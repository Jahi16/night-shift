d lighting and sensors do not block a person from entering."},{"q":"A security team adds a fake database administrator account that is never used for real work. An alert is generated if anyone attempts to sign in with it. What has the team deployed?","o":["Honeytoken","Honeyfile","Honeynet","Honeypot"],"e":"A fake credential that alerts when it is used is a honeytoken. A honeyfile is a bait file that alerts when opened, and honeypots and honeynets are decoy systems."},{"q":"Which type of sensor detects an intruder by sensing the heat the body gives off?","o":["Infrared","Ultrasonic","Microwave","Pressure"],"e":"Infrared sensors detect heat radiation and work in darkness. Ultrasonic and microwave sensors detect movement by reflected signals, and pressure sensors detect weight."},{"q":"A facility wants to prevent a truck from being driven through its glass lobby doors while still allowing people to walk in freely. Which control should be installed?","o":["Bollards","Fencing","Access badge readers","Video surveillance"],"e":"Bollards block vehicles and leave room for pedestrians. A fence would also block the people, and badge readers and cameras do not stop a vehicle."}],"checks":[{"q":"Researchers build several interconnected decoy servers and workstations that imitate a corporate environment so they can observe how attackers move from one system to another. What is this called?","o":["Honeynet","Honeypot","Honeyfile","Honeytoken"],"e":"Multiple connected decoy systems form a honeynet. A honeypot is a single decoy system."},{"q":"An administrator places a spreadsheet named \"Executive_Salaries\" on a file server. The file contains nothing real, and an alert is sent whenever it is opened. Which technology is this?","o":["Honeyfile","Honeytoken","Honeypot","Data masking"],"e":"A bait file that alerts on access is a honeyfile. A honeytoken is a piece of traceable data such as a fake credential, and the alert comes from its use."},{"q":"A company inserts a made-up customer record with a unique email address into its database. Months later, spam arrives at that address. What did the record function as?","o":["Honeytoken","Honeyfile","Honeynet","Pressure sensor"],"e":"Fake data planted so that its appearance elsewhere reveals a leak is a honeytoken. The bait here is a record, not a file, and the signal is the data being used outside the organization."},{"q":"A museum places a pad beneath a display so that an alarm sounds if the object is lifted. Which type of sensor is in use?","o":["Pressure","Microwave","Infrared","Ultrasonic"],"e":"A pressure sensor detects a change in weight or force on a surface. The other sensors detect heat or movement."},{"q":"Which of the following BEST describes the security value of an access badge system beyond unlocking doors?","o":["It records who entered each door and when","It prevents vehicles from approaching the building","It detects body heat in restricted areas","It imitates a production server to attract attackers"],"e":"Badge systems log each use, which provides accounting for physical access. The other choices describe bollards, infrared sensors, and honeypots."}],"drill":"<li><b>The Drill Down:<\/b> add the keywords below. Stay on honeyfile versus honeytoken until you get five in a row.<\/li><li><b>Flashcards:<\/b> run 15 cards and name the sensor type before you flip any sensor card.<\/li><li><b>Glossary:<\/b> look up \"tailgating\" and \"piggybacking\".<\/li>","text":" An attacker who can touch a server can usually defeat every software control on it, so the exam expects you to know the standard physical protections by name and purpose. The second half of this lesson covers decoys: fake systems and fake data planted to catch intruders. The four \"honey\" terms are short, similar, and frequently confused with each other. Physical security is the part of security you can see when you walk up to a building: posts that stop cars, fences, doors, guards, cameras, lights, and alarm sensors. Each one has a specific job, and exam questions ask which one fits a described need. Deception is a different idea. A fishing lure looks like food and exists only to be bitten. Security teams plant lures too: a fake server, a fake file, a fake password. Nobody with a legitimate reason would ever touch them, so when one is touched, the team knows someone is snooping, and gets to watch what they do. Physical security controls Bollards. Short, sturdy posts set into the ground. They stop vehicles from driving into a building or an area while letting people walk between them. A question about preventing a vehicle from ramming an entrance is asking for bollards. Access control vestibule. A small room with two doors, where the second door will not open until the first has closed. It lets one person through at a time, so someone cannot follow an authorized person in. The older name is mantrap . Confusable pair Tailgating vs. piggybacking. Both mean an unauthorized person entering behind an authorized one. In tailgating the authorized person does not know. In piggybacking the authorized person knowingly holds the door. An access control vestibule stops both. Fencing. Establishes the perimeter. A fence can be see-through, so guards and cameras can watch the outside, or opaque, so outsiders cannot see in. Height and topping such as razor wire make it harder to climb. Video surveillance. Cameras, often called closed-circuit television. They record events for later review and can be watched live. Modern systems add motion detection and object recognition. Recording makes them a detective control; visible cameras also act as a deterrent. Security guard. A person who can check identification, question a visitor, and react to something unexpected. People bring judgment that devices lack. Guards also maintain the visitor log and escort visitors. Access badge. A card that identifies the holder, often with a photo, and unlocks doors electronically. Each use is logged, so badge records show who entered which door and when. That log is the accounting step from the AAA lesson, applied to a building. Lighting. Well-lit areas discourage intruders and make cameras and guards effective. Good lighting avoids deep shadows and glare, and covers entrances and parking areas. Sensors Sensors detect a presence or a change and raise an alarm. The exam expects you to match each kind to what it senses. Sensor What it senses Notes Infrared Infrared radiation, meaning heat from a body Works in darkness; common in motion detectors Pressure A change in force on a surface Floor mats, pads under an object Microwave Movement, detected by sending microwave signals and reading the reflection Covers large areas; can pass through thin walls, which may cause false alarms Ultrasonic Movement, detected by sending sound waves above human hearing and reading the reflection Also used to detect a collision or how near an object is Memory hook Match each sensor to one word. Infrared: heat. Pressure: weight. Microwave: wide area. Ultrasonic: sound. Trap Microwave and ultrasonic sensors both send out a signal and read what bounces back. Infrared sensors of the common kind only receive heat. If a question mentions body heat or working in the dark, choose infrared. If it mentions sound waves, choose ultrasonic. Deception and disruption technology Deception technology plants fake targets. Legitimate users have no reason to touch them, so any contact is a high-quality alert. The decoys also waste the attacker's time and let defenders study the attacker's methods. Honeypot. A single decoy system made to look like a real, attractive target, such as a server with weak settings. It is isolated from production and heavily monitored. Honeynet. A whole decoy network: several honeypots connected together, with fake servers, workstations, and network devices. It looks like a real environment and lets defenders watch how an attacker moves between systems. Honeyfile. A bait file with a tempting name, such as passwords.xlsx , placed on a real file share. Nobody should open it. An alert fires when someone does. Honeytoken. A piece of fake data that can be traced: a made-up user account, a fake API key, a fake customer record in a database, a fake email address. It has no legitimate use. If it is ever used to log in, or turns up outside the organization, the team knows data was taken and can often tell from where. Confusable pair Honeyfile vs. honeytoken. This is the pair people miss most. Ask what the bait is and what sets off the alert. Honeyfile Honeytoken The bait is A file A piece of data: credential, key, record, address The alert fires when The file is opened or accessed The data is used, or appears somewhere it should not Typical wording \"a document named...\" \"a spreadsheet on the share\" \"fake credentials\", \"a bogus record\", \"a dummy API key\", \"tracks the source of a leak\" A fake administrator account planted in the directory is a honeytoken. A file called admin-passwords.txt that triggers an alert when opened is a honeyfile. If the question describes fake credentials inside a file and the alert comes when someone tries to use the credentials , the answer is honeytoken. Confusable pair Honeypot vs. honeynet. One system versus many. If the question says \"a decoy server\", choose honeypot. If it says \"a simulated network\" or \"multiple decoy systems\", choose honeynet. Trap Decoys do not block anything. They are detective controls that also buy time. An answer that claims a honeypot prevents attacks on production systems is wrong. Item Purpose in one phrase Bollard Short post that stops vehicles and lets people walk through Access control vestibule Two interlocked doors; one person at a time; defeats tailgating Fencing Marks and protects the perimeter Video surveillance Records and monitors; detective, and a deterrent when visible Security guard Human judgment: checks identification, responds to events Access badge Identifies the holder and logs each entry Lighting Deters intruders and lets cameras and guards see Sensor Detects Infrared Heat given off by a body; works in the dark Pressure Weight or force on a surface Microwave Movement, by reflected microwave signals; covers large areas Ultrasonic Movement, by reflected sound waves Decoy What it is Honeypot One fake system Honeynet A network of honeypots Honeyfile A bait file ; alerts when someone opens it Honeytoken A piece of fake, traceable data (credential, record, key); alerts when it is used or shows up somewhere "},"1.3":{"id":"1.3","obj":"1.3","min":20,"title":"Change management and why security depends on it","kw":["change management","backout plan","impact analysis","maintenance window","allow list","version control","dependencies"],"cov":["Business processes impacting security operation","Approval process","Ownership","Stakeholders","Impact analysis","Test results","Backout plan","Maintenance window","Standard operating procedure","Technical implications","Allow lists/deny lists","Restricted activities","Downtime","Service restart","Application restart","Legacy applications","Dependencies","Documentation","Updating diagrams","Updating policies/procedures","Version control"],"why":"<p>Many outages and many security holes are self-inflicted: someone changed a firewall rule, applied a patch, or updated a server without checking what else it would affect. <strong>Change management<\/strong> is the formal process that makes every change requested, reviewed, tested, scheduled, reversible, and recorded.<\/p>\n<p>On the exam this objective is mostly vocabulary in context. A question describes a step in the process and asks what it is called, or describes a failed change and asks which step was skipped.<\/p>","plain":"<p>Suppose a restaurant wants to replace its ovens. A sensible owner would not rip them out during Friday dinner service. They would ask who is affected (the cooks, the customers), check whether the new ovens fit the gas line, pick a day the restaurant is closed, keep the old ovens nearby in case the new ones fail, and update the kitchen manual afterward.<\/p>\n<p>Change management is that same common sense, written down as a required process for IT systems. Nothing gets changed in the live environment (called <em>production<\/em>) without going through it.<\/p>","fast":"<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning in one phrase<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Approval process<\/td>\n<td>A formal request reviewed and approved before any work starts<\/td>\n<\/tr>\n<tr>\n<td>Ownership<\/td>\n<td>The person or team that requested the change and is accountable for it<\/td>\n<\/tr>\n<tr>\n<td>Stakeholders<\/td>\n<td>Everyone the change affects; they get a say<\/td>\n<\/tr>\n<tr>\n<td>Impact analysis<\/td>\n<td>What could go wrong and how badly, decided <em>before<\/em> approval<\/td>\n<\/tr>\n<tr>\n<td>Test results<\/td>\n<td>Evidence from a non-production environment that the change works<\/td>\n<\/tr>\n<tr>\n<td>Backout plan<\/td>\n<td>The steps to return to the previous state if the change fails<\/td>\n<\/tr>\n<tr>\n<td>Maintenance window<\/td>\n<td>The scheduled time when the change causes the least disruption<\/td>\n<\/tr>\n<tr>\n<td>Standard operating procedure<\/td>\n<td>The documented steps for how changes are made<\/td>\n<\/tr>\n<tr>\n<td>Allow list / deny list<\/td>\n<td>Only listed items permitted / only listed items blocked<\/td>\n<\/tr>\n<tr>\n<td>Restricted activities<\/td>\n<td>The change may do only what was approved: the scope<\/td>\n<\/tr>\n<tr>\n<td>Dependencies<\/td>\n<td>Other things that must change first or that will break<\/td>\n<\/tr>\n<tr>\n<td>Version control<\/td>\n<td>Tracks each change to a file and allows a return to an earlier version<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Afterward, update diagrams, policies, and procedures so the documentation matches reality.<\/p>","core":"<h3>Why this is a security topic<\/h3>\n<p>An unreviewed change can open a port, remove a patch, disable logging, or take down a service. Unrecorded changes mean nobody knows what the environment looks like, so nobody can defend it or investigate it. Change management protects availability and integrity, and it produces the record that auditors and incident responders rely on.<\/p>\n<h3>Business processes<\/h3>\n<p><strong>Approval process.<\/strong> Every change starts as a formal request that states what will change, why, when, which systems are affected, and what the risk is. A reviewing body, often called a change advisory board, approves or rejects it. No approval, no change.<\/p>\n<p><strong>Ownership.<\/strong> The owner is the person or department that wants the change and is accountable for it. The owner usually does not perform the technical work. If the accounting department needs its application upgraded, accounting owns the change and the IT team carries it out.<\/p>\n<p><strong>Stakeholders.<\/strong> Anyone affected by the change: other departments, application users, customers, the security team. Stakeholders are consulted before approval, because a change to one system often reaches further than expected.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Owner vs. stakeholder.<\/strong> The owner <em>initiates and answers for<\/em> the change. Stakeholders are <em>affected by<\/em> it. One change has one owner and many stakeholders.<\/p><\/div>\n\n<p><strong>Impact analysis.<\/strong> An assessment, before approval, of what the change could break and how serious that would be. It also considers the risk of <em>not<\/em> making the change, such as leaving a vulnerability unpatched.<\/p>\n<p><strong>Test results.<\/strong> The change is tried first in a test environment that is isolated from production, often called a sandbox. The results show whether it works and whether the backout plan works.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Impact analysis vs. test results.<\/strong> Impact analysis is a <em>prediction<\/em> made on paper. Test results are <em>evidence<\/em> from actually running the change somewhere safe.<\/p><\/div>\n\n<p><strong>Backout plan.<\/strong> The documented steps for undoing the change and returning to the previous working state. Every change needs one, because some changes fail even after testing.<\/p>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>A backout plan is not the same thing as a backup. A backup is a copy of data. A backout plan is a <em>procedure<\/em> for reversing a change, and a backup may be one of the things it uses.<\/p><\/div>\n\n<p><strong>Maintenance window.<\/strong> The agreed time period for making the change, chosen to disturb the business least: overnight, a weekend, a slow season. A retailer would not schedule changes during its busiest sales week.<\/p>\n<p><strong>Standard operating procedure.<\/strong> The documented, step-by-step way a task is done in the organization. The change process itself is written into standard operating procedures, and a completed change often requires updating them.<\/p>\n<h3>Technical implications<\/h3>\n<p>These are the practical side effects a change can have. The exam expects you to recognize each as something that must be planned for.<\/p>\n<p><strong>Allow lists and deny lists.<\/strong> An <strong>allow list<\/strong> permits only the items on the list and blocks everything else. A <strong>deny list<\/strong> blocks only the items on the list and permits everything else. If application allow-listing is in use, a new or updated program will not run until it is added to the list, so the list is part of the change.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Allow list vs. deny list.<\/strong> An allow list is the stricter of the two, because anything unknown is blocked. A deny list lets anything unknown through. \"Only approved applications may run\" is an allow list.<\/p><\/div>\n\n<p><strong>Restricted activities.<\/strong> A change approval covers a defined scope. The technician may do what was approved and nothing more, even if another problem is spotted along the way. Anything outside the scope needs its own approval.<\/p>\n<p><strong>Downtime.<\/strong> Many changes make a service unavailable while they are applied. Downtime is planned for the maintenance window and announced to stakeholders. Where a spare system exists, work can be done on one system while the other carries the load.<\/p>\n<p><strong>Service restart and application restart.<\/strong> A change often takes effect only after the service, the application, or the whole machine is restarted. The plan has to include the restart and a check that everything comes back up correctly.<\/p>\n<p><strong>Legacy applications.<\/strong> Old software that the business still depends on, often no longer supported by its maker. It may fail on a newer operating system or after a patch, and nobody may fully understand how it works. Changes near legacy applications need extra testing and documentation.<\/p>\n<p><strong>Dependencies.<\/strong> One component relies on another. An application update may first require a database upgrade, or a patch on one server may require a driver update on several others. Dependencies determine the order of the work and widen the impact.<\/p>\n<h3>Documentation and version control<\/h3>\n<p>A change is finished when the records match the new reality.<\/p>\n<ul>\n<li><strong>Updating diagrams.<\/strong> Network and system diagrams must show the new layout, addresses, and connections.<\/li>\n<li><strong>Updating policies and procedures.<\/strong> If the change alters how work is done, the written procedures are revised.<\/li>\n<\/ul>\n<p><strong>Version control<\/strong> tracks every modification to a file, a configuration, or source code: what changed, who changed it, and when. Its security value is that you can compare versions to spot an unexpected change and return to a known good version.<\/p>\n<h3>The usual order<\/h3>\n<p>Request, impact analysis, approval, testing, scheduling in a maintenance window, implementation, verification, documentation. If verification fails, run the backout plan.<\/p>\n<div class=\"co exam\"><span class=\"k\">Exam vs. real world<\/span><p>Real emergencies sometimes force a change before the paperwork is complete. On the exam, the correct answer follows the process: get approval before changing production, and have a backout plan. An answer choice that skips approval to save time is a distractor unless the question says an emergency change procedure exists.<\/p><\/div>","recall":[["What is a backout plan?","The documented steps to reverse a change and return to the previous working state."],["Who is the owner of a change, and who are the stakeholders?","The owner requested the change and is accountable for it. Stakeholders are everyone it affects."],["Impact analysis versus test results?","Impact analysis predicts what could go wrong before approval. Test results are evidence from running the change in a test environment."],["Which is stricter, an allow list or a deny list, and why?","An allow list. Everything not listed is blocked."],["What does \"restricted activities\" mean during a change?","Only the approved scope may be carried out. Anything else needs separate approval."],["What is the security value of version control?","It records what changed, who changed it, and when, and allows a return to an earlier version."],["What gets updated after a change is complete?","Diagrams, policies, and procedures."]],"pre":[{"q":"A patch is installed during an approved maintenance window, and the application fails to start afterward. Which element of the change management process tells the team how to return the system to its previous state?","o":["Backout plan","Impact analysis","Maintenance window","Approval process"],"e":"The backout plan is the documented procedure for reversing a failed change. Impact analysis predicts consequences before approval and does not provide reversal steps."},{"q":"The marketing department asks IT to upgrade the marketing team's content platform. In change management terms, the marketing department is which of the following?","o":["The owner of the change","A dependency of the change","The change advisory board","A restricted activity"],"e":"The party that requests the change and is accountable for it is the owner. IT performs the work, and the change advisory board approves it."},{"q":"An organization permits only a specific list of approved applications to run on its workstations and blocks everything else. Which of the following is in use?","o":["Allow list","Deny list","Version control","Backout plan"],"e":"Permitting only listed items and blocking all others is an allow list. A deny list blocks listed items and permits everything else."},{"q":"Before approving a database upgrade, the review board asks which other applications could stop working and how serious that would be for the business. Which process element is the board requesting?","o":["Impact analysis","Test results","Standard operating procedure","Version control"],"e":"Predicting what a change could affect and how badly is impact analysis. Test results would be evidence from running the upgrade in a test environment."}],"checks":[{"q":"While applying an approved firewall firmware update, a technician notices an unrelated rule that appears outdated and wants to remove it. According to change management practice, what should the technician do?","o":["Leave the rule and submit a separate change request","Remove the rule because the firewall is already in maintenance","Remove the rule and document it after the window closes","Disable the rule temporarily to see whether anyone reports a problem"],"e":"A change approval covers a defined scope. Work outside that scope is a restricted activity and needs its own request and approval."},{"q":"An application upgrade cannot be installed until the database server it relies on has been updated to a newer release. What does this describe?","o":["A dependency","A stakeholder","A deny list","A legacy application"],"e":"When one change requires another component to be changed first, that is a dependency. It affects the order and the scope of the work."},{"q":"A company schedules all production changes for Sunday between 1 a.m. and 5 a.m., when customer activity is lowest. What is this time period called?","o":["Maintenance window","Backout plan","Impact analysis","Downtime tolerance"],"e":"The agreed period for carrying out changes with the least disruption is the maintenance window."},{"q":"An engineer discovers that a router's configuration no longer matches last month's known good configuration. Which of the following would BEST show exactly what was changed and by whom?","o":["Version control","A maintenance window","An allow list","A backout plan"],"e":"Version control records each modification with its author and time, and lets the team compare versions and restore an earlier one."},{"q":"A fifteen-year-old payroll program is no longer supported by its vendor, and the business still relies on it. Why does this matter when planning an operating system upgrade on the server that hosts it?","o":["The program may not function after the upgrade and needs additional testing","The program must be added to a deny list before the upgrade begins","The program removes the need for a backout plan","The program transfers ownership of the change to the vendor"],"e":"Legacy applications may break when the systems beneath them change, and vendor help is not available. They call for extra testing and careful documentation."}],"drill":"<li><b>The Drill Down:<\/b> add the keywords below and work the pool once.<\/li><li><b>Flashcards:<\/b> run 15 cards. For every change management card, say where it falls in the order: before approval, during the change, or after.<\/li><li><b>PBQ Lab:<\/b> open \"Change Management Approval Sequence\" and put the steps in order.<\/li><li><b>Glossary:<\/b> look up \"change advisory board\" and \"sandbox\".<\/li>","text":" Many outages and many security holes are self-inflicted: someone changed a firewall rule, applied a patch, or updated a server without checking what else it would affect. Change management is the formal process that makes every change requested, reviewed, tested, scheduled, reversible, and recorded. On the exam this objective is mostly vocabulary in context. A question describes a step in the process and asks what it is called, or describes a failed change and asks which step was skipped. Suppose a restaurant wants to replace its ovens. A sensible owner would not rip them out during Friday dinner service. They would ask who is affected (the cooks, the customers), check whether the new ovens fit the gas line, pick a day the restaurant is closed, keep the old ovens nearby in case the new ones fail, and update the kitchen manual afterward. Change management is that same common sense, written down as a required process for IT systems. Nothing gets changed in the live environment (called production ) without going through it. Why this is a security topic An unreviewed change can open a port, remove a patch, disable logging, or take down a service. Unrecorded changes mean nobody knows what the environment looks like, so nobody can defend it or investigate it. Change management protects availability and integrity, and it produces the record that auditors and incident responders rely on. Business processes Approval process. Every change starts as a formal request that states what will change, why, when, which systems are affected, and what the risk is. A reviewing body, often called a change advisory board, approves or rejects it. No approval, no change. Ownership. The owner is the person or department that wants the change and is accountable for it. The owner usually does not perform the technical work. If the accounting department needs its application upgraded, accounting owns the change and the IT team carries it out. Stakeholders. Anyone affected by the change: other departments, application users, customers, the security team. Stakeholders are consulted before approval, because a change to one system often reaches further than expected. Confusable pair Owner vs. stakeholder. The owner initiates and answers for the change. Stakeholders are affected by it. One change has one owner and many stakeholders. Impact analysis. An assessment, before approval, of what the change could break and how serious that would be. It also considers the risk of not making the change, such as leaving a vulnerability unpatched. Test results. The change is tried first in a test environment that is isolated from production, often called a sandbox. The results show whether it works and whether the backout plan works. Confusable pair Impact analysis vs. test results. Impact analysis is a prediction made on paper. Test results are evidence from actually running the change somewhere safe. Backout plan. The documented steps for undoing the change and returning to the previous working state. Every change needs one, because some changes fail even after testing. Trap A backout plan is not the same thing as a backup. A backup is a copy of data. A backout plan is a procedure for reversing a change, and a backup may be one of the things it uses. Maintenance window. The agreed time period for making the change, chosen to disturb the business least: overnight, a weekend, a slow season. A retailer would not schedule changes during its busiest sales week. Standard operating procedure. The documented, step-by-step way a task is done in the organization. The change process itself is written into standard operating procedures, and a completed change often requires updating them. Technical implications These are the practical side effects a change can have. The exam expects you to recognize each as something that must be planned for. Allow lists and deny lists. An allow list permits only the items on the list and blocks everything else. A deny list blocks only the items on the list and permits everything else. If application allow-listing is in use, a new or updated program will not run until it is added to the list, so the list is part of the change. Confusable pair Allow list vs. deny list. An allow list is the stricter of the two, because anything unknown is blocked. A deny list lets anything unknown through. \"Only approved applications may run\" is an allow list. Restricted activities. A change approval covers a defined scope. The technician may do what was approved and nothing more, even if another problem is spotted along the way. Anything outside the scope needs its own approval. Downtime. Many changes make a service unavailable while they are applied. Downtime is planned for the maintenance window and announced to stakeholders. Where a spare system exists, work can be done on one system while the other carries the load. Service restart and application restart. A change often takes effect only after the service, the application, or the whole machine is restarted. The plan has to include the restart and a check that everything comes back up correctly. Legacy applications. Old software that the business still depends on, often no longer supported by its maker. It may fail on a newer operating system or after a patch, and nobody may fully understand how it works. Changes near legacy applications need extra testing and documentation. Dependencies. One component relies on another. An application update may first require a database upgrade, or a patch on one server may require a driver update on several others. Dependencies determine the order of the work and widen the impact. Documentation and version control A change is finished when the records match the new reality. Updating diagrams. Network and system diagrams must show the new layout, addresses, and connections. Updating policies and procedures. If the change alters how work is done, the written procedures are revised. Version control tracks every modification to a file, a configuration, or source code: what changed, who changed it, and when. Its security value is that you can compare versions to spot an unexpected change and return to a known good version. The usual order Request, impact analysis, approval, testing, scheduling in a maintenance window, implementation, verification, documentation. If verification fails, run the backout plan. Exam vs. real world Real emergencies sometimes force a change before the paperwork is complete. On the exam, the correct answer follows the process: get approval before changing production, and have a backout plan. An answer choice that skips approval to save time is a distractor unless the question says an emergency change procedure exists. Term Meaning in one phrase Approval process A formal request reviewed and approved before any work starts Ownership The person or team that requested the change and is accountable for it Stakeholders Everyone the change affects; they get a say Impact analysis What could go wrong and how badly, decided before approval Test results Evidence from a non-production environment that the change works Backout plan The steps to return to the previous state if the change fails Maintenance window The scheduled time when the change causes the least disruption Standard operating procedure The documented steps for how changes are made Allow list / deny list Only listed items permitted / only listed items blocked Restricted activities The change may do only what was approved: the scope Dependencies Other things that must change first or that will break Version control Tracks each change to a file and allows a return to an earlier version Afterward, update diagrams, policies, and procedures so the documentation matches reality. "},"1.4a":{"id":"1.4a","obj":"1.4","min":30,"title":"Encryption: symmetric, asymmetric, key exchange, and where to apply it","kw":["symmetric","asymmetric","key exchange","full-disk encryption","public key","private key","key length"],"cov":["Encryption","Level","Full-disk","Partition","File","Volume","Database","Record","Transport/communication","Asymmetric","Symmetric","Key exchange","Algorithms","Key length","Public key","Private key"],"why":"<p>Cryptography is the largest objective in Domain 1 and the one beginners fear most. The exam does not ask for any mathematics. It asks which kind of encryption fits a described need, which key is used for which job, and where encryption should be applied. This lesson covers encryption. The next two cover hashing and signatures, then certificates.<\/p>","plain":"<p><strong>Encryption<\/strong> scrambles readable information so that only someone with the right key can unscramble it.<\/p>\n<p>Four words to learn first:<\/p>\n<ul>\n<li><strong>Plaintext<\/strong>: the readable original.<\/li>\n<li><strong>Ciphertext<\/strong>: the scrambled result.<\/li>\n<li><strong>Algorithm<\/strong> (or cipher): the published recipe for scrambling. Everyone can know the recipe.<\/li>\n<li><strong>Key<\/strong>: the secret value fed into the recipe. The security rests on the key, not on hiding the recipe.<\/li>\n<\/ul>\n<p>Two everyday pictures help. A house key locks and unlocks the same door: one key does both jobs. That is the first kind of encryption. A mail slot is different: anyone can push a letter in, and only the person with the key to the box can take letters out. That is the second kind. The rest of this lesson gives those two kinds their proper names.<\/p>","fast":"<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Symmetric<\/th>\n<th>Asymmetric<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Keys<\/td>\n<td>One shared secret key<\/td>\n<td>A pair: public key and private key<\/td>\n<\/tr>\n<tr>\n<td>Speed<\/td>\n<td>Fast<\/td>\n<td>Slow<\/td>\n<\/tr>\n<tr>\n<td>Used for<\/td>\n<td>Bulk data: files, disks, sessions<\/td>\n<td>Key exchange, digital signatures, certificates<\/td>\n<\/tr>\n<tr>\n<td>Main weakness<\/td>\n<td>Getting the key to the other side safely<\/td>\n<td>Too slow for large data<\/td>\n<\/tr>\n<tr>\n<td>Algorithms<\/td>\n<td>AES (current); DES and 3DES (retired)<\/td>\n<td>RSA, ECC, Diffie-Hellman<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Confidentiality:<\/strong> encrypt with the <em>recipient's public<\/em> key; the recipient decrypts with their <em>private<\/em> key.<\/li>\n<li><strong>Hybrid:<\/strong> asymmetric encryption protects the exchange of a symmetric session key, then symmetric encryption carries the data. This is how TLS works.<\/li>\n<li><strong>Key length:<\/strong> longer is stronger <em>within one algorithm<\/em>. Lengths are not comparable across algorithm families.<\/li>\n<li><strong>Levels at rest:<\/strong> full-disk, partition, volume, file, database, record. <strong>In transit:<\/strong> TLS, VPN, SSH.<\/li>\n<\/ul>","core":"<h3>Symmetric encryption<\/h3>\n<p><strong>Symmetric<\/strong> encryption uses <strong>one key<\/strong> to encrypt and to decrypt. Both sides must hold the same secret key.<\/p>\n<ul>\n<li><strong>Strength:<\/strong> it is fast, so it is used for large amounts of data: files, whole disks, network sessions.<\/li>\n<li><strong>Weakness:<\/strong> key distribution. Both sides need the key, and sending it across an untrusted network exposes it. It also scales badly: every pair of people needs its own key.<\/li>\n<li><strong>Algorithm to know:<\/strong> <strong>AES<\/strong> is the current standard, with key lengths of 128, 192, or 256 bits. <strong>DES<\/strong> and <strong>3DES<\/strong> are older and retired.<\/li>\n<\/ul>\n<p>Other names for the same idea: secret-key or shared-key encryption.<\/p>\n<h3>Asymmetric encryption<\/h3>\n<p><strong>Asymmetric<\/strong> encryption uses a <strong>key pair<\/strong> that is mathematically linked.<\/p>\n<ul>\n<li>The <strong>public key<\/strong> can be given to anyone.<\/li>\n<li>The <strong>private key<\/strong> is kept secret by its owner and never shared.<\/li>\n<li>What one key of the pair encrypts, only the other key of the same pair can decrypt.<\/li>\n<li>\n<p>Knowing the public key does not reveal the private key.<\/p>\n<\/li>\n<li>\n<p><strong>Strength:<\/strong> no shared secret has to be delivered in advance. This solves the key distribution problem.<\/p>\n<\/li>\n<li><strong>Weakness:<\/strong> it is much slower than symmetric encryption, so it is not used for bulk data.<\/li>\n<li><strong>Algorithms to know:<\/strong> <strong>RSA<\/strong>, <strong>ECC<\/strong> (elliptic curve cryptography), and <strong>Diffie-Hellman<\/strong>. ECC gives the same strength as RSA with much shorter keys, so it suits phones and small devices.<\/li>\n<\/ul>\n<p>Another name for it is public-key cryptography.<\/p>\n<h3>Which key does which job<\/h3>\n<p>This is the most tested idea in the lesson. There are only two jobs.<\/p>\n<table>\n<thead>\n<tr>\n<th>Goal<\/th>\n<th>Encrypt or sign with<\/th>\n<th>Decrypt or verify with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Confidentiality<\/strong> (only Bob can read it)<\/td>\n<td>Bob's <strong>public<\/strong> key<\/td>\n<td>Bob's <strong>private<\/strong> key<\/td>\n<\/tr>\n<tr>\n<td><strong>Proof of sender<\/strong> (digital signature from Alice)<\/td>\n<td>Alice's <strong>private<\/strong> key<\/td>\n<td>Alice's <strong>public<\/strong> key<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"co mem\"><span class=\"k\">Memory hook<\/span><p>To keep a secret <strong>for<\/strong> someone, use <strong>their public<\/strong> key. To prove something came <strong>from<\/strong> you, use <strong>your private<\/strong> key. A private key is only ever used by its owner.<\/p><\/div>\n\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>Nobody ever sends, shares, or uses another person's private key. Any answer choice in which Alice uses \"Bob's private key\" is wrong.<\/p><\/div>\n\n<h3>Key exchange<\/h3>\n<p>Symmetric encryption is fast, and it needs both sides to hold the same key. <strong>Key exchange<\/strong> is how they get it.<\/p>\n<ul>\n<li><strong>Out-of-band:<\/strong> deliver the key by a different channel, such as in person or by courier. Safe, slow, and impractical on the internet.<\/li>\n<li><strong>In-band:<\/strong> send it over the same network, protected by asymmetric cryptography.<\/li>\n<\/ul>\n<p>Two in-band methods matter:<\/p>\n<ol>\n<li><strong>Encrypt the session key with the recipient's public key.<\/strong> Only the recipient's private key can recover it.<\/li>\n<li><strong>Diffie-Hellman key agreement.<\/strong> Each side combines its own private value with the other side's public value, and both arrive at the same shared secret. The secret itself never crosses the network.<\/li>\n<\/ol>\n<p>The result in both cases is a <strong>session key<\/strong>: a symmetric key used for one conversation and then discarded.<\/p>\n<p><strong>Hybrid encryption<\/strong> is this combination: asymmetric cryptography to establish the session key, symmetric cryptography for the data. Nearly all secure communication, including TLS, works this way.<\/p>\n<div class=\"co tip\"><span class=\"k\">Exam tip<\/span><p>When a question asks how two parties can communicate quickly <em>and<\/em> avoid sharing a key in advance, the answer is the hybrid approach: asymmetric for the key exchange, symmetric for the data.<\/p><\/div>\n\n<h3>Algorithms and key length<\/h3>\n<p>An <strong>algorithm<\/strong> is the method. The <strong>key length<\/strong> is the size of the key in bits. A longer key means more possible keys and more work for an attacker who tries them all, which is called a brute-force attack. A longer key also costs more processing.<\/p>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>Key lengths can only be compared <strong>within the same kind of algorithm<\/strong>. AES-256 is stronger than AES-128. A 2048-bit RSA key is <em>not<\/em> stronger than a 256-bit AES key. Symmetric keys are much shorter for the same strength: a 256-bit ECC key is roughly as strong as a 3072-bit RSA key.<\/p><\/div>\n\n<p>Reasonable current choices: AES with 128 bits or more, RSA with 2048 bits or more.<\/p>\n<h3>Encryption levels: data at rest<\/h3>\n<p>Encryption can be applied at different levels of storage. The objectives list six.<\/p>\n<table>\n<thead>\n<tr>\n<th>Level<\/th>\n<th>What gets encrypted<\/th>\n<th>Typical use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Full-disk<\/strong><\/td>\n<td>The entire drive, including the operating system<\/td>\n<td>Laptops and phones; protects a lost or stolen device<\/td>\n<\/tr>\n<tr>\n<td><strong>Partition<\/strong><\/td>\n<td>One partition of a drive<\/td>\n<td>Encrypting the data partition, leaving another unencrypted<\/td>\n<\/tr>\n<tr>\n<td><strong>Volume<\/strong><\/td>\n<td>One logical volume, which may be a single partition or span several disks<\/td>\n<td>An encrypted data volume or container<\/td>\n<\/tr>\n<tr>\n<td><strong>File<\/strong><\/td>\n<td>Individual files or folders<\/td>\n<td>Protecting selected files, including from other users of the same machine<\/td>\n<\/tr>\n<tr>\n<td><strong>Database<\/strong><\/td>\n<td>The database files as a whole<\/td>\n<td>Protecting the stored database from someone who copies the files<\/td>\n<\/tr>\n<tr>\n<td><strong>Record<\/strong><\/td>\n<td>Individual rows or fields inside the database<\/td>\n<td>Encrypting only the sensitive column, such as an account number<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Full-disk vs. file encryption.<\/strong> Full-disk encryption protects everything while the device is <strong>powered off or locked<\/strong>. Once the user signs in, the disk is unlocked and files are readable by that session. File-level encryption protects specific files even on a running, shared system, and can stay with a file when it is copied elsewhere.<\/p><\/div>\n\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Database vs. record encryption.<\/strong> Database encryption protects the whole database as stored on disk, and an authorized database user still sees everything. Record-level encryption protects chosen rows or fields, so even an administrator browsing the table sees ciphertext in those fields.<\/p><\/div>\n\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>Full-disk encryption does nothing for a file after it leaves the disk. An email attachment sent from an encrypted laptop travels unencrypted unless something else protects it.<\/p><\/div>\n\n<h3>Transport and communication encryption: data in transit<\/h3>\n<p>Data moving across a network needs its own protection.<\/p>\n<ul>\n<li><strong>TLS<\/strong> protects web traffic (HTTPS) and many other protocols.<\/li>\n<li>A <strong>VPN<\/strong> builds an encrypted tunnel between two points, commonly using IPsec or TLS.<\/li>\n<li><strong>SSH<\/strong> protects remote administration sessions and file transfers.<\/li>\n<\/ul>\n<p>A complete design protects data at rest <em>and<\/em> in transit. HTTPS protects a card number on its way to a web server. It says nothing about how the server stores that number afterward.<\/p>\n<div class=\"co exam\"><span class=\"k\">Exam vs. real world<\/span><p>Encoding (such as Base64) and compression change how data looks without using a key. They provide no confidentiality. If a question describes data that was \"encoded\", it has not been encrypted.<\/p><\/div>","recall":[["How many keys does symmetric encryption use? Asymmetric?","Symmetric uses one shared key. Asymmetric uses a public and private key pair."],["Why is symmetric encryption used for bulk data?","It is much faster than asymmetric encryption."],["To send Bob a confidential message, which key encrypts it and which decrypts it?","Bob's public key encrypts. Bob's private key decrypts."],["What is hybrid encryption?","Asymmetric cryptography exchanges a symmetric session key, then symmetric encryption protects the data."],["What does Diffie-Hellman do?","It lets two parties derive the same shared secret over a public network without sending the secret."],["Can you compare a 2048-bit RSA key with a 256-bit AES key by length?","No. Key length only compares within the same kind of algorithm."],["Name the six levels of encryption for stored data.","Full-disk, partition, volume, file, database, record."],["What does full-disk encryption not protect?","Data on a running, unlocked system, and files after they leave the disk."]],"pre":[{"q":"Alice wants to send Bob a message that only Bob can read. Using asymmetric encryption, which key should Alice use to encrypt it?","o":["Bob's public key","Bob's private key","Alice's public key","Alice's private key"],"e":"Data encrypted with Bob's public key can be decrypted only with Bob's private key, which only Bob holds. Alice never has access to Bob's private key."},{"q":"A company needs to encrypt several terabytes of archived video as quickly as possible. Which type of encryption is MOST appropriate?","o":["Symmetric","Asymmetric","Key exchange","Elliptic curve"],"e":"Symmetric encryption is far faster and is the standard choice for bulk data. Asymmetric algorithms, including elliptic curve, are too slow for large volumes."},{"q":"A laptop containing customer data is stolen while powered off. Which of the following would BEST prevent the thief from reading the data?","o":["Full-disk encryption","Transport encryption","A longer account password","Record-level encryption on the company database"],"e":"Full-disk encryption protects everything on a powered-off device. Transport encryption protects data crossing a network, and an account password can be bypassed by reading the drive directly."},{"q":"Which statement about key length is correct?","o":["A longer key is stronger only when comparing keys of the same algorithm type","A 2048-bit RSA key is stronger than a 256-bit AES key because it is longer","Key length affects speed and has no effect on strength","Asymmetric keys are shorter than symmetric keys of equal strength"],"e":"Key lengths are comparable only within one kind of algorithm. Symmetric keys provide equal strength at much shorter lengths than asymmetric keys."}],"checks":[{"q":"Two offices need to exchange large files securely over the internet and have no secure way to share a key in advance. Which approach BEST meets the need?","o":["Use asymmetric cryptography to exchange a symmetric session key","Use asymmetric encryption for all of the file data","Use symmetric encryption and email the key to the other office","Use full-disk encryption on both file servers"],"e":"The hybrid approach uses asymmetric cryptography to solve key distribution and symmetric encryption for speed. Emailing the key exposes it, and full-disk encryption does not protect data in transit."},{"q":"A database administrator must be able to manage a customer table but must not be able to read the stored credit card numbers. Which encryption level BEST meets this requirement?","o":["Record","Full-disk","Partition","Volume"],"e":"Record-level encryption protects individual rows or fields, so the administrator sees ciphertext in that column. Disk, partition, and volume encryption are transparent to anyone with access to the running system."},{"q":"Which of the following is a weakness of symmetric encryption?","o":["The shared key must be distributed securely to each party","It is too slow to encrypt large files","It requires a certificate authority to operate","The public key can be used to derive the private key"],"e":"Symmetric encryption relies on a single shared secret, and delivering it safely is the central problem. Being slow is the weakness of asymmetric encryption."},{"q":"A mobile device manufacturer wants strong asymmetric encryption that uses short keys and little processing power. Which algorithm BEST fits?","o":["ECC","RSA","AES","3DES"],"e":"Elliptic curve cryptography provides strength comparable to RSA with much shorter keys. AES and 3DES are symmetric algorithms."},{"q":"A user signs in to a laptop protected by full-disk encryption and emails a spreadsheet to a partner. Which statement is accurate?","o":["The attachment is not protected by the laptop's disk encryption","The attachment remains encrypted until the partner signs in","Full-disk encryption also encrypts all network traffic","The partner needs the laptop's recovery key to open the file"],"e":"Full-disk encryption protects data stored on that drive. Once a file is copied or sent elsewhere, it needs file-level or transport encryption."},{"q":"Which of the following protects data in transit?","o":["TLS","Full-disk encryption","Record-level encryption","Volume encryption"],"e":"TLS encrypts communication between two endpoints. The other choices protect data at rest."}],"drill":"<li><b>The Drill Down:<\/b> add the keywords below. Keep going until the \"which key\" questions feel automatic.<\/li><li><b>Acronym Recall:<\/b> run 15 items on Easy, then 15 on Hard. AES, RSA, ECC, TLS, and VPN should be instant.<\/li><li><b>Flashcards:<\/b> run a session and sort each cryptography card out loud as symmetric, asymmetric, or neither.<\/li>","text":" Cryptography is the largest objective in Domain 1 and the one beginners fear most. The exam does not ask for any mathematics. It asks which kind of encryption fits a described need, which key is used for which job, and where encryption should be applied. This lesson covers encryption. The next two cover hashing and signatures, then certificates. Encryption scrambles readable information so that only someone with the right key can unscramble it. Four words to learn first: Plaintext : the readable original. Ciphertext : the scrambled result. Algorithm (or cipher): the published recipe for scrambling. Everyone can know the recipe. Key : the secret value fed into the recipe. The security rests on the key, not on hiding the recipe. Two everyday pictures help. A house key locks and unlocks the same door: one key does both jobs. That is the first kind of encryption. A mail slot is different: anyone can push a letter in, and only the person with the key to the box can take letters out. That is the second kind. The rest of this lesson gives those two kinds their proper names. Symmetric encryption Symmetric encryption uses one key to encrypt and to decrypt. Both sides must hold the same secret key. Strength: it is fast, so it is used for large amounts of data: files, whole disks, network sessions. Weakness: key distribution. Both sides need the key, and sending it across an untrusted network exposes it. It also scales badly: every pair of people needs its own key. Algorithm to know: AES is the current standard, with key lengths of 128, 192, or 256 bits. DES and 3DES are older and retired. Other names for the same idea: secret-key or shared-key encryption. Asymmetric encryption Asymmetric encryption uses a key pair that is mathematically linked. The public key can be given to anyone. The private key is kept secret by its owner and never shared. What one key of the pair encrypts, only the other key of the same pair can decrypt. Knowing the public key does not reveal the private key. Strength: no shared secret has to be delivered in advance. This solves the key distribution problem. Weakness: it is much slower than symmetric encryption, so it is not used for bulk data. Algorithms to know: RSA , ECC (elliptic curve cryptography), and Diffie-Hellman . ECC gives the same strength as RSA with much shorter keys, so it suits phones and small devices. Another name for it is public-key cryptography. Which key does which job This is the most tested idea in the lesson. There are only two jobs. Goal Encrypt or sign with Decrypt or verify with Confidentiality (only Bob can read it) Bob's public key Bob's private key Proof of sender (digital signature from Alice) Alice's private key Alice's public key Memory hook To keep a secret for someone, use their public key. To prove something came from you, use your private key. A private key is only ever used by its owner. Trap Nobody ever sends, shares, or uses another person's private key. Any answer choice in which Alice uses \"Bob's private key\" is wrong. Key exchange Symmetric encryption is fast, and it needs both sides to hold the same key. Key exchange is how they get it. Out-of-band: deliver the key by a different channel, such as in person or by courier. Safe, slow, and impractical on the internet. In-band: send it over the same network, protected by asymmetric cryptography. Two in-band methods matter: Encrypt the session key with the recipient's public key. Only the recipient's private key can recover it. Diffie-Hellman key agreement. Each side combines its own private value with the other side's public value, and both arrive at the same shared secret. The secret itself never crosses the network. The result in both cases is a session key : a symmetric key used for one conversation and then discarded. Hybrid encryption is this combination: asymmetric cryptography to establish the session key, symmetric cryptography for the data. Nearly all secure communication, including TLS, works this way. Exam tip When a question asks how two parties can communicate quickly and avoid sharing a key in advance, the answer is the hybrid approach: asymmetric for the key exchange, symmetric for the data. Algorithms and key length An algorithm is the method. The key length is the size of the key in bits. A longer key means more possible keys and more work for an attacker who tries them all, which is called a brute-force attack. A longer key also costs more processing. Trap Key lengths can only be compared within the same kind of algorithm . AES-256 is stronger than AES-128. A 2048-bit RSA key is not stronger than a 256-bit AES key. Symmetric keys are much shorter for the same strength: a 256-bit ECC key is roughly as strong as a 3072-bit RSA key. Reasonable current choices: AES with 128 bits or more, RSA with 2048 bits or more. Encryption levels: data at rest Encryption can be applied at different levels of storage. The objectives list six. Level What gets encrypted Typical use Full-disk The entire drive, including the operating system Laptops and phones; protects a lost or stolen device Partition One partition of a drive Encrypting the data partition, leaving another unencrypted Volume One logical volume, which may be a single partition or span several disks An encrypted data volume or container File Individual files or folders Protecting selected files, including from other users of the same machine Database The database files as a whole Protecting the stored database from someone who copies the files Record Individual rows or fields inside the database Encrypting only the sensitive column, such as an account number Confusable pair Full-disk vs. file encryption. Full-disk encryption protects everything while the device is powered off or locked . Once the user signs in, the disk is unlocked and files are readable by that session. File-level encryption protects specific files even on a running, shared system, and can stay with a file when it is copied elsewhere. Confusable pair Database vs. record encryption. Database encryption protects the whole database as stored on disk, and an authorized database user still sees everything. Record-level encryption protects chosen rows or fields, so even an administrator browsing the table sees ciphertext in those fields. Trap Full-disk encryption does nothing for a file after it leaves the disk. An email attachment sent from an encrypted laptop travels unencrypted unless something else protects it. Transport and communication encryption: data in transit Data moving across a network needs its own protection. TLS protects web traffic (HTTPS) and many other protocols. A VPN builds an encrypted tunnel between two points, commonly using IPsec or TLS. SSH protects remote administration sessions and file transfers. A complete design protects data at rest and in transit. HTTPS protects a card number on its way to a web server. It says nothing about how the server stores that number afterward. Exam vs. real world Encoding (such as Base64) and compression change how data looks without using a key. They provide no confidentiality. If a question describes data that was \"encoded\", it has not been encrypted. Symmetric Asymmetric Keys One shared secret key A pair: public key and private key Speed Fast Slow Used for Bulk data: files, disks, sessions Key exchange, digital signatures, certificates Main weakness Getting the key to the other side safely Too slow for large data Algorithms AES (current); DES and 3DES (retired) RSA, ECC, Diffie-Hellman Confidentiality: encrypt with the recipient's public key; the recipient decrypts with their private key. Hybrid: asymmetric encryption protects the exchange of a symmetric session key, then symmetric encryption carries the data. This is how TLS works. Key length: longer is stronger within one algorithm . Lengths are not comparable across algorithm families. Levels at rest: full-disk, partition, volume, file, database, record. In transit: TLS, VPN, SSH. "},"1.4b":{"id":"1.4b","obj":"1.4","min":25,"title":"Hashing, salting, digital signatures, obfuscation, and blockchain","kw":["hashing","salting","key stretching","digital signature","steganography","tokenization","data masking","blockchain"],"cov":["Hashing","Salting","Digital signatures","Key stretching","Obfuscation","Steganography","Tokenization","Data masking","Blockchain","Open public ledger"],"why":"<p>Encryption hides data. The tools in this lesson do other jobs: proving data has not changed, protecting stored passwords, proving who sent something, and disguising data without encrypting it. The exam describes a need and offers several of these as answer choices, so the skill is telling them apart.<\/p>","plain":"<p>A <strong>hash<\/strong> is a fingerprint for data. Feed any file or password into a hash function and you get back a short, fixed-length string of characters. The same input always gives the same fingerprint. Change one letter of the input and the fingerprint changes completely. And you cannot run it backward: a fingerprint does not let you rebuild the person.<\/p>\n<p>That one idea, a one-way fingerprint, is behind most of this lesson. Password storage uses it. Digital signatures use it. Blockchain uses it.<\/p>","fast":"<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>What it gives you<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hashing<\/td>\n<td>Integrity: detects any change. One-way, no key<\/td>\n<\/tr>\n<tr>\n<td>Salting<\/td>\n<td>Unique hashes for identical passwords; defeats precomputed tables<\/td>\n<\/tr>\n<tr>\n<td>Key stretching<\/td>\n<td>Makes each password guess slow<\/td>\n<\/tr>\n<tr>\n<td>Digital signature<\/td>\n<td>Integrity, proof of sender, non-repudiation<\/td>\n<\/tr>\n<tr>\n<td>Steganography<\/td>\n<td>Hides the <em>existence<\/em> of data inside another file<\/td>\n<\/tr>\n<tr>\n<td>Tokenization<\/td>\n<td>Replaces sensitive data with an unrelated stand-in; the real value stays in a vault<\/td>\n<\/tr>\n<tr>\n<td>Data masking<\/td>\n<td>Hides part of a value from view; the original usually still exists<\/td>\n<\/tr>\n<tr>\n<td>Blockchain<\/td>\n<td>A shared, tamper-evident record with no central owner<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Signature:<\/strong> sender hashes the message and encrypts the hash with the sender's <strong>private<\/strong> key. Anyone verifies with the sender's <strong>public<\/strong> key. A signature does not hide the message.<\/li>\n<li>Weak hashes: <strong>MD5<\/strong> and <strong>SHA-1<\/strong>. Current: <strong>SHA-256<\/strong> and the rest of the SHA-2 family, and SHA-3.<\/li>\n<\/ul>","core":"<h3>Hashing<\/h3>\n<p>A <strong>hash function<\/strong> takes input of any size and produces a fixed-length output called a <strong>hash<\/strong> or <strong>digest<\/strong>.<\/p>\n<ul>\n<li><strong>One-way.<\/strong> The original cannot be recovered from the hash. There is no key and no \"decrypting\" a hash.<\/li>\n<li><strong>Deterministic.<\/strong> The same input always produces the same hash.<\/li>\n<li><strong>Sensitive.<\/strong> A tiny change to the input produces a completely different hash.<\/li>\n<li><strong>Fixed length.<\/strong> A one-line note and a full movie produce digests of the same size.<\/li>\n<\/ul>\n<p>Hashing provides <strong>integrity<\/strong>. If the hash of a file you downloaded matches the hash the publisher posted, the file is unchanged.<\/p>\n<p>A <strong>collision<\/strong> is two different inputs producing the same hash. Good algorithms make collisions practically impossible to find. <strong>MD5<\/strong> and <strong>SHA-1<\/strong> have known collision problems and should not be used for security. <strong>SHA-256<\/strong> (part of SHA-2) and <strong>SHA-3<\/strong> are current.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Hashing vs. encryption.<\/strong> Encryption is two-way and uses a key: its goal is confidentiality. Hashing is one-way and uses no key: its goal is integrity. If the question says \"verify the file was not altered\", think hashing. If it says \"prevent others from reading\", think encryption.<\/p><\/div>\n\n<h3>Storing passwords: hashing, salting, key stretching<\/h3>\n<p>Systems should never store passwords in readable form. They store the <strong>hash<\/strong> of each password and compare hashes at login.<\/p>\n<p>Plain hashing has two weaknesses. Two users with the same password get the same hash. And attackers build <strong>rainbow tables<\/strong>: huge precomputed lists of common passwords and their hashes, so a stolen hash can simply be looked up.<\/p>\n<p><strong>Salting<\/strong> fixes both. A <strong>salt<\/strong> is a random value, unique to each user, that is added to the password before hashing. The salt is stored next to the hash and is not secret. Identical passwords now produce different hashes, and precomputed tables are useless because the attacker would need a separate table for every salt.<\/p>\n<p><strong>Key stretching<\/strong> makes each guess expensive. The password is run through the hash function thousands of times or more, so that checking one guess takes noticeable computing effort. A legitimate login barely notices; an attacker trying billions of guesses is slowed enormously. Algorithms to recognize: <strong>PBKDF2<\/strong> and <strong>bcrypt<\/strong>.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Salting vs. key stretching.<\/strong> Salting makes every stored hash <em>unique<\/em>, which defeats rainbow tables. Key stretching makes every guess <em>slow<\/em>, which defeats brute force. Good password storage uses both.<\/p><\/div>\n\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>A salt is not a secret and does not need to be hidden. Its job is uniqueness. If an answer says salting \"encrypts\" the password, it is wrong.<\/p><\/div>\n\n<h3>Digital signatures<\/h3>\n<p>A <strong>digital signature<\/strong> proves who sent a message and that it has not been changed.<\/p>\n<ol>\n<li>The sender hashes the message.<\/li>\n<li>The sender encrypts that hash with the sender's <strong>private key<\/strong>. The result is the signature.<\/li>\n<li>The receiver decrypts the signature with the sender's <strong>public key<\/strong>, hashes the received message, and compares the two hashes.<\/li>\n<\/ol>\n<p>If they match, three things are established:<\/p>\n<ul>\n<li><strong>Integrity:<\/strong> the message was not altered.<\/li>\n<li><strong>Authentication:<\/strong> it came from the holder of that private key.<\/li>\n<li><strong>Non-repudiation:<\/strong> the sender cannot deny it, because only the sender has that key.<\/li>\n<\/ul>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>A digital signature does <strong>not<\/strong> provide confidentiality. The message itself travels in readable form unless it is also encrypted. Signing and encrypting are separate operations with different keys.<\/p><\/div>\n\n<div class=\"co mem\"><span class=\"k\">Memory hook<\/span><p>Signing uses the <strong>sender's private<\/strong> key. Encrypting for secrecy uses the <strong>recipient's public<\/strong> key. Say both sentences until they are automatic.<\/p><\/div>\n\n<h3>Obfuscation<\/h3>\n<p><strong>Obfuscation<\/strong> makes something harder to understand or find without encrypting it in the usual sense. The objectives list three forms.<\/p>\n<p><strong>Steganography.<\/strong> Hiding data inside another file, such as an image, an audio file, or a video, so that nobody notices a message exists. The carrier file looks normal. Its purpose is concealing the <em>existence<\/em> of the data.<\/p>\n<p><strong>Tokenization.<\/strong> Replacing a sensitive value with a random stand-in called a <strong>token<\/strong>. The real value and the mapping live in a protected system called a token vault. The token has no mathematical relationship to the original, so it cannot be reversed by calculation. Payment systems use this so that merchants handle tokens and never store the real card number.<\/p>\n<p><strong>Data masking.<\/strong> Hiding part of a value when it is displayed or copied, such as showing a card number as <code>**** **** **** 4321<\/code>. The viewer sees only what they need. The complete value normally still exists in the underlying system.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Tokenization vs. encryption vs. masking.<\/strong> Encryption transforms the value with a key, and anyone with the key can reverse it. Tokenization <em>swaps<\/em> the value for an unrelated one, and only the vault can map it back. Masking <em>hides part of the display<\/em>. Wording to watch for: \"replaced with a random value\" or \"stored in a vault\" means tokenization; \"only the last four digits are shown\" means masking.<\/p><\/div>\n\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Steganography vs. encryption.<\/strong> Encrypted data is obviously scrambled; everyone can see a secret exists. Steganography hides the fact that there is a secret at all. \"Hidden inside an image\" means steganography.<\/p><\/div>\n\n<h3>Blockchain and the open public ledger<\/h3>\n<p>A <strong>blockchain<\/strong> is a record of transactions kept as a chain of blocks. Each block contains a batch of transactions plus the <strong>hash of the previous block<\/strong>. Copies of the whole chain are held by many independent computers.<\/p>\n<p>Because each block includes the previous block's hash, changing an old transaction would change that block's hash and break every block after it. With many copies in many hands, the tampering is noticed and rejected. The record is <strong>tamper-evident<\/strong> without any central authority.<\/p>\n<p>An <strong>open public ledger<\/strong> is a blockchain that anyone may read and verify. Every participant can see the full history of transactions.<\/p>\n<p>What it provides: integrity of the record and a history nobody can quietly rewrite. Uses include digital currency, tracking goods through a supply chain, and recording votes or ownership.<\/p>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>A public ledger is not confidential. Everyone can read it. Blockchain answers an integrity and trust question, not a secrecy question.<\/p><\/div>","recall":[["What does hashing provide, and is it reversible?","Integrity. It is one-way and cannot be reversed."],["Name two weak hash algorithms and two current ones.","Weak: MD5 and SHA-1. Current: SHA-256 (SHA-2) and SHA-3."],["What is a salt, and what attack does it defeat?","A unique random value added to each password before hashing. It defeats rainbow tables and makes identical passwords hash differently."],["What does key stretching do?","It repeats the hashing many times so each guess is slow, which defeats brute force."],["How is a digital signature created and verified?","The sender encrypts the message hash with the sender's private key. The receiver verifies with the sender's public key."],["What three things does a digital signature provide, and what does it not provide?","Integrity, authentication, non-repudiation. It does not provide confidentiality."],["Tokenization versus data masking?","Tokenization replaces the value with an unrelated token and keeps the original in a vault. Masking hides part of the value from view."],["What links one block of a blockchain to the next?","Each block contains the hash of the previous block."]],"pre":[{"q":"A software vendor publishes a SHA-256 value next to each download. What is the purpose of this value?","o":["To let customers verify the file has not been altered","To let customers decrypt the file after downloading","To prevent unauthorized users from downloading the file","To hide the file's contents during transfer"],"e":"A published hash lets the customer confirm integrity by comparing it with the hash of the downloaded file. A hash cannot decrypt, restrict access, or hide content."},{"q":"Two employees choose the same password. Which technique ensures that their stored password hashes are different?","o":["Salting","Key stretching","Tokenization","Steganography"],"e":"A unique salt added to each password before hashing produces different hashes for identical passwords. Key stretching slows each guess without making identical passwords differ."},{"q":"Alice digitally signs a contract and sends it to Bob. Which key does Bob use to verify the signature?","o":["Alice's public key","Alice's private key","Bob's public key","Bob's private key"],"e":"The signature was created with Alice's private key, so it is verified with Alice's public key. Bob never has Alice's private key."},{"q":"A retailer replaces each stored credit card number with a random value that has no mathematical relationship to the original. The real numbers are kept in a separate secured system. Which technique is this?","o":["Tokenization","Data masking","Hashing","Steganography"],"e":"Substituting an unrelated value and keeping the original in a vault is tokenization. Masking hides part of a displayed value, and hashing produces a one-way digest of the original."}],"checks":[{"q":"Attackers steal a password database and attempt to look up each hash in a large precomputed table. Which control makes this technique ineffective?","o":["Salting each password before hashing","Encrypting the login page with TLS","Masking the password field on screen","Storing passwords with MD5"],"e":"A unique salt per password means a precomputed table no longer matches the stored hashes. TLS protects the password in transit, and MD5 is a weak algorithm that makes the problem worse."},{"q":"A customer service screen shows only the last four digits of each account number, while the complete number remains in the database. Which technique is in use?","o":["Data masking","Tokenization","Record encryption","Key stretching"],"e":"Hiding part of a value from view while the full value still exists is data masking. Tokenization would replace the stored value with an unrelated token."},{"q":"An employee hides confidential design documents inside vacation photographs and posts the photographs to a public website. Which technique is the employee using?","o":["Steganography","Tokenization","Salting","Hashing"],"e":"Concealing data inside another file so that its existence is not noticed is steganography."},{"q":"Which of the following does a digital signature NOT provide?","o":["Confidentiality","Integrity","Non-repudiation","Authentication"],"e":"A signature proves origin and integrity and supports non-repudiation. The signed content is still readable unless it is separately encrypted."},{"q":"A consortium of shipping companies needs a shared record of container movements that no single company controls and that cannot be altered without detection. Which technology BEST fits?","o":["Blockchain","Steganography","Full-disk encryption","Key stretching"],"e":"A blockchain is a distributed ledger whose blocks are linked by hashes, so changes are evident and no central owner is needed."},{"q":"A system processes each password through a hashing function many thousands of times before storing the result. What is the PRIMARY purpose of this design?","o":["To slow down brute-force guessing","To make identical passwords hash differently","To allow the password to be recovered later","To hide the password inside another file"],"e":"Repeating the hash is key stretching, which makes each guess costly. Making identical passwords differ is the job of the salt."}],"drill":"<li><b>The Drill Down:<\/b> add the keywords below. The tokenization, masking, and encryption trio deserves the most repetitions.<\/li><li><b>Flashcards:<\/b> run 15 cards. For each tool, say whether it supports confidentiality, integrity, or neither.<\/li><li><b>PBQ Lab:<\/b> open \"Cryptographic Technique Recognition\".<\/li><li><b>Acronym Recall:<\/b> run 15 items and watch for SHA, MD5, and PBKDF2.<\/li>","text":" Encryption hides data. The tools in this lesson do other jobs: proving data has not changed, protecting stored passwords, proving who sent something, and disguising data without encrypting it. The exam describes a need and offers several of these as answer choices, so the skill is telling them apart. A hash is a fingerprint for data. Feed any file or password into a hash function and you get back a short, fixed-length string of characters. The same input always gives the same fingerprint. Change one letter of the input and the fingerprint changes completely. And you cannot run it backward: a fingerprint does not let you rebuild the person. That one idea, a one-way fingerprint, is behind m

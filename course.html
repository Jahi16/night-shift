h function thousands of times or more, so that checking one guess takes noticeable computing effort. A legitimate login barely notices; an attacker trying billions of guesses is slowed enormously. Algorithms to recognize: PBKDF2 and bcrypt . Confusable pair Salting vs. key stretching. Salting makes every stored hash unique , which defeats rainbow tables. Key stretching makes every guess slow , which defeats brute force. Good password storage uses both. Trap A salt is not a secret and does not need to be hidden. Its job is uniqueness. If an answer says salting \"encrypts\" the password, it is wrong. Digital signatures A digital signature proves who sent a message and that it has not been changed. The sender hashes the message. The sender encrypts that hash with the sender's private key . The result is the signature. The receiver decrypts the signature with the sender's public key , hashes the received message, and compares the two hashes. If they match, three things are established: Integrity: the message was not altered. Authentication: it came from the holder of that private key. Non-repudiation: the sender cannot deny it, because only the sender has that key. Trap A digital signature does not provide confidentiality. The message itself travels in readable form unless it is also encrypted. Signing and encrypting are separate operations with different keys. Memory hook Signing uses the sender's private key. Encrypting for secrecy uses the recipient's public key. Say both sentences until they are automatic. Obfuscation Obfuscation makes something harder to understand or find without encrypting it in the usual sense. The objectives list three forms. Steganography. Hiding data inside another file, such as an image, an audio file, or a video, so that nobody notices a message exists. The carrier file looks normal. Its purpose is concealing the existence of the data. Tokenization. Replacing a sensitive value with a random stand-in called a token . The real value and the mapping live in a protected system called a token vault. The token has no mathematical relationship to the original, so it cannot be reversed by calculation. Payment systems use this so that merchants handle tokens and never store the real card number. Data masking. Hiding part of a value when it is displayed or copied, such as showing a card number as **** **** **** 4321 . The viewer sees only what they need. The complete value normally still exists in the underlying system. Confusable pair Tokenization vs. encryption vs. masking. Encryption transforms the value with a key, and anyone with the key can reverse it. Tokenization swaps the value for an unrelated one, and only the vault can map it back. Masking hides part of the display . Wording to watch for: \"replaced with a random value\" or \"stored in a vault\" means tokenization; \"only the last four digits are shown\" means masking. Confusable pair Steganography vs. encryption. Encrypted data is obviously scrambled; everyone can see a secret exists. Steganography hides the fact that there is a secret at all. \"Hidden inside an image\" means steganography. Blockchain and the open public ledger A blockchain is a record of transactions kept as a chain of blocks. Each block contains a batch of transactions plus the hash of the previous block . Copies of the whole chain are held by many independent computers. Because each block includes the previous block's hash, changing an old transaction would change that block's hash and break every block after it. With many copies in many hands, the tampering is noticed and rejected. The record is tamper-evident without any central authority. An open public ledger is a blockchain that anyone may read and verify. Every participant can see the full history of transactions. What it provides: integrity of the record and a history nobody can quietly rewrite. Uses include digital currency, tracking goods through a supply chain, and recording votes or ownership. Trap A public ledger is not confidential. Everyone can read it. Blockchain answers an integrity and trust question, not a secrecy question. Tool What it gives you Hashing Integrity: detects any change. One-way, no key Salting Unique hashes for identical passwords; defeats precomputed tables Key stretching Makes each password guess slow Digital signature Integrity, proof of sender, non-repudiation Steganography Hides the existence of data inside another file Tokenization Replaces sensitive data with an unrelated stand-in; the real value stays in a vault Data masking Hides part of a value from view; the original usually still exists Blockchain A shared, tamper-evident record with no central owner Signature: sender hashes the message and encrypts the hash with the sender's private key. Anyone verifies with the sender's public key. A signature does not hide the message. Weak hashes: MD5 and SHA-1 . Current: SHA-256 and the rest of the SHA-2 family, and SHA-3. "},"1.4c":{"id":"1.4c","obj":"1.4","min":30,"title":"PKI, certificates, and where keys are kept","kw":["certificate","key escrow","ocsp","crl","wildcard","self-signed","tpm","hsm","secure enclave","root of trust"],"cov":["Public key infrastructure (PKI)","Public key","Private key","Key escrow","Certificates","Certificate authorities","Certificate revocation lists (CRLs)","Online Certificate Status Protocol (OCSP)","Self-signed","Third-party","Root of trust","Certificate signing request (CSR) generation","Wildcard","Tools","Trusted Platform Module (TPM)","Hardware security module (HSM)","Key management system","Secure enclave"],"why":"<p>Asymmetric encryption has one open problem: when a website hands you its public key, how do you know the key really belongs to that website and not to an impostor? Certificates answer that question, and public key infrastructure is the system that issues and manages them. The second half of the lesson covers the hardware and services that keep keys safe, four items that are easy to confuse.<\/p>","plain":"<p>A passport is trusted because a government issued it, and border officers trust that government. The passport ties your face and name together, carries an expiry date, and can be cancelled.<\/p>\n<p>A <strong>digital certificate<\/strong> is a passport for a public key. It ties a name, such as a website address, to a public key. It is issued and signed by an organization called a <strong>certificate authority<\/strong>, which your computer already trusts. It has an expiry date and can be cancelled early, which is called <em>revocation<\/em>.<\/p>\n<p>When your browser shows a padlock, it has checked the site's certificate: issued by an authority it trusts, not expired, not cancelled, and matching the address you typed.<\/p>","fast":"<ul>\n<li><strong>PKI:<\/strong> the people, policies, hardware, and software that create, distribute, manage, and revoke certificates.<\/li>\n<li><strong>Certificate:<\/strong> binds an identity to a public key, signed by a certificate authority.<\/li>\n<li><strong>CSR:<\/strong> the applicant generates a key pair and sends the <em>public<\/em> key plus identity details to the authority. The private key never leaves the applicant.<\/li>\n<li><strong>Root of trust:<\/strong> the starting point that is trusted without further proof, such as a root certificate authority or a hardware chip.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>One-phrase meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Third-party certificate<\/td>\n<td>Issued by a public authority that browsers already trust<\/td>\n<\/tr>\n<tr>\n<td>Self-signed certificate<\/td>\n<td>Signed by its own key; nobody else vouches for it<\/td>\n<\/tr>\n<tr>\n<td>Wildcard certificate<\/td>\n<td><code>*.example.com<\/code>: covers every subdomain one level down<\/td>\n<\/tr>\n<tr>\n<td>CRL<\/td>\n<td>A published list of revoked certificates<\/td>\n<\/tr>\n<tr>\n<td>OCSP<\/td>\n<td>A live query about one certificate's status<\/td>\n<\/tr>\n<tr>\n<td>Key escrow<\/td>\n<td>A trusted third party holds a copy of keys for recovery<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Scope<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TPM<\/td>\n<td>A chip on one device's motherboard; protects that device's keys<\/td>\n<\/tr>\n<tr>\n<td>HSM<\/td>\n<td>A dedicated device or service protecting keys for many servers<\/td>\n<\/tr>\n<tr>\n<td>Key management system<\/td>\n<td>Central software to create, rotate, and retire keys across services<\/td>\n<\/tr>\n<tr>\n<td>Secure enclave<\/td>\n<td>An isolated area of a processor that protects secrets from the main operating system<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","core":"<h3>Public key infrastructure<\/h3>\n<p><strong>Public key infrastructure<\/strong> is everything needed to create, distribute, manage, store, and revoke digital certificates: the policies, the procedures, the people, the hardware, and the software. Its purpose is to make public keys trustworthy by tying each one to a verified identity.<\/p>\n<p>The key pair from the encryption lesson is the foundation. The <strong>public key<\/strong> goes into the certificate for everyone to see. The <strong>private key<\/strong> stays with the owner and must be protected, because anyone who obtains it can impersonate the owner.<\/p>\n<h3>What a certificate contains<\/h3>\n<p>A <strong>digital certificate<\/strong> binds an identity to a public key. Its main fields:<\/p>\n<ul>\n<li>the <strong>subject<\/strong>: who the certificate belongs to, such as a domain name<\/li>\n<li>the subject's <strong>public key<\/strong><\/li>\n<li>the <strong>issuer<\/strong>: the certificate authority that signed it<\/li>\n<li>the <strong>validity period<\/strong>: start and end dates<\/li>\n<li>a <strong>serial number<\/strong><\/li>\n<li>the issuer's <strong>digital signature<\/strong> over all of the above<\/li>\n<\/ul>\n<p>The standard format is called X.509.<\/p>\n<h3>Certificate authorities and the chain of trust<\/h3>\n<p>A <strong>certificate authority<\/strong> verifies the identity of an applicant and then signs the applicant's certificate with the authority's own private key. Anyone holding the authority's public key can check that signature.<\/p>\n<p>Authorities are arranged in a hierarchy:<\/p>\n<ol>\n<li>The <strong>root certificate authority<\/strong> sits at the top. Its certificate is signed by itself. Root certificates come pre-installed in operating systems and browsers. The root's private key is so valuable that the root is usually kept offline.<\/li>\n<li><strong>Intermediate authorities<\/strong> hold certificates signed by the root. They do the day-to-day issuing.<\/li>\n<li>The <strong>end certificate<\/strong> for a server or user is signed by an intermediate.<\/li>\n<\/ol>\n<p>Your browser follows this chain upward until it reaches a root it already trusts.<\/p>\n<p><strong>Root of trust.<\/strong> Every system of trust has to start somewhere. The root of trust is the component that is trusted without anything else vouching for it, and everything else's trustworthiness is derived from it. In PKI, that is the root certificate authority. In hardware, it is a protected chip such as a TPM or an HSM.<\/p>\n<h3>Getting a certificate: the certificate signing request<\/h3>\n<ol>\n<li>The applicant generates a key pair on their own system.<\/li>\n<li>The applicant creates a <strong>certificate signing request<\/strong> containing the public key and identifying details, signed with the new private key.<\/li>\n<li>The request is sent to the certificate authority.<\/li>\n<li>The authority validates the applicant's identity, signs a certificate, and returns it.<\/li>\n<\/ol>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>The private key is <strong>never<\/strong> sent to the certificate authority. A certificate signing request contains the public key only. Any answer in which the private key is submitted, emailed, or included in the certificate is wrong.<\/p><\/div>\n\n<h3>Third-party, self-signed, and internal certificates<\/h3>\n<p><strong>Third-party.<\/strong> Issued by a public certificate authority whose root is already trusted by browsers and operating systems. Required for anything the public will connect to, such as a company website.<\/p>\n<p><strong>Self-signed.<\/strong> Signed with its own private key, with no outside authority vouching for it. It costs nothing and still encrypts the connection, but other systems have no reason to trust it, so browsers show a warning. Acceptable for testing and for internal systems.<\/p>\n<p>Between the two sits the <strong>internal (private) certificate authority<\/strong>: an organization runs its own authority and installs its root certificate on company devices. Those devices then trust everything it issues. This is how companies issue certificates for internal servers and for authenticating company-owned devices.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Self-signed vs. third-party.<\/strong> Both encrypt equally well. The difference is <em>trust<\/em>: a third-party certificate proves identity to strangers, and a self-signed one proves nothing to anyone who has not chosen to trust it. \"Public-facing website\" means third-party. \"Internal lab server, lowest cost\" means self-signed.<\/p><\/div>\n\n<h3>Wildcard certificates<\/h3>\n<p>A <strong>wildcard certificate<\/strong> covers a domain and all its subdomains at one level, written with an asterisk: <code>*.example.com<\/code> is valid for <code>www.example.com<\/code>, <code>mail.example.com<\/code>, and <code>shop.example.com<\/code>. It is not valid for <code>a.b.example.com<\/code>.<\/p>\n<p>It is convenient: one certificate for many servers. The risk is that every one of those servers holds the same private key, so one compromised server exposes them all.<\/p>\n<p>A related option is a certificate with several specific names listed in its Subject Alternative Name field. That covers a fixed list of names, where a wildcard covers any name at that level.<\/p>\n<h3>Revocation: CRL and OCSP<\/h3>\n<p>A certificate sometimes has to be cancelled before it expires, most often because its private key was stolen. That is <strong>revocation<\/strong>, and clients need a way to find out.<\/p>\n<p><strong>Certificate revocation list.<\/strong> A list, published by the certificate authority, of the serial numbers of every revoked certificate. The client downloads the list and searches it. Lists grow large, and a downloaded copy is only as current as its last update.<\/p>\n<p><strong>Online Certificate Status Protocol.<\/strong> The client asks about one certificate and gets back its current status: good, revoked, or unknown. It is faster and more current than downloading a full list.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>CRL vs. OCSP.<\/strong> A CRL is the <em>whole list<\/em>, fetched periodically. OCSP is a <em>single question<\/em> answered in real time. If the question stresses \"real-time status\" or \"without downloading a list\", choose OCSP.<\/p><\/div>\n\n<p><strong>OCSP stapling<\/strong> improves on this: the web server itself fetches a signed, time-stamped status from the authority and attaches it to the connection handshake, so the client does not have to contact the authority.<\/p>\n<h3>Key escrow<\/h3>\n<p><strong>Key escrow<\/strong> means a trusted third party holds a copy of encryption keys so they can be recovered when needed: an employee leaves and their encrypted files must be opened, a key is lost, or a court orders access. The escrow copy must be tightly controlled, because whoever can reach it can decrypt the data.<\/p>\n<h3>Where keys are kept<\/h3>\n<p>The objectives list four tools. Sort them by scale.<\/p>\n<p><strong>Trusted Platform Module.<\/strong> A chip on a device's motherboard that provides cryptographic functions <em>for that one device<\/em>. It generates and stores keys that never leave the chip, supplies random numbers, and holds measurements used to verify that the device started up with unmodified software. Full-disk encryption on a laptop typically stores its key in the TPM, which ties the encrypted drive to that specific machine.<\/p>\n<p><strong>Hardware security module.<\/strong> A dedicated, tamper-resistant device (or a cloud service doing the same job) built to generate, store, and use keys at scale. It serves many systems at once: a certificate authority's signing keys, a payment system's keys, the private keys of a farm of web servers. It also speeds up cryptographic operations.<\/p>\n<p><strong>Key management system.<\/strong> Central software or a cloud service for the whole life of keys across an organization: creating, distributing, rotating, revoking, and logging their use. It keeps keys separate from the data they protect and gives one place to see and control them.<\/p>\n<p><strong>Secure enclave.<\/strong> A protected area built into a processor, isolated from the main operating system, with its own memory. Secrets such as encryption keys and fingerprint data are handled inside it, so they stay protected even if the operating system is compromised. Phones and modern laptops use one.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>TPM vs. HSM.<\/strong> A TPM is built into <strong>one device<\/strong> and protects that device's keys. An HSM is a <strong>separate, dedicated<\/strong> device that protects keys for <strong>many<\/strong> systems. \"Laptop\", \"motherboard\", or \"boot integrity\" means TPM. \"Certificate authority\", \"data center\", or \"thousands of keys\" means HSM.<\/p><\/div>\n\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Secure enclave vs. TPM.<\/strong> Both are hardware protection on a single device. A TPM is a separate chip that mainly stores keys and startup measurements. A secure enclave is an isolated environment inside the processor that <em>runs<\/em> sensitive operations away from the operating system. \"Isolated from the operating system\" and \"biometric data on a phone\" mean secure enclave.<\/p><\/div>\n\n<div class=\"co exam\"><span class=\"k\">Exam vs. real world<\/span><p>Real products blur these lines: cloud providers sell key management backed by HSMs, and some processors implement TPM functions in firmware. On the exam, match the scale and the wording: one device, many servers, organization-wide software, or isolation inside the processor.<\/p><\/div>","recall":[["What does a digital certificate bind together, and who signs it?","An identity and a public key. A certificate authority signs it."],["What goes into a certificate signing request, and what never leaves the applicant?","The public key and identifying details go in. The private key never leaves."],["What is the root of trust in PKI?","The root certificate authority, which is trusted without anything else vouching for it."],["Self-signed versus third-party certificate?","Self-signed has no outside authority vouching for it and triggers warnings. Third-party is issued by a publicly trusted authority."],["What does *.example.com cover and not cover?","It covers any subdomain one level down, such as mail.example.com. It does not cover a.b.example.com."],["CRL versus OCSP?","A CRL is a downloaded list of all revoked certificates. OCSP answers a live query about one certificate."],["What is key escrow for?","A third party holds copies of keys so data can be recovered when a key is lost or its owner is unavailable."],["TPM versus HSM?","A TPM is a chip protecting keys on one device. An HSM is a dedicated device protecting keys for many systems."],["What makes a secure enclave different?","It is an isolated area of the processor that protects secrets from the main operating system."]],"pre":[{"q":"An administrator needs a single certificate that secures www.example.com, mail.example.com, and any other first-level subdomain added later. Which type of certificate should be requested?","o":["Wildcard","Self-signed","Root","Escrowed"],"e":"A wildcard certificate covers all subdomains at one level of a domain. Self-signed describes who signed the certificate, not which names it covers."},{"q":"A web browser needs to confirm in real time that one specific certificate has not been revoked, without downloading a complete list. Which of the following provides this?","o":["OCSP","CRL","CSR","TPM"],"e":"OCSP returns the current status of a single certificate. A CRL is the complete downloaded list, and a CSR is a request for a new certificate."},{"q":"When an administrator generates a certificate signing request for a new web server, what is sent to the certificate authority?","o":["The server's public key and identifying information","The server's private key and identifying information","The certificate authority's private key","The server's symmetric session key"],"e":"A CSR contains the public key and the applicant's details. The private key stays on the server and is never sent."},{"q":"A company needs a tamper-resistant device in its data center to generate and store the private keys used by its certificate authority and dozens of web servers. Which of the following BEST meets this need?","o":["HSM","TPM","Secure enclave","Key escrow"],"e":"A hardware security module is a dedicated device that protects keys for many systems. A TPM protects keys on the single device it is built into."}],"checks":[{"q":"Users receive a browser warning that the certificate for an internal test server is not trusted, although the connection is encrypted. What is the MOST likely reason?","o":["The certificate is self-signed","The certificate is a wildcard certificate","The certificate has been placed in key escrow","The certificate was verified using OCSP"],"e":"A self-signed certificate has no trusted authority vouching for it, so browsers warn even though encryption works. Wildcards, escrow, and OCSP do not cause a trust warning."},{"q":"An employee who encrypted project files with a personal key pair leaves the company without notice. Which of the following would have allowed the company to recover the files?","o":["Key escrow","A certificate revocation list","A certificate signing request","A wildcard certificate"],"e":"Key escrow keeps a recoverable copy of keys with a trusted party. Revocation would only mark the employee's certificate invalid and would not decrypt anything."},{"q":"A laptop's full-disk encryption key is stored in a chip on the motherboard so that the drive cannot be read if it is moved to another computer. Which component is this?","o":["TPM","HSM","Key management system","Certificate authority"],"e":"A Trusted Platform Module is built into a single device and binds keys to that device. An HSM is a separate device serving many systems."},{"q":"A web server's private key is stolen. Which action should the certificate owner take FIRST regarding the certificate?","o":["Request that the certificate authority revoke it","Wait for the certificate to expire","Generate a new certificate signing request with the same key","Convert it to a wildcard certificate"],"e":"A certificate whose private key is compromised must be revoked so clients stop trusting it. Reusing the stolen key in a new request would keep the exposure."},{"q":"A smartphone processes fingerprint data in a hardware-isolated area of its processor that the main operating system cannot read. What is this area called?","o":["Secure enclave","Hardware security module","Key escrow","Root certificate authority"],"e":"A secure enclave is an isolated environment within the processor that protects secrets even if the operating system is compromised."},{"q":"In a public key infrastructure, which of the following serves as the root of trust?","o":["The root certificate authority","The certificate revocation list","The wildcard certificate","The certificate signing request"],"e":"All trust in the hierarchy derives from the root certificate authority, whose certificate is trusted without another party vouching for it."},{"q":"A security team wants one central service to create, rotate, and retire encryption keys for its databases, storage, and applications, with a log of every use. Which of the following BEST fits?","o":["Key management system","Trusted Platform Module","Online Certificate Status Protocol","Secure enclave"],"e":"A key management system centralizes the life cycle of keys across services. A TPM and a secure enclave protect keys on a single device."}],"drill":"<li><b>The Drill Down:<\/b> add the keywords below. TPM, HSM, and secure enclave are the group to repeat most.<\/li><li><b>Acronym Recall:<\/b> run 15 items. PKI, CSR, CRL, OCSP, TPM, and HSM must be instant, because the exam prints them bare.<\/li><li><b>PBQ Lab:<\/b> open \"Certificate Request Flow\" and place the steps in order.<\/li>","text":" Asymmetric encryption has one open problem: when a website hands you its public key, how do you know the key really belongs to that website and not to an impostor? Certificates answer that question, and public key infrastructure is the system that issues and manages them. The second half of the lesson covers the hardware and services that keep keys safe, four items that are easy to confuse. A passport is trusted because a government issued it, and border officers trust that government. The passport ties your face and name together, carries an expiry date, and can be cancelled. A digital certificate is a passport for a public key. It ties a name, such as a website address, to a public key. It is issued and signed by an organization called a certificate authority , which your computer already trusts. It has an expiry date and can be cancelled early, which is called revocation . When your browser shows a padlock, it has checked the site's certificate: issued by an authority it trusts, not expired, not cancelled, and matching the address you typed. Public key infrastructure Public key infrastructure is everything needed to create, distribute, manage, store, and revoke digital certificates: the policies, the procedures, the people, the hardware, and the software. Its purpose is to make public keys trustworthy by tying each one to a verified identity. The key pair from the encryption lesson is the foundation. The public key goes into the certificate for everyone to see. The private key stays with the owner and must be protected, because anyone who obtains it can impersonate the owner. What a certificate contains A digital certificate binds an identity to a public key. Its main fields: the subject : who the certificate belongs to, such as a domain name the subject's public key the issuer : the certificate authority that signed it the validity period : start and end dates a serial number the issuer's digital signature over all of the above The standard format is called X.509. Certificate authorities and the chain of trust A certificate authority verifies the identity of an applicant and then signs the applicant's certificate with the authority's own private key. Anyone holding the authority's public key can check that signature. Authorities are arranged in a hierarchy: The root certificate authority sits at the top. Its certificate is signed by itself. Root certificates come pre-installed in operating systems and browsers. The root's private key is so valuable that the root is usually kept offline. Intermediate authorities hold certificates signed by the root. They do the day-to-day issuing. The end certificate for a server or user is signed by an intermediate. Your browser follows this chain upward until it reaches a root it already trusts. Root of trust. Every system of trust has to start somewhere. The root of trust is the component that is trusted without anything else vouching for it, and everything else's trustworthiness is derived from it. In PKI, that is the root certificate authority. In hardware, it is a protected chip such as a TPM or an HSM. Getting a certificate: the certificate signing request The applicant generates a key pair on their own system. The applicant creates a certificate signing request containing the public key and identifying details, signed with the new private key. The request is sent to the certificate authority. The authority validates the applicant's identity, signs a certificate, and returns it. Trap The private key is never sent to the certificate authority. A certificate signing request contains the public key only. Any answer in which the private key is submitted, emailed, or included in the certificate is wrong. Third-party, self-signed, and internal certificates Third-party. Issued by a public certificate authority whose root is already trusted by browsers and operating systems. Required for anything the public will connect to, such as a company website. Self-signed. Signed with its own private key, with no outside authority vouching for it. It costs nothing and still encrypts the connection, but other systems have no reason to trust it, so browsers show a warning. Acceptable for testing and for internal systems. Between the two sits the internal (private) certificate authority : an organization runs its own authority and installs its root certificate on company devices. Those devices then trust everything it issues. This is how companies issue certificates for internal servers and for authenticating company-owned devices. Confusable pair Self-signed vs. third-party. Both encrypt equally well. The difference is trust : a third-party certificate proves identity to strangers, and a self-signed one proves nothing to anyone who has not chosen to trust it. \"Public-facing website\" means third-party. \"Internal lab server, lowest cost\" means self-signed. Wildcard certificates A wildcard certificate covers a domain and all its subdomains at one level, written with an asterisk: *.example.com is valid for www.example.com , mail.example.com , and shop.example.com . It is not valid for a.b.example.com . It is convenient: one certificate for many servers. The risk is that every one of those servers holds the same private key, so one compromised server exposes them all. A related option is a certificate with several specific names listed in its Subject Alternative Name field. That covers a fixed list of names, where a wildcard covers any name at that level. Revocation: CRL and OCSP A certificate sometimes has to be cancelled before it expires, most often because its private key was stolen. That is revocation , and clients need a way to find out. Certificate revocation list. A list, published by the certificate authority, of the serial numbers of every revoked certificate. The client downloads the list and searches it. Lists grow large, and a downloaded copy is only as current as its last update. Online Certificate Status Protocol. The client asks about one certificate and gets back its current status: good, revoked, or unknown. It is faster and more current than downloading a full list. Confusable pair CRL vs. OCSP. A CRL is the whole list , fetched periodically. OCSP is a single question answered in real time. If the question stresses \"real-time status\" or \"without downloading a list\", choose OCSP. OCSP stapling improves on this: the web server itself fetches a signed, time-stamped status from the authority and attaches it to the connection handshake, so the client does not have to contact the authority. Key escrow Key escrow means a trusted third party holds a copy of encryption keys so they can be recovered when needed: an employee leaves and their encrypted files must be opened, a key is lost, or a court orders access. The escrow copy must be tightly controlled, because whoever can reach it can decrypt the data. Where keys are kept The objectives list four tools. Sort them by scale. Trusted Platform Module. A chip on a device's motherboard that provides cryptographic functions for that one device . It generates and stores keys that never leave the chip, supplies random numbers, and holds measurements used to verify that the device started up with unmodified software. Full-disk encryption on a laptop typically stores its key in the TPM, which ties the encrypted drive to that specific machine. Hardware security module. A dedicated, tamper-resistant device (or a cloud service doing the same job) built to generate, store, and use keys at scale. It serves many systems at once: a certificate authority's signing keys, a payment system's keys, the private keys of a farm of web servers. It also speeds up cryptographic operations. Key management system. Central software or a cloud service for the whole life of keys across an organization: creating, distributing, rotating, revoking, and logging their use. It keeps keys separate from the data they protect and gives one place to see and control them. Secure enclave. A protected area built into a processor, isolated from the main operating system, with its own memory. Secrets such as encryption keys and fingerprint data are handled inside it, so they stay protected even if the operating system is compromised. Phones and modern laptops use one. Confusable pair TPM vs. HSM. A TPM is built into one device and protects that device's keys. An HSM is a separate, dedicated device that protects keys for many systems. \"Laptop\", \"motherboard\", or \"boot integrity\" means TPM. \"Certificate authority\", \"data center\", or \"thousands of keys\" means HSM. Confusable pair Secure enclave vs. TPM. Both are hardware protection on a single device. A TPM is a separate chip that mainly stores keys and startup measurements. A secure enclave is an isolated environment inside the processor that runs sensitive operations away from the operating system. \"Isolated from the operating system\" and \"biometric data on a phone\" mean secure enclave. Exam vs. real world Real products blur these lines: cloud providers sell key management backed by HSMs, and some processors implement TPM functions in firmware. On the exam, match the scale and the wording: one device, many servers, organization-wide software, or isolation inside the processor. PKI: the people, policies, hardware, and software that create, distribute, manage, and revoke certificates. Certificate: binds an identity to a public key, signed by a certificate authority. CSR: the applicant generates a key pair and sends the public key plus identity details to the authority. The private key never leaves the applicant. Root of trust: the starting point that is trusted without further proof, such as a root certificate authority or a hardware chip. Term One-phrase meaning Third-party certificate Issued by a public authority that browsers already trust Self-signed certificate Signed by its own key; nobody else vouches for it Wildcard certificate *.example.com : covers every subdomain one level down CRL A published list of revoked certificates OCSP A live query about one certificate's status Key escrow A trusted third party holds a copy of keys for recovery Tool Scope TPM A chip on one device's motherboard; protects that device's keys HSM A dedicated device or service protecting keys for many servers Key management system Central software to create, rotate, and retire keys across services Secure enclave An isolated area of a processor that protects secrets from the main operating system "}},"obj":{"1.1":"Compare and contrast various types of security controls.","1.2":"Summarize fundamental security concepts.","1.3":"Explain the importance of change management processes and the impact to security.","1.4":"Explain the importance of using appropriate cryptographic solutions.","2.1":"Compare and contrast common threat actors and motivations.","2.2":"Explain common threat vectors and attack surfaces.","2.3":"Explain various types of vulnerabilities.","2.4":"Given a scenario, analyze indicators of malicious activity.","2.5":"Explain the purpose of mitigation techniques used t let C=Object.assign({v:1,track:"",mins:30,exam:"",acr:"all",theme:"",l:{},last:""},lsGet("ns_course")||{});
if(!C.l) C.l={};
function save(){ lsSet("ns_course",C); }
/* Night Shift app state: readable only when this page is served from the same site as the app */
function readNS(){ const v=lsGet("ns_state"); return (v&&v.v===2)?v:null; }

/* ---------- course structure ---------- */
const L=COURSE.lessons, MODS=COURSE.mods;
function pendingMods(){ return MODS.filter(m=>m.weight&&!m.lessons.length); }
function modOf(id){ return MODS.find(m=>m.lessons.indexOf(id)>=0); }
function isOptional(id){ const m=modOf(id); return m.id==="F"&&C.track!=="new"; }
function nsDomAcc(ns,d){ const x=ns&&ns.dom&&ns.dom[d]; return (x&&x.s>=10)?x.c/x.s:null; }
function modOrder(){
  const ids=MODS.map(m=>m.id);
  if(C.track!=="exp") return ids;
  /* working-knowledge track: exam skills first, then domains weakest-first (Night Shift data) or by exam weight */
  const ns=readNS(); const doms=["1","2","3","4","5"];
  const key=d=>{ const a=nsDomAcc(ns,d); return a===null?null:a; };
  const haveAll=doms.every(d=>key(d)!==null);
  doms.sort((a,b)=>haveAll?(key(a)-key(b)):(DWEIGHT[b]-DWEIGHT[a]));
  return ["S","X"].concat(doms).concat(["F"]);
}
function path(){ const out=[]; modOrder().forEach(mid=>{ const m=MODS.find(x=>x.id===mid); m.lessons.forEach(id=>{ if(!isOptional(id)) out.push(id); }); }); return out; }
function st(id){ return C.l[id]||null; }
function isDone(id){ const s=st(id); return !!(s&&s.d); }
function nextLesson(){ return path().find(id=>!isDone(id))||null; }
function progress(){ const p=path(); const done=p.filter(isDone).length; return {done:done,total:p.length,pct:p.length?done/p.length:0,minsLeft:p.filter(id=>!isDone(id)).reduce((a,id)=>a+L[id].min,0)}; }
function reviewDue(id,now){ const s=st(id); if(!s||!s.d) return false; const r=s.r||[]; if(r.length>=REVIEW_GAPS.length) return false; const last=r.length?r[r.length-1]:s.d; return (now||Date.now())-last>=REVIEW_GAPS[r.length]*DAY; }
function dueList(){ const now=Date.now(); return Object.keys(L).filter(id=>reviewDue(id,now)); }
function hashOf(id){ return "#l-"+id.replace(/\./g,"-"); }
function idFromHash(h){ const m=/^#l-(.+)$/.exec(h); if(!m) return null; const raw=m[1]; return Object.keys(L).find(id=>id.replace(/\./g,"-")===raw)||null; }

/* ---------- Night Shift per-objective stats ---------- */
function objStats(ns,obj){ if(!ns||!ns.tag||!obj) return null; let s=0,m=0; (COURSE.tags[obj]||[]).forEach(t=>{ const x=ns.tag[t]; if(x){ s+=x.s; m+=x.m; } }); return s?{s:s,acc:(s-m)/s}:null; }
function pctTxt(x){ return Math.round(x*100)+"%"; }

/* ---------- acronym expansion ---------- */
let ACRX=null;
function acrBuild(){
  if(ACRX) return ACRX;
  const keys=Object.keys(COURSE.acr).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  ACRX=new RegExp("(^|[^A-Za-z0-9/&-])("+keys.join("|")+")(s)?(?![A-Za-z0-9&]|-[A-Za-z0-9]|/[A-Z])","g");
  return ACRX;
}
function plural(full){
  if(/\band\b|&/.test(full)) return full;
  const parts=full.split(/(\s+(?:of|for|over|to|as|in)\s+)/);
  parts[0]=parts[0].replace(/([A-Za-z]+)$/,w=>/s$/i.test(w)?w:(/[^aeiou]y$/i.test(w)?w.slice(0,-1)+"ies":(/(x|z|ch|sh)$/i.test(w)?w+"es":w+"s")));
  return parts.join("");
}
function expandAcr(root){
  if(C.acr==="off") return;
  const rx=acrBuild(), seen={};
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    for(let p=n.parentNode;p&&p!==root;p=p.parentNode){ const t=p.nodeName; if(t==="CODE"||t==="PRE"||t==="BUTTON"||t==="H1"||t==="SUMMARY"||(p.classList&&p.classList.contains("noacr"))) return NodeFilter.FILTER_REJECT; }
    return NodeFilter.FILTER_ACCEPT; }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const src=n.nodeValue; rx.lastIndex=0; let out="",last=0,m,changed=false;
    while((m=rx.exec(src))){
      const a=m[2], end=m.index+m[0].length, start=m.index+m[1].length;
      const after=src.slice(end,end+2), before=src.slice(Math.max(0,start-1),start);
      const full=COURSE.acr[a];
      const already=after===" ("||before==="("||(C.acr==="first"&&seen[a]);
      if(src.slice(Math.max(0,start-full.length-2),start).toLowerCase().indexOf(full.toLowerCase())>=0) { seen[a]=1; continue; }
      if(already){ seen[a]=1; continue; }
      seen[a]=1; changed=true;
      out+=esc(src.slice(last,end))+' <span class="dim">('+esc(m[3]?plural(full):full)+')</span>'; last=end;
    }
    if(changed){ out+=esc(src.slice(last)); const span=document.createElement("span"); span.innerHTML=out; n.parentNode.replaceChild(span,n); }
  });
}

function sessionPlan(){
  const budget=Math.max(10,Math.round(C.mins/2)); const out=[]; let used=0;
  for(const id of path()){ if(isDone(id)) continue; if(out.length&&used+L[id].min>budget) break; out.push(id); used+=L[id].min; if(used>=budget) break; }
  return {ids:out,lessonMins:used,drillMins:Math.max(5,C.mins-used)};
}
function drillFor(id,mins){
  const m=modOf(id); const n=mins>=25?25:15;
  if(/^[1-5]$/.test(m.id)) return `Question Queue, locked to Domain ${m.id}.0, ${n} tickets. Then add this lesson's keywords to The Drill Down if you missed more than a couple.`;
  if(m.id==="F") return `Acronym Recall, ${n} items on Easy. Foundations show up in every domain, so start building the vocabulary now.`;
  return `Question Queue across all domains, ${n} tickets, timer on.`;
}

/* ----- checkpoint questions ----- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderChecks(box,checks,onDone){
  let answered=0,right=0;
  box.innerHTML=checks.map((c,qi)=>{ const order=shuffle(c.o.map((_,i)=>i));
    return `<div class="q noacr" data-q="${qi}"><p class="qn">Question ${qi+1} of ${checks.length}</p><p class="qt">${c.q}</p>${order.map((oi,pos)=>`<button class="opt" data-o="${oi}">${String.fromCharCode(65+pos)}. ${c.o[oi]}</button>`).join("")}<div class="fb" hidden></div></div>`; }).join("");
  box.addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(!b||b.disabled) return;
    const qEl=b.closest(".q"), c=checks[parseInt(qEl.getAttribute("data-q"),10)], pick=parseInt(b.getAttribute("data-o"),10), ok=pick===0;
    qEl.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(x.getAttribute("data-o")==="0") x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    const fb=qEl.querySelector(".fb"); fb.hidden=false; fb.innerHTML=(ok?'<b class="ok">Correct.</b> ':'<b class="no">Not quite.</b> ')+c.e;
    answered++; if(ok) right++;
    if(answered===checks.length) onDone(right,checks.length);
  });
}

}

  const base=/^[1-5]$/.test(m.id)?`<li><b>Question Queue:</b> lock the queue to Domain ${m.id}.0 and run 15 tickets with the timer on.</li>`:"";
  return `<p class="sec-lab">Drill it in Night Shift</p>
  ${x?`<p class="stat">Your Night Shift record on objective ${l.obj}: <b>${pctTxt(x.acc)}</b> correct across <b>${x.s}</b> answers.</p>`:""}
  <ul>${base}${l.drill}</ul>
  ${l.kw.length?`<p style="margin:14px 0 4px"><b>The Drill Down keywords for this lesson</b></p><p class="dim" style="margin:0">Add these as topics in The Drill Down to pull every matching question and flashcard into one repeating pool.</p>
  <div class="kw noacr">${l.kw.map(k=>`<span>${esc(k)}</span>`).join("")}</div>
  <div class="row">${ns?`<button class="btn sm" id="sendKw">Send keywords to The Drill Down</button>`:""}<button class="btn sm ghost" id="copyKw">Copy keywords</button><a class="btn sm amber" href="${$("appLink").href}" target="_blank" rel="noopener">Open Night Shift</a></div>
  ${ns?`<p class="note" style="margin-top:6px">Close Night Shift in other tabs before sending, or it may overwrite the new topics with its older copy.</p>`:""}`:`<div class="row"><a class="btn sm amber" href="${$("appLink").href}" target="_blank" rel="noopener">Open Night Shift</a></div>`}`;
}
function trapsOf(l){ const tmp=document.createElement("div"); tmp.innerHTML=l.core; return [...tmp.querySelectorAll(".co")].map(x=>x.outerHTML).join(""); }
function viewLesson(id,mode){
  if(!C.track) return viewSetup(true);
  chrome("");
  const l=L[id], s=st(id), ns=readNS(), p=path(), idx=p.indexOf(id), m=modOf(id);
  const nextId=idx>=0?p.slice(idx+1).find(x=>!isDone(x))||p[idx+1]:nextLesson();
  const ownPre=!!(l.pre&&l.pre.length);                 /* lesson has its own placement questions */
  const preQs=ownPre?l.pre:l.checks;
  const canPlace=preQs.length>0&&m.id!=="S";
  if(!mode){ if(s&&s.d) mode=s.to?"fast":"full"; else if(s&&s.pre) mode="full"; else mode=canPlace?"gate":"full"; }
  if((mode==="gate"||mode==="pre")&&!canPlace) mode="full";
  const go=md=>{ viewLesson(id,md); window.scrollTo(0,0); };
  const head=`<p class="eyebrow">${esc(m.title)} &middot; ${mode==="fast"?"fast track":l.min+" min"}</p><h1>${esc(l.title)}</h1>
    ${l.obj?`<p class="objline">Objective <b>${l.obj}</b> &middot; ${esc(COURSE.obj[l.obj])}</p>`:""}
    ${l.cov&&l.cov.length?`<details class="cov noacr"><summary>Official objective bullets this lesson covers (${l.cov.length})</summary><ul>${l.cov.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>`:""}`;
  const nextBtn=pri=>(nextId&&nextId!==id)?`<a class="btn${pri?" pri":""}" href="${hashOf(nextId)}">Next: ${esc(L[nextId].title)}</a>`:"";

  /* ----- gate: choose placement check or full lesson ----- */
  if(mode==="gate"){
    const fresh=C.track==="new";
    const cPre=`<div class="card${fresh?"":" hi"}"><h3>Placement check</h3><p>${preQs.length} questions, about ${Math.max(2,Math.round(preQs.length*.75))} minutes. All correct sends you to the fast track: the summary, the traps, and the recall prompts. Any miss opens the full lesson.</p><button class="btn${fresh?"":" pri"}" id="goPre">Take the placement check</button></div>`;
    const cFull=`<div class="card${fresh?" hi":""}"><h3>Full lesson</h3><p>About ${l.min} minutes. Starts from zero and assumes nothing. Pick this if the topic is new or it has been a while.</p><button class="btn${fresh?" pri":""}" id="goFull">Start the full lesson</button></div>`;
    $("app").innerHTML=`<article class="lesson">${head}
      <p class="sec-lab">How do you want to take this one?</p>
      <div class="gate">${fresh?cFull+cPre:cPre+cFull}</div>
      <p class="note">Guessing your way through the placement check only hides a gap until exam day. If you are not sure of an answer, that is a miss.</p></article>`;
    $("goPre").addEventListener("click",()=>go("pre")); $("goFull").addEventListener("click",()=>go("full"));
    return;
  }

  /* ----- placement check ----- */
  if(mode==="pre"){
    $("app").innerHTML=`<article class="lesson">${head}
      <p class="sec-lab">Placement check</p><p class="dim" style="margin:0 0 6px">Acronyms appear bare here, as they do on the exam.</p>
      <div id="checks"></div><div id="after"></div>
      <div class="foot row"><button class="btn ghost sm" id="skipTest">Skip this and read the full lesson</button></div></article>`;
    $("skipTest").addEventListener("click",()=>go("full"));
    renderChecks($("checks"),preQs,(right,total)=>{
      if(right===total){ complete(id,right,total,true); chrome("");
        $("after").innerHTML=`<div class="card hi"><h3>${total} of ${total}. Fast track.</h3><p style="margin:0 0 10px">You know this one. Skim the summary and the traps, then drill it. The lesson still comes back for spaced review.</p><button class="btn pri" id="openFast">Open the fast track</button></div>`;
        $("openFast").addEventListener("click",()=>go("fast"));
      } else {
        C.l[id]={d:0,s:right,n:total,r:[],pre:1}; save();
        $("after").innerHTML=`<div class="card"><h3>${right} of ${total}. Take the full lesson.</h3><p style="margin:0 0 10px">That is useful information, not a failure: this lesson has something you need. The explanations above show which part.</p><button class="btn pri" id="openFull">Open the full lesson</button></div>`;
        $("openFull").addEventListener("click",()=>go("full"));
      }
      $("after").scrollIntoView({block:"nearest"});
    });
    return;
  }

  const stat=(s&&s.d)?`<p class="stat">Completed ${fmtDate(s.d)}${s.to?" &middot; fast track (passed the placement check)":(s.n?` &middot; checkpoint ${s.s}/${s.n}`:"")}</p>`:"";
  const recallSec=l.recall.length?`<p class="sec-lab">Recall before you check</p><p class="dim" style="margin:0 0 6px">Answer each one out loud or on paper before you tap it. Pulling the answer out of your own head is what makes it stick.</p><div id="recall"></div>`:"";

  /* ----- fast track ----- */
  if(mode==="fast"){
    const traps=trapsOf(l);
    $("app").innerHTML=`<article class="lesson">${head}${stat}
      ${l.fast?`<p class="sec-lab">Summary</p><div id="fast">${l.fast}</div>`:""}
      ${traps?`<p class="sec-lab">Traps and exam notes</p><div id="trapBox">${traps}</div>`:""}
      ${recallSec}
      <div id="drill">${drillBlock(l,ns)}</div>
      <div class="foot"><div class="row">${nextBtn(true)}<button class="btn" id="readFull">Read the full lesson</button><a class="btn ghost" href="#home">Stop here for today</a></div></div></article>`;
    ["fast","trapBox","recall","drill"].forEach(k=>{ const el=$(k); if(el) wrapTables(el); });
    if(l.recall.length) renderRecall($("recall"),l.recall);
    ["fast","trapBox","recall","drill"].forEach(k=>{ const el=$(k); if(el) expandAcr(el); });
    $("readFull").addEventListener("click",()=>go("full"));
    wireDrill(l);
    return;
  }

  /* ----- full lesson ----- */
  const skipEnd=!ownPre&&s&&s.pre&&!s.d;      /* same questions were already used as the placement check */
  $("app").innerHTML=`<article class="lesson">${head}${stat}
    <p class="sec-lab">Why this matters</p><div id="why">${l.why}</div>
    ${l.plain?`<details class="plain" id="plainBox"${C.track==="new"?" open":""}><summary>New to this? Start here</summary><div>${l.plain}</div></details>`:""}
    <p class="sec-lab">The lesson</p><div id="core">${l.core}</div>
    ${l.fast?`<p class="sec-lab">Summary</p><div id="fast">${l.fast}</div>`:""}
    ${recallSec}
    ${l.checks.length&&!skipEnd?`<p class="sec-lab">Checkpoint</p><p class="dim" style="margin:0 0 6px">Acronyms appear bare here, as they do on the exam.</p><div id="checks"></div>`:""}
    <div id="drill">${drillBlock(l,ns)}</div>
    <div class="foot"><div id="doneMsg"></div><div class="row" id="doneRow"></div></div></article>`;
  ["why","core","plainBox","fast","recall","drill"].forEach(k=>{ const el=$(k); if(el){ wrapTables(el); } });
  if(l.recall.length) renderRecall($("recall"),l.recall);
  ["why","core","plainBox","fast","recall","drill"].forEach(k=>{ const el=$(k); if(el) expandAcr(el); });
  const footer=()=>{
    const cur=st(id); const done=cur&&cur.d;
    $("doneRow").innerHTML=(done?"":`<button class="btn pri" id="markDone">Mark lesson complete</button>`)+nextBtn(done)+`<a class="btn ghost" href="#home">Stop here for today</a>`;
    const b=$("markDone"); if(b) b.addEventListener("click",()=>{ const c=st(id)||{}; complete(id,c.s||0,c.n||0,false); chrome(""); toast("Lesson complete. Now drill it in Night Shift."); footer(); });
  };
  if($("checks")) renderChecks($("checks"),l.checks,(right,total)=>{
    complete(id,right,total,false); chrome("");
    $("doneMsg").innerHTML=`<div class="card hi"><h3>Checkpoint: ${right} of ${total}</h3><p style="margin:0">${right===total?"Clean. The lesson is marked complete. Do the Night Shift drill while it is fresh.":"The lesson is marked complete. Reread the section behind each miss now, then do the Night Shift drill. This lesson comes back for a 2-minute review in a couple of days."}</p></div>`;
    footer();
  });
  footer();
  wireDrill(l);
}
function wireDrill(l){
  const kwText=l.kw.join(", ");
  const ck=$("copyKw"); if(ck) ck.addEventListener("click",()=>{ const done=()=>toast("Keywords copied"); try{ navigator.clipboard.writeText(kwText).then(done,()=>toast(kwText)); }catch(e){ toast(kwText); } });
  const sk=$("sendKw"); if(sk) sk.addEventListener("click",()=>{
    const cur=readNS(); if(!cur){ toast("Night Shift data not found on this device"); return; }
    cur.jcTopics=cur.jcTopics||[]; const have=cur.jcTopics.map(t=>t.toLowerCase()); let added=0;
    l.kw.forEach(k=>{ if(have.indexOf(k.toLowerCase())<0){ cur.jcTopics.push(k); added++; } });
    if(lsSet("ns_state",cur)) toast(added?(added+" keyword"+(added===1?"":"s")+" added to The Drill Down"):"Already in The Drill Down"); else toast("Could not save to Night Shift");
  });
}
function viewReview(){
  if(!C.track) return viewSetup(true);
  chrome("review");
  const due=dueList();
  if(!due.length){
    const upcoming=Object.keys(L).filter(id=>isDone(id)&&(st(id).r||[]).length<REVIEW_GAPS.length).length;
    $("app").innerHTML=`<p class="eyebrow">Spaced review</p><h1>Nothing due</h1><p class="lede">Finished lessons come back here after 2, 7, and 21 days as a 2-minute recall check. ${upcoming?upcoming+" lesson"+(upcoming===1?" is":"s are")+" scheduled.":"Finish a lesson to schedule the first one."}</p><div class="row"><a class="btn pri" href="#home">Back to Today</a></div>`;
    return;
  }
  const id=due[0], l=L[id];
  $("app").innerHTML=`<article class="lesson"><p class="eyebrow">Review ${due.length>1?"1 of "+due.length:""} &middot; about 2 min</p><h1>${esc(l.title)}</h1>
    <p class="lede">Answer from memory first, then tap to check. If it has gone, reopen the lesson.</p>
    <div id="recall"></div><div id="checks"></div>
    <div class="foot row"><button class="btn pri" id="revDone">Got it. Next review</button><a class="btn" href="${hashOf(id)}">Reopen the lesson</a></div></article>`;
  renderRecall($("recall"),l.recall); expandAcr($("recall"));
  if(l.checks.length){ const c=l.checks[Math.floor(Math.random()*l.checks.length)]; renderChecks($("checks"),[c],()=>{}); }
  $("revDone").addEventListener("click",()=>{ const s=st(id); s.r=(s.r||[]).concat([Date.now()]); save(); viewReview(); window.scrollTo(0,0); });
}

/* ---------- router ---------- */
function route(){
  const h=location.hash||"#home";
  const id=idFromHash(h);
  if(id) viewLesson(id); else if(h==="#map") viewMap(); else if(h==="#review") viewReview(); else if(h==="#prefs") viewSetup(!C.track); else viewHome();
}
window.addEventListener("hashchange",()=>{ route(); window.scrollTo(0,0); });
$("themeBtn").addEventListener("click",()=>{ C.theme=curTheme()==="light"?"dark":"light"; applyTheme(); save(); });
(function init(){ if(!C.theme){ const ns=readNS(); if(ns&&(ns.theme==="light"||ns.theme==="dark")) C.theme=ns.theme; } applyTheme(); route(); })();
</script>
</body>
</html>

run dozens of virtual machines (the guests ), each isolated from the others. Why this matters for security: the isolation between guests is a security boundary. If it fails, one compromised machine can reach its neighbors. You will meet that failure in Domain 2 as VM escape . A snapshot is a saved copy of a virtual machine's state at one moment, which can be restored later. It is handy before a risky change. Containers A container packages one application with everything it needs to run, but shares the host's operating system kernel instead of bringing its own. Containers start in seconds and use far less memory than virtual machines. Virtual machine Container Includes its own operating system Yes No, shares the host's kernel Isolation Strong Weaker, because the kernel is shared Size and start time Large, minutes Small, seconds Typical use Running whole servers Running one application or service Cloud Cloud computing means renting computing from a provider over the internet and paying for what you use. The company running the data centers is the CSP . Three service models describe how much the provider manages for you: Model You rent You still manage Example use IaaS Virtual machines, storage, networks Operating system, applications, data Running your own servers without buying hardware PaaS A ready platform to run your code Your application and data Deploying a web app without managing servers SaaS A finished application Your data and user accounts Web-based email or payroll Memory hook Think of pizza. IaaS: you rent the kitchen and cook everything. PaaS: the dough and oven are ready; you add toppings. SaaS: the pizza is delivered and you just eat it. At every level, your data and who can access it remain your responsibility . Four deployment models describe who shares the environment: Model Who uses it Public cloud Many unrelated customers on shared infrastructure Private cloud One organization only Hybrid cloud A mix of on-premises or private with public, connected together Community cloud Several organizations with a shared need, such as hospitals On-premises means the organization owns and runs the equipment in its own building. Multi-tenant means several customers share the same underlying hardware, kept apart by software. Trap Moving to the cloud moves the hardware, not the accountability. A provider securing its data center does not secure your badly configured storage. Most real cloud breaches are customer misconfigurations, and exam questions about cloud responsibility are written to test exactly that. "},"1.1":{"id":"1.1","obj":"1.1","min":20,"title":"Security controls: four categories and six types","kw":["compensating","detective","deterrent","directive","corrective","managerial","operational control"],"cov":["Categories: Technical","Categories: Managerial","Categories: Operational","Categories: Physical","Control types: Preventive","Control types: Deterrent","Control types: Detective","Control types: Corrective","Control types: Compensating","Control types: Directive"],"why":"<p>A <strong>security control<\/strong> is anything put in place to reduce risk: a lock, a firewall rule, a policy, a training session. The exam describes a control in a sentence and asks you to label it. There are two separate labels, and most wrong answers come from mixing them up or from picking the right label on the wrong axis.<\/p>\n<p>This is one of the most heavily tested ideas in Domain 1, and the vocabulary comes back in every other domain.<\/p>","plain":"<p>Think about how a bank protects its money.<\/p>\n<ul>\n<li>There is a vault door. That <strong>stops<\/strong> a thief.<\/li>\n<li>There is a sign that says the building is monitored. That <strong>discourages<\/strong> a thief.<\/li>\n<li>There are cameras. They <strong>record<\/strong> what happened.<\/li>\n<li>There is insurance and a recovery plan. They <strong>fix things afterward<\/strong>.<\/li>\n<li>There is a rule book telling tellers what to do. It <strong>instructs<\/strong> people.<\/li>\n<\/ul>\n<p>Each of those is a control. Security people sort controls in two ways: by <strong>who or what carries the control out<\/strong> (a machine, a manager's decision, a staff member, a physical object) and by <strong>what the control does<\/strong> to an incident (stop it, discourage it, notice it, repair it). This lesson teaches both sorting systems.<\/p>","fast":"<p>Every control gets <strong>one category<\/strong> (how it is implemented) and <strong>one or more types<\/strong> (what it does).<\/p>\n<table>\n<thead>\n<tr>\n<th>Category<\/th>\n<th>Carried out by<\/th>\n<th>Typical examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Technical<\/td>\n<td>Hardware, software, firmware<\/td>\n<td>Firewall, encryption, antivirus, access control list<\/td>\n<\/tr>\n<tr>\n<td>Managerial<\/td>\n<td>Decisions and documents that direct the security program<\/td>\n<td>Risk assessment, security policy, vendor review<\/td>\n<\/tr>\n<tr>\n<td>Operational<\/td>\n<td>People doing day-to-day work<\/td>\n<td>Awareness training, guard patrols, log review by staff<\/td>\n<\/tr>\n<tr>\n<td>Physical<\/td>\n<td>Tangible objects that limit physical access<\/td>\n<td>Fence, door lock, bollard, badge reader<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>What it does<\/th>\n<th>Signal words in a question<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Preventive<\/td>\n<td>Blocks the event<\/td>\n<td>\"stops\", \"blocks\", \"prevents\"<\/td>\n<\/tr>\n<tr>\n<td>Deterrent<\/td>\n<td>Discourages the attempt, does not block it<\/td>\n<td>\"discourages\", \"warning\"<\/td>\n<\/tr>\n<tr>\n<td>Detective<\/td>\n<td>Identifies or records an event<\/td>\n<td>\"identifies\", \"logs\", \"alerts\"<\/td>\n<\/tr>\n<tr>\n<td>Corrective<\/td>\n<td>Repairs or limits damage after the event<\/td>\n<td>\"restores\", \"recovers\", \"after an incident\"<\/td>\n<\/tr>\n<tr>\n<td>Compensating<\/td>\n<td>Stands in when the required control cannot be used<\/td>\n<td>\"cannot patch\", \"until\", \"alternative\"<\/td>\n<\/tr>\n<tr>\n<td>Directive<\/td>\n<td>Tells people what to do<\/td>\n<td>\"instructs\", \"requires\", \"policy states\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Method: ask \"who or what carries this out?\" for the category, then \"what does it do to the incident?\" for the type.<\/p>","core":"<h3>Two labels, two questions<\/h3>\n<p>Every control can be described with two labels. Treat them as two separate questions.<\/p>\n<ol>\n<li><strong>Category: who or what carries it out?<\/strong><\/li>\n<li><strong>Type: what does it do to an incident, and when?<\/strong><\/li>\n<\/ol>\n<p>A firewall rule that blocks traffic is <em>technical<\/em> (category) and <em>preventive<\/em> (type). The same firewall, when it writes a log entry, is <em>technical<\/em> and <em>detective<\/em>. The category stayed the same. The type changed because the function changed.<\/p>\n<h3>The four categories<\/h3>\n<table>\n<thead>\n<tr>\n<th>Category<\/th>\n<th>Carried out by<\/th>\n<th>Examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Technical<\/strong><\/td>\n<td>Hardware, software, or firmware<\/td>\n<td>Firewalls, encryption, antivirus, operating system permissions<\/td>\n<\/tr>\n<tr>\n<td><strong>Managerial<\/strong><\/td>\n<td>Management decisions and written direction for the security program<\/td>\n<td>Risk assessments, security policies, vendor reviews, change approval<\/td>\n<\/tr>\n<tr>\n<td><strong>Operational<\/strong><\/td>\n<td>People performing day-to-day tasks<\/td>\n<td>Security awareness training, guard patrols, staff reviewing logs<\/td>\n<\/tr>\n<tr>\n<td><strong>Physical<\/strong><\/td>\n<td>Tangible objects that limit physical access<\/td>\n<td>Fences, locks, bollards, badge readers<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Managerial controls are sometimes called <em>administrative<\/em> controls. Technical controls are sometimes called <em>logical<\/em> controls. The exam uses the names in the table.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Managerial vs. operational.<\/strong> Managerial is about <em>deciding and documenting<\/em>: someone assessed a risk or wrote a policy. Operational is about <em>people doing<\/em>: someone delivered the training, walked the patrol, or reviewed the report. A policy that requires annual training is managerial. The training session is operational.<\/p><\/div>\n\n<h3>The six types<\/h3>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>What it does<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Preventive<\/strong><\/td>\n<td>Blocks the event from happening<\/td>\n<td>Door lock, firewall rule, hiring background check<\/td>\n<\/tr>\n<tr>\n<td><strong>Deterrent<\/strong><\/td>\n<td>Discourages someone from trying; does not physically stop them<\/td>\n<td>Warning sign, login banner, visible camera<\/td>\n<\/tr>\n<tr>\n<td><strong>Detective<\/strong><\/td>\n<td>Identifies or records an event during or after it<\/td>\n<td>Motion sensor, intrusion detection system, log review<\/td>\n<\/tr>\n<tr>\n<td><strong>Corrective<\/strong><\/td>\n<td>Repairs the damage or returns things to normal afterward<\/td>\n<td>Restoring from backup, patching after an incident, fire extinguisher<\/td>\n<\/tr>\n<tr>\n<td><strong>Compensating<\/strong><\/td>\n<td>An alternative used when the required control cannot be applied<\/td>\n<td>Isolating an unpatchable server on its own network segment<\/td>\n<\/tr>\n<tr>\n<td><strong>Directive<\/strong><\/td>\n<td>Tells people what to do or not do<\/td>\n<td>Acceptable use policy, \"Authorized personnel only\" sign<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"co mem\"><span class=\"k\">Memory hook<\/span><p>Put the types on a timeline. <strong>Before<\/strong> the event: directive (instruct), deterrent (discourage), preventive (block). <strong>During or after<\/strong>: detective (notice). <strong>After<\/strong>: corrective (repair). Compensating sits outside the timeline: it is whatever fills the gap when the normal control is not possible.<\/p><\/div>\n\n<h3>Look-alike types<\/h3>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Deterrent vs. preventive.<\/strong> A deterrent works on the attacker's <em>decision<\/em>. A preventive control works on the attacker's <em>ability<\/em>. A \"Beware of dog\" sign is a deterrent. The locked gate is preventive. If the attacker ignores the control and can still proceed, it was only a deterrent.<\/p><\/div>\n\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Detective vs. preventive.<\/strong> An intrusion <em>detection<\/em> system raises an alert and lets the traffic through: detective. An intrusion <em>prevention<\/em> system drops the traffic: preventive. A camera that only records is detective.<\/p><\/div>\n\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Corrective vs. compensating.<\/strong> Corrective happens <em>after<\/em> something went wrong and fixes it. Compensating is planned <em>in advance<\/em> as a substitute, because the preferred control is too costly, not yet available, or technically impossible.<\/p><\/div>\n\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Directive vs. deterrent.<\/strong> A directive gives an instruction: \"Visitors must sign in.\" A deterrent threatens a consequence: \"Trespassers will be prosecuted.\" Policies, procedures, and standards are directive.<\/p><\/div>\n\n<h3>One control, several types<\/h3>\n<p>A security guard at a door can refuse entry (preventive), be visible (deterrent), and notice a break-in (detective). The exam handles this by describing <strong>one function<\/strong> in the question. Label the function that the question describes, not everything the control could do.<\/p>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>When a camera appears in a question, read what it is doing. \"Cameras are placed in plain view so that people think twice\" is deterrent. \"Footage is reviewed after the theft\" is detective. A camera never prevents anything by itself.<\/p><\/div>\n\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>Backups are <strong>corrective<\/strong>, because they are used after data is lost. They do not prevent the loss.<\/p><\/div>\n\n<div class=\"co exam\"><span class=\"k\">Exam vs. real world<\/span><p>In real organizations people argue about whether a security guard is a physical or an operational control. On the exam, use the question's wording. If it stresses a person carrying out a duty or procedure, choose operational. If it lists the guard with fences and locks as a barrier to entry, choose physical. Objective 1.2 lists security guards under physical security.<\/p><\/div>\n\n<h3>Why layers matter<\/h3>\n<p>No single control is enough. <strong>Defense in depth<\/strong> means stacking controls of different categories and types so that when one fails another still stands: a policy (managerial, directive), a locked server room (physical, preventive), a camera (physical, detective), and backups (technical, corrective) all protecting the same server.<\/p>","recall":[["Name the four control categories.","Technical, managerial, operational, physical."],["Name the six control types.","Preventive, deterrent, detective, corrective, compensating, directive."],["What question gives you the category? What question gives you the type?","Category: who or what carries it out. Type: what it does to the incident and when."],["A legacy server cannot be patched, so it is moved to an isolated network segment. Which type?","Compensating. It substitutes for the control that cannot be applied."],["What is the difference between a deterrent and a preventive control?","A deterrent discourages the attempt; a preventive control blocks it."],["Which category is a risk assessment? Which category is security awareness training?","Risk assessment is managerial. Awareness training is operational."]],"pre":[{"q":"A company cannot apply a vendor patch to a production system for 60 days, so it restricts access to that system with additional firewall rules until the patch can be installed. Which control type do the firewall rules represent?","o":["Compensating","Corrective","Deterrent","Directive"],"e":"The firewall rules are a planned substitute for a control that cannot be applied yet, which is the definition of compensating. Corrective would repair damage after an incident, and nothing has gone wrong here."},{"q":"Which of the following is a managerial control?","o":["An annual risk assessment","A badge reader at the data center door","Full-disk encryption on laptops","A guard checking IDs at the entrance"],"e":"Managerial controls are decisions and documents that direct the security program, such as risk assessments and policies. The badge reader is physical, encryption is technical, and a guard performing a duty is operational."},{"q":"A login banner states that all activity is monitored and that misuse will be prosecuted. Which control type is this?","o":["Deterrent","Preventive","Detective","Corrective"],"e":"The banner discourages misuse by warning of consequences. It does not block a login, so it is not preventive, and the banner itself records nothing, so it is not detective."},{"q":"After ransomware encrypts a file server, administrators restore the data from last night's backup. Which control type did the backup serve as?","o":["Corrective","Compensating","Preventive","Detective"],"e":"Restoring from backup returns the system to normal after an incident, which is corrective. Compensating controls are alternatives chosen in advance when a required control is not feasible."}],"checks":[{"q":"An organization posts a sign at its data center entrance that reads \"Authorized personnel only. All visitors must be escorted.\" Which control type BEST describes the sign?","o":["Directive","Deterrent","Preventive","Compensating"],"e":"The sign gives an instruction about what people must do, which is directive. A deterrent would warn of a consequence. The sign cannot physically stop anyone, so it is not preventive."},{"q":"A security analyst reviews authentication logs every morning to look for failed login patterns. How should this control be classified?","o":["Operational and detective","Technical and preventive","Managerial and detective","Operational and corrective"],"e":"A person performing a day-to-day task makes it operational. Looking for events that already occurred makes it detective. It would be technical if software performed the review automatically."},{"q":"A network device inspects traffic and sends an alert to the security team when it matches a known attack signature. The traffic is not blocked. Which control type is this?","o":["Detective","Preventive","Corrective","Deterrent"],"e":"The device identifies and reports the event without stopping it, so it is detective. If it dropped the traffic it would be preventive."},{"q":"A payment standard requires a specific encryption product that a small retailer's old terminals cannot run. The retailer instead places the terminals on a separate network with strict monitoring. Which term describes this approach?","o":["Compensating control","Corrective control","Managerial control","Directive control"],"e":"An alternative that meets the intent of a requirement that cannot be met directly is a compensating control. Nothing is being repaired, so it is not corrective."},{"q":"Which of the following is the BEST example of a physical preventive control?","o":["A locked server cabinet","A motion detector in the server room","A policy restricting server room access","A sign warning of video surveillance"],"e":"The locked cabinet is a tangible object that blocks access. The motion detector is physical but detective, the policy is managerial and directive, and the sign is a deterrent."}],"drill":"<li><b>Flashcards:<\/b> run a 15-card session and say the category and the type out loud for every control that appears.<\/li><li><b>The Drill Down:<\/b> add the keywords below, then work the pool until you can label each control in under 20 seconds.<\/li><li><b>PBQ Lab:<\/b> open \"Classify the Control Types\". It is this lesson as a hands-on task.<\/li><li><b>Weak Areas:<\/b> if \"deterrent\" or \"compensating\" shows up there after your queue, reread the look-alike section above.<\/li>","text":" A security control is anything put in place to reduce risk: a lock, a firewall rule, a policy, a training session. The exam describes a control in a sentence and asks you to label it. There are two separate labels, and most wrong answers come from mixing them up or from picking the right label on the wrong axis. This is one of the most heavily tested ideas in Domain 1, and the vocabulary comes back in every other domain. Think about how a bank protects its money. There is a vault door. That stops a thief. There is a sign that says the building is monitored. That discourages a thief. There are cameras. They record what happened. There is insurance and a recovery plan. They fix things afterward . There is a rule book telling tellers what to do. It instructs people. Each of those is a control. Security people sort controls in two ways: by who or what carries the control out (a machine, a manager's decision, a staff member, a physical object) and by what the control does to an incident (stop it, discourage it, notice it, repair it). This lesson teaches both sorting systems. Two labels, two questions Every control can be described with two labels. Treat them as two separate questions. Category: who or what carries it out? Type: what does it do to an incident, and when? A firewall rule that blocks traffic is technical (category) and preventive (type). The same firewall, when it writes a log entry, is technical and detective . The category stayed the same. The type changed because the function changed. The four categories Category Carried out by Examples Technical Hardware, software, or firmware Firewalls, encryption, antivirus, operating system permissions Managerial Management decisions and written direction for the security program Risk assessments, security policies, vendor reviews, change approval Operational People performing day-to-day tasks Security awareness training, guard patrols, staff reviewing logs Physical Tangible objects that limit physical access Fences, locks, bollards, badge readers Managerial controls are sometimes called administrative controls. Technical controls are sometimes called logical controls. The exam uses the names in the table. Confusable pair Managerial vs. operational. Managerial is about deciding and documenting : someone assessed a risk or wrote a policy. Operational is about people doing : someone delivered the training, walked the patrol, or reviewed the report. A policy that requires annual training is managerial. The training session is operational. The six types Type What it does Example Preventive Blocks the event from happening Door lock, firewall rule, hiring background check Deterrent Discourages someone from trying; does not physically stop them Warning sign, login banner, visible camera Detective Identifies or records an event during or after it Motion sensor, intrusion detection system, log review Corrective Repairs the damage or returns things to normal afterward Restoring from backup, patching after an incident, fire extinguisher Compensating An alternative used when the required control cannot be applied Isolating an unpatchable server on its own network segment Directive Tells people what to do or not do Acceptable use policy, \"Authorized personnel only\" sign Memory hook Put the types on a timeline. Before the event: directive (instruct), deterrent (discourage), preventive (block). During or after : detective (notice). After : corrective (repair). Compensating sits outside the timeline: it is whatever fills the gap when the normal control is not possible. Look-alike types Confusable pair Deterrent vs. preventive. A deterrent works on the attacker's decision . A preventive control works on the attacker's ability . A \"Beware of dog\" sign is a deterrent. The locked gate is preventive. If the attacker ignores the control and can still proceed, it was only a deterrent. Confusable pair Detective vs. preventive. An intrusion detection system raises an alert and lets the traffic through: detective. An intrusion prevention system drops the traffic: preventive. A camera that only records is detective. Confusable pair Corrective vs. compensating. Corrective happens after something went wrong and fixes it. Compensating is planned in advance as a substitute, because the preferred control is too costly, not yet available, or technically impossible. Confusable pair Directive vs. deterrent. A directive gives an instruction: \"Visitors must sign in.\" A deterrent threatens a consequence: \"Trespassers will be prosecuted.\" Policies, procedures, and standards are directive. One control, several types A security guard at a door can refuse entry (preventive), be visible (deterrent), and notice a break-in (detective). The exam handles this by describing one function in the question. Label the function that the question describes, not everything the control could do. Trap When a camera appears in a question, read what it is doing. \"Cameras are placed in plain view so that people think twice\" is deterrent. \"Footage is reviewed after the theft\" is detective. A camera never prevents anything by itself. Trap Backups are corrective , because they are used after data is lost. They do not prevent the loss. Exam vs. real world In real organizations people argue about whether a security guard is a physical or an operational control. On the exam, use the question's wording. If it stresses a person carrying out a duty or procedure, choose operational. If it lists the guard with fences and locks as a barrier to entry, choose physical. Objective 1.2 lists security guards under physical security. Why layers matter No single control is enough. Defense in depth means stacking controls of different categories and types so that when one fails another still stands: a policy (managerial, directive), a locked server room (physical, preventive), a camera (physical, detective), and backups (technical, corrective) all protecting the same server. Every control gets one category (how it is implemented) and one or more types (what it does). Category Carried out by Typical examples Technical Hardware, software, firmware Firewall, encryption, antivirus, access control list Managerial Decisions and documents that direct the security program Risk assessment, security policy, vendor review Operational People doing day-to-day work Awareness training, guard patrols, log review by staff Physical Tangible objects that limit physical access Fence, door lock, bollard, badge reader Type What it does Signal words in a question Preventive Blocks the event \"stops\", \"blocks\", \"prevents\" Deterrent Discourages the attempt, does not block it \"discourages\", \"warning\" Detective Identifies or records an event \"identifies\", \"logs\", \"alerts\" Corrective Repairs or limits damage after the event \"restores\", \"recovers\", \"after an incident\" Compensating Stands in when the required control cannot be used \"cannot patch\", \"until\", \"alternative\" Directive Tells people what to do \"instructs\", \"requires\", \"policy states\" Method: ask \"who or what carries this out?\" for the category, then \"what does it do to the incident?\" for the type. "},"1.2a":{"id":"1.2a","obj":"1.2","min":25,"title":"CIA, non-repudiation, AAA, and gap analysis","kw":["non-repudiation","cia triad","accounting","authorization","gap analysis","integrity","availability"],"cov":["Confidentiality, Integrity, and Availability (CIA)","Non-repudiation","Authentication, Authorization, and Accounting (AAA)","Authenticating people","Authenticating systems","Authorization models","Gap analysis"],"why":"<p>These are the words the rest of the exam is written in. Almost every scenario question is quietly asking \"which of these goals is at stake?\" If you can name the goal, half of the answer choices disappear.<\/p>\n<p>Objective 1.2 is large, so this course splits it into three lessons. This one covers the core goals and the access framework. The next two cover Zero Trust, then physical security and deception.<\/p>","plain":"<p>Imagine your medical record at a clinic.<\/p>\n<ul>\n<li>You want only you and your doctor to read it. That is <strong>confidentiality<\/strong>.<\/li>\n<li>You want nobody to change your blood type in it by mistake or on purpose. That is <strong>integrity<\/strong>.<\/li>\n<li>You want the doctor to be able to open it during your appointment. That is <strong>availability<\/strong>.<\/li>\n<\/ul>\n<p>Now imagine the clinic's front desk. You say your name (you <em>identify<\/em> yourself). You show a photo ID (you <em>authenticate<\/em>: you prove it). The receptionist checks which rooms you may enter (you are <em>authorized<\/em>). The visit is written in the sign-in book (the clinic keeps an <em>account<\/em> of it). Security uses the same four steps for every login.<\/p>","fast":"<table>\n<thead>\n<tr>\n<th>Goal<\/th>\n<th>Protects against<\/th>\n<th>Typical controls<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Confidentiality<\/td>\n<td>Unauthorized reading<\/td>\n<td>Encryption, access controls<\/td>\n<\/tr>\n<tr>\n<td>Integrity<\/td>\n<td>Unauthorized or undetected change<\/td>\n<td>Hashing, digital signatures<\/td>\n<\/tr>\n<tr>\n<td>Availability<\/td>\n<td>Loss of access for authorized users<\/td>\n<td>Redundancy, backups, patching<\/td>\n<\/tr>\n<tr>\n<td>Non-repudiation<\/td>\n<td>A sender denying they sent or did something<\/td>\n<td>Digital signatures, individual accounts with logs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>AAA<\/strong> order: identify (claim), <strong>authenticate<\/strong> (prove), <strong>authorize<\/strong> (permissions), <strong>account<\/strong> (log).<\/li>\n<li>People authenticate with factors (password, token, fingerprint). <strong>Systems<\/strong> authenticate with a <strong>certificate<\/strong> on the device.<\/li>\n<li>An <strong>authorization model<\/strong> assigns permissions through roles, groups, labels, or attributes, not one user at a time.<\/li>\n<li><strong>Gap analysis<\/strong> compares where you are with where you need to be (a baseline such as a standard) and produces the list of what is missing.<\/li>\n<\/ul>","core":"<h3>The CIA triad<\/h3>\n<p>Three goals describe what security is protecting.<\/p>\n<table>\n<thead>\n<tr>\n<th>Goal<\/th>\n<th>Meaning<\/th>\n<th>An attack on it<\/th>\n<th>Controls that support it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Confidentiality<\/strong><\/td>\n<td>Only authorized people can read the information<\/td>\n<td>Eavesdropping, stolen laptop, data leak<\/td>\n<td>Encryption, access controls, need-to-know<\/td>\n<\/tr>\n<tr>\n<td><strong>Integrity<\/strong><\/td>\n<td>Information is accurate and has not been changed without authorization<\/td>\n<td>Tampering with a file, altering a transfer amount<\/td>\n<td>Hashing, digital signatures, version checks<\/td>\n<\/tr>\n<tr>\n<td><strong>Availability<\/strong><\/td>\n<td>Systems and data are usable when authorized people need them<\/td>\n<td>Denial of service, ransomware, hardware failure<\/td>\n<td>Redundancy, backups, fault tolerance, patching<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>When a question describes an incident, ask what was lost. Data read by the wrong person: confidentiality. Data changed: integrity. Service down: availability.<\/p>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>Encryption protects <strong>confidentiality<\/strong>. Hashing protects <strong>integrity<\/strong>. A hash does not hide anything, and encryption alone does not prove a file is unchanged. The exam swaps these two constantly.<\/p><\/div>\n\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>Ransomware that locks files is first an <strong>availability<\/strong> problem, because the owner cannot use the data. If the attacker also steals a copy, confidentiality is lost too. Answer for what the question describes.<\/p><\/div>\n\n<h3>Non-repudiation<\/h3>\n<p><strong>Non-repudiation<\/strong> means a person cannot believably deny having sent a message or performed an action. It needs two things at once: proof the content was not altered (integrity) and proof of who it came from (proof of origin).<\/p>\n<p>The standard tool is a <strong>digital signature<\/strong>. The sender signs with a private key that only the sender holds, so nobody else could have produced the signature. Signatures are covered in the cryptography lessons.<\/p>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>A shared account destroys non-repudiation. If five administrators log in as \"admin\", the log cannot prove which one deleted the database. So does a shared secret key: if two parties both hold the same key, either one could have created the message.<\/p><\/div>\n\n<h3>AAA: authentication, authorization, accounting<\/h3>\n<p>AAA is the framework for controlling access. In practice there is a step before the three A's.<\/p>\n<table>\n<thead>\n<tr>\n<th>Step<\/th>\n<th>Question it answers<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Identification<\/td>\n<td>Who do you claim to be?<\/td>\n<td>Typing a username<\/td>\n<\/tr>\n<tr>\n<td><strong>Authentication<\/strong><\/td>\n<td>Can you prove it?<\/td>\n<td>Password, one-time code, fingerprint<\/td>\n<\/tr>\n<tr>\n<td><strong>Authorization<\/strong><\/td>\n<td>What are you allowed to do?<\/td>\n<td>Read access to the finance share, no write access<\/td>\n<\/tr>\n<tr>\n<td><strong>Accounting<\/strong><\/td>\n<td>What did you do?<\/td>\n<td>Login time, files opened, data sent, logout time<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Accounting is also called auditing. It is what makes investigations possible later.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Authentication vs. authorization.<\/strong> Authentication is about <em>identity<\/em>. Authorization is about <em>permissions<\/em>. A user who logs in successfully but gets \"access denied\" on a folder has passed authentication and failed authorization.<\/p><\/div>\n\n<p><strong>Authenticating people.<\/strong> A person presents one or more factors: something they know, something they have, something they are. In a company, the login request usually goes from the device the user connects to (a VPN concentrator, a wireless access point) to a central <strong>AAA server<\/strong>, which checks the credentials against the directory. RADIUS is the most common AAA protocol.<\/p>\n<p><strong>Authenticating systems.<\/strong> A laptop or server cannot type a password, and you still need to know it is a company device before letting it on the network. The usual answer is a <strong>digital certificate<\/strong> installed on the device and signed by the organization's own certificate authority. The network checks the certificate the way it would check a person's credentials. A question about making sure only company-owned devices can connect is asking for device certificates.<\/p>\n<p><strong>Authorization models.<\/strong> Assigning permissions to each user one at a time does not scale and produces mistakes. An authorization model puts a layer between users and resources: users are placed in roles or groups, or carry attributes or labels, and the permissions attach to that layer. Add a new hire to the \"Accounting\" role and all the right access follows.<\/p>\n<p>The named models are tested in detail in objective 4.6. For now, know the one-line versions:<\/p>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Who or what decides access<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Role-based<\/td>\n<td>The user's job role<\/td>\n<\/tr>\n<tr>\n<td>Rule-based<\/td>\n<td>System-wide rules set by an administrator, such as time of day<\/td>\n<\/tr>\n<tr>\n<td>Mandatory (MAC)<\/td>\n<td>Labels on data and clearances on users, set centrally; users cannot change them<\/td>\n<\/tr>\n<tr>\n<td>Discretionary (DAC)<\/td>\n<td>The owner of each resource<\/td>\n<\/tr>\n<tr>\n<td>Attribute-based<\/td>\n<td>A combination of attributes of the user, the resource, and the context<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Least privilege is a principle, not a model.<\/strong> Least privilege means giving each user only the access the job requires. Any of the models above can be used to apply it. If a question asks which <em>model<\/em> is in use, least privilege is not the answer.<\/p><\/div>\n\n<h3>Gap analysis<\/h3>\n<p>A <strong>gap analysis<\/strong> compares where the organization is now with where it needs to be, and lists the differences.<\/p>\n<ol>\n<li>Choose the target: a <strong>baseline<\/strong> such as a published standard or framework (for example ISO/IEC 27001 or a NIST publication), or the organization's own policy.<\/li>\n<li>Assess the current state: people, processes, and technology.<\/li>\n<li>Compare the two, item by item.<\/li>\n<li>Report the gaps, with priorities and a plan to close them.<\/li>\n<\/ol>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Gap analysis vs. risk assessment vs. vulnerability scan.<\/strong> A gap analysis measures against a <em>chosen standard<\/em>: \"the framework requires multifactor authentication and we do not have it.\" A risk assessment measures <em>likelihood and impact<\/em> of threats. A vulnerability scan looks for <em>technical weaknesses<\/em> on systems. The words \"compare current state to desired state\" or \"against a framework\" mean gap analysis.<\/p><\/div>","recall":[["What does each letter of CIA protect against?","Confidentiality: unauthorized reading. Integrity: unauthorized change. Availability: authorized users losing access."],["Which control family supports integrity, and which supports confidentiality?","Hashing and digital signatures support integrity. Encryption and access controls support confidentiality."],["What is non-repudiation and what provides it?","A sender cannot deny sending a message or taking an action. Digital signatures provide it, along with individual accounts and logs."],["Put these in order: authorization, accounting, authentication, identification.","Identification, authentication, authorization, accounting."],["How does a network authenticate a device, since a device cannot type a password?","With a digital certificate installed on the device, signed by the organization's certificate authority."],["What are the four steps of a gap analysis?","Choose the baseline, assess the current state, compare, report the gaps with a plan."]],"pre":[{"q":"An attacker intercepts a wire-transfer request and changes the destination account number before forwarding it to the bank. Which security goal was violated?","o":["Integrity","Confidentiality","Availability","Accounting"],"e":"The data was altered without authorization, which is an integrity violation. Confidentiality would be the issue if the attacker had only read the request."},{"q":"A user signs in successfully with a password and a one-time code, then receives an \"access denied\" message when opening the payroll folder. Which part of AAA produced the denial?","o":["Authorization","Authentication","Accounting","Identification"],"e":"The user proved their identity, so authentication succeeded. Authorization decides what an authenticated user may access, and it denied the folder."},{"q":"A company wants to make sure that only laptops it owns can join the internal wireless network, regardless of who is using them. Which of the following BEST accomplishes this?","o":["Installing a certificate on each company laptop","Requiring a longer password for each user","Assigning users to role-based groups","Recording each connection in a log"],"e":"Systems are authenticated with digital certificates issued by the organization. Passwords and roles deal with the user, not the device, and logging records the connection without controlling it."},{"q":"A security manager compares the organization's current controls with the requirements of an industry framework and documents which requirements are not yet met. What is this activity called?","o":["Gap analysis","Risk assessment","Vulnerability scan","Penetration test"],"e":"Comparing the current state with a chosen baseline and listing the differences is a gap analysis. A risk assessment evaluates likelihood and impact, and a vulnerability scan looks for technical weaknesses."}],"checks":[{"q":"A hospital's patient-records system is taken offline for six hours by a flood of malicious traffic. No records were read or altered. Which security goal was affected?","o":["Availability","Integrity","Confidentiality","Non-repudiation"],"e":"Authorized users could not reach the system, which is a loss of availability. The question states that nothing was read or changed."},{"q":"Three system administrators share a single privileged account. A critical configuration is deleted and the log shows only the shared account name. Which security concept has been undermined?","o":["Non-repudiation","Availability","Confidentiality","Authorization"],"e":"Because the action cannot be tied to one person, any of the three can deny it. Individual accounts are required for non-repudiation."},{"q":"Which of the following BEST describes the accounting function of AAA?","o":["Recording login times and the resources a user accessed","Verifying a fingerprint against a stored template","Granting read access based on a user's department","Asking a user to enter a username"],"e":"Accounting tracks what users did and when. Verifying a fingerprint is authentication, granting access by department is authorization, and entering a username is identification."},{"q":"A developer downloads a software installer and wants to confirm that the file was not modified in transit. Which of the following should the developer use?","o":["A hash value published by the vendor","An encrypted connection to the vendor","A longer download password","A role-based access group"],"e":"Comparing the file's hash with the vendor's published hash confirms integrity. An encrypted connection protects confidentiality in transit and does not by itself confirm the file matches what the vendor published."},{"q":"An administrator places every new salesperson into a \"Sales\" group, and the group has been granted access to the customer database. Which statement BEST describes this approach?","o":["An authorization model is assigning permissions through roles","Accounting is tracking each salesperson's activity","Each device is being authenticated with a certificate","A gap analysis is identifying missing permissions"],"e":"Attaching permissions to a role or group and placing users in it is the purpose of an authorization model. Nothing in the scenario describes logging, device certificates, or comparison with a baseline."}],"drill":"<li><b>Acronym Recall:<\/b> run 15 items. AAA, CIA, and RADIUS should now cost you no thought.<\/li><li><b>The Drill Down:<\/b> add the keywords below. Non-repudiation and the authentication/authorization split are the two that most often need repetition.<\/li><li><b>Glossary:<\/b> look up \"accounting\" and \"need to know\".<\/li>","text":" These are the words the rest of the exam is written in. Almost every scenario question is quietly asking \"which of these goals is at stake?\" If you can name the goal, half of the answer choices disappear. Objective 1.2 is large, so this course splits it into three lessons. This one covers the core goals and the access framework. The next two cover Zero Trust, then physical security and deception. Imagine your medical record at a clinic. You want only you and your doctor to read it. That is confidentiality . You want nobody to change your blood type in it by mistake or on purpose. That is integrity . You want the doctor to be able to open it during your appointment. That is availability . Now imagine the clinic's front desk. You say your name (you identify yourself). You show a photo ID (you authenticate : you prove it). The receptionist checks which rooms you may enter (you are authorized ). The visit is written in the sign-in book (the clinic keeps an account of it). Security uses the same four steps for every login. The CIA triad Three goals describe what security is protecting. Goal Meaning An attack on it Controls that support it Confidentiality Only authorized people can read the information Eavesdropping, stolen laptop, data leak Encryption, access controls, need-to-know Integrity Information is accurate and has not been changed without authorization Tampering with a file, altering a transfer amount Hashing, digital signatures, version checks Availability Systems and data are usable when authorized people need them Denial of service, ransomware, hardware failure Redundancy, backups, fault tolerance, patching When a question describes an incident, ask what was lost. Data read by the wrong person: confidentiality. Data changed: integrity. Service down: availability. Trap Encryption protects confidentiality . Hashing protects integrity . A hash does not hide anything, and encryption alone does not prove a file is unchanged. The exam swaps these two constantly. Trap Ransomware that locks files is first an availability problem, because the owner cannot use the data. If the attacker also steals a copy, confidentiality is lost too. Answer for what the question describes. Non-repudiation Non-repudiation means a person cannot believably deny having sent a message or performed an action. It needs two things at once: proof the content was not altered (integrity) and proof of who it came from (proof of origin). The standard tool is a digital signature . The sender signs with a private key that only the sender holds, so nobody else could have produced the signature. Signatures are covered in the cryptography lessons. Trap A shared account destroys non-repudiation. If five administrators log in as \"admin\", the log cannot prove which one deleted the database. So does a shared secret key: if two parties both hold the same key, either one could have created the message. AAA: authentication, authorization, accounting AAA is the framework for controlling access. In practice there is a step before the three A's. Step Question it answers Example Identification Who do you claim to be? Typing a username Authentication Can you prove it? Password, one-time code, fingerprint Authorization What are you allowed to do? Read access to the finance share, no write access Accounting What did you do? Login time, files opened, data sent, logout time Accounting is also called auditing. It is what makes investigations possible later. Confusable pair Authentication vs. authorization. Authentication is about identity . Authorization is about permissions . A user who logs in successfully but gets \"access denied\" on a folder has passed authentication and failed authorization. Authenticating people. A person presents one or more factors: something they know, something they have, something they are. In a company, the login request usually goes from the device the user connects to (a VPN concentrator, a wireless access point) to a central AAA server , which checks the credentials against the directory. RADIUS is the most common AAA protocol. Authenticating systems. A laptop or server cannot type a password, and you still need to know it is a company device before letting it on the network. The usual answer is a digital certificate installed on the device and signed by the organization's own certificate authority. The network checks the certificate the way it would check a person's credentials. A question about making sure only company-owned devices can connect is asking for device certificates. Authorization models. Assigning permissions to each user one at a time does not scale and produces mistakes. An authorization model puts a layer between users and resources: users are placed in roles or groups, or carry attributes or labels, and the permissions attach to that layer. Add a new hire to the \"Accounting\" role and all the right access follows. The named models are tested in detail in objective 4.6. For now, know the one-line versions: Model Who or what decides access Role-based The user's job role Rule-based System-wide rules set by an administrator, such as time of day Mandatory (MAC) Labels on data and clearances on users, set centrally; users cannot change them Discretionary (DAC) The owner of each resource Attribute-based A combination of attributes of the user, the resource, and the context Confusable pair Least privilege is a principle, not a model. Least privilege means giving each user only the access the job requires. Any of the models above can be used to apply it. If a question asks which model is in use, least privilege is not the answer. Gap analysis A gap analysis compares where the organization is now with where it needs to be, and lists the differences. Choose the target: a baseline such as a published standard or framework (for example ISO/IEC 27001 or a NIST publication), or the organization's own policy. Assess the current state: people, processes, and technology. Compare the two, item by item. Report the gaps, with priorities and a plan to close them. Confusable pair Gap analysis vs. risk assessment vs. vulnerability scan. A gap analysis measures against a chosen standard : \"the framework requires multifactor authentication and we do not have it.\" A risk assessment measures likelihood and impact of threats. A vulnerability scan looks for technical weaknesses on systems. The words \"compare current state to desired state\" or \"against a framework\" mean gap analysis. Goal Protects against Typical controls Confidentiality Unauthorized reading Encryption, access controls Integrity Unauthorized or undetected change Hashing, digital signatures Availability Loss of access for authorized users Redundancy, backups, patching Non-repudiation A sender denying they sent or did something Digital signatures, individual accounts with logs AAA order: identify (claim), authenticate (prove), authorize (permissions), account (log). People authenticate with factors (password, token, fingerprint). Systems authenticate with a certificate on the device. An authorization model assigns permissions through roles, groups, labels, or attributes, not one user at a time. Gap analysis compares where you are with where you need to be (a baseline such as a standard) and produces the list of what is missing. "},"1.2b":{"id":"1.2b","obj":"1.2","min":20,"title":"Zero Trust: the control plane and the data plane","kw":["zero trust","policy engine","policy administrator","policy enforcement point","adaptive identity","implicit trust"],"cov":["Zero Trust","Control Plane","Adaptive identity","Threat scope reduction","Policy-driven access control","Policy Administrator","Policy Engine","Data Plane","Implicit trust zones","Subject/System","Policy Enforcement Point"],"why":"<p>Zero Trust has more named parts than any other topic in Domain 1, and the exam asks you to tell those parts apart: which component <em>decides<\/em>, which one <em>carries out<\/em> the decision, and which one <em>blocks or allows<\/em> the traffic. The names sound alike, so this needs to be memorized cleanly.<\/p>","plain":"<p>Picture an old office building with one guard at the front door. Once you are past the guard, you can walk into any room. That is the traditional network: hard on the outside, wide open inside. An attacker who gets in, or an employee who goes bad, can roam freely.<\/p>\n<p>Now picture a building where <strong>every door<\/strong> has a badge reader, and every time you badge, a central office checks who you are, what you are carrying, and whether you should be at that door right now. Being inside the building earns you nothing. That is Zero Trust.<\/p>\n<p>Two more words you will need. A network has a part that <strong>moves the traffic<\/strong> and a part that <strong>decides where traffic may go<\/strong>. The moving part is called the <em>data plane<\/em>. The deciding part is called the <em>control plane<\/em>. Think of trucks on roads (data plane) and the traffic control center that sets the signals (control plane).<\/p>","fast":"<p><strong>Zero Trust:<\/strong> no user or device is trusted because of where it is on the network. Every request is verified.<\/p>\n<table>\n<thead>\n<tr>\n<th>Plane<\/th>\n<th>Component<\/th>\n<th>Job in one phrase<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Control<\/td>\n<td><strong>Policy Engine<\/strong><\/td>\n<td><em>Decides<\/em>: grant, deny, or revoke<\/td>\n<\/tr>\n<tr>\n<td>Control<\/td>\n<td><strong>Policy Administrator<\/strong><\/td>\n<td><em>Carries out<\/em> the decision: issues the session credential, tells the gate to open or close<\/td>\n<\/tr>\n<tr>\n<td>Control<\/td>\n<td>Adaptive identity<\/td>\n<td>Adjusts how much proof is needed based on context<\/td>\n<\/tr>\n<tr>\n<td>Control<\/td>\n<td>Threat scope reduction<\/td>\n<td>Limits what any one identity can reach<\/td>\n<\/tr>\n<tr>\n<td>Control<\/td>\n<td>Policy-driven access control<\/td>\n<td>Decisions come from written policy plus the request's context<\/td>\n<\/tr>\n<tr>\n<td>Data<\/td>\n<td><strong>Policy Enforcement Point<\/strong><\/td>\n<td>The <em>gate<\/em>: allows or blocks the traffic as instructed<\/td>\n<\/tr>\n<tr>\n<td>Data<\/td>\n<td>Subject/System<\/td>\n<td>The user, device, or application making the request<\/td>\n<\/tr>\n<tr>\n<td>Data<\/td>\n<td>Implicit trust zone<\/td>\n<td>An area where traffic is trusted without re-checking; Zero Trust shrinks these<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Policy Engine + Policy Administrator together = the <strong>Policy Decision Point<\/strong>.<\/p>","core":"<h3>The idea<\/h3>\n<p>In a traditional network, anything inside the perimeter is trusted. <strong>Zero Trust<\/strong> removes that assumption. No user, device, or application is trusted because of its network location. Every request for a resource is authenticated and authorized, every time, using everything known about the request.<\/p>\n<p>The short version is \"never trust, always verify.\"<\/p>\n<h3>Two planes<\/h3>\n<p>Zero Trust separates the <strong>decision<\/strong> about access from the <strong>movement<\/strong> of traffic.<\/p>\n<ul>\n<li>The <strong>control plane<\/strong> makes and communicates access decisions.<\/li>\n<li>The <strong>data plane<\/strong> carries the actual traffic and enforces those decisions.<\/li>\n<\/ul>\n<p>The objective list places specific terms under each plane. Learn them by plane.<\/p>\n<h3>Control plane: the deciding side<\/h3>\n<p><strong>Policy Engine.<\/strong> Evaluates each request against policy and the available information (identity, device health, threat intelligence) and makes the decision: grant, deny, or revoke.<\/p>\n<p><strong>Policy Administrator.<\/strong> Takes the Policy Engine's decision and acts on it. It generates the session token or credential and tells the enforcement point to open or shut the connection.<\/p>\n<p>Together, the Policy Engine and the Policy Administrator are called the <strong>Policy Decision Point<\/strong>.<\/p>\n<p><strong>Adaptive identity.<\/strong> Authentication that changes with context. The system looks at more than the password: where the request is coming from, what device, what time, how the user normally behaves, how sensitive the resource is. A higher-risk request triggers stronger checks.<\/p>\n<p><strong>Threat scope reduction.<\/strong> Limiting what an attacker could reach if one account or device is compromised. Least privilege and segmenting the network into small zones both reduce the scope.<\/p>\n<p><strong>Policy-driven access control.<\/strong> Access decisions are made by applying defined policy to the identity and context gathered above, not by a static rule such as \"inside the network equals allowed.\"<\/p>\n<h3>Data plane: the moving side<\/h3>\n<p><strong>Subject/System.<\/strong> Whoever or whatever is asking for access: an end user, an application, a device, a service.<\/p>\n<p><strong>Policy Enforcement Point.<\/strong> The gatekeeper that every request must pass through. It allows, monitors, or ends the connection according to instructions from the Policy Administrator. It does not make the decision.<\/p>\n<p><strong>Implicit trust zones.<\/strong> Parts of the network where traffic is trusted without further checks, such as everything behind a corporate firewall. Zero Trust tries to make these zones as small as possible, ideally just the last step between the enforcement point and the resource.<\/p>\n<h3>How a request flows<\/h3>\n<ol>\n<li>The <strong>subject<\/strong> asks for a resource. The request arrives at the <strong>Policy Enforcement Point<\/strong>.<\/li>\n<li>The enforcement point passes the request to the <strong>Policy Administrator<\/strong>.<\/li>\n<li>The Policy Administrator asks the <strong>Policy Engine<\/strong> for a decision.<\/li>\n<li>The Policy Engine evaluates and answers: grant or deny.<\/li>\n<li>The Policy Administrator tells the enforcement point what to do, supplying a session credential if access is granted.<\/li>\n<li>The enforcement point opens the path to the resource, or blocks it.<\/li>\n<\/ol>\n<div class=\"co mem\"><span class=\"k\">Memory hook<\/span><p><strong>Engine decides. Administrator delivers. Enforcement point does the door.<\/strong> If you remember one line from this lesson, make it that one.<\/p><\/div>\n\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Policy Engine vs. Policy Administrator.<\/strong> The engine is the <em>judge<\/em>: it only issues a verdict. The administrator is the <em>clerk<\/em>: it turns the verdict into action by issuing credentials and commanding the gate. If the question says \"decides\" or \"evaluates\", choose the engine. If it says \"establishes or shuts down the communication path\" or \"generates the token\", choose the administrator.<\/p><\/div>\n\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Policy Enforcement Point vs. Policy Decision Point.<\/strong> Enforcement is in the data plane and touches the traffic. Decision is in the control plane and never touches the traffic.<\/p><\/div>\n\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>A user who is \"already on the internal network\" or \"connected through the VPN\" gets no automatic trust in Zero Trust. If an answer choice grants access because of network location, it is describing an implicit trust zone, which is what Zero Trust is trying to remove.<\/p><\/div>\n\n<div class=\"co exam\"><span class=\"k\">Exam vs. real world<\/span><p>Vendors sell products labeled \"Zero Trust\", and real deployments blend these roles into one or two products. The exam tests the reference model from NIST Special Publication 800-207, where the three components are separate and each has one job. Answer from the model.<\/p><\/div>","recall":[["State the Zero Trust idea in one sentence.","Nothing is trusted because of its network location; every request is verified."],["Which plane decides and which plane moves traffic?","The control plane decides. The data plane moves traffic and enforces."],["What does the Policy Engine do?","It evaluates the request and decides to grant, deny, or revoke access."],["What does the Policy Administrator do?","It carries out the engine's decision: issues the session credential and tells the enforcement point to open or close the path."],["What does the Policy Enforcement Point do, and which plane is it in?","It allows or blocks the traffic as instructed. It is in the data plane."],["What is adaptive identity?","Authentication that adjusts to context such as location, device, time, and behavior, requiring more proof when risk is higher."],["What is an implicit trust zone?","An area where traffic is trusted without being re-checked. Zero Trust makes these as small as possible."]],"pre":[{"q":"In a Zero Trust architecture, which component evaluates an access request against policy and makes the grant or deny decision?","o":["Policy Engine","Policy Administrator","Policy Enforcement Point","Implicit trust zone"],"e":"The Policy Engine makes the decision. The Policy Administrator carries the decision out, and the Policy Enforcement Point allows or blocks the traffic."},{"q":"Which Zero Trust component resides in the data plane?","o":["Policy Enforcement Point","Policy Engine","Policy Administrator","Adaptive identity"],"e":"The Policy Enforcement Point sits in the path of the traffic, which is the data plane. The engine, the administrator, and adaptive identity are control plane concepts."},{"q":"A user who normally signs in from the office during business hours attempts to sign in at 3 a.m. from another country. The system requires an additional verification step before continuing. Which concept does this demonstrate?","o":["Adaptive identity","Threat scope reduction","Implicit trust","Data plane enforcement"],"e":"Changing the authentication requirement based on context such as location and time is adaptive identity. Threat scope reduction limits what an identity can reach after access is granted."},{"q":"Which statement BEST describes the Zero Trust model?","o":["Every access request is verified regardless of where it originates","Users inside the corporate network are trusted by default","Remote users are trusted once the VPN tunnel is established","Devices are trusted permanently after their first successful login"],"e":"Zero Trust grants no trust based on network location or past success. The other three choices describe forms of implicit trust."}],"checks":[{"q":"After an access decision has been made, which Zero Trust component generates the session credential and instructs the gateway to open the connection?","o":["Policy Administrator","Policy Engine","Subject","Policy Enforcement Point"],"e":"The Policy Administrator executes the decision by issuing credentials and commanding the enforcement point. The Policy Engine only decides."},{"q":"A security architect divides a flat internal network into many small segments and gives each service account access to a single application. Which Zero Trust concept is the architect applying?","o":["Threat scope reduction","Adaptive identity","Policy Enforcement Point","Implicit trust zone"],"e":"Limiting what a compromised account or device can reach reduces the threat scope. Adaptive identity concerns how strongly a request is verified."},{"q":"In the Zero Trust model, an employee's laptop requesting access to a file server is referred to as which of the following?","o":["Subject","Policy Engine","Control plane","Trust zone"],"e":"The user, device, or application requesting access is the subject (or system). It belongs to the data plane."},{"q":"Which two components together make up the Policy Decision Point?","o":["Policy Engine and Policy Administrator","Policy Engine and Policy Enforcement Point","Policy Administrator and Subject","Policy Enforcement Point and Subject"],"e":"The Policy Decision Point is the Policy Engine (decides) plus the Policy Administrator (executes). The enforcement point is separate and sits in the data plane."},{"q":"An organization allows any device connected to its headquarters network to reach internal applications without further checks. In Zero Trust terms, the headquarters network is functioning as which of the following?","o":["An implicit trust zone","A Policy Enforcement Point","A threat scope reduction","An adaptive identity"],"e":"An area where traffic is trusted without re-verification is an implicit trust zone. Zero Trust aims to shrink such zones."}],"drill":"<li><b>The Drill Down:<\/b> add the keywords below. Run the pool until Policy Engine, Policy Administrator, and Policy Enforcement Point no longer blur.<\/li><li><b>Flashcards:<\/b> run 15 cards, then draw the six-step request flow on paper from memory.<\/li><li><b>Glossary:<\/b> look up \"microsegmentation\" and \"control plane\".<\/li>","text":" Zero Trust has more named parts than any other topic in Domain 1, and the exam asks you to tell those parts apart: which component decides , which one carries out the decision, and which one blocks or allows the traffic. The names sound alike, so this needs to be memorized cleanly. Picture an old office building with one guard at the front door. Once you are past the guard, you can walk into any room. That is the traditional network: hard on the outside, wide open inside. An attacker who gets in, or an employee who goes bad, can roam freely. Now picture a building where every door has a badge reader, and every time you badge, a central office checks who you are, what you are carrying, and whether you should be at that door right now. Being inside the building earns you nothing. That is Zero Trust. Two more words you will need. A network has a part that moves the traffic and a part that decides where traffic may go . The moving part is called the data plane . The deciding part is called the control plane . Think of trucks on roads (data plane) and the traffic control center that sets the signals (control plane). The idea In a traditional network, anything inside the perimeter is trusted. Zero Trust removes that assumption. No user, device, or application is trusted because of its network location. Every request for a resource is authenticated and authorized, every time, using everything known about the request. The short version is \"never trust, always verify.\" Two planes Zero Trust separates the decision about access from the movement of traffic. The control plane makes and communicates access decisions. The data plane carries the actual traffic and enforces those decisions. The objective list places specific terms under each plane. Learn them by plane. Control plane: the deciding side Policy Engine. Evaluates each request against policy and the available information (identity, device health, threat intelligence) and makes the decision: grant, deny, or revoke. Policy Administrator. Takes the Policy Engine's decision and acts on it. It generates the session token or credential and tells the enforcement point to open or shut the connection. Together, the Policy Engine and the Policy Administrator are called the Policy Decision Point . Adaptive identity. Authentication that changes with context. The system looks at more than the password: where the request is coming from, what device, what time, how the user normally behaves, how sensitive the resource is. A higher-risk request triggers stronger checks. Threat scope reduction. Limiting what an attacker could reach if one account or device is compromised. Least privilege and segmenting the network into small zones both reduce the scope. Policy-driven access control. Access decisions are made by applying defined policy to the identity and context gathered above, not by a static rule such as \"inside the network equals allowed.\" Data plane: the moving side Subject/System. Whoever or whatever is asking for access: an end user, an application, a device, a service. Policy Enforcement Point. The gatekeeper that every request must pass through. It allows, monitors, or ends the connection according to instructions from the Policy Administrator. It does not make the decision. Implicit trust zones. Parts of the network where traffic is trusted without further checks, such as everything behind a corporate firewall. Zero Trust tries to make these zones as small as possible, ideally just the last step between the enforcement point and the resource. How a request flows The subject asks for a resource. The request arrives at the Policy Enforcement Point . The enforcement point passes the request to the Policy Administrator . The Policy Administrator asks the Policy Engine for a decision. The Policy Engine evaluates and answers: grant or deny. The Policy Administrator tells the enforcement point what to do, supplying a session credential if access is granted. The enforcement point opens the path to the resource, or blocks it. Memory hook Engine decides. Administrator delivers. Enforcement point does the door. If you remember one line from this lesson, make it that one. Confusable pair Policy Engine vs. Policy Administrator. The engine is the judge : it only issues a verdict. The administrator is the clerk : it turns the verdict into action by issuing credentials and commanding the gate. If the question says \"decides\" or \"evaluates\", choose the engine. If it says \"establishes or shuts down the communication path\" or \"generates the token\", choose the administrator. Confusable pair Policy Enforcement Point vs. Policy Decision Point. Enforcement is in the data plane and touches the traffic. Decision is in the control plane and never touches the traffic. Trap A user who is \"already on the internal network\" or \"connected through the VPN\" gets no automatic trust in Zero Trust. If an answer choice grants access because of network location, it is describing an implicit trust zone, which is what Zero Trust is trying to remove. Exam vs. real world Vendors sell products labeled \"Zero Trust\", and real deployments blend these roles into one or two products. The exam tests the reference model from NIST Special Publication 800-207, where the three components are separate and each has one job. Answer from the model. Zero Trust: no user or device is trusted because of where it is on the network. Every request is verified. Plane Component Job in one phrase Control Policy Engine Decides : grant, deny, or revoke Control Policy Administrator Carries out the decision: issues the session credential, tells the gate to open or close Control Adaptive identity Adjusts how much proof is needed based on context Control Threat scope reduction Limits what any one identity can reach Control Policy-driven access control Decisions come from written policy plus the request's context Data Policy Enforcement Point The gate : allows or blocks the traffic as instructed Data Subject/System The user, device, or application making the request Data Implicit trust zone An area where traffic is trusted without re-checking; Zero Trust shrinks these Policy Engine + Policy Administrator together = the Policy Decision Point . "},"1.2c":{"id":"1.2c","obj":"1.2","min":20,"title":"Physical security and deception technology","kw":["honeytoken","honeyfile","honeypot","honeynet","access control vestibule","bollard","infrared","ultrasonic"],"cov":["Physical security","Bollards","Access control vestibule","Fencing","Video surveillance","Security guard","Access badge","Lighting","Sensors","Infrared","Pressure","Microwave","Ultrasonic","Deception and disruption technology","Honeypot","Honeynet","Honeyfile","Honeytoken"],"why":"<p>An attacker who can touch a server can usually defeat every software control on it, so the exam expects you to know the standard physical protections by name and purpose. The second half of this lesson covers decoys: fake systems and fake data planted to catch intruders. The four \"honey\" terms are short, similar, and frequently confused with each other.<\/p>","plain":"<p>Physical security is the part of security you can see when you walk up to a building: posts that stop cars, fences, doors, guards, cameras, lights, and alarm sensors. Each one has a specific job, and exam questions ask which one fits a described need.<\/p>\n<p>Deception is a different idea. A fishing lure looks like food and exists only to be bitten. Security teams plant lures too: a fake server, a fake file, a fake password. Nobody with a legitimate reason would ever touch them, so when one is touched, the team knows someone is snooping, and gets to watch what they do.<\/p>","fast":"<table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Purpose in one phrase<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bollard<\/td>\n<td>Short post that stops vehicles and lets people walk through<\/td>\n<\/tr>\n<tr>\n<td>Access control vestibule<\/td>\n<td>Two interlocked doors; one person at a time; defeats tailgating<\/td>\n<\/tr>\n<tr>\n<td>Fencing<\/td>\n<td>Marks and protects the perimeter<\/td>\n<\/tr>\n<tr>\n<td>Video surveillance<\/td>\n<td>Records and monitors; detective, and a deterrent when visible<\/td>\n<\/tr>\n<tr>\n<td>Security guard<\/td>\n<td>Human judgment: checks identification, responds to events<\/td>\n<\/tr>\n<tr>\n<td>Access badge<\/td>\n<td>Identifies the holder and logs each entry<\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>Deters intruders and lets cameras and guards see<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Sensor<\/th>\n<th>Detects<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Infrared<\/td>\n<td>Heat given off by a body; works in the dark<\/td>\n<\/tr>\n<tr>\n<td>Pressure<\/td>\n<td>Weight or force on a surface<\/td>\n<\/tr>\n<tr>\n<td>Microwave<\/td>\n<td>Movement, by reflected microwave signals; covers large areas<\/td>\n<\/tr>\n<tr>\n<td>Ultrasonic<\/td>\n<td>Movement, by reflected sound waves<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Decoy<\/th>\n<th>What it is<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Honeypot<\/td>\n<td>One fake system<\/td>\n<\/tr>\n<tr>\n<td>Honeynet<\/td>\n<td>A network of honeypots<\/td>\n<\/tr>\n<tr>\n<td>Honeyfile<\/td>\n<td>A bait <strong>file<\/strong>; alerts when someone opens it<\/td>\n<\/tr>\n<tr>\n<td>Honeytoken<\/td>\n<td>A piece of fake, traceable <strong>data<\/strong> (credential, record, key); alerts when it is used or shows up somewhere<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","core":"<h3>Physical security controls<\/h3>\n<p><strong>Bollards.<\/strong> Short, sturdy posts set into the ground. They stop vehicles from driving into a building or an area while letting people walk between them. A question about preventing a vehicle from ramming an entrance is asking for bollards.<\/p>\n<p><strong>Access control vestibule.<\/strong> A small room with two doors, where the second door will not open until the first has closed. It lets one person through at a time, so someone cannot follow an authorized person in. The older name is <em>mantrap<\/em>.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Tailgating vs. piggybacking.<\/strong> Both mean an unauthorized person entering behind an authorized one. In tailgating the authorized person does not know. In piggybacking the authorized person knowingly holds the door. An access control vestibule stops both.<\/p><\/div>\n\n<p><strong>Fencing.<\/strong> Establishes the perimeter. A fence can be see-through, so guards and cameras can watch the outside, or opaque, so outsiders cannot see in. Height and topping such as razor wire make it harder to climb.<\/p>\n<p><strong>Video surveillance.<\/strong> Cameras, often called closed-circuit television. They record events for later review and can be watched live. Modern systems add motion detection and object recognition. Recording makes them a detective control; visible cameras also act as a deterrent.<\/p>\n<p><strong>Security guard.<\/strong> A person who can check identification, question a visitor, and react to something unexpected. People bring judgment that devices lack. Guards also maintain the visitor log and escort visitors.<\/p>\n<p><strong>Access badge.<\/strong> A card that identifies the holder, often with a photo, and unlocks doors electronically. Each use is logged, so badge records show who entered which door and when. That log is the <em>accounting<\/em> step from the AAA lesson, applied to a building.<\/p>\n<p><strong>Lighting.<\/strong> Well-lit areas discourage intruders and make cameras and guards effective. Good lighting avoids deep shadows and glare, and covers entrances and parking areas.<\/p>\n<h3>Sensors<\/h3>\n<p>Sensors detect a presence or a change and raise an alarm. The exam expects you to match each kind to what it senses.<\/p>\n<table>\n<thead>\n<tr>\n<th>Sensor<\/th>\n<th>What it senses<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Infrared<\/strong><\/td>\n<td>Infrared radiation, meaning heat from a body<\/td>\n<td>Works in darkness; common in motion detectors<\/td>\n<\/tr>\n<tr>\n<td><strong>Pressure<\/strong><\/td>\n<td>A change in force on a surface<\/td>\n<td>Floor mats, pads under an object<\/td>\n<\/tr>\n<tr>\n<td><strong>Microwave<\/strong><\/td>\n<td>Movement, detected by sending microwave signals and reading the reflection<\/td>\n<td>Covers large areas; can pass through thin walls, which may cause false alarms<\/td>\n<\/tr>\n<tr>\n<td><strong>Ultrasonic<\/strong><\/td>\n<td>Movement, detected by sending sound waves above human hearing and reading the reflection<\/td>\n<td>Also used to detect a collision or how near an object is<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"co mem\"><span class=\"k\">Memory hook<\/span><p>Match each sensor to one word. <strong>Infrared: heat. Pressure: weight. Microwave: wide area. Ultrasonic: sound.<\/strong><\/p><\/div>\n\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>Microwave and ultrasonic sensors both <em>send out<\/em> a signal and read what bounces back. Infrared sensors of the common kind only <em>receive<\/em> heat. If a question mentions body heat or working in the dark, choose infrared. If it mentions sound waves, choose ultrasonic.<\/p><\/div>\n\n<h3>Deception and disruption technology<\/h3>\n<p>Deception technology plants fake targets. Legitimate users have no reason to touch them, so any contact is a high-quality alert. The decoys also waste the attacker's time and let defenders study the attacker's methods.<\/p>\n<p><strong>Honeypot.<\/strong> A single decoy system made to look like a real, attractive target, such as a server with weak settings. It is isolated from production and heavily monitored.<\/p>\n<p><strong>Honeynet.<\/strong> A whole decoy network: several honeypots connected together, with fake servers, workstations, and network devices. It looks like a real environment and lets defenders watch how an attacker moves between systems.<\/p>\n<p><strong>Honeyfile.<\/strong> A bait file with a tempting name, such as <code>passwords.xlsx<\/code>, placed on a real file share. Nobody should open it. An alert fires when someone does.<\/p>\n<p><strong>Honeytoken.<\/strong> A piece of fake data that can be traced: a made-up user account, a fake API key, a fake customer record in a database, a fake email address. It has no legitimate use. If it is ever used to log in, or turns up outside the organization, the team knows data was taken and can often tell from where.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Honeyfile vs. honeytoken.<\/strong> This is the pair people miss most. Ask what the bait <em>is<\/em> and what sets off the alert.<\/p><\/div>\n\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Honeyfile<\/th>\n<th>Honeytoken<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The bait is<\/td>\n<td>A file<\/td>\n<td>A piece of data: credential, key, record, address<\/td>\n<\/tr>\n<tr>\n<td>The alert fires when<\/td>\n<td>The file is opened or accessed<\/td>\n<td>The data is used, or appears somewhere it should not<\/td>\n<\/tr>\n<tr>\n<td>Typical wording<\/td>\n<td>\"a document named...\" \"a spreadsheet on the share\"<\/td>\n<td>\"fake credentials\", \"a bogus record\", \"a dummy API key\", \"tracks the source of a leak\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A fake administrator account planted in the directory is a honeytoken. A file called <code>admin-passwords.txt<\/code> that triggers an alert when opened is a honeyfile. If the question describes fake credentials <em>inside<\/em> a file and the alert comes when someone tries to <strong>use the credentials<\/strong>, the answer is honeytoken.<\/p>\n<div class=\"co pair\"><span class=\"k\">Confusable pair<\/span><p><strong>Honeypot vs. honeynet.<\/strong> One system versus many. If the question says \"a decoy server\", choose honeypot. If it says \"a simulated network\" or \"multiple decoy systems\", choose honeynet.<\/p><\/div>\n\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>Decoys do not block anything. They are <strong>detective<\/strong> controls that also buy time. An answer that claims a honeypot prevents attacks on production systems is wrong.<\/p><\/div>","recall":[["What stops a vehicle from being driven into a building entrance?","Bollards."],["What does an access control vestibule prevent, and how?","Tailgating and piggybacking. Two interlocked doors let one person through at a time."],["Which sensor detects body heat? Which uses sound waves?","Infrared detects heat. Ultrasonic uses sound waves."],["Which sensor covers large areas and can cause false alarms through thin walls?","Microwave."],["Honeypot versus honeynet?","A honeypot is one decoy system. A honeynet is a network of them."],["Honeyfile versus honeytoken?","A honeyfile is a bait file that alerts when opened. A honeytoken is a piece of fake traceable data that alerts when it is used or appears elsewhere."],["Which control type are decoys?","Detective. They alert and observe; they do not block."]],"pre":[{"q":"A company wants to stop an unauthorized person from following an employee through a secured data center entrance. Which control BEST addresses this?","o":["Access control vestibule","Bollards","Perimeter lighting","Infrared sensor"],"e":"An access control vestibule admits one person at a time through two interlocked doors, which defeats tailgating. Bollards stop vehicles, an

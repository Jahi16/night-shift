/* Layout: one reading column (max 760px) under a sticky console strip, same visual language as the Night Shift app. */
:root{
  --bg:#0A1017; --panel:#121C26; --raise:#1A2733; --line:#263644;
  --txt:#DDE7F1; --dim:#8FA2B5; --faint:#4E6072;
  --amber:#F0A03C; --red:#E8695D; --cyan:#45D3C0; --violet:#A996FF; --blue:#5AA9F0; --green:#3ED07A;
  --stripbg:#070C11; --lampoff:#182430; --oninv:#0A1017;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#EFF2F6; --panel:#FFFFFF; --raise:#F5F7F9; --line:#D9E0E8;
  --txt:#16212D; --dim:#52667A; --faint:#98A8B9;
  --amber:#995806; --red:#A22013; --cyan:#157568; --violet:#2908BC; --blue:#0862B3; --green:#16763D;
  --stripbg:#E2E8EE; --lampoff:#DCE3EA; --oninv:#FFFFFF; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#EFF2F6; --panel:#FFFFFF; --raise:#F5F7F9; --line:#D9E0E8;
  --txt:#16212D; --dim:#52667A; --faint:#98A8B9;
  --amber:#995806; --red:#A22013; --cyan:#157568; --violet:#2908BC; --blue:#0862B3; --green:#16763D;
  --stripbg:#E2E8EE; --lampoff:#DCE3EA; --oninv:#FFFFFF; color-scheme:light;
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important} }
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:var(--blue)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--stripbg)}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--stripbg);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.strip-in{max-width:760px;margin:0 auto;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stn{font-weight:700;white-space:nowrap;letter-spacing:.02em;color:var(--txt);text-decoration:none}
.stn .sub{color:var(--violet)}
.lamps{display:flex;gap:2px;flex:1;min-width:90px}
.lamp{flex:1;height:10px;background:var(--lampoff);border-radius:1px}
.lamp.on{background:var(--cyan)}
.readout{color:var(--dim);white-space:nowrap}
.readout b{color:var(--txt)}
.nav{display:flex;gap:6px;flex:1 1 100%;flex-wrap:wrap;align-items:center}
.hbtn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:5px 11px;border:1px solid var(--line);border-radius:6px;color:var(--dim);text-decoration:none;display:inline-block}
.hbtn:hover{color:var(--txt);border-color:var(--dim)}
.hbtn.cur{color:var(--cyan);border-color:var(--cyan)}
.hbtn.app{color:var(--amber);border-color:var(--amber);margin-left:auto}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 6px;font-weight:600}
h1{font-size:27px;line-height:1.2;margin:0 0 8px;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px;line-height:1.3;margin:30px 0 10px;font-weight:700;text-wrap:balance}
h3{font-size:16px;margin:22px 0 6px;font-weight:700}
.lede{color:var(--dim);margin:0 0 18px;font-size:15.5px;max-width:65ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.card.hi{border-left:3px solid var(--cyan)}
.card h2:first-child,.card h3:first-child{margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-weight:600;font-size:14px;color:var(--txt);text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--cyan);border-color:var(--cyan);color:var(--oninv)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--oninv)}
.btn.ghost{background:none}
.btn.sm{padding:6px 11px;font-size:12.5px;min-height:34px}
.btn.danger{color:var(--red);border-color:var(--red);background:none}
.dim{color:var(--dim)}
.mono{font-family:var(--mono)}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.done{color:var(--green);border-color:var(--green)}
.pill.due{color:var(--amber);border-color:var(--amber)}
.pill.opt{color:var(--violet);border-color:var(--violet)}
.bar{height:8px;background:var(--lampoff);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--cyan)}
.dom{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin:0 0 12px}
.dom .nm{font-weight:600;font-size:14px;min-width:0}
.dom .ct{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.dom .bar{grid-column:1/-1}
.choice{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:0 0 16px}
.choice button{text-align:left;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.choice button:hover{border-color:var(--dim)}
.choice button[aria-pressed="true"]{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.choice b{display:block;margin-bottom:3px}
.choice span{color:var(--dim);font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--dim);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--cyan);color:var(--oninv)}
label.fld{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input[type=date],input[type=search]{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;max-width:100%}
input[type=search]{width:100%}
/* course map */
.mod{margin:0 0 18px}
.mod-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.mod-h h2{margin:0;font-size:17px}
.mod-b{color:var(--dim);font-size:13.5px;margin:0 0 8px}
.ll{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.ll li+li{border-top:1px solid var(--line)}
.ll a{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;color:var(--txt);text-decoration:none}
.ll a:hover{background:var(--raise)}
.ll .ob{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:34px;font-variant-numeric:tabular-nums}
.ll .ti{min-width:0;font-weight:500;font-size:14.5px}
.ll .me{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ll .mn{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
/* lesson */
.lesson{font-size:16px;line-height:1.65}
.lesson p,.lesson li{max-width:68ch}
.lesson ul,.lesson ol{padding-left:22px;margin:8px 0 14px}
.lesson li{margin:4px 0}
.lesson strong{font-weight:700}
.lesson code{font-family:var(--mono);font-size:.88em;background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.lesson pre{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5}
.lesson pre code{background:none;border:none;padding:0;font-size:inherit}
.tw{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:8px}
.lesson table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45;min-width:460px}
.lesson th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left;color:var(--dim);background:var(--raise);padding:8px 10px;border-bottom:1px solid var(--line)}
.lesson td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.lesson tr:last-child td{border-bottom:none}
.objline{font-family:var(--mono);font-size:12.5px;color:var(--dim);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:0 0 16px}
.objline b{color:var(--txt)}
.sec-lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:30px 0 8px;color:var(--cyan);display:flex;align-items:center;gap:8px}
.sec-lab::after{content:"";flex:1;height:1px;background:var(--line)}
.co{border:1px solid var(--line);border-left-width:3px;border-radius:6px;padding:10px 14px;margin:12px 0;background:var(--panel)}
.co>.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:2px}
.co p{margin:0}
.co.trap{border-left-color:var(--red)} .co.trap>.k{color:var(--red)}
.co.exam{border-left-color:var(--amber)} .co.exam>.k{color:var(--amber)}
.co.tip{border-left-color:var(--cyan)} .co.tip>.k{color:var(--cyan)}
.co.mem{border-left-color:var(--violet)} .co.mem>.k{color:var(--violet)}
.co.pair{border-left-color:var(--blue)} .co.pair>.k{color:var(--blue)}
.co p+p{margin-top:6px}
.gate{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:0 0 6px}
.gate .card{margin:0;display:flex;flex-direction:column;gap:8px}
.gate .card p{margin:0;font-size:14.5px;color:var(--dim)}
.gate .card .btn{margin-top:auto;align-self:flex-start}
details.cov{margin:0 0 16px;font-size:13.5px}
details.cov summary{cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:12px}
details.cov ul{columns:2;column-gap:24px;margin:8px 0 0;padding-left:18px;color:var(--dim)}
@media(max-width:560px){details.cov ul{columns:1}}
.pill.soon{color:var(--faint);border-style:dashed}
details.plain{border:1px dashed var(--line);border-radius:8px;padding:0 14px;margin:12px 0;background:var(--panel)}
details.plain summary{cursor:pointer;font-weight:600;padding:11px 0;color:var(--violet)}
details.plain[open] summary{border-bottom:1px dashed var(--line);margin-bottom:8px}
.rc{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--panel)}
.rc button{display:block;width:100%;text-align:left;padding:11px 14px;font-weight:600}
.rc .ans{padding:0 14px 12px;color:var(--dim)}
.rc .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);float:right;margin-left:8px}
.q{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;margin:12px 0}
.q .qt{font-weight:600;margin:0 0 10px}
.q .qn{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--raise);font-size:15px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--dim)}
.opt:disabled{cursor:default;opacity:.75}
.opt.right{border-color:var(--green);opacity:1;box-shadow:inset 0 0 0 1px var(--green)}
.opt.wrong{border-color:var(--red);opacity:1}
.fb{margin:10px 0 0;padding:10px 12px;border-radius:8px;background:var(--raise);font-size:14.5px}
.fb b.ok{color:var(--green)} .fb b.no{color:var(--red)}
.kw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.kw span{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--txt)}
.stat{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin:6px 0}
.stat b{color:var(--txt)}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--txt);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:80;max-width:90vw}
.note{font-size:12.5px;color:var(--dim)}
.theme-toggle{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--dim);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.theme-toggle svg{width:15px;height:15px}
@media(max-width:560px){ .lamps{min-width:40px} h1{font-size:23px} .lesson{font-size:15.5px} .ll a{grid-template-columns:auto 1fr} .ll .me{grid-column:2;justify-content:flex-start} }
</style>

<script>
const COURSE={"mods":[{"id":"S","title":"Orientation","blurb":"How the exam works and how to use this course with Night Shift.","weight":0,"lessons":["S1"]},{"id":"F","title":"Foundations","blurb":"The IT groundwork the exam assumes you already have: networks, ports, operating systems, cloud.","weight":0,"lessons":["F1","F2","F3","F4","F5"]},{"id":"1","title":"Domain 1: General Security Concepts","blurb":"Controls, core principles, change management, and cryptography.","weight":12,"lessons":["1.1","1.2a","1.2b","1.2c","1.3","1.4a","1.4b","1.4c"]},{"id":"2","title":"Domain 2: Threats, Vulnerabilities, and Mitigations","blurb":"Who attacks, how they get in, what they exploit, what it looks like, and how to reduce it.","weight":22,"lessons":[]},{"id":"3","title":"Domain 3: Security Architecture","blurb":"Cloud and network design, secure infrastructure, data protection, and resilience.","weight":18,"lessons":[]},{"id":"4","title":"Domain 4: Security Operations","blurb":"The largest domain: hardening, assets, vulnerabilities, monitoring, identity, automation, incidents, and logs.","weight":28,"lessons":[]},{"id":"5","title":"Domain 5: Security Program Management and Oversight","blurb":"Governance, risk, third parties, compliance, audits, and awareness.","weight":20,"lessons":[]},{"id":"X","title":"Exam Skills","blurb":"Reading questions, separating look-alike answers, performance-based questions, and exam day.","weight":0,"lessons":[]}],"lessons":{"S1":{"id":"S1","obj":"","min":10,"title":"How the exam works and how to use this course","kw":[],"why":"<p>You are preparing for one specific test with published rules. Knowing those rules, and having a method that fits them, saves weeks of unfocused study. This lesson gives you the facts about the exam and the routine this course is built around.<\/p>","plain":"","core":"<h3>The exam in numbers<\/h3>\n<table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>SY0-701<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Questions<\/td>\n<td>Up to 90<\/td>\n<\/tr>\n<tr>\n<td>Time<\/td>\n<td>90 minutes<\/td>\n<\/tr>\n<tr>\n<td>Question types<\/td>\n<td>Multiple choice (one answer or several) and performance-based questions<\/td>\n<\/tr>\n<tr>\n<td>Passing score<\/td>\n<td>750 on a scale of 100 to 900<\/td>\n<\/tr>\n<tr>\n<td>Recommended background<\/td>\n<td>About two years in IT administration with a security focus. Recommended, not required.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The score is scaled. 750 out of 900 is not \"83 percent of questions\", and CompTIA does not publish the conversion, so do not try to count the misses you can afford. Unanswered questions score as wrong and there is no extra penalty for a wrong guess, so answer everything.<\/p>\n<h3>What the exam covers<\/h3>\n<table>\n<thead>\n<tr>\n<th>Domain<\/th>\n<th>Share of the exam<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.0 General Security Concepts<\/td>\n<td>12%<\/td>\n<\/tr>\n<tr>\n<td>2.0 Threats, Vulnerabilities, and Mitigations<\/td>\n<td>22%<\/td>\n<\/tr>\n<tr>\n<td>3.0 Security Architecture<\/td>\n<td>18%<\/td>\n<\/tr>\n<tr>\n<td>4.0 Security Operations<\/td>\n<td>28%<\/td>\n<\/tr>\n<tr>\n<td>5.0 Security Program Management and Oversight<\/td>\n<td>20%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The five domains break into 28 numbered objectives (1.1 through 5.6). Every lesson in this course is labeled with the objective it teaches, and Night Shift labels every question the same way, so a miss in the app always points back to one lesson here.<\/p>\n<p>Notice the weights. Domains 4, 2, and 5 together are 70% of the exam. People who enjoy the technical material often under-study Domain 5 (governance and risk), which is worth more than all of Domain 3.<\/p>\n<div class=\"co exam\"><span class=\"k\">Exam vs. real world<\/span><p>The objective list says its bullet points are examples, not a complete list. Expect a few questions on terms that are near the objectives but not printed in them. This is normal. Understanding the idea behind each bullet is what lets you answer those.<\/p><\/div>\n<h3>Which version you are studying<\/h3>\n<p>This course and Night Shift teach <strong>SY0-701<\/strong> (version 7). CompTIA lists SY0-701 as retiring on <strong>June 11, 2027<\/strong> for the English exam, and its replacement, version 8 (SY0-801), launches in November 2026. Both versions are valid for the same certification while they overlap. If you plan to test after spring 2027, check CompTIA's site first: version 8 renumbers objectives and changes the domain weights.<\/p>\n<h3>What is in the course so far<\/h3><p>Orientation, the optional Foundations lessons, and all of <strong>Domain 1<\/strong> are complete. Domains 2 through 5 and the Exam Skills lessons are being added. The All lessons page always shows what is available. Night Shift already covers all five domains, so keep drilling everything there.<\/p><h3>The method<\/h3>\n<p>Reading and watching feel productive but produce weak memory. Getting answers out of your own head, spaced over days, is what holds up under exam pressure. So every lesson follows the same loop:<\/p>\n<ol>\n<li><strong>Place.<\/strong> Each lesson offers a short placement check. Get every question right and you take the fast track: a summary, the traps, and the recall prompts. Miss one, or skip the check, and you take the full lesson, which starts from zero.<\/li>\n<li><strong>Learn.<\/strong> In the full lesson, if the topic is new, open \"New to this? Start here\" first.<\/li>\n<li><strong>Recall.<\/strong> Answer the recall prompts from memory before you reveal them.<\/li>\n<li><strong>Checkpoint.<\/strong> Exam-style questions at the end of the full lesson, different from the placement questions.<\/li>\n<li><strong>Drill.<\/strong> Go to Night Shift and work the drill named at the bottom of the lesson.<\/li>\n<li><strong>Review.<\/strong> The lesson returns after 2, 7, and 21 days for a two-minute recall check.<\/li>\n<\/ol>\n<p>Plan on spending at least half of your study time answering questions, not reading.<\/p>\n<h3>What each Night Shift mode is for<\/h3>\n<table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Use it for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Question Queue<\/td>\n<td>Daily practice. Lock it to the domain you just studied.<\/td>\n<\/tr>\n<tr>\n<td>The Drill Down<\/td>\n<td>Repetition on specific topics you keep missing. Each lesson gives you keywords to add.<\/td>\n<\/tr>\n<tr>\n<td>Acronym Recall<\/td>\n<td>The acronym list. A few minutes most days.<\/td>\n<\/tr>\n<tr>\n<td>Flashcards<\/td>\n<td>Definitions and look-alike terms, on a spaced schedule.<\/td>\n<\/tr>\n<tr>\n<td>Glossary<\/td>\n<td>Looking up any term you meet and do not know.<\/td>\n<\/tr>\n<tr>\n<td>PBQ Lab<\/td>\n<td>Performance-based questions. Start once you are into Domain 3.<\/td>\n<\/tr>\n<tr>\n<td>Practice Exam<\/td>\n<td>Full timed exams. Save these for after the lessons.<\/td>\n<\/tr>\n<tr>\n<td>Weak Areas<\/td>\n<td>Seeing which concepts you miss repeatedly.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>The readiness gate<\/h3>\n<p>Book the exam on evidence, not on a calendar. The gate used by Night Shift: <strong>two full practice exams at 85% or better, with no domain under 75%, both inside the last 14 days.<\/strong> Scores stuck in the low 70s mean more drilling, not more hoping.<\/p>\n<div class=\"co tip\"><span class=\"k\">Exam tip<\/span><p>If you have a documented disability, CompTIA's testing partner offers accommodations such as extended time. The request has to be approved before you schedule, so start it early.<\/p><\/div>","recall":[["How many questions and minutes, and what is the passing score?","Up to 90 questions, 90 minutes, 750 on a 100 to 900 scale."],["Which three domains make up 70% of the exam?","Domain 4 Security Operations (28%), Domain 2 Threats, Vulnerabilities, and Mitigations (22%), and Domain 5 Security Program Management and Oversight (20%)."],["What is the readiness gate?","Two full practice exams at 85% or better, no domain under 75%, both within the last 14 days."]],"checks":[{"q":"Which domain carries the most weight on the SY0-701 exam?","o":["Security Operations","Security Architecture","General Security Concepts","Threats, Vulnerabilities, and Mitigations"],"e":"Security Operations is 28% of the exam. Threats is second at 22%. Architecture feels large because it is technical, but it is 18%."},{"q":"A candidate has ten minutes left and twelve unanswered multiple-choice questions. What is the best approach?","o":["Select an answer for every question, even where guessing","Leave the hardest ones blank to avoid a penalty","Spend the time perfecting one flagged performance-based question","Answer only the questions they are certain about"],"e":"Unanswered questions count as wrong and a wrong guess costs nothing extra, so every question should have an answer. Perfecting one item while twelve sit blank loses more points than it gains."},{"q":"A learner reads every lesson twice and highlights carefully but rarely answers practice questions. What does the course method say is missing?","o":["Retrieval practice spaced over days","A third read-through before the exam","Memorizing the objective numbers","Longer study sessions"],"e":"Rereading builds familiarity, which feels like knowing. Pulling answers from memory, repeated over days, is what builds recall under pressure. At least half of study time should be spent answering questions."}],"drill":"<li><b>First visit:<\/b> open Night Shift, set your name and exam date, and run one 15-ticket Question Queue across all domains to get a baseline. Do not worry about the score.<\/li><li><b>Glossary:<\/b> look up any term in this lesson you did not know.<\/li>","text":" You are preparing for one specific test with published rules. Knowing those rules, and having a method that fits them, saves weeks of unfocused study. This lesson gives you the facts about the exam and the routine this course is built around. The exam in numbers Item SY0-701 Questions Up to 90 Time 90 minutes Question types Multiple choice (one answer or several) and performance-based questions Passing score 750 on a scale of 100 to 900 Recommended background About two years in IT administration with a security focus. Recommended, not required. The score is scaled. 750 out of 900 is not \"83 percent of questions\", and CompTIA does not publish the conversion, so do not try to count the misses you can afford. Unanswered questions score as wrong and there is no extra penalty for a wrong guess, so answer everything. What the exam covers Domain Share of the exam 1.0 General Security Concepts 12% 2.0 Threats, Vulnerabilities, and Mitigations 22% 3.0 Security Architecture 18% 4.0 Security Operations 28% 5.0 Security Program Management and Oversight 20% The five domains break into 28 numbered objectives (1.1 through 5.6). Every lesson in this course is labeled with the objective it teaches, and Night Shift labels every question the same way, so a miss in the app always points back to one lesson here. Notice the weights. Domains 4, 2, and 5 together are 70% of the exam. People who enjoy the technical material often under-study Domain 5 (governance and risk), which is worth more than all of Domain 3. Exam vs. real world The objective list says its bullet points are examples, not a complete list. Expect a few questions on terms that are near the objectives but not printed in them. This is normal. Understanding the idea behind each bullet is what lets you answer those. Which version you are studying This course and Night Shift teach SY0-701 (version 7). CompTIA lists SY0-701 as retiring on June 11, 2027 for the English exam, and its replacement, version 8 (SY0-801), launches in November 2026. Both versions are valid for the same certification while they overlap. If you plan to test after spring 2027, check CompTIA's site first: version 8 renumbers objectives and changes the domain weights. The method Reading and watching feel productive but produce weak memory. Getting answers out of your own head, spaced over days, is what holds up under exam pressure. So every lesson follows the same loop: Place. Each lesson offers a short placement check. Learn. Read the lesson. If the topic is new, open \"New to this? Start here\" first. Recall. Answer the recall prompts from memory before you reveal them. Checkpoint. Three or four exam-style questions. Drill. Go to Night Shift and work the drill named at the bottom of the lesson. Review. The lesson returns after 2, 7, and 21 days for a two-minute recall check. Plan on spending at least half of your study time answering questions, not reading. What each Night Shift mode is for Mode Use it for Question Queue Daily practice. Lock it to the domain you just studied. The Drill Down Repetition on specific topics you keep missing. Each lesson gives you keywords to add. Acronym Recall The acronym list. A few minutes most days. Flashcards Definitions and look-alike terms, on a spaced schedule. Glossary Looking up any term you meet and do not know. PBQ Lab Performance-based questions. Start once you are into Domain 3. Practice Exam Full timed exams. Save these for after the lessons. Weak Areas Seeing which concepts you miss repeatedly. The readiness gate Book the exam on evidence, not on a calendar. The gate used by Night Shift: two full practice exams at 85% or better, with no domain under 75%, both inside the last 14 days. Scores stuck in the low 70s mean more drilling, not more hoping. Exam tip If you have a documented disability, CompTIA's testing partner offers accommodations such as extended time. The request has to be approved before you schedule, so start it early. "},"F1":{"id":"F1","obj":"","min":20,"title":"How networks move data","kw":[],"why":"<p>Most exam scenarios happen on a network: a firewall blocks something, an attacker sits between two machines, a log shows two addresses talking. If addresses, switches, routers, and packets are fuzzy, those questions turn into guessing. This lesson is the minimum networking you need for everything after it.<\/p>","plain":"","core":"<h3>Two addresses for every device<\/h3>\n<p>Every device on a network has two addresses, and they do different jobs.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Hardware address<\/th>\n<th>IP address<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Full name<\/td>\n<td>Media access control address (written as \"MAC address\")<\/td>\n<td>Internet Protocol address<\/td>\n<\/tr>\n<tr>\n<td>Looks like<\/td>\n<td><code>00:1A:2B:3C:4D:5E<\/code><\/td>\n<td><code>192.168.1.25<\/code> (version 4) or <code>2001:db8::1<\/code> (version 6)<\/td>\n<\/tr>\n<tr>\n<td>Assigned by<\/td>\n<td>The manufacturer of the network card<\/td>\n<td>The network you join<\/td>\n<\/tr>\n<tr>\n<td>Used for<\/td>\n<td>Delivery inside one local network<\/td>\n<td>Delivery between networks<\/td>\n<\/tr>\n<tr>\n<td>Analogy<\/td>\n<td>A person's name inside a building<\/td>\n<td>The building's street address<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Some IPv4 ranges are <strong>private<\/strong>, meaning they are reused inside organizations and never appear on the public internet: anything starting <code>10.<\/code>, <code>172.16.<\/code> through <code>172.31.<\/code>, or <code>192.168.<\/code>. When a log shows <code>10.4.2.7<\/code> talking to <code>203.0.113.50<\/code>, the first is an internal machine and the second is outside.<\/p>\n<p>An address is often written with a slash, such as <code>10.4.2.0/24<\/code>. The number after the slash says how much of the address names the network. <code>/24<\/code> means the first three numbers are the network and the last number is the device, so <code>10.4.2.0/24<\/code> is the 254 usable addresses from <code>10.4.2.1<\/code> to <code>10.4.2.254<\/code>. You will not be asked to calculate subnets on this exam, but firewall rules are written this way.<\/p>\n<h3>The devices in the middle<\/h3>\n<table>\n<thead>\n<tr>\n<th>Device<\/th>\n<th>What it does<\/th>\n<th>Works with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Switch<\/td>\n<td>Connects devices inside one local network and forwards traffic to the right port<\/td>\n<td>Hardware addresses<\/td>\n<\/tr>\n<tr>\n<td>Router<\/td>\n<td>Connects different networks and chooses the path between them<\/td>\n<td>IP addresses<\/td>\n<\/tr>\n<tr>\n<td>Wireless AP<\/td>\n<td>Lets Wi-Fi devices join the wired network<\/td>\n<td>Hardware addresses<\/td>\n<\/tr>\n<tr>\n<td>Firewall<\/td>\n<td>Allows or blocks traffic according to rules<\/td>\n<td>IP addresses, ports, and sometimes content<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A <strong>LAN<\/strong> is one local network, such as an office floor. A <strong>VLAN<\/strong> is a switch feature that splits one physical network into several separate logical ones, so the guest Wi-Fi and the payroll servers can share hardware without being able to reach each other. That idea, <strong>segmentation<\/strong>, returns constantly in this course.<\/p>\n<h3>Packets, TCP, and UDP<\/h3>\n<p>Data crosses a network in small pieces called packets. Each packet carries a source address, a destination address, and a port number that says which service on the destination it is for.<\/p>\n<p>Two transport methods carry almost everything:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>TCP<\/th>\n<th>UDP<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Style<\/td>\n<td>Sets up a connection first, confirms delivery, resends what is lost<\/td>\n<td>Just sends; no setup, no confirmation<\/td>\n<\/tr>\n<tr>\n<td>Trade-off<\/td>\n<td>Reliable but slower<\/td>\n<td>Fast but can lose data<\/td>\n<\/tr>\n<tr>\n<td>Typical use<\/td>\n<td>Web pages, email, file transfer<\/td>\n<td>Voice and video calls, DNS lookups, streaming<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>TCP opens every connection with a <strong>three-way handshake<\/strong>: the client sends SYN, the server answers SYN-ACK, the client replies ACK. Several attacks and log patterns you will meet later are built on that handshake.<\/p>\n<h3>Layers<\/h3>\n<p>Networking is described in layers, each with one job. The exam uses the layer numbers of the OSI model as shorthand, mostly these four:<\/p>\n<table>\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Name<\/th>\n<th>What lives here<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2<\/td>\n<td>Data link<\/td>\n<td>Hardware addresses, switches<\/td>\n<td>A switch forwarding a frame<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Network<\/td>\n<td>IP addresses, routers<\/td>\n<td>A router choosing a path<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Transport<\/td>\n<td>TCP, UDP, port numbers<\/td>\n<td>A firewall rule for port 443<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Application<\/td>\n<td>The actual service: web, email, DNS<\/td>\n<td>A web request for a page<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"co tip\"><span class=\"k\">Exam tip<\/span><p>When a question says a \"Layer 4\" firewall, read it as \"decides using addresses and ports only\". \"Layer 7\" means \"can read the application content\", such as the web address requested or the commands inside the traffic. That one distinction answers most layer questions on this exam.<\/p><\/div>\n<div class=\"co mem\"><span class=\"k\">Memory hook<\/span><p>Layers 2, 3, 4, 7: <strong>S<\/strong>witch, <strong>R<\/strong>outer, <strong>P<\/strong>orts, <strong>A<\/strong>pplication. Higher number, more understanding of the content, more work per packet.<\/p><\/div>","recall":[["Which address is used inside a local network and which between networks?","The hardware address (media access control address) inside a local network; the IP address between networks."],["What are the three private IPv4 ranges?","10.x.x.x, 172.16.x.x through 172.31.x.x, and 192.168.x.x."],["TCP or UDP: which confirms delivery, and what is the handshake?","TCP. SYN, SYN-ACK, ACK."],["What can a Layer 7 device see that a Layer 4 device cannot?","The application content, such as the web address or commands, not just addresses and ports."]],"checks":[{"q":"A log entry shows 172.20.5.14 connecting to 198.51.100.7. What can be concluded about the first address?","o":["It is a private address belonging to an internal network","It is a public address on the internet","It is a hardware address assigned by the manufacturer","It is a loopback address that never leaves the device"],"e":"172.16.0.0 through 172.31.255.255 is one of the three private IPv4 ranges, so 172.20.5.14 is internal. The format (four numbers) rules out a hardware address."},{"q":"An administrator wants guest wireless devices and finance servers to share the same switches without being able to reach each other. Which feature provides this?","o":["VLANs","UDP","A three-way handshake","A larger address range"],"e":"A VLAN splits one physical switched network into separate logical networks. That is segmentation without buying separate hardware."},{"q":"Which statement about TCP and UDP is accurate?","o":["TCP establishes a connection and confirms delivery; UDP sends without confirmation","UDP establishes a connection and confirms delivery; TCP sends without confirmation","Both confirm delivery, but only TCP uses port numbers","Neither uses port numbers; ports belong to the IP layer"],"e":"TCP is connection-oriented and reliable. UDP is connectionless and faster. Both use port numbers."},{"q":"A firewall is described as operating at Layer 4. What information does it use to make decisions?","o":["IP addresses, protocol, and port numbers","The web address and page content requested","The user's identity and group membership","Hardware addresses only"],"e":"Layer 4 is the transport layer: decisions use source and destination address, TCP or UDP, and port. Reading the requested web address needs Layer 7."}],"drill":"<li><b>Acronym Recall:<\/b> 15 items on Easy. Watch for LAN, VLAN, TCP/IP, UDP, NAT, DNS.<\/li><li><b>Glossary:<\/b> look up \"three-way handshake\", \"VLAN\", and \"subnet\".<\/li>","text":" Most exam scenarios happen on a network: a firewall blocks something, an attacker sits between two machines, a log shows two addresses talking. If addresses, switches, routers, and packets are fuzzy, those questions turn into guessing. This lesson is the minimum networking you need for everything after it. Two addresses for every device Every device on a network has two addresses, and they do different jobs. Hardware address IP address Full name Media access control address (written as \"MAC address\") Internet Protocol address Looks like 00:1A:2B:3C:4D:5E 192.168.1.25 (version 4) or 2001:db8::1 (version 6) Assigned by The manufacturer of the network card The network you join Used for Delivery inside one local network Delivery between networks Analogy A person's name inside a building The building's street address Some IPv4 ranges are private , meaning they are reused inside organizations and never appear on the public internet: anything starting 10. , 172.16. through 172.31. , or 192.168. . When a log shows 10.4.2.7 talking to 203.0.113.50 , the first is an internal machine and the second is outside. An address is often written with a slash, such as 10.4.2.0/24 . The number after the slash says how much of the address names the network. /24 means the first three numbers are the network and the last number is the device, so 10.4.2.0/24 is the 254 usable addresses from 10.4.2.1 to 10.4.2.254 . You will not be asked to calculate subnets on this exam, but firewall rules are written this way. The devices in the middle Device What it does Works with Switch Connects devices inside one local network and forwards traffic to the right port Hardware addresses Router Connects different networks and chooses the path between them IP addresses Wireless AP Lets Wi-Fi devices join the wired network Hardware addresses Firewall Allows or blocks traffic according to rules IP addresses, ports, and sometimes content A LAN is one local network, such as an office floor. A VLAN is a switch feature that splits one physical network into several separate logical ones, so the guest Wi-Fi and the payroll servers can share hardware without being able to reach each other. That idea, segmentation , returns constantly in this course. Packets, TCP, and UDP Data crosses a network in small pieces called packets. Each packet carries a source address, a destination address, and a port number that says which service on the destination it is for. Two transport methods carry almost everything: TCP UDP Style Sets up a connection first, confirms delivery, resends what is lost Just sends; no setup, no confirmation Trade-off Reliable but slower Fast but can lose data Typical use Web pages, email, file transfer Voice and video calls, DNS lookups, streaming TCP opens every connection with a three-way handshake : the client sends SYN, the server answers SYN-ACK, the client replies ACK. Several attacks and log patterns you will meet later are built on that handshake. Layers Networking is described in layers, each with one job. The exam uses the layer numbers of the OSI model as shorthand, mostly these four: Layer Name What lives here Example 2 Data link Hardware addresses, switches A switch forwarding a frame 3 Network IP addresses, routers A router choosing a path 4 Transport TCP, UDP, port numbers A firewall rule for port 443 7 Application The actual service: web, email, DNS A web request for a page Exam tip When a question says a \"Layer 4\" firewall, read it as \"decides using addresses and ports only\". \"Layer 7\" means \"can read the application content\", such as the web address requested or the commands inside the traffic. That one distinction answers most layer questions on this exam. Memory hook Layers 2, 3, 4, 7: S witch, R outer, P orts, A pplication. Higher number, more understanding of the content, more work per packet. "},"F2":{"id":"F2","obj":"","min":20,"title":"Ports, protocols, and their secure replacements","kw":[],"why":"<p>The exam expects you to recognize common services by port number and to know which protocols send data unprotected and what replaces them. Firewall-rule questions, log questions, and \"which protocol should the administrator use\" questions all depend on this table. It is one of the few places where plain memorization pays off directly.<\/p>","plain":"","core":"<h3>What a port is<\/h3>\n<p>An IP address gets a packet to the right machine. A <strong>port number<\/strong> gets it to the right service on that machine. One server can run a website on port 443 and accept remote administration on port 22 at the same time. Think of the IP address as the building and the port as the numbered door.<\/p>\n<p>A <strong>protocol<\/strong> is the agreed set of rules for one kind of conversation. HTTP is the rule set for requesting web pages. SMTP is the rule set for handing over email.<\/p>\n<h3>The ports to know<\/h3>\n<table>\n<thead>\n<tr>\n<th>Port<\/th>\n<th>Protocol<\/th>\n<th>What it does<\/th>\n<th>Protected?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>20, 21<\/td>\n<td>FTP<\/td>\n<td>File transfer<\/td>\n<td>No. Sends passwords and files in the clear.<\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>SSH<\/td>\n<td>Remote command line; also carries SFTP<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>Telnet<\/td>\n<td>Remote command line<\/td>\n<td>No. Replace with SSH.<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>SMTP<\/td>\n<td>Sending email between servers<\/td>\n<td>No, by itself<\/td>\n<\/tr>\n<tr>\n<td>53<\/td>\n<td>DNS<\/td>\n<td>Turns names into IP addresses<\/td>\n<td>No, by itself<\/td>\n<\/tr>\n<tr>\n<td>67, 68<\/td>\n<td>DHCP<\/td>\n<td>Hands out IP addresses automatically<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>80<\/td>\n<td>HTTP<\/td>\n<td>Web pages<\/td>\n<td>No. Replace with HTTPS.<\/td>\n<\/tr>\n<tr>\n<td>110<\/td>\n<td>POP3<\/td>\n<td>Downloading email<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>143<\/td>\n<td>IMAP<\/td>\n<td>Reading email kept on the server<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>161, 162<\/td>\n<td>SNMP<\/td>\n<td>Monitoring network devices; 162 is for traps (alerts)<\/td>\n<td>Only version 3<\/td>\n<\/tr>\n<tr>\n<td>389<\/td>\n<td>LDAP<\/td>\n<td>Directory lookups (users, groups)<\/td>\n<td>No. Replace with LDAPS.<\/td>\n<\/tr>\n<tr>\n<td>443<\/td>\n<td>HTTPS<\/td>\n<td>Web pages over TLS<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>445<\/td>\n<td>SMB<\/td>\n<td>Windows file sharing<\/td>\n<td>Depends on version<\/td>\n<\/tr>\n<tr>\n<td>587<\/td>\n<td>SMTP submission<\/td>\n<td>Sending mail from a client, with TLS<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>636<\/td>\n<td>LDAPS<\/td>\n<td>LDAP over TLS<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>993<\/td>\n<td>IMAPS<\/td>\n<td>IMAP over TLS<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>995<\/td>\n<td>POP3S<\/td>\n<td>POP3 over TLS<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>1812, 1813<\/td>\n<td>RADIUS<\/td>\n<td>Central authentication for network access<\/td>\n<td>Partly<\/td>\n<\/tr>\n<tr>\n<td>3389<\/td>\n<td>RDP<\/td>\n<td>Windows remote desktop<\/td>\n<td>Yes, but a favorite target<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"co mem\"><span class=\"k\">Memory hook<\/span><p>Learn them in insecure/secure pairs, because that is how they are asked: 23 → 22, 80 → 443, 21 → 22 (SFTP), 389 → 636, 143 → 993, 110 → 995.<\/p><\/div>\n<h3>Insecure and secure versions<\/h3>\n<table>\n<thead>\n<tr>\n<th>If you see this<\/th>\n<th>Use this instead<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Telnet<\/td>\n<td>SSH<\/td>\n<td>SSH encrypts the session<\/td>\n<\/tr>\n<tr>\n<td>HTTP<\/td>\n<td>HTTPS<\/td>\n<td>Adds TLS<\/td>\n<\/tr>\n<tr>\n<td>FTP<\/td>\n<td>SFTP or FTPS<\/td>\n<td>SFTP runs inside SSH (port 22); FTPS is FTP wrapped in TLS<\/td>\n<\/tr>\n<tr>\n<td>LDAP<\/td>\n<td>LDAPS<\/td>\n<td>Adds TLS<\/td>\n<\/tr>\n<tr>\n<td>SNMP version 1 or 2<\/td>\n<td>SNMP version 3<\/td>\n<td>Version 3 adds authentication and encryption<\/td>\n<\/tr>\n<tr>\n<td>POP3, IMAP<\/td>\n<td>POP3S, IMAPS<\/td>\n<td>Adds TLS<\/td>\n<\/tr>\n<tr>\n<td>DNS<\/td>\n<td>DNSSEC<\/td>\n<td>Adds signatures so answers cannot be forged. It does not hide the lookup.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p><strong>SFTP and FTPS are different things.<\/strong> SFTP is a file transfer feature of SSH and uses port 22. FTPS is the old FTP protocol with TLS added. If a question says \"over SSH\" or \"port 22\", the answer is SFTP.<\/p><\/div>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p><strong>SSL is the old name; TLS is the current protocol.<\/strong> SSL is broken and retired. When the exam offers both, TLS is the right choice. People still say \"SSL certificate\" out of habit.<\/p><\/div>\n<h3>Reading a firewall rule<\/h3>\n<p>Firewall rules combine everything in this lesson and the last. A rule has a source, a destination, a protocol, a port, and an action:<\/p>\n<pre><code>ALLOW  TCP  from 10.4.2.0/24  to 10.9.0.15  port 443\nDENY   ANY  from any          to any\n<\/code><\/pre>\n<p>Read it as: \"machines on the 10.4.2 network may reach the server 10.9.0.15 on the HTTPS port; everything else is blocked.\" Rules are checked from the top down and the first match wins. A final rule that blocks everything not already allowed is called <strong>implicit deny<\/strong>.<\/p>\n<div class=\"co tip\"><span class=\"k\">Exam tip<\/span><p>When a question asks which rule satisfies a requirement, check all five parts: source, destination, TCP or UDP, port, and action. Wrong options usually get four right and one wrong, often the port or the direction.<\/p><\/div>","recall":[["Give the secure replacement and port for Telnet (23), HTTP (80), and LDAP (389).","SSH on 22, HTTPS on 443, LDAPS on 636."],["What ports do DNS, RDP, and SMTP use?","DNS 53, RDP 3389, SMTP 25 (587 for client submission with TLS)."],["What is the difference between SFTP and FTPS?","SFTP is file transfer inside SSH on port 22. FTPS is FTP wrapped in TLS."],["In what order are firewall rules checked, and what is implicit deny?","Top down, first match wins. Implicit deny blocks anything not explicitly allowed."]],"checks":[{"q":"An administrator must replace Telnet for managing switches with an encrypted alternative. Which port should be opened on the management firewall?","o":["22","23","3389","443"],"e":"SSH replaces Telnet and uses TCP port 22. Port 23 is Telnet itself, 3389 is Windows remote desktop, and 443 is HTTPS."},{"q":"A security analyst sees a workstation sending traffic to an external server on TCP port 3389. Which service is most likely in use?","o":["Remote desktop","Directory lookups","Encrypted web browsing","Email submission"],"e":"3389 is RDP. Outbound RDP to an unknown external host is worth investigating. Directory lookups use 389 or 636, HTTPS 443, mail submission 587."},{"q":"A company must transfer files using a protocol that runs over SSH. Which should be selected?","o":["SFTP","FTPS","FTP","SMB"],"e":"SFTP is the SSH file transfer protocol and uses port 22. FTPS is tempting because it is also secure, but it is FTP with TLS and has nothing to do with SSH."},{"q":"A firewall has these rules in order: (1) DENY TCP any to 10.1.1.5 port 22; (2) ALLOW TCP 10.2.0.0/24 to 10.1.1.5 port 22; (3) DENY ANY any to any. A host at 10.2.0.8 tries to SSH to 10.1.1.5. What happens?","o":["The connection is blocked by rule 1","The connection is allowed by rule 2","The connection is blocked by rule 3","The connection is allowed because no rule names 10.2.0.8"],"e":"Rules are evaluated top down and the first match wins. Rule 1 matches any source going to port 22 on that server, so rule 2 is never reached. The fix is to put the specific allow above the general deny."}],"drill":"<li><b>Flashcards:<\/b> run a 15-card session and watch for port and protocol cards.<\/li><li><b>PBQ Lab:<\/b> you are not expected to pass these yet, but open one firewall-rule PBQ just to see what the format looks like.<\/li><li><b>Glossary:<\/b> look up \"implicit deny\" and \"DNSSEC\".<\/li>","text":" The exam expects you to recognize common services by port number and to know which protocols send data unprotected and what replaces them. Firewall-rule questions, log questions, and \"which protocol should the administrator use\" questions all depend on this table. It is one of the few places where plain memorization pays off directly. What a port is An IP address gets a packet to the right machine. A port number gets it to the right service on that machine. One server can run a website on port 443 and accept remote administration on port 22 at the same time. Think of the IP address as the building and the port as the numbered door. A protocol is the agreed set of rules for one kind of conversation. HTTP is the rule set for requesting web pages. SMTP is the rule set for handing over email. The ports to know Port Protocol What it does Protected? 20, 21 FTP File transfer No. Sends passwords and files in the clear. 22 SSH Remote command line; also carries SFTP Yes 23 Telnet Remote command line No. Replace with SSH. 25 SMTP Sending email between servers No, by itself 53 DNS Turns names into IP addresses No, by itself 67, 68 DHCP Hands out IP addresses automatically No 80 HTTP Web pages No. Replace with HTTPS. 110 POP3 Downloading email No 143 IMAP Reading email kept on the server No 161, 162 SNMP Monitoring network devices; 162 is for traps (alerts) Only version 3 389 LDAP Directory lookups (users, groups) No. Replace with LDAPS. 443 HTTPS Web pages over TLS Yes 445 SMB Windows file sharing Depends on version 587 SMTP submission Sending mail from a client, with TLS Yes 636 LDAPS LDAP over TLS Yes 993 IMAPS IMAP over TLS Yes 995 POP3S POP3 over TLS Yes 1812, 1813 RADIUS Central authentication for network access Partly 3389 RDP Windows remote desktop Yes, but a favorite target Memory hook Learn them in insecure/secure pairs, because that is how they are asked: 23 → 22, 80 → 443, 21 → 22 (SFTP), 389 → 636, 143 → 993, 110 → 995. Insecure and secure versions If you see this Use this instead Why Telnet SSH SSH encrypts the session HTTP HTTPS Adds TLS FTP SFTP or FTPS SFTP runs inside SSH (port 22); FTPS is FTP wrapped in TLS LDAP LDAPS Adds TLS SNMP version 1 or 2 SNMP version 3 Version 3 adds authentication and encryption POP3, IMAP POP3S, IMAPS Adds TLS DNS DNSSEC Adds signatures so answers cannot be forged. It does not hide the lookup. Trap SFTP and FTPS are different things. SFTP is a file transfer feature of SSH and uses port 22. FTPS is the old FTP protocol with TLS added. If a question says \"over SSH\" or \"port 22\", the answer is SFTP. Trap SSL is the old name; TLS is the current protocol. SSL is broken and retired. When the exam offers both, TLS is the right choice. People still say \"SSL certificate\" out of habit. Reading a firewall rule Firewall rules combine everything in this lesson and the last. A rule has a source, a destination, a protocol, a port, and an action: ALLOW TCP from 10.4.2.0/24 to 10.9.0.15 port 443 DENY ANY from any to any Read it as: \"machines on the 10.4.2 network may reach the server 10.9.0.15 on the HTTPS port; everything else is blocked.\" Rules are checked from the top down and the first match wins. A final rule that blocks everything not already allowed is called implicit deny . Exam tip When a question asks which rule satisfies a requirement, check all five parts: source, destination, TCP or UDP, port, and action. Wrong options usually get four right and one wrong, often the port or the direction. "},"F3":{"id":"F3","obj":"","min":15,"title":"Names, addresses, and what happens when you load a web page","kw":[],"why":"<p>A surprising number of attacks target the plumbing that makes the internet convenient: the system that turns names into addresses, the service that hands out addresses, the translation at the edge of the network. Understanding one ordinary web request from start to finish gives you a map that most of Domain 2 hangs on.<\/p>","plain":"","core":"<h3>Four services you use without noticing<\/h3>\n<table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Job<\/th>\n<th>If it is abused<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>DHCP<\/td>\n<td>Gives a device its IP address, gateway, and DNS server when it joins a network<\/td>\n<td>A rogue DHCP server can point victims at an attacker's gateway<\/td>\n<\/tr>\n<tr>\n<td>DNS<\/td>\n<td>Translates a name like <code>example.com<\/code> into an IP address<\/td>\n<td>Forged answers send users to the wrong server<\/td>\n<\/tr>\n<tr>\n<td>NAT<\/td>\n<td>Lets many private addresses share one public address at the network edge<\/td>\n<td>Logs outside the network show only the shared address<\/td>\n<\/tr>\n<tr>\n<td>ARP<\/td>\n<td>Finds the hardware address that goes with a local IP address<\/td>\n<td>Forged replies let an attacker sit between two local machines<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The <strong>default gateway<\/strong> is the router a device uses to reach anything outside its own local network.<\/p>\n<h3>One web request, step by step<\/h3>\n<p>You type <code>https://shop.example.com<\/code> and press Enter.<\/p>\n<ol>\n<li><strong>Name lookup.<\/strong> Your device asks its DNS server for the IP address of <code>shop.example.com<\/code>. The answer comes back, for example <code>203.0.113.20<\/code>.<\/li>\n<li><strong>Local delivery.<\/strong> The destination is outside your network, so your device sends the packet to its default gateway. It uses ARP to find the gateway's hardware address.<\/li>\n<li><strong>Translation.<\/strong> The router at the edge of your network replaces your private address with its public one (NAT) and sends the packet toward the internet.<\/li>\n<li><strong>Connection.<\/strong> Your device and the server complete the TCP three-way handshake on port 443.<\/li>\n<li><strong>Encryption setup.<\/strong> A TLS handshake follows. The server presents a <strong>certificate<\/strong> proving it really is <code>shop.example.com<\/code>, and the two sides agree on encryption keys.<\/li>\n<li><strong>The request.<\/strong> Only now does the browser send the HTTP request for the page, inside the encrypted connection.<\/li>\n<\/ol>\n<p>Each step is something an attacker can interfere with, and each has a defense you will study:<\/p>\n<table>\n<thead>\n<tr>\n<th>Step<\/th>\n<th>Attack you will meet later<\/th>\n<th>Lesson<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>DNS poisoning, typosquatting<\/td>\n<td>2.4, 2.2<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>ARP poisoning, on-path attacks<\/td>\n<td>2.4<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>SYN floods, port scans<\/td>\n<td>2.4<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Certificate problems, downgrade attacks<\/td>\n<td>1.4, 2.4<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Injection, cross-site scripting<\/td>\n<td>2.3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Web terms the exam assumes<\/h3>\n<ul>\n<li><strong>URL:<\/strong> the full web address, such as <code>https://shop.example.com/cart?id=7<\/code>.<\/li>\n<li><strong>Client and server:<\/strong> the client asks, the server answers. Your browser is a client.<\/li>\n<li><strong>Cookie:<\/strong> a small piece of data a site stores in your browser, usually to remember that you are logged in. Steal the cookie and you can often steal the session.<\/li>\n<li><strong>API:<\/strong> a way for one program to ask another for data or actions. Modern apps are mostly programs talking to APIs.<\/li>\n<li><strong>Proxy:<\/strong> a server that makes requests on behalf of others. A forward proxy sits in front of users going out; a reverse proxy sits in front of servers taking requests in.<\/li>\n<\/ul>\n<div class=\"co tip\"><span class=\"k\">Exam tip<\/span><p>When a scenario says users are \"redirected to a fake site even though they typed the correct address\", think DNS. When they typed a slightly wrong address, think typosquatting. When they are on the same local network as the attacker, think ARP poisoning or another on-path attack.<\/p><\/div>","recall":[["What do DHCP, DNS, NAT, and ARP each do?","DHCP hands out IP settings; DNS turns names into IP addresses; NAT lets private addresses share a public one; ARP finds the hardware address for a local IP."],["In an HTTPS connection, which comes first: the TLS handshake or the TCP handshake?","The TCP three-way handshake, then the TLS handshake, then the HTTP request."],["What does the server's certificate prove during the TLS handshake?","That the server really is the name the client asked for, vouched for by a trusted certificate authority."]],"checks":[{"q":"Users type the correct address for their bank but arrive at a fraudulent copy of the site. Their browsers show a different IP address than the bank's real one. Which service was most likely attacked?","o":["DNS","DHCP","NAT","SMTP"],"e":"DNS turns names into addresses. If the name was right but the address was wrong, the name lookup was tampered with. DHCP can deliver a malicious DNS server setting, but the service that gave the wrong answer is DNS."},{"q":"Which protocol does a device use to find the hardware address of another device on its own local network?","o":["ARP","DNS","DHCP","TLS"],"e":"ARP maps a local IP address to a hardware address. Because ARP trusts any reply, forged replies are the basis of ARP poisoning."},{"q":"A web server's logs show hundreds of requests from one public IP address, yet the requests clearly come from many different users at a partner company. What explains this?","o":["The partner's users share one public address through NAT","The partner is using DNSSEC","The users all have the same hardware address","The requests were sent over UDP"],"e":"NAT lets many internal devices share one public address, so outside logs show a single source. This matters in investigations: one address can be many people."}],"drill":"<li><b>Acronym Recall:<\/b> 15 items on Easy.<\/li><li><b>Glossary:<\/b> look up \"default gateway\", \"reverse proxy\", and \"cookie\".<\/li>","text":" A surprising number of attacks target the plumbing that makes the internet convenient: the system that turns names into addresses, the service that hands out addresses, the translation at the edge of the network. Understanding one ordinary web request from start to finish gives you a map that most of Domain 2 hangs on. Four services you use without noticing Service Job If it is abused DHCP Gives a device its IP address, gateway, and DNS server when it joins a network A rogue DHCP server can point victims at an attacker's gateway DNS Translates a name like example.com into an IP address Forged answers send users to the wrong server NAT Lets many private addresses share one public address at the network edge Logs outside the network show only the shared address ARP Finds the hardware address that goes with a local IP address Forged replies let an attacker sit between two local machines The default gateway is the router a device uses to reach anything outside its own local network. One web request, step by step You type https://shop.example.com and press Enter. Name lookup. Your device asks its DNS server for the IP address of shop.example.com . The answer comes back, for example 203.0.113.20 . Local delivery. The destination is outside your network, so your device sends the packet to its default gateway. It uses ARP to find the gateway's hardware address. Translation. The router at the edge of your network replaces your private address with its public one (NAT) and sends the packet toward the internet. Connection. Your device and the server complete the TCP three-way handshake on port 443. Encryption setup. A TLS handshake follows. The server presents a certificate proving it really is shop.example.com , and the two sides agree on encryption keys. The request. Only now does the browser send the HTTP request for the page, inside the encrypted connection. Each step is something an attacker can interfere with, and each has a defense you will study: Step Attack you will meet later Lesson 1 DNS poisoning, typosquatting 2.4, 2.2 2 ARP poisoning, on-path attacks 2.4 4 SYN floods, port scans 2.4 5 Certificate problems, downgrade attacks 1.4, 2.4 6 Injection, cross-site scripting 2.3 Web terms the exam assumes URL: the full web address, such as https://shop.example.com/cart?id=7 . Client and server: the client asks, the server answers. Your browser is a client. Cookie: a small piece of data a site stores in your browser, usually to remember that you are logged in. Steal the cookie and you can often steal the session. API: a way for one program to ask another for data or actions. Modern apps are mostly programs talking to APIs. Proxy: a server that makes requests on behalf of others. A forward proxy sits in front of users going out; a reverse proxy sits in front of servers taking requests in. Exam tip When a scenario says users are \"redirected to a fake site even though they typed the correct address\", think DNS. When they typed a slightly wrong address, think typosquatting. When they are on the same local network as the attacker, think ARP poisoning or another on-path attack. "},"F4":{"id":"F4","obj":"","min":20,"title":"Operating systems, accounts, permissions, and logs","kw":[],"why":"<p>Security work is mostly deciding who may do what on which system, and then reading the record of what happened. The exam's \"given a scenario\" questions show you permission settings and log lines and expect you to read them. This lesson covers the operating system basics those questions assume.<\/p>","plain":"","core":"<h3>What an operating system does<\/h3>\n<p>The operating system (OS) is the software that controls the hardware and runs everything else. Windows, Linux, and macOS run computers and servers; Android and iOS run phones. Its innermost part is the <strong>kernel<\/strong>, which has complete control of the machine. Code that reaches the kernel can hide from everything above it, which is why kernel-level malware is so dangerous.<\/p>\n<p>Under the OS sits <strong>firmware<\/strong>, the low-level software built into the hardware that starts the machine (BIOS, or its modern replacement UEFI).<\/p>\n<p>A <strong>process<\/strong> is a running program. A <strong>service<\/strong> (Windows) or <strong>daemon<\/strong> (Linux) is a process that runs in the background without a user, such as a web server.<\/p>\n<h3>Accounts<\/h3>\n<table>\n<thead>\n<tr>\n<th>Account type<\/th>\n<th>What it is<\/th>\n<th>Why it matters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Standard user<\/td>\n<td>Everyday account with limited rights<\/td>\n<td>Malware that runs as this user is limited too<\/td>\n<\/tr>\n<tr>\n<td>Administrator (Windows) or root (Linux)<\/td>\n<td>Full control of the system<\/td>\n<td>The main target of attackers<\/td>\n<\/tr>\n<tr>\n<td>Service account<\/td>\n<td>Used by software, not a person<\/td>\n<td>Often over-privileged and forgotten<\/td>\n<\/tr>\n<tr>\n<td>Guest or default account<\/td>\n<td>Built in at install time<\/td>\n<td>Should be disabled or have its password changed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Privilege escalation<\/strong> means gaining more rights than you were given, for example going from a standard user to administrator. <strong>Least privilege<\/strong> is the opposite discipline: every account gets only the access its job needs.<\/p>\n<h3>Permissions<\/h3>\n<p>On Linux, every file has three permissions (read, write, execute) for three audiences (the owner, the group, everyone else):<\/p>\n<pre><code>-rwxr-x---  1  dana  finance  payroll.sh\n<\/code><\/pre>\n<p>Read the letters in threes after the first character: owner <code>rwx<\/code> (read, write, execute), group <code>r-x<\/code> (read and execute), others <code>---<\/code> (nothing). So Dana can change and run this file, the finance group can read and run it, and nobody else can touch it.<\/p>\n<p>Windows uses access control lists on files and folders (NTFS permissions) with the same idea: named users or groups are allowed or denied specific actions.<\/p>\n<h3>The command line<\/h3>\n<p>You will see commands in scenarios without being asked to write them. Recognize these:<\/p>\n<table>\n<thead>\n<tr>\n<th>Command<\/th>\n<th>System<\/th>\n<th>What it shows or does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ping<\/code><\/td>\n<td>Both<\/td>\n<td>Tests whether a host answers<\/td>\n<\/tr>\n<tr>\n<td><code>ipconfig<\/code> / <code>ip<\/code> or <code>ifconfig<\/code><\/td>\n<td>Windows / Linux<\/td>\n<td>The device's own network settings<\/td>\n<\/tr>\n<tr>\n<td><code>nslookup<\/code>, <code>dig<\/code><\/td>\n<td>Both / Linux<\/td>\n<td>DNS lookups<\/td>\n<\/tr>\n<tr>\n<td><code>tracert<\/code> / <code>traceroute<\/code><\/td>\n<td>Windows / Linux<\/td>\n<td>The path packets take<\/td>\n<\/tr>\n<tr>\n<td><code>netstat<\/code><\/td>\n<td>Both<\/td>\n<td>Open ports and current connections<\/td>\n<\/tr>\n<tr>\n<td><code>chmod<\/code><\/td>\n<td>Linux<\/td>\n<td>Changes file permissions<\/td>\n<\/tr>\n<tr>\n<td><code>sudo<\/code><\/td>\n<td>Linux<\/td>\n<td>Runs one command with root rights<\/td>\n<\/tr>\n<tr>\n<td><code>ssh<\/code><\/td>\n<td>Both<\/td>\n<td>Opens an encrypted remote session<\/td>\n<\/tr>\n<tr>\n<td><code>grep<\/code><\/td>\n<td>Linux<\/td>\n<td>Searches text, such as logs, for a pattern<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Logs<\/h3>\n<p>A log is a time-stamped record of events. Almost every log line answers the same questions: <strong>when, where, who, what, and the result.<\/strong><\/p>\n<pre><code>2026-03-14 02:17:44  srv-db01  sshd  Failed password for admin from 198.51.100.23 port 51122\n<\/code><\/pre>\n<p>When: 2:17 in the morning. Where: the server srv-db01, its SSH service. Who: someone at an outside address trying the account \"admin\". What and result: a failed password. One line like this is noise. Five hundred in ten minutes from one address is a password attack. The same account failing from fifty addresses is a different attack. Reading the pattern, not the line, is the skill.<\/p>\n<p>Windows records security events in the Event Viewer with numbered event IDs; two worth knowing are <strong>4624<\/strong> (successful logon) and <strong>4625<\/strong> (failed logon). Linux writes text logs under <code>/var/log<\/code>, and network devices send theirs to a central collector using the <strong>syslog<\/strong> format.<\/p>\n<div class=\"co tip\"><span class=\"k\">Exam tip<\/span><p>In any log question, find the timestamp, the source, the destination, and the action before reading the answer choices. Then ask what changed: a new address, an odd hour, a repeated failure followed by a success.<\/p><\/div>","recall":[["What is the kernel, and why does malware want to reach it?","The core of the operating system with full control of the machine. Code running there can hide from everything above it."],["Read this permission string: -rw-r-----","Owner can read and write; group can read; everyone else has no access."],["What five questions does a log line answer?","When, where, who, what, and the result."],["What is privilege escalation?","Gaining more rights than you were assigned, such as moving from standard user to administrator."]],"checks":[{"q":"A file on a Linux server shows the permissions -rwxrw-r--. What can members of the file's group do?","o":["Read and modify the file, but not execute it","Read, modify, and execute the file","Read the file only","Nothing; the group has no access"],"e":"The second set of three characters is the group: rw- means read and write without execute. The first set (rwx) is the owner and the last (r--) is everyone else."},{"q":"An analyst reviews a server log and finds 400 failed logons for the account \"administrator\" from a single external address within five minutes, followed by one successful logon. What does this most likely indicate?","o":["A password attack that succeeded","A user who forgot their password","A misconfigured service account","Normal authentication traffic"],"e":"The volume, the single source, the short time window, and the eventual success together point to an automated password attack that found the password. A forgetful user produces a handful of failures, not hundreds."},{"q":"Which account type is most often left with excessive rights and unchanged passwords because no person logs in with it?","o":["Service account","Standard user account","Guest account","Root account"],"e":"Service accounts run software in the background. Because no one uses them interactively, they are easy to forget, and they are frequently given broad rights to \"make things work\"."}],"drill":"<li><b>Glossary:<\/b> look up \"kernel\", \"syslog\", \"least privilege\", and \"privilege escalation\".<\/li><li><b>Acronym Recall:<\/b> 15 items on Easy.<\/li>","text":" Security work is mostly deciding who may do what on which system, and then reading the record of what happened. The exam's \"given a scenario\" questions show you permission settings and log lines and expect you to read them. This lesson covers the operating system basics those questions assume. What an operating system does The operating system (OS) is the software that controls the hardware and runs everything else. Windows, Linux, and macOS run computers and servers; Android and iOS run phones. Its innermost part is the kernel , which has complete control of the machine. Code that reaches the kernel can hide from everything above it, which is why kernel-level malware is so dangerous. Under the OS sits firmware , the low-level software built into the hardware that starts the machine (BIOS, or its modern replacement UEFI). A process is a running program. A service (Windows) or daemon (Linux) is a process that runs in the background without a user, such as a web server. Accounts Account type What it is Why it matters Standard user Everyday account with limited rights Malware that runs as this user is limited too Administrator (Windows) or root (Linux) Full control of the system The main target of attackers Service account Used by software, not a person Often over-privileged and forgotten Guest or default account Built in at install time Should be disabled or have its password changed Privilege escalation means gaining more rights than you were given, for example going from a standard user to administrator. Least privilege is the opposite discipline: every account gets only the access its job needs. Permissions On Linux, every file has three permissions (read, write, execute) for three audiences (the owner, the group, everyone else): -rwxr-x--- 1 dana finance payroll.sh Read the letters in threes after the first character: owner rwx (read, write, execute), group r-x (read and execute), others --- (nothing). So Dana can change and run this file, the finance group can read and run it, and nobody else can touch it. Windows uses access control lists on files and folders (NTFS permissions) with the same idea: named users or groups are allowed or denied specific actions. The command line You will see commands in scenarios without being asked to write them. Recognize these: Command System What it shows or does ping Both Tests whether a host answers ipconfig / ip or ifconfig Windows / Linux The device's own network settings nslookup , dig Both / Linux DNS lookups tracert / traceroute Windows / Linux The path packets take netstat Both Open ports and current connections chmod Linux Changes file permissions sudo Linux Runs one command with root rights ssh Both Opens an encrypted remote session grep Linux Searches text, such as logs, for a pattern Logs A log is a time-stamped record of events. Almost every log line answers the same questions: when, where, who, what, and the result. 2026-03-14 02:17:44 srv-db01 sshd Failed password for admin from 198.51.100.23 port 51122 When: 2:17 in the morning. Where: the server srv-db01, its SSH service. Who: someone at an outside address trying the account \"admin\". What and result: a failed password. One line like this is noise. Five hundred in ten minutes from one address is a password attack. The same account failing from fifty addresses is a different attack. Reading the pattern, not the line, is the skill. Windows records security events in the Event Viewer with numbered event IDs; two worth knowing are 4624 (successful logon) and 4625 (failed logon). Linux writes text logs under /var/log , and network devices send theirs to a central collector using the syslog format. Exam tip In any log question, find the timestamp, the source, the destination, and the action before reading the answer choices. Then ask what changed: a new address, an odd hour, a repeated failure followed by a success. "},"F5":{"id":"F5","obj":"","min":15,"title":"Virtualization and cloud in plain terms","kw":[],"why":"<p>Most organizations now run on rented, shared computers they never see. The exam treats cloud and virtualization as normal, and Domain 3 builds directly on the vocabulary here. If \"hypervisor\", \"container\", and \"platform as a service\" are already clear, skip ahead.<\/p>","plain":"","core":"<h3>Virtual machines<\/h3>\n<p>A <strong>VM<\/strong> is a complete computer simulated in software: it has its own operating system and believes it has its own hardware. The software that creates and runs virtual machines is the <strong>hypervisor<\/strong>. One physical server (the <strong>host<\/strong>) can run dozens of virtual machines (the <strong>guests<\/strong>), each isolated from the others.<\/p>\n<p>Why this matters for security: the isolation between guests is a security boundary. If it fails, one compromised machine can reach its neighbors. You will meet that failure in Domain 2 as <strong>VM escape<\/strong>.<\/p>\n<p>A <strong>snapshot<\/strong> is a saved copy of a virtual machine's state at one moment, which can be restored later. It is handy before a risky change.<\/p>\n<h3>Containers<\/h3>\n<p>A <strong>container<\/strong> packages one application with everything it needs to run, but shares the host's operating system kernel instead of bringing its own. Containers start in seconds and use far less memory than virtual machines.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Virtual machine<\/th>\n<th>Container<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Includes its own operating system<\/td>\n<td>Yes<\/td>\n<td>No, shares the host's kernel<\/td>\n<\/tr>\n<tr>\n<td>Isolation<\/td>\n<td>Strong<\/td>\n<td>Weaker, because the kernel is shared<\/td>\n<\/tr>\n<tr>\n<td>Size and start time<\/td>\n<td>Large, minutes<\/td>\n<td>Small, seconds<\/td>\n<\/tr>\n<tr>\n<td>Typical use<\/td>\n<td>Running whole servers<\/td>\n<td>Running one application or service<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Cloud<\/h3>\n<p><strong>Cloud computing<\/strong> means renting computing from a provider over the internet and paying for what you use. The company running the data centers is the <strong>CSP<\/strong>.<\/p>\n<p>Three service models describe how much the provider manages for you:<\/p>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>You rent<\/th>\n<th>You still manage<\/th>\n<th>Example use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>IaaS<\/td>\n<td>Virtual machines, storage, networks<\/td>\n<td>Operating system, applications, data<\/td>\n<td>Running your own servers without buying hardware<\/td>\n<\/tr>\n<tr>\n<td>PaaS<\/td>\n<td>A ready platform to run your code<\/td>\n<td>Your application and data<\/td>\n<td>Deploying a web app without managing servers<\/td>\n<\/tr>\n<tr>\n<td>SaaS<\/td>\n<td>A finished application<\/td>\n<td>Your data and user accounts<\/td>\n<td>Web-based email or payroll<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"co mem\"><span class=\"k\">Memory hook<\/span><p>Think of pizza. IaaS: you rent the kitchen and cook everything. PaaS: the dough and oven are ready; you add toppings. SaaS: the pizza is delivered and you just eat it. At every level, <strong>your data and who can access it remain your responsibility<\/strong>.<\/p><\/div>\n<p>Four deployment models describe who shares the environment:<\/p>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Who uses it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Public cloud<\/td>\n<td>Many unrelated customers on shared infrastructure<\/td>\n<\/tr>\n<tr>\n<td>Private cloud<\/td>\n<td>One organization only<\/td>\n<\/tr>\n<tr>\n<td>Hybrid cloud<\/td>\n<td>A mix of on-premises or private with public, connected together<\/td>\n<\/tr>\n<tr>\n<td>Community cloud<\/td>\n<td>Several organizations with a shared need, such as hospitals<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>On-premises<\/strong> means the organization owns and runs the equipment in its own building. <strong>Multi-tenant<\/strong> means several customers share the same underlying hardware, kept apart by software.<\/p>\n<div class=\"co trap\"><span class=\"k\">Trap<\/span><p>Moving to the cloud moves the hardware, not the accountability. A provider securing its data center does not secure your badly configured storage. Most real cloud breaches are customer misconfigurations, and exam questions about cloud responsibility are written to test exactly that.<\/p><\/div>","recall":[["What is a hypervisor?","The software that creates and runs virtual machines on a physical host."],["What is the key difference between a virtual machine and a container?","A virtual machine has its own operating system; a container shares the host's kernel, so it is lighter but less isolated."],["Name the three cloud service models from most customer control to least.","Infrastructure as a service, platform as a service, software as a service."],["In every cloud model, what stays the customer's responsibility?","Their data and who has access to it."]],"checks":[{"q":"A development team wants to deploy its application code without managing operating systems or servers. Which cloud service model fits?","o":["PaaS","IaaS","SaaS","On-premises"],"e":"Platform as a service supplies the runtime and servers; the team supplies code. IaaS would leave them patching operating systems. SaaS is a finished application, not a place to run their own code."},{"q":"Which statement correctly compares containers and virtual machines?","o":["Containers share the host kernel, while each virtual machine runs its own operating system","Virtual machines share the host kernel, while each container runs its own operating system","Both run a full operating system, but containers use more memory","Containers cannot run on cloud platforms"],"e":"Sharing the kernel is what makes containers small and fast, and also what makes their isolation weaker than a virtual machine's."},{"q":"A company stores customer records in a SaaS application. The provider's infrastructure is fully patched, but the company left the records readable by anyone with the link. Who is responsible for the exposure?","o":["The company, because access settings are its job","The provider, because it hosts the application","Both equally, because the cloud is shared","Neither, because SaaS data is public by design"],"e":"In every service model the customer remains responsible for its data and for who can access it. The provider secures the platform; the customer secures how it is used."}],"drill":"<li><b>Glossary:<\/b> look up \"hypervisor\", \"multi-tenant\", and \"hybrid cloud\".<\/li><li><b>Acronym Recall:<\/b> 15 items on Easy. Watch for IaaS, PaaS, SaaS, VM, CSP.<\/li>","text":" Most organizations now run on rented, shared computers they never see. The exam treats cloud and virtualization as normal, and Domain 3 builds directly on the vocabulary here. If \"hypervisor\", \"container\", and \"platform as a service\" are already clear, skip ahead. Virtual machines A VM is a complete computer simulated in software: it has its own operating system and believes it has its own hardware. The software that creates and runs virtual machines is the hypervisor . One physical server (the host ) can

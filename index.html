"SMS":"Text messaging, the delivery channel for smishing and a weak second factor",
"SMTP":"Sends mail between servers on port 25",
"SMTPS":"Sends mail over an encrypted TLS connection",
"SOAP":"XML-based protocol for exchanging structured data between web services",
"SoC":"Single chip integrating processor, memory, and peripherals, common in embedded devices",
"SOC":"The team and facility that monitors and responds to security events around the clock",
"SRTP":"Encrypts and authenticates voice and video streams",
"SSD":"Flash storage that cannot be reliably degaussed and requires crypto-erase or destruction",
"TCP/IP":"The protocol suite underlying nearly all modern network communication",
"TKIP":"Deprecated wireless encryption introduced as a stopgap for WEP",
"TSIG":"Authenticates DNS zone transfers between servers using a shared key",
"UAT":"Testing stage where end users confirm the system meets requirements before release",
"UAV":"Drone, usable for physical reconnaissance and for reaching restricted areas",
"UDP":"Connectionless transport with no handshake, easily spoofed for amplification attacks",
"UTP":"Standard network cabling with no shielding against electromagnetic interference",
"VM":"Virtualized computer instance running on a hypervisor",
"VoIP":"Carries telephone calls over the data network",
"WAP":"The access point wireless clients connect through to reach the network",
"WPA":"The wireless security standard family that replaced WEP",
"XOR":"Bitwise operation forming the mathematical basis of many stream ciphers",
"XSRF":"Alternate abbreviation for cross-site request forgery",
"AI":"Systems that perform tasks needing human-like reasoning; used in security for detection and by attackers for convincing lures",
"API":"The defined interface one program uses to call another; a major attack surface when unauthenticated or over-permissioned",
"AV":"Endpoint software that detects and removes known malware, traditionally by signature matching",
"BASH":"The default Linux command shell; a common target for malicious scripting and post-exploitation activity",
"CAR":"A formal document recording a compliance or audit finding and the remediation committed to fix it",
"CMS":"Platform for publishing website content; a frequent breach entry point when plugins go unpatched",
"CSU":"Telecom hardware terminating a digital circuit between the carrier line and customer equipment",
"DLL":"A shared Windows code library loaded at runtime; abused through DLL injection and hijacking attacks",
"ERP":"Integrated business software covering finance, HR, and supply chain; a high-value target holding regulated data",
"GPU":"Highly parallel processor; used by attackers to accelerate password hash cracking dramatically",
"HTML":"The markup language of web pages; the injection point for cross-site scripting when input is not sanitized",
"IM":"Real-time chat; a message-based threat vector for phishing links and malware delivery",
"IRC":"Legacy chat protocol historically used for botnet command and control channels",
"MaaS":"Outsourced service that watches an organization's systems and alerts on issues",
"ML":"A branch of AI that learns patterns from data; used in behavior analytics and anomaly detection",
"NTFS":"The standard Windows file system, providing per-file permissions, auditing, and encryption support",
"OID":"A globally unique dotted-number identifier used in certificates and SNMP to name objects unambiguously",
"OS":"The software managing hardware and applications; its own vulnerabilities are a named exam category",
"PAT":"Maps many internal addresses to one public address using distinct ports, hiding the internal network",
"ROI":"Financial measure comparing gain against cost; used to justify security spending to leadership",
"SDK":"Vendor-supplied tools and libraries for building on a platform; a supply chain risk if compromised",
"SEH":"Windows mechanism for handling runtime errors; historically abused to hijack execution during overflows",
"SPIM":"Unsolicited bulk messaging delivered over instant messaging rather than email",
"SQL":"The query language for relational databases; the target of injection attacks against unsanitized input",
"URI":"The general identifier for a resource; a URL is the subset that also specifies how to locate it",
"URL":"The full web address of a resource; inspected by web filters and scanned for malicious destinations",
"USB":"Ubiquitous peripheral connector; a removable-device threat vector for malware and data exfiltration",
"VBA":"Microsoft Office scripting language; the engine behind malicious macros in weaponized documents",
"WIDS":"Monitors wireless traffic and alerts on rogue access points and wireless attacks without blocking them",
"XML":"Structured, tag-based data format; the encoding used by SAML assertions and vulnerable to XXE injection"
};

const PBQ = [
{id:1,t:"order",d:4,o:"4.8",g:"incident-response-phases",
 title:"Incident Response Sequence",
 brief:"An analyst confirms ransomware on several hosts. Place the incident response phases in the correct order, first at the top.",
 items:["Preparation","Detection","Analysis","Containment","Eradication","Recovery","Lessons Learned"],
 explain:"Preparation happens before anything occurs. Detection identifies that something is wrong, Analysis determines what and how bad, Containment stops the spread, Eradication removes the threat and closes the entry point, Recovery restores and validates production, and Lessons Learned feeds back into Preparation. The most commonly missed placement is putting Eradication before Containment. You stop the bleeding first."},

{id:2,t:"order",d:4,o:"4.8",g:"order-of-volatility",
 title:"Order of Volatility",
 brief:"You are collecting forensic evidence from a live compromised server. Order these sources from MOST volatile to LEAST volatile.",
 items:["CPU registers and cache","RAM and running processes","Network connections and ARP cache","Temporary file systems and swap","Disk and local storage","Remote logging and archived backups"],
 explain:"Collect what disappears fastest first. Registers and cache are gone in nanoseconds, RAM is lost on power-off, network state changes constantly, temp and swap survive briefly, disk persists, and archives are the most stable of all. Pulling the power before capturing RAM destroys the most valuable evidence in a live intrusion."},

{id:3,t:"match",d:1,o:"1.1",g:"control-categories",
 title:"Classify the Security Controls",
 brief:"Drag each control into the correct CATEGORY. Category answers who or what implements the control.",
 buckets:["Technical","Managerial","Operational","Physical"],
 items:[{x:"Firewall access control list",b:0},{x:"Full-disk encryption",b:0},{x:"Intrusion prevention system",b:0},
        {x:"Risk assessment program",b:1},{x:"Change management policy",b:1},{x:"System security plan",b:1},
        {x:"Security awareness training",b:2},{x:"Incident response drills",b:2},{x:"Guard staffing schedule",b:2},
        {x:"Bollards at the entrance",b:3},{x:"Access control vestibule",b:3},{x:"Badge reader on a server room door",b:3}],
 explain:[["Technical","Implemented by technology itself: ACLs, encryption, IPS."],
          ["Managerial","Administrative and planning oriented, largely paperwork and process design."],
          ["Operational","Carried out by people day to day."],
          ["Physical","Exists in the real world and stops or slows physical access."],
          ["Common trap","Security awareness training is easy to misfile under Managerial. Writing the training policy is managerial, but running the training is operational."]]},

{id:4,t:"match",d:1,o:"1.1",g:"control-types",
 title:"Classify the Control Types",
 brief:"Drag each control into the correct TYPE. Type answers what the control actually does.",
 buckets:["Preventive","Deterrent","Detective","Corrective"],
 items:[{x:"Door lock",b:0},{x:"Application allow list",b:0},{x:"Least privilege permissions",b:0},
        {x:"Warning sign about prosecution",b:1},{x:"Visible security camera dome",b:1},
        {x:"Log review and SIEM alerting",b:2},{x:"File integrity monitoring",b:2},{x:"Motion sensor",b:2},
        {x:"Restoring from backup",b:3},{x:"Patching an exploited vulnerability",b:3}],
 explain:[["Preventive","Stops the action outright."],
          ["Deterrent","Discourages someone who could still proceed anyway."],
          ["Detective","Tells you it happened, after the fact."],
          ["Corrective","Fixes or restores afterward."],
          ["Common trap","A visible camera does double duty in real life, but CompTIA treats the visible dome as deterrent and the recorded footage review as detective. Read what the control is doing in the question, not what device it is."]]},

{id:5,t:"match",d:3,o:"3.1",g:"cloud-responsibility",
 title:"Cloud Shared Responsibility",
 brief:"For each item, drag it to the LOWEST service model at which the CUSTOMER is still responsible for it. If the customer owns it in all three, place it under IaaS.",
 buckets:["Customer owns in IaaS only","Customer owns in IaaS and PaaS","Customer owns in all three"],
 items:[{x:"Guest operating system patching",b:0},{x:"Host-based firewall configuration",b:0},{x:"Runtime and middleware",b:0},
        {x:"Application code and dependencies",b:1},{x:"Application-level secrets",b:1},
        {x:"Data classification and content",b:2},{x:"User accounts and access permissions",b:2},{x:"Identity federation configuration",b:2}],
 explain:[["IaaS only","The customer owns the OS and everything above it, in addition to data and identity."],
          ["IaaS and PaaS","The provider takes the OS and runtime in PaaS, leaving the customer their code and data."],
          ["All three","Data classification and identity/access never transfer to the provider at any tier. That is the single most testable fact in the shared responsibility model."]]},

{id:6,t:"match",d:2,o:"2.4",g:"attack-identification",
 title:"Identify the Attack",
 brief:"Drag each observed behavior onto the attack it indicates.",
 buckets:["Password spraying","Credential stuffing","On-path attack","Amplified DDoS"],
 items:[{x:"One common password tried against 3,000 accounts, weekly, no lockouts",b:0},
        {x:"Attacker stays under the lockout threshold deliberately",b:0},
        {x:"Username and password pairs from an unrelated breach replayed here",b:1},
        {x:"High success rate on accounts that reuse credentials",b:1},
        {x:"Gratuitous ARP replies mapping the gateway IP to an unknown MAC",b:2},
        {x:"A workstation begins receiving traffic destined for the router",b:2},
        {x:"Small spoofed DNS queries sent to thousands of open resolvers",b:3},
        {x:"Victim buried under large responses it never requested",b:3}],
 explain:[["Password spraying","Wide and shallow: one common password tried across many accounts, staying under the lockout threshold on purpose."],
          ["Credential stuffing","Replays username/password pairs stolen from an unrelated breach, which is why its success rate is high against accounts that reuse credentials."],
          ["On-path attack","Requires the attacker to sit in the traffic flow. Forged (gratuitous) ARP replies are the classic way onto a flat LAN."],
          ["Amplified DDoS","Uses a protocol where a small spoofed request yields a large response, with reflection putting the victim's address in the source field so they get buried under traffic they never requested."]]},

{id:7,t:"grid",d:4,o:"4.5",g:"firewall-rules",
 title:"Build the Firewall Rule Set",
 brief:"Configure the perimeter firewall to meet the stated requirements. Rules evaluate top down and stop at the first match.",
 pre:"REQUIREMENTS\n1. Public users must reach the web server on HTTPS.\n2. Administrators must NOT reach RDP from the internet.\n3. The web server must query the internal database on TCP 1433.\n4. Nothing else may pass.",
 rows:[
  {label:"Rule 1  ANY -> WEB-SRV  TCP 443",opts:["Permit","Deny"],a:0},
  {label:"Rule 2  ANY -> ANY  TCP 3389",opts:["Permit","Deny"],a:1},
  {label:"Rule 3  WEB-SRV -> DB-SRV  TCP 1433",opts:["Permit","Deny"],a:0},
  {label:"Rule 4  ANY -> ANY  ANY",opts:["Permit","Deny"],a:1}],
 explain:"Requirement 1 needs an explicit permit on 443. Requirement 2 is satisfied by denying 3389 from any source, and exposing RDP to the internet is one of the most exploited misconfigurations there is. Requirement 3 needs a targeted permit from the web tier to the database only, not from anywhere. Requirement 4 is the implicit deny made explicit at the bottom. Note that the deny-all must stay LAST. Moving it to the top would block everything above it."},

{id:8,t:"select",d:4,o:"4.9",g:"log-analysis",
 title:"Log Analysis: Identify the Indicators",
 brief:"Review the authentication log below. Select EVERY line that is an indicator of the attack in progress. Selecting benign lines costs you.",
 pre:"08:14:02  auth  SUCCESS  user=jmoore     src=10.20.4.51    geo=US-VA\n08:14:09  auth  FAILED   user=aandrews   src=203.0.113.77  geo=RU\n08:14:10  auth  FAILED   user=bcastillo  src=203.0.113.77  geo=RU\n08:14:11  auth  FAILED   user=cnguyen    src=203.0.113.77  geo=RU\n08:16:44  auth  SUCCESS  user=jmoore     src=198.51.100.9  geo=RU\n08:17:01  auth  SUCCESS  user=dpatel     src=10.20.4.62    geo=US-VA\n08:19:30  priv  GRANTED  user=jmoore     role=domain_admin src=198.51.100.9\n08:22:15  auth  FAILED   user=dpatel     src=10.20.4.62    geo=US-VA",
 items:["08:14:09 FAILED aandrews from 203.0.113.77",
        "08:14:10 FAILED bcastillo from 203.0.113.77",
        "08:14:11 FAILED cnguyen from 203.0.113.77",
        "08:16:44 SUCCESS jmoore from 198.51.100.9 (RU)",
        "08:17:01 SUCCESS dpatel from 10.20.4.62 (US-VA)",
        "08:19:30 priv GRANTED jmoore role=domain_admin",
        "08:22:15 FAILED dpatel from 10.20.4.62 (US-VA)"],
 correct:[0,1,2,3,5],
 explain:"Three different usernames failing from one foreign address within seconds is password spraying, wide and shallow. The jmoore success at 08:16 is impossible travel: the same account authenticated from Virginia at 08:14 and from Russia two minutes later. The privilege grant at 08:19 from that same foreign address is the escalation and the most serious line in the log. The dpatel lines are benign. A single failed login from an internal address during business hours is a person mistyping their password, and treating it as an indicator is exactly the false positive that causes alert fatigue."},

{id:9,t:"match",d:3,o:"3.3",g:"data-protection-methods",
 title:"Match Protection to Data State",
 brief:"Drag each protection method to the data state it addresses.",
 buckets:["Data at rest","Data in transit","Data in use"],
 items:[{x:"Full-disk encryption",b:0},{x:"Database transparent encryption",b:0},{x:"Self-encrypting drive",b:0},
        {x:"TLS 1.3",b:1},{x:"IPSec tunnel",b:1},{x:"SFTP",b:1},
        {x:"Trusted execution environment",b:2},{x:"Secure enclave",b:2}],
 explain:[["Data at rest","Stored and not being accessed. Protected with disk/database encryption."],
          ["Data in transit","Moving across a network. Protected with TLS, IPSec, SFTP."],
          ["Data in use","Loaded into memory and actively being processed, the state most people forget exists. It's the hardest to protect because the data must be readable to be worked on, which is why it needs hardware isolation (TEE, secure enclave) rather than ordinary encryption."]]},

{id:10,t:"grid",d:4,o:"4.6",g:"access-control-models",
 title:"Assign Least Privilege",
 brief:"A small firm needs access assigned according to least privilege. Choose the MINIMUM access level that still lets each person do their job.",
 rows:[
  {label:"Help desk technician, resets user passwords",opts:["Domain Admin","Delegated password reset rights","Read-only directory access","No access"],a:1},
  {label:"External auditor, reviews configurations for 30 days",opts:["Domain Admin","Local Admin on all servers","Read-only, time-limited account","Standard user"],a:2},
  {label:"Backup service that copies files nightly",opts:["Domain Admin","Interactive admin account","Service account with backup rights only","Shared team account"],a:2},
  {label:"Developer who needs production logs to debug",opts:["Production Domain Admin","Write access to production","Read-only access to the log store","Database owner"],a:2},
  {label:"Departing employee on their final day",opts:["Unchanged access","Disabled account, data retained","Deleted account and data","Elevated for handover"],a:1}],
 explain:"Least privilege means the minimum access needed to perform the function, and nothing beyond it. Delegation exists precisely so help desk staff never need domain admin. Auditors read, they do not change, and their access should expire. Service accounts get scoped rights and should never be interactive. Developers debugging need to read logs, not write to production. For departures, disabling rather than deleting preserves evidence and any data the business still needs, which is why deletion is the wrong answer even though it feels more secure."},

{id:11,t:"match",d:5,o:"5.2",g:"risk-strategies",
 title:"Choose the Risk Strategy",
 brief:"Drag each management decision onto the risk strategy it represents.",
 buckets:["Mitigate","Transfer","Accept","Avoid"],
 items:[{x:"Deploy MFA to reduce account takeover likelihood",b:0},{x:"Segment the network to limit blast radius",b:0},
        {x:"Purchase cyber liability insurance",b:1},{x:"Contractually shift breach liability to the vendor",b:1},
        {x:"Document that the cost of the fix exceeds the loss, take no action",b:2},{x:"Grant a formal, time-bound exception",b:2},
        {x:"Discontinue the legacy service entirely",b:3},{x:"Decline to enter a market with unmanageable regulation",b:3}],
 explain:[["Mitigate","Applies controls to lower likelihood or impact."],
          ["Transfer","Moves the financial consequence to someone else. Insurance is the textbook example."],
          ["Accept","A documented, deliberate decision to live with the risk. The documentation is what separates it from negligence."],
          ["Avoid","Eliminates the activity that creates the risk in the first place."],
          ["Common trap","Transfer and Accept get confused since insurance still leaves you exposed operationally. Ask who absorbs the cost."]]},

{id:12,t:"order",d:1,o:"1.4",g:"cert-lifecycle",
 title:"Certificate Request Flow",
 brief:"Order the steps required to obtain and deploy a TLS certificate for a new web server.",
 items:["Generate a key pair on the server","Create a certificate signing request containing the public key",
        "Registration Authority verifies the requester's identity","Certificate Authority signs and issues the certificate",
        "Install the certificate and chain on the web server","Client validates the chain and checks revocation status"],
 explain:"The private key is generated on the server and never leaves it, which is why key generation comes first. The CSR carries the public key and identifying details to the CA. The Registration Authority handles identity verification on the CA's behalf. Only then does the CA sign. Installation includes the intermediate chain, and a missing intermediate is one of the most common real-world TLS failures. Validation and revocation checking happen on the client side at connection time."},
{id:13,t:"grid",d:4,o:"4.5",g:"firewall-rules",
 title:"Interpret an Existing Firewall Rule Set",
 brief:"The firewall below is already configured with the rules shown. For each traffic flow described, decide whether the firewall allows or blocks it. Rules are evaluated top to bottom, first match wins.",
 pre:"RULE #   SOURCE   DESTINATION      PROTOCOL   PORT   ACTION\n  1        Any      10.5.20.10       TCP        22     Allow\n  2        Any      10.5.20.40       TCP        443    Allow\n  3        Any      10.5.20.40       TCP        3389   Allow\n  4        Any      Any              UDP        53     Allow\n  5        Any      Any              UDP        123    Allow\n  6        Any      Any              ICMP       -      Block\n  7        Any      Any              Any        Any    Block",
 rows:[
  {label:"SSH session to 10.5.20.10",opts:["Allowed","Blocked"],a:0},
  {label:"RDP session to 10.5.20.40",opts:["Allowed","Blocked"],a:0},
  {label:"HTTP (not HTTPS) request to 10.5.20.40",opts:["Allowed","Blocked"],a:1},
  {label:"DNS query to 8.8.8.8",opts:["Allowed","Blocked"],a:0},
  {label:"Ping (ICMP echo) to 10.5.20.10",opts:["Allowed","Blocked"],a:1},
  {label:"NTP sync to an internal time server",opts:["Allowed","Blocked"],a:0}],
 explain:"Rule 1 permits SSH (TCP 22) to the .10 host, so that session is allowed. Rule 3 permits RDP (TCP 3389) to the .40 host, so that's allowed too. HTTP is TCP 80, and only TCP 443 is permitted to .40 by rule 2, so plain HTTP falls through to the implicit deny at rule 7 and is blocked. DNS (UDP 53) and NTP (UDP 123) are both permitted from any source to any destination by rules 4 and 5. ICMP is explicitly blocked by rule 6, which sits before the final catch-all. The skill being tested is reading a rule table as an ordered, first-match list rather than treating every row as independent."},

{id:14,t:"match",d:3,o:"3.2",g:"device-placement",
 title:"Match Network Appliance to Function",
 brief:"Drag each appliance onto the function it actually performs. Some appliances look similar on paper but solve different problems.",
 buckets:["WAF","Load balancer","Jump server","Proxy server","IPS","Sensor"],
 items:[{x:"Blocks SQL injection and XSS payloads aimed at a public web app",b:0},
        {x:"Inspects and filters HTTP request content specifically",b:0},
        {x:"Distributes incoming connections across a pool of identical web servers",b:1},
        {x:"Keeps a single server from being overwhelmed by spreading the load",b:1},
        {x:"Hardened, monitored host that administrators connect through before reaching internal systems",b:2},
        {x:"Concentrates and audits administrative access into one chokepoint",b:2},
        {x:"Caches and filters outbound requests on behalf of internal users",b:3},
        {x:"Sits between users and the internet to enforce acceptable-use policy",b:3},
        {x:"Sits inline and actively drops malicious packets before they arrive",b:4},
        {x:"A passive collector feeding traffic to a monitoring platform",b:5}],
 explain:[["WAF","Purpose-built for web application payloads specifically (SQLi, XSS), narrower than a general firewall."],
          ["Load balancer","Solves an availability and scaling problem, not a security-filtering one."],
          ["Jump server","Exists purely to concentrate and audit administrative access, nothing else."],
          ["Proxy server","Mediates outbound traffic for internal users, the opposite direction from a WAF."],
          ["IPS","Defined by sitting inline and actively blocking."],
          ["Sensor","Passive, only feeds a monitoring platform. This is why the exam separates IPS from sensor even though both watch traffic."]]},

{id:15,t:"match",d:4,o:"4.6",g:"mfa-factors",
 title:"Authentication Factor Recognition",
 brief:"Drag each scenario onto the authentication factor category it demonstrates.",
 buckets:["Something you know","Something you have","Something you are","Somewhere you are"],
 items:[{x:"Typing a PIN into a payment terminal",b:0},{x:"Answering a security question about your first pet",b:0},
        {x:"A hardware token generating a rotating six-digit code",b:1},{x:"A smart card inserted into a reader",b:1},
        {x:"A retina scan at a secure facility entrance",b:2},{x:"Voice pattern matching during a phone banking call",b:2},
        {x:"Access is denied unless the connection originates from the corporate office IP range",b:3},{x:"A login attempt is blocked because it comes from an unexpected country",b:3}],
 explain:[["Something you know","Memorized information: PINs, passwords, security question answers."],
          ["Something you have","A physical possession: a token, a smart card, a phone receiving a code."],
          ["Something you are","A biometric trait inherent to the person."],
          ["Somewhere you are","Geolocation or network-origin based. CompTIA treats this as a distinct attribute rather than a true factor, and it's the one most commonly left out when people list authentication factors from memory."]]},

{id:16,t:"match",d:3,o:"3.2",g:"secure-access",
 title:"Select the Right Security Technology",
 brief:"Drag each scenario onto the technology that best addresses it. Several options look plausible; pick the one that matches the specific requirement stated.",
 buckets:["SASE","802.1X","NGFW","Sandboxing","SD-WAN"],
 items:[{x:"A fully remote workforce needs identity-based policy enforced at the edge instead of backhauled to headquarters",b:0},
        {x:"A device must authenticate before its switch port passes any traffic",b:1},
        {x:"Traffic must be inspected with awareness of which application generated it, not just port and protocol",b:2},
        {x:"A suspicious executable needs to run in isolation to observe its behavior before it touches production",b:3},
        {x:"A retailer with dozens of branch locations wants to manage and prioritize traffic across multiple WAN links centrally",b:4}],
 explain:[["SASE","Converges connectivity and security into a cloud-delivered edge, exactly the model a distributed, identity-first remote workforce needs."],
          ["802.1X","Port-based network access control, the mechanism that gates a switch port on authentication."],
          ["NGFW","Defined by application-aware deep packet inspection, beyond simple port and protocol filtering."],
          ["Sandboxing","Isolates something suspicious to observe its behavior safely."],
          ["SD-WAN","Centrally manages and steers traffic across multiple WAN links. This is a connectivity and cost problem rather than a security-enforcement one, the detail that separates it from SASE."]]},

{id:17,t:"match",d:1,o:"1.4",g:"obfuscation",
 title:"Cryptographic Technique Recognition",
 brief:"Drag each description onto the technique it demonstrates.",
 buckets:["Salting","Key stretching","Masking","Tokenization","Steganography","Digital signature"],
 items:[{x:"A random value is added to a password before hashing so identical passwords produce different hashes",b:0},
        {x:"A hashing algorithm is deliberately slowed down to make brute-force guessing expensive",b:1},
        {x:"A credit card number is displayed as **** **** **** 4412 on a receipt",b:2},
        {x:"A card number is replaced with a surrogate value that is meaningless outside the issuing vault",b:3},
        {x:"A secret message is hidden inside the pixel data of an ordinary-looking image",b:4},
        {x:"A document is signed with a private key so the recipient can verify both origin and integrity",b:5}],
 explain:[["Salting","Defeats precomputed rainbow tables by making every hash unique even for identical inputs."],
          ["Key stretching","PBKDF2, bcrypt, etc. Adds computational cost to slow down guessing."],
          ["Masking","Hides part of a value at display time while the full value may still exist elsewhere."],
          ["Tokenization","Goes further than masking, replacing the value with a surrogate that has no mathematical relationship to the original outside the vault."],
          ["Steganography","Hides data inside unrelated media rather than transforming the data itself."],
          ["Digital signature","The one item here that proves authenticity and integrity together, not just secrecy or transformation."]]},
{id:18,t:"match",d:4,o:"4.5",g:"email-security",
 title:"Email Authentication: SPF, DKIM, DMARC, Gateway",
 brief:"Drag each description onto the email security standard or control it belongs to. These four work together but do different jobs.",
 buckets:["SPF","DKIM","DMARC","Email gateway"],
 items:[{x:"A DNS record listing which mail servers are authorized to send for the domain",b:0},
        {x:"Lets receivers reject mail that claims the domain but arrives from an unlisted server",b:0},
        {x:"Cryptographically signs outgoing messages using the domain's private key",b:1},
        {x:"Receivers verify the message signature against a public key published in DNS",b:1},
        {x:"The policy layer telling receivers whether to reject, quarantine, or accept mail that fails the other checks",b:2},
        {x:"Sends the domain owner aggregate reports about who is sending as their domain",b:2},
        {x:"An inline service that sandboxes attachments and quarantines spam before delivery",b:3},
        {x:"The content inspection chokepoint in front of user mailboxes",b:3}],
 explain:[["SPF","Answers 'which servers may send for this domain' via a DNS record."],
          ["DKIM","Answers 'was this exact message authorized and unaltered' via a signature verified against a DNS public key."],
          ["DMARC","Sits on top of both: pure policy and reporting, telling receivers what to do on failure and telling the domain owner who is spoofing them."],
          ["Email gateway","Different in kind: an inspection appliance filtering content, not an authentication standard."],
          ["Mirror-swap trap","The exam loves swapping SPF and DKIM. Anchor it as SPF = server list, DKIM = message signature, DMARC = policy on failure."]]},
{id:19,t:"grid",d:1,o:"1.2",g:"zero-trust",
 title:"Zero Trust: Control Plane or Data Plane",
 brief:"For each Zero Trust component, decide whether it belongs to the Control Plane (where decisions are made) or the Data Plane (where traffic flows and decisions are enforced).",
 rows:[
  {label:"Adaptive identity",opts:["Control Plane","Data Plane"],a:0},
  {label:"Policy engine",opts:["Control Plane","Data Plane"],a:0},
  {label:"Policy administrator",opts:["Control Plane","Data Plane"],a:0},
  {label:"Threat scope reduction",opts:["Control Plane","Data Plane"],a:0},
  {label:"Policy-driven access control",opts:["Control Plane","Data Plane"],a:0},
  {label:"Implicit trust zones",opts:["Control Plane","Data Plane"],a:1},

/* ================= adaptive pressure ================= */
function limit(){ return TIGHT[Math.max(0,Math.min(4,S.tight))]; }
function adapt(ok){
  S.roll.push(ok?1:0); if(S.roll.length>12) S.roll.shift();
  if(S.roll.length>=8){
    const acc=S.roll.reduce((a,b)=>a+b,0)/S.roll.length;
    if(acc>=.85&&S.tight<4){ S.tight++; S.roll=[]; toast("Pressure up - "+limit()+"s per item"); }
    else if(acc<.6&&S.tight>0){ S.tight--; S.roll=[]; toast("Pressure eased - "+limit()+"s per item"); }
  }
}

/* ================= weighting ================= */
const DCOUNT={};
function domWeight(d){
  let w=DWEIGHT[d];
  const st=S.dom[d];
  if(st.s>=5){ const a=st.c/st.s; w*= 1+(1-a)*1.4; }
  return w/(DCOUNT[d]||1);              // per-question, so bank size cannot skew the blueprint
}
function noteRecent(id){ S.recent=(S.recent||[]).filter(x=>x!==id); S.recent.push(id); if(S.recent.length>45) S.recent.shift(); }
function pick(pool,used){
  let cand=pool.filter(q=>!used.has(q.i));
  if(!cand.length) return null;
  // prefer items not seen in the last 45 draws, so shifts do not replay the same set
  const fresh=cand.filter(q=>(S.recent||[]).indexOf(q.i)<0);
  if(fresh.length>=6) cand=fresh;
  // occasional targeted resurfacing of a past miss, but much lighter than before
  const missed=cand.filter(q=>(S.qStat[q.i]&&S.qStat[q.i].m>0));
  if(missed.length&&Math.random()<.18){ const m=missed[Math.floor(Math.random()*missed.length)]; noteRecent(m.i); return m; }
  const ws=cand.map(q=>{
    let w=domWeight(q.d);
    const pos=(S.recent||[]).indexOf(q.i);
    if(pos>=0) w*=0.12+0.02*pos;              // heavy penalty, easing as it ages out
    w*=0.75+Math.random()*0.5;                 // jitter so ordering is never deterministic
    return w;
  });
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<cand.length;i++){ r-=ws[i]; if(r<=0){ noteRecent(cand[i].i); return cand[i]; } }
  const last=cand[cand.length-1]; noteRecent(last.i); return last;
}

  adapt(ok); save();
  if(!ok&&S.tag[q.g].m>=2&&S.flagged.indexOf(q.g)<0){ S.flagged.push(q.g); return true; }
  return false;
}

function heroJump(ids){
  const els=ids.map(id=>$(id)).filter(Boolean);
  if(!els.length) return;
  if(els[0].getBoundingClientRect){
    const rects=els.map(el=>el.getBoundingClientRect());
    const top=Math.min(...rects.map(r=>r.top));
    const bottom=Math.max(...rects.map(r=>r.bottom));
    const groupH=bottom-top;
    const stripEl=(typeof document!=="undefined"&&document.querySelector)?document.querySelector(".strip"):null;
    const stripH=(stripEl&&stripEl.offsetHeight)?stripEl.offsetHeight:70;
    const vh=(typeof window!=="undefined"&&window.innerHeight)?window.innerHeight:800;
    const avail=vh-stripH;
    const offset = groupH<avail-24 ? stripH+Math.max(12,(avail-groupH)/2) : stripH+14;
    const y=(window.pageYOffset||0)+top-offset;
    if(window.scrollTo) window.scrollTo({top:Math.max(0,y),behavior:"smooth"});
  }
  els.forEach(el=>{
    if(!el.classList) return;
    el.classList.remove("jump-flash"); void el.offsetWidth;
    el.classList.add("jump-flash");
    setTimeout(()=>el.classList.remove("jump-flash"),1750);
  });
}

  <h2 style="margin-top:20px">Shift length</h2>

    <button class="btn pri" onclick="shiftStart(10)">Short - 10 tickets</button>

}
function shiftStart(n){
  AT_SECTION=false; view="shift";
  sess={mode:"shift",n:n,i:0,used:new Set(),correct:0,integrity:100,byDom:{},misses:[],dom:S.shiftDom||0};
  startSess(); nextTicket();
}
function sevFor(){ const r=Math.random(); return r<.22?"p1":(r<.6?"p2":"p3"); }
function nextTicket(){
  checkBreak();
  if(sess.i>=sess.n||sess.integrity<=0) return shiftReport();
  const shiftPool=(sess.mode==="shift"&&sess.dom)?QUESTIONS.filter(x=>x.d===sess.dom):QUESTIONS;
  const q=pick(shiftPool,sess.used);
  if(!q) return shiftReport();
  sess.used.add(q.i); sess.i++; sess.q=q; sess.sev=sevFor(); sess.order=shuffle([0,1,2,3]);
  renderTicket(false);
  runTimer(limit(),()=>answer(-1));
}
function renderTicket(done,chosen){
  if(!done&&window.scrollTo) window.scrollTo(0,0);
  const q=sess.q, sv=sess.sev;
  const im=sess.integrity>60?"on":(sess.integrity>30?"warn":"crit");
  strip("soc watch",sess.integrity,im,"Integrity <b>"+sess.integrity+"%</b> &nbsp; Ticket <b>"+sess.i+"/"+sess.n+"</b>","<b id='clk'>--</b>s");
  const opts=sess.order.map((oi,pos)=>{
    let cls="opt";
    if(done){ if(oi===q.a) cls+=" correct"; else if(oi===chosen) cls+=" wrong"; else cls+=" faded"; }
    return `<button class="${cls}" ${done?"disabled":""} onclick="answer(${oi})">
      <span class="key">${String.fromCharCode(65+pos)}</span><span>${esc(q.c[oi])}</span></button>`;
  }).join("");
  const typeLabel={s:"Scenario",b:"Best answer",m:"Multiple choice",a:"Acronym"}[q.t];
  $("app").innerHTML=`
  <div class="ticket">
    <div class="thead"><span class="sev ${sv}">${sv.toUpperCase()}</span>
      <span>TKT-${String(1000+q.i)}</span><span>Domain ${q.d}.0</span><span>Obj ${q.o}</span><span>${typeLabel}</span></div>
    <div class="tbody"><p class="qtext">${esc(q.q)}</p></div>
    <div class="opts">${opts}</div>
  </div>
  <div id="fb"></div>`;
}
function answer(chosen){
  stopTimer();
  const q=sess.q, ok=chosen===q.a;
  const pat=record(q,ok);
  if(!sess.byDom[q.d]) sess.byDom[q.d]={s:0,c:0};
  sess.byDom[q.d].s++; if(ok) sess.byDom[q.d].c++;
  if(ok){ sess.correct++; sess.integrity=Math.min(100,sess.integrity+2); }
  else{ sess.integrity=Math.max(0,sess.integrity-({p1:14,p2:9,p3:5}[sess.sev])); sess.misses.push(q); }
  renderTicket(true,chosen);
  $("fb").innerHTML=feedback(q,ok,chosen,pat)+
    `<div class="row"><button class="btn pri" id="nx" onclick="nextTicket()">${sess.i>=sess.n||sess.integrity<=0?"End shift":"Next ticket"}</button>
     <button class="btn ghost" onclick="shiftReport()">End early</button></div>`;
  $("nx").focus();
}
function feedback(q,ok,chosen,pat){
  const traps=q.c.map((t,i)=>i===q.a?null:`<li><b>${esc(t)}:</b> ${esc(q.w[i])}</li>`).filter(Boolean).join("");
  return (pat?`<div class="pattern"><b>This is a pattern</b>You have now missed <b>${esc(q.g.replace(/-/g," "))}</b> twice. It is on your weak list and will resurface more often until you clear it.</div>`:"")+
  `<div class="fb ${ok?"ok":"no"}">
    <div class="verdict">${ok?"Resolved":(chosen<0?"Timed out - counted wrong":"Escalated - wrong call")}</div>
    <p><b>${esc(q.c[q.a])}</b></p><p>${esc(q.e)}</p>
    <div class="traps"><div class="th">Why the others pull you</div><ul>${traps}</ul></div>
  </div>`;
}
function shiftReport(){
  stopTimer();
  const p=pct(sess.correct,sess.i);
  S.sessions.push({t:Date.now(),mode:"shift",n:sess.i,pct:p,byDom:sess.byDom}); save();
  const g=gateStatus();
  const bars=Object.keys(sess.byDom).sort().map(d=>{
    const b=sess.byDom[d], v=pct(b.c,b.s);
    return `<div class="dstat"><div class="nm"><span>${d}.0</span>${DNAME[d]}</div>
      <div class="bar"><i class="${v>=85?"":v>=75?"warn":"bad"}" style="width:${v}%"></i></div><div class="pc">${v}%</div></div>`;
  }).join("");
  const missList=sess.misses.length?sess.misses.map(q=>`<li><span>${esc(q.g.replace(/-/g," "))} <span class="dim">(obj ${q.o})</span></span><span class="ct">D${q.d}</span></li>`).join(""):`<li class="dim">Nothing missed. Clean shift.</li>`;
  strip("shift report",p,p>=85?"on":p>=70?"warn":"crit","Score <b>"+p+"%</b>","<b>"+sess.correct+"/"+sess.i+"</b> resolved");
  $("app").innerHTML=`
  <p class="eyebrow">Shift report</p>
  <h1>${sess.integrity<=0?"Shift lost":"Shift complete"} - ${p}%</h1>
  <p class="lede">${sess.integrity<=0?"Integrity hit zero. Review the misses below before the next run.":"Network integrity closed at "+sess.integrity+"%."}</p>
  <div class="card"><h2 style="margin-top:0">Accuracy by domain</h2>${bars}
    <p class="dim" style="font-size:13px;margin:14px 0 0">Gate requires one qualifying exam and one qualifying 45-ticket shift, both 85%+ with no domain under 75%. ${esc(g.label)}.</p></div>
  <h2>Missed concepts</h2><div class="card"><ul class="weaklist">${missList}</ul></div>
  <div class="row" style="margin-top:18px">
    <button class="btn pri" onclick="shiftStart(${sess.n})">Run another shift</button>
    ${sess.misses.length?`<button class="btn" onclick="exportMissesToAI()">Export misses for AI refresher &amp; quiz</button>`:""}
    <button class="btn ghost" onclick="home()">Home</button></div>`;
}

/* ================= RAPID RESPONSE ================= */
function drillStart(){
  AT_SECTION=false; view="drill";
  sess={mode:"drill",used:new Set(),i:0,correct:0,lives:3,streak:0,mult:1,score:0,misses:[],byDom:{}};
  startSess(); nextDrill();
}
function nextDrill(){
  checkBreak();
  if(sess.lives<=0) return drillReport();
  const q=pick(QUESTIONS,sess.used);
  if(!q) return drillReport();
  sess.used.add(q.i); sess.i++; sess.q=q; sess.order=shuffle([0,1,2,3]); sess.t0=Date.now();
  renderDrill(false);
  runTimer(limit(),()=>dAnswer(-1));
}
function renderDrill(done,chosen){
  if(!done&&window.scrollTo) window.scrollTo(0,0);
  const q=sess.q;
  strip("rapid response",Math.min(100,sess.streak*10),sess.mult>=3?"crit":sess.mult>=2?"warn":"on",
    "Score <b>"+sess.score+"</b> &nbsp; x<b>"+sess.mult+"</b>","Lives <b>"+"|".repeat(Math.max(0,sess.lives))+"</b> &nbsp; <b id='clk'>--</b>s");
  const opts=sess.order.map((oi,pos)=>{
    let cls="opt";
    if(done){ if(oi===q.a) cls+=" correct"; else if(oi===chosen) cls+=" wrong"; else cls+=" faded"; }
    return `<button class="${cls}" ${done?"disabled":""} onclick="dAnswer(${oi})">
      <span class="key">${String.fromCharCode(65+pos)}</span><span>${esc(q.c[oi])}</span></button>`;
  }).join("");
  $("app").innerHTML=`
  <div style="display:flex;align-items:baseline;gap:14px;margin:18px 0 10px">
    <span class="combo">x${sess.mult}</span>
    <span class="dim mono" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase">streak ${sess.streak} &nbsp;/&nbsp; item ${sess.i}</span>
  </div>
  <div class="ticket"><div class="thead"><span>Domain ${q.d}.0</span><span>Obj ${q.o}</span></div>
    <div class="tbody"><p class="qtext">${esc(q.q)}</p></div><div class="opts">${opts}</div></div>
  ${done?"":`<div class="row" style="margin-top:14px"><button class="btn ghost sm" onclick="drillReport()">Stop</button></div>`}
  <div id="fb"></div>`;
}
function dAnswer(chosen){
  stopTimer();
  const q=sess.q, ok=chosen===q.a;
  const pat=record(q,ok);
  if(!sess.byDom[q.d]) sess.byDom[q.d]={s:0,c:0};
  sess.byDom[q.d].s++; if(ok) sess.byDom[q.d].c++;
  if(ok){
    sess.correct++; sess.streak++;
    sess.mult = sess.streak>=10?4:sess.streak>=6?3:sess.streak>=3?2:1;
    const secs=(Date.now()-sess.t0)/1000;
    const bonus=Math.max(0,Math.round((limit()-secs)*2));
    sess.score += (100+bonus)*sess.mult;
  } else { sess.lives--; sess.streak=0; sess.mult=1; sess.misses.push(q); }
  renderDrill(true,chosen);
  $("fb").innerHTML=feedback(q,ok,chosen,pat)+
    `<div class="row"><button class="btn pri" id="nx" onclick="nextDrill()">${sess.lives<=0?"See results":"Next"}</button>
     <button class="btn ghost" onclick="drillReport()">Stop</button></div>`;
  $("nx").focus();
}
function drillReport(){
  stopTimer();
  const best=sess.score>S.bestDrill;
  if(best) S.bestDrill=sess.score;
  S.sessions.push({t:Date.now(),mode:"drill",n:sess.i,pct:pct(sess.correct,sess.i),byDom:sess.byDom}); save();
  strip("run complete",100,best?"on":"warn","Score <b>"+sess.score+"</b>","<b>"+sess.correct+"/"+sess.i+"</b> correct");
  const missList=sess.misses.length?sess.misses.map(q=>`<li><span>${esc(q.g.replace(/-/g," "))} <span class="dim">(obj ${q.o})</span></span><span class="ct">D${q.d}</span></li>`).join(""):`<li class="dim">Nothing missed.</li>`;
  $("app").innerHTML=`
  <p class="eyebrow">Run complete</p>
  <h1 class="big" style="color:var(--amber)">${sess.score}</h1>
  <p class="lede">${best?"New best score.":"Best is "+S.bestDrill+"."} ${sess.correct} of ${sess.i} correct at ${pct(sess.correct,sess.i)}%.</p>
  <h2>Missed concepts</h2><div class="card"><ul class="weaklist">${missList}</ul></div>
  <div class="row" style="margin-top:18px"><button class="btn pri" onclick="drillStart()">Run again</button>
    ${sess.misses.length?`<button class="btn" onclick="exportMissesToAI()">Export misses for AI refresher &amp; quiz</button>`:""}
    <button class="btn ghost" onclick="home()">Home</button></div>`;
}

/* ================= TIMER ================= */
function runTimer(secs,onEnd){
  stopTimer(); let left=secs;
  const tickFn=()=>{ const el=$("clk"); if(el){ el.textContent=left; el.parentElement.classList.toggle("hot",left<=10); }
    if(left<=0){ stopTimer(); onEnd(); return; } left--; };
  tickFn(); tickHandle=setInterval(tickFn,1000);
}
function stopTimer(){ if(tickHandle){ clearInterval(tickHandle); tickHandle=null; } }

function cardStart(d,dueOnly){

  const now=Date.now();
  let ids=allCards().filter(c=>(!d||c.d===d)&&(!dueOnly||srsOf(c.id).due<=now)).map(c=>c.id);
  if(!ids.length){ toast("Nothing due in that deck yet"); return; }

function nextCard(){

function renderCard(revealed){
  if(!revealed&&window.scrollTo) window.scrollTo(0,0);
  const c=cardById(sess.ci);
  strip("flashcards",Math.round(sess.done/sess.total*100),"on","Card <b>"+(sess.done+1)+"</b> of <b>"+sess.total+"</b>","Domain <b>"+c.d+".0</b> obj "+c.o);
  $("app").innerHTML=`
  <div class="fc"><div class="front">${esc(c.f)}</div>
    ${revealed?`<div class="back">${esc(c.b)}</div>`:""}</div>
  ${revealed?`<div class="rate">
      <button onclick="rate(0)">Again<small>&lt; 1m</small></button>
      <button onclick="rate(1)">Hard<small>short</small></button>
      <button onclick="rate(2)">Good<small>normal</small></button>
      <button onclick="rate(3)">Easy<small>long</small></button></div>`
    :`<button class="btn pri" id="rv" style="width:100%" onclick="renderCard(true)">Show answer</button>`}
  <div class="row" style="margin-top:16px"><button class="btn ghost sm" onclick="cardReport()">End session</button></div>`;
  if(!revealed&&$("rv")) $("rv").focus();
}
function rate(r){
  const i=sess.ci, s=srsOf(i), D=86400000;
  if(r===0){ s.ease=Math.max(1.3,s.ease-.2); s.iv=0; s.due=Date.now(); sess.again.push(i); }
  else if(r===1){ s.ease=Math.max(1.3,s.ease-.15); s.iv=Math.max(1,(s.iv||1)*1.2); s.due=Date.now()+s.iv*D; }
  else if(r===2){ s.iv=s.iv?s.iv*s.ease:1; s.due=Date.now()+s.iv*D; }
  else { s.ease=s.ease+.15; s.iv=(s.iv||1)*s.ease*1.3; s.due=Date.now()+s.iv*D; }
  s.reps++; S.srs[i]=s; save();
  sess.queue.shift();
  if(r===0) sess.queue.push(i); else sess.done++;
  nextCard();
}
function cardReport(){
  const uniq=[...new Set(sess.again)];
  strip("session complete",100,"on","<b>"+sess.done+"</b> cards cleared","");
  $("app").innerHTML=`

  <p class="lede">${uniq.length?uniq.length+" card"+(uniq.length>1?"s":"")+" needed a second pass. Those are due again soon.":"Nothing needed a second pass."}</p>
  ${uniq.length?`<div class="card"><ul class="weaklist">${uniq.map(i=>`<li><span>${esc(cardById(i).f)}</span><span class="ct">D${cardById(i).d}</span></li>`).join("")}</ul></div>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="exportCards([${uniq.join(",")}])">Export these as flashcards</button></div>`:""}
  <div class="row" style="margin-top:18px"><button class="btn pri" onclick="cardSetup()">Another deck</button>
    <button class="btn ghost" onclick="home()">Home</button></div>`;
}

function srsAcrOf(a){ const s=S.acrStat[a]; const base={s:0,m:0,ease:2.3,iv:0,due:0,reps:0}; return s?Object.assign({},base,s):base; }
function acrDueCount(){ const now=Date.now(); return acrU().filter(a=>srsAcrOf(a.a).due<=now).length; }
function acrSrsUpdate(a,ok){
  const st=srsAcrOf(a), D=86400000;
  st.s++; if(!ok) st.m++;
  if(!ok){ st.ease=Math.max(1.3,st.ease-.2); st.iv=0; st.due=Date.now(); }
  else { st.ease=Math.min(3.2,st.ease+.05); st.iv=st.iv?st.iv*st.ease:1; st.due=Date.now()+st.iv*D; }
  st.reps=(st.reps||0)+1;
  S.acrStat[a]=st;
}

    <button class="tile" style="--accent:var(--violet)" onclick="acrRef()"><span class="tag">Reference</span>

    <button class="btn ghost sm" onclick="content('acr')">Add new acronyms</button></div>`;

function acrStart(kind,dueOnly){ AT_SECTION=false; view="acr"; sess={mode:"acr",kind:"fun",i:0,correct:0,used:new Set(),misses:[],dueOnly:!!dueOnly}; startSess(); nextAcr(); }
function nextAcr(){
  checkBreak();
  if(sess.i>=20) return acrReport();
  let kind="fun";
  let pool=acrU();
  if(sess.dueOnly){ const now=Date.now(); pool=pool.filter(a=>srsAcrOf(a.a).due<=now); }
  const cand=pool.filter(a=>!sess.used.has(a.a));
  if(!cand.length) return acrReport();
  const now=Date.now();
  const due=cand.filter(a=>srsAcrOf(a.a).due<=now);
  const weighted=cand.filter(a=>S.acrStat[a.a]&&S.acrStat[a.a].m>0);
  const target=(due.length&&Math.random()<.5)?due[Math.floor(Math.random()*due.length)]
    :(weighted.length&&Math.random()<.4)?weighted[Math.floor(Math.random()*weighted.length)]
    :cand[Math.floor(Math.random()*cand.length)];
  sess.used.add(target.a); sess.i++;
  let sib=pool.filter(a=>a.g===target.g&&a.a!==target.a);
  if(sib.length<3) sib=sib.concat(pool.filter(a=>a.g!==target.g&&a.a!==target.a&&sib.indexOf(a)<0));
  const wrong=shuffle(sib).slice(0,3);
  const all=shuffle([target].concat(wrong));
  sess.acr={kind:kind,target:target,all:all,ans:all.indexOf(target)};
  renderAcr(false);
  runTimer(kind==="fun"?limit():Math.round(limit()*.6),()=>aAnswer(-1));
}
function renderAcr(done,chosen){
  if(!done&&window.scrollTo) window.scrollTo(0,0);
  const A=sess.acr, k=A.kind;
  const prompt = k==="exp" ? A.target.a : k==="rev" ? A.target.d : A.target.u;
  const label  = k==="exp" ? "What does this stand for" : k==="rev" ? "Which acronym is this" : "Which acronym does this";
  strip("acronym range",Math.round(sess.i/20*100),"on","Item <b>"+sess.i+"</b>/20 &nbsp; <b>"+sess.correct+"</b> correct","<b id='clk'>--</b>s");
  const opts=A.all.map((o,pos)=>{
    let cls="opt";
    if(done){ if(pos===A.ans) cls+=" correct"; else if(pos===chosen) cls+=" wrong"; else cls+=" faded"; }
    const text = k==="exp" ? o.d : o.a;
    return `<button class="${cls}" ${done?"disabled":""} onclick="aAnswer(${pos})">
      <span class="key">${String.fromCharCode(65+pos)}</span><span${k!=="exp"?' class="mono"':''}>${esc(text)}</span></button>`;
  }).join("");
  $("app").innerHTML=`
  <div class="ticket">
    <div class="thead"><span style="color:var(--violet)">${label}</span><span>${A.target.g.toUpperCase()} family</span></div>
    <div class="tbody"><p class="qtext" ${k==="exp"?'style="font-family:var(--mono);font-size:30px;letter-spacing:.02em"':''}>${esc(prompt)}</p></div>
    <div class="opts">${opts}</div></div>
  <div id="fb"></div>`;
}
function aAnswer(chosen){
  stopTimer();
  const A=sess.acr, ok=chosen===A.ans, t=A.target;
  acrSrsUpdate(t.a,ok); if(!ok) sess.misses.push(t);
  if(ok) sess.correct++;
  adapt(ok); save();
  renderAcr(true,chosen);
  const others=A.all.filter((o,i)=>i!==A.ans).map(o=>`<li><b>${esc(o.a)}</b> is ${esc(o.d)}.${o.u?" "+esc(o.u)+".":""}</li>`).join("");
  $("fb").innerHTML=`
  <div class="fb ${ok?"ok":"no"}"><div class="verdict">${ok?"Hit":(chosen<0?"Timed out":"Miss")}</div>
    <p><b class="mono">${esc(t.a)}</b> &mdash; ${esc(t.d)}</p>${t.u?`<p>${esc(t.u)}.</p>`:""}
    <div class="traps"><div class="th">The near neighbours</div><ul>${others}</ul></div></div>
  <div class="row"><button class="btn pri" id="nx" onclick="nextAcr()">${sess.i>=20?"See results":"Next"}</button>
   <button class="btn ghost" onclick="acrReport()">Stop</button></div>`;
  $("nx").focus();
}
function acrReport(){
  stopTimer();

function pbqStart(id){
  RENDER_CB=null; AT_SECTION=false; view="pbq";
  let p;
  if(id===0) p=PBQ[Math.floor(Math.random()*PBQ.length)];
  else if(id===-1){
    const scored=PBQ.map(x=>({x:x,s:S.pbqStat[x.id]?S.pbqStat[x.id].best:-1}));
    scored.sort((a,b)=>a.s-b.s); p=scored[0].x;
  } else p=PBQ.find(x=>x.id===id);
  PICK=null;
  PB={p:p,done:false,score:0};
  if(p.t==="order") PB.seq=shuffle(p.items.map((_,i)=>i));
  if(p.t==="match"){ PB.place={}; p.items.forEach((_,i)=>PB.place[i]=null); PB.pool=shuffle(p.items.map((_,i)=>i)); }
  if(p.t==="grid") PB.sel=p.rows.map(()=>-1);
  if(p.t==="select") PB.on={};
  startSess(); pbqRender();
}
function explainHTML(ex){

function pbqRender(){

    "Domain <b>"+p.d+".0</b> &nbsp; obj <b>"+p.o+"</b>", PB.done?"Score <b>"+PB.score+"%</b>":"<b>In progress</b>");

             :`<button class="btn pri" onclick="pbqGrade()">Submit</button>

function pbqOrder(p){
  return `<div class="pbqlist">${PB.seq.map((it,pos)=>{
    const right=PB.done&&it===pos;
    const wrong=PB.done&&it!==pos;
    return `<div class="pbqitem ${PICK===it?"picked":""} ${right?"correct":""} ${wrong?"wrong":""}" data-zone="p${pos}"
      ${PB.done?"":`onpointerdown="dgStart(event,${it})" onclick="pbqZone('p${pos}')"`}>
      <span class="pos mono">${pos+1}</span><span class="txt">${esc(p.items[it])}</span>
      ${PB.done?"":`<span class="arrows"><button onclick="event.stopPropagation();pbqMove(${pos},-1)" aria-label="Move up">&#9650;</button><button onclick="event.stopPropagation();pbqMove(${pos},1)" aria-label="Move down">&#9660;</button></span>`}
    </div>`;}).join("")}</div>`;
}
function pbqMove(pos,dir){
  const t=pos+dir; if(t<0||t>=PB.seq.length) return;
  const s=PB.seq; [s[pos],s[t]]=[s[t],s[pos]]; PICK=null; rerender();
}
function pbqMatch(p){
  const chip=(i)=>{
    const right=PB.done&&PB.place[i]===p.items[i].b;
    const wrong=PB.done&&PB.place[i]!==p.items[i].b;
    return `<div class="pbqchip ${PICK===i?"picked":""} ${right?"correct":""} ${wrong?"wrong":""}"
      ${PB.done?"":`onpointerdown="dgStart(event,${i})"`}>${esc(p.items[i].x)}${PB.done&&wrong?`<span class="fix">&rarr; ${esc(p.buckets[p.items[i].b])}</span>`:""}</div>`;
  };
  const pool=p.items.map((_,i)=>i).filter(i=>PB.place[i]===null);
  return `
  <div class="pbqpool" data-zone="pool" ${PB.done?"":`onclick="pbqZone('pool')"`}>
    <div class="zlab">Unassigned (${pool.length})</div>
    <div class="chips">${pool.length?pool.map(chip).join(""):`<span class="dim" style="font-size:13px">All items placed.</span>`}</div>
  </div>
  <div class="pbqbuckets">${p.buckets.map((b,bi)=>{
    const inB=p.items.map((_,i)=>i).filter(i=>PB.place[i]===bi);
    return `<div class="pbqbucket" data-zone="b${bi}" ${PB.done?"":`onclick="pbqZone('b${bi}')"`}>
      <div class="zlab">${esc(b)}</div><div class="chips">${inB.map(chip).join("")}</div></div>`;}).join("")}</div>`;
}
function pbqGrid(p){
  return `<div class="card" style="padding:0">${p.rows.map((r,ri)=>{
    const right=PB.done&&PB.sel[ri]===r.a, wrong=PB.done&&PB.sel[ri]!==r.a;
    return `<div style="padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="mono" style="flex:1;min-width:200px;font-size:13px;color:${right?"var(--cyan)":wrong?"var(--red)":"var(--txt)"}">${esc(r.label)}</span>
      <select ${PB.done?"disabled":""} onchange="PB.sel[${ri}]=+this.value"
        style="background:var(--raise);border:1px solid ${right?"var(--cyan)":wrong?"var(--red)":"var(--line)"};color:var(--txt);border-radius:7px;padding:8px 10px;min-width:180px">
        <option value="-1">Choose...</option>
        ${r.opts.map((o,oi)=>`<option value="${oi}" ${PB.sel[ri]===oi?"selected":""}>${esc(o)}</option>`).join("")}
      </select>
      ${PB.done&&wrong?`<span class="mono" style="font-size:12px;color:var(--cyan)">&rarr; ${esc(r.opts[r.a])}</span>`:""}
    </div>`;}).join("")}</div>`;
}
function pbqSelect(p){
  return `<div class="pbqlist">${p.items.map((it,i)=>{
    const on=!!PB.on[i], isC=p.correct.indexOf(i)>=0;
    let cls="";
    if(PB.done) cls = on&&isC ? "correct" : on&&!isC ? "wrong" : !on&&isC ? "missed" : "";
    return `<button class="pbqitem sel ${on?"picked":""} ${cls}" ${PB.done?"disabled":""} onclick="PB.on[${i}]=!PB.on[${i}];rerender()">
      <span class="box">${on?"&#10003;":""}</span><span class="txt mono" style="font-size:13px">${esc(it)}</span>
      ${PB.done&&!on&&isC?`<span class="fix">missed indicator</span>`:""}
      ${PB.done&&on&&!isC?`<span class="fix">benign</span>`:""}</button>`;}).join("")}</div>`;
}
function pbqZone(z){
  if(PB.done||PICK===null) return;
  pbqDrop(PICK,z); PICK=null; rerender();
}
function pbqDrop(id,z){
  const p=PB.p;
  if(p.t==="match"){ PB.place[id] = z==="pool" ? null : +z.slice(1); }
  if(p.t==="order"){
    const to=+z.slice(1), from=PB.seq.indexOf(id);
    if(from<0||to===from) return;
    PB.seq.splice(from,1); PB.seq.splice(to,0,id);
  }
}
function scorePBQ(p,st){
  let got=0,total=0;
  if(p.t==="order"){ total=p.items.length; st.seq.forEach((it,pos)=>{ if(it===pos) got++; }); }
  if(p.t==="match"){ total=p.items.length; p.items.forEach((it,i)=>{ if(st.place[i]===it.b) got++; }); }
  if(p.t==="grid"){ total=p.rows.length; p.rows.forEach((r,i)=>{ if(st.sel[i]===r.a) got++; }); }
  if(p.t==="select"){
    total=p.items.length;
    p.items.forEach((_,i)=>{ const on=!!st.on[i], isC=p.correct.indexOf(i)>=0; if(on===isC) got++; });
  }
  return {got:got,total:total,pct:Math.round(got/total*100)};
}
function pbqGrade(){
  const p=PB.p; const sc=scorePBQ(p,PB);
  PB.score=sc.pct; PB.done=true;
  const st=S.pbqStat[p.id]||{tries:0,best:0,last:0};
  st.tries++; st.last=PB.score; if(PB.score>st.best) st.best=PB.score;
  S.pbqStat[p.id]=st;
  if(!S.tag[p.g]) S.tag[p.g]={s:0,m:0};
  S.tag[p.g].s++; if(PB.score<80) S.tag[p.g].m++;
  S.sessions.push({t:Date.now(),mode:"pbq",n:sc.total,pct:PB.score,byDom:{[p.d]:{s:sc.total,c:sc.got}}});

}
/* ---- unified pointer drag + tap-to-place ---- */
let DG={active:false};
function dgStart(e,id){
  if(e.button&&e.button!==0) return;
  DG={active:true,id:id,el:e.currentTarget,x0:e.clientX,y0:e.clientY,moved:false,ghost:null};
  document.addEventListener("pointermove",dgMove,{passive:false});
  document.addEventListener("pointerup",dgEnd);
  document.addEventListener("pointercancel",dgEnd);
}
function dgMove(e){
  if(!DG.active) return;
  const dx=e.clientX-DG.x0, dy=e.clientY-DG.y0;
  if(!DG.moved && Math.sqrt(dx*dx+dy*dy)>7){
    DG.moved=true;
    const r=DG.el.getBoundingClientRect();
    const g=DG.el.cloneNode(true);
    g.style.cssText="position:fixed;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;margin:0;pointer-events:none;opacity:.92;z-index:999;box-shadow:0 10px 26px rgba(0,0,0,.55)";
    document.body.appendChild(g); DG.ghost=g;
    DG.el.style.opacity=".3";
  }
  if(DG.moved){ e.preventDefault(); if(DG.ghost) DG.ghost.style.transform="translate("+dx+"px,"+dy+"px)"; }
}
function dgEnd(e){
  document.removeEventListener("pointermove",dgMove);
  document.removeEventListener("pointerup",dgEnd);
  document.removeEventListener("pointercancel",dgEnd);
  if(!DG.active) return;
  const moved=DG.moved;
  if(DG.ghost) DG.ghost.remove();
  if(DG.el) DG.el.style.opacity="";
  DG.active=false;
  if(moved){
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const zone=t&&t.closest?t.closest("[data-zone]"):null;
    if(zone){ pbqDrop(DG.id,zone.getAttribute("data-zone")); PICK=null; rerender(); }
    else rerender();
  } else {
    PICK = (PICK===DG.id)?null:DG.id;
    rerender();
  }
}

const EXAM_QUOTA={1:10,2:19,3:16,4:24,5:17};
const EXAM_PBQS={A:[1,3,7,8],B:[2,4,10,6],C:[12,5,13,11],D:[14,16,18,20],E:[15,17,9,19]};
const EXAM_NAMES=["A","B","C","D","E"];
function m32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sShuffle(arr,seed){const r=m32(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
let EXAMS=null;
function buildExams(){
  if(EXAMS) return EXAMS;
  EXAMS={};
  const byDom={};
  [1,2,3,4,5].forEach(d=>byDom[d]=sShuffle(QUESTIONS.filter(q=>q.d===d).map(q=>q.i),4200+d));
  EXAM_NAMES.forEach((nm,k)=>{
    let mcq=[];
    [1,2,3,4,5].forEach(d=>{
      const pool=byDom[d], need=EXAM_QUOTA[d], start=Math.floor(k*pool.length/EXAM_NAMES.length);
      for(let j=0;j<need;j++) mcq.push(pool[(start+j)%pool.length]);
    });
    EXAMS[nm]={pbq:EXAM_PBQS[nm].slice(),mcq:sShuffle(mcq,9000+k)};
  });
  return EXAMS;
}
function qById(i){ return QUESTIONS.find(q=>q.i===i); }

function initPbqStateX(id){
  const p=PBQ.find(x=>x.id===id), st={};

  if(p.t==="match"){ st.place={}; p.items.forEach((_,ix)=>st.place[ix]=null); }
  if(p.t==="grid") st.sel=p.rows.map(()=>-1);
  if(p.t==="select") st.on={};
  return st;
}

function recordExamStat(q,ok){

function examExport(fmt){
  const r=SX.result, nm=SX.exam;
  if(!r){ toast("No exam result to export"); return; }
  const date=new Date();
  const missObj={};
  r.detail.forEach(d=>{
    if(d.t==="q"&&!d.ok){ const q=qById(d.id); missObj[q.o]=(missObj[q.o]||0)+1; }
    if(d.t==="p"&&d.pct<100){ const p=PBQ.find(z=>z.id===d.id); missObj[p.o]=(missObj[p.o]||0)+(d.total-d.got); }
  });
  const plan=Object.keys(missObj).sort((a,b)=>missObj[b]-missObj[a]);
  if(fmt==="json"){
    const items=r.detail.map(d=>{
      if(d.t==="q"){ const q=qById(d.id);
        return {type:"question",domain:q.d,objective:q.o,concept:q.g,question:q.q,
          correctAnswer:q.c[q.a],yourAnswer:d.pick!==undefined?q.c[d.pick]:null,correct:d.ok};
      } else { const p=PBQ.find(z=>z.id===d.id);
        return {type:"pbq",domain:p.d,objective:p.o,concept:p.g,title:p.title,score:d.pct,points:d.got+"/"+d.total};
      }
    });
    const out={exam:nm,date:date.toISOString(),scorePct:r.pct,minutes:r.mins,timeExpired:!!r.expired,
      domainBreakdown:r.byDom,restudyObjectives:plan,items:items};
    dl("exam-"+nm+"-"+date.toISOString().slice(0,10)+".json",JSON.stringify(out,null,2));
  } else {
    const L=[];
    L.push("# CompTIA Security+ SY0-701 - Exam "+nm+" Results");
    L.push("Taken "+date.toISOString().slice(0,10)+" \u00b7 Night Shift trainer");
    L.push("");
    L.push("## Score: "+r.pct+"%"+(r.expired?" (time expired)":""));
    L.push("Time: "+r.mins+" minutes");
    L.push("");
    L.push("## Accuracy by domain");
    [1,2,3,4,5].forEach(d=>{
      const b=r.byDom[d], p2=b.s?Math.round(b.c/b.s*100):0;
      L.push("- Domain "+d+".0 "+DNAME[d]+": "+Math.round(b.c*10)/10+"/"+b.s+" = "+p2+"%");
    });
    L.push("");
    L.push("## Restudy plan, ranked by miss count");
    if(plan.length) plan.forEach(o=>L.push("- Objective "+o+" ("+missObj[o]+" miss"+(missObj[o]>1?"es":"")+"): "+studyLine(o)));
    else L.push("- Nothing missed.");
    L.push("");
    L.push("## Every item");
    r.detail.forEach((d,ix)=>{
      L.push("");
      if(d.t==="q"){
        const q=qById(d.id);
        L.push((ix+1)+". ["+ (d.ok?"CORRECT":(d.pick===undefined?"UNANSWERED":"MISSED")) +"] Domain "+q.d+".0, objective "+q.o+", concept: "+q.g.replace(/-/g," "));
        L.push("   Q: "+q.q);
        L.push("   Correct answer: "+q.c[q.a]);
        if(!d.ok) L.push("   Your answer: "+(d.pick!==undefined?q.c[d.pick]:"(unanswered)"));
        L.push("   Why: "+q.e);
      } else {
        const p=PBQ.find(z=>z.id===d.id);
        L.push((ix+1)+". [PBQ, "+d.pct+"%] Domain "+p.d+".0, objective "+p.o+", concept: "+p.g.replace(/-/g," "));
        L.push("   Title: "+p.title);
        L.push("   Score: "+d.got+"/"+d.total+" points");
      }
    });
    dl("exam-"+nm+"-"+date.toISOString().slice(0,10)+".txt",L.join("\n"));
  }
  toast("Exam "+nm+" results exported");
}
function examExportAll(fmt){
  if(!S.examHist||!Object.keys(S.examHist).length){ toast("No practice exams taken yet"); return; }
  const names=Object.keys(S.examHist).sort();
  const hasDetail=n=>{const h=S.examHist[n]; return h.attempts&&h.attempts.length;};
  if(fmt==="json"){
    const out={generated:new Date().toISOString(),
      exams:names.map(n=>{ const h=S.examHist[n];
        const base={exam:n,attempts:h.tries,bestPct:h.best,lastPct:h.last,lastTaken:h.when?new Date(h.when).toISOString():null};
        if(!hasDetail(n)){ base.note="Taken before detailed export existed \u2014 no per-question data available for this exam."; return base; }
        base.attemptDetail=h.attempts.map(at=>{
          const missObj={};
          at.detail.forEach(d=>{
            if(d.t==="q"&&!d.ok){ const q=qById(d.id); missObj[q.o]=(missObj[q.o]||0)+1; }
            if(d.t==="p"&&d.pct<100){ const p=PBQ.find(z=>z.id===d.id); missObj[p.o]=(missObj[p.o]||0)+(d.total-d.got); }
          });
          const items=at.detail.map(d=>{
            if(d.t==="q"){ const q=qById(d.id);
              return {type:"question",domain:q.d,objective:q.o,concept:q.g,question:q.q,
                correctAnswer:q.c[q.a],yourAnswer:d.pick!==undefined?q.c[d.pick]:null,correct:d.ok,why:q.e};
            } else { const p=PBQ.find(z=>z.id===d.id);
              return {type:"pbq",domain:p.d,objective:p.o,concept:p.g,title:p.title,score:d.pct,points:d.got+"/"+d.total};
            }
          });
          return {when:new Date(at.when).toISOString(),scorePct:at.pct,minutes:at.mins,timeExpired:!!at.expired,
            domainBreakdown:at.byDom,restudyObjectives:Object.keys(missObj).sort((a,b)=>missObj[b]-missObj[a]),items:items};
        });
        return base;
      })};
    dl("exam-history-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(out,null,2));
  } else {
    const L=[];
    L.push("# CompTIA Security+ SY0-701 - Practice Exam History");
    L.push("Generated "+new Date().toISOString().slice(0,10)+" \u00b7 Night Shift trainer");
    L.push("");
    L.push("Full per-question detail is included for every attempt taken after this export feature was added. Attempts from before that only show the aggregate score, noted below.");
    L.push("");
    names.forEach(n=>{
      const h=S.examHist[n];
      L.push("## Exam "+n+" \u2014 "+h.tries+" attempt"+(h.tries>1?"s":"")+", best "+h.best+"%, most recent "+h.last+"%");
      if(!hasDetail(n)){
        L.push("(Taken before detailed export existed \u2014 no per-question data available for this exam.)");
        L.push("");
        return;
      }
      h.attempts.forEach((at,ai)=>{
        const missObj={};
        at.detail.forEach(d=>{
          if(d.t==="q"&&!d.ok){ const q=qById(d.id); missObj[q.o]=(missObj[q.o]||0)+1; }
          if(d.t==="p"&&d.pct<100){ const p=PBQ.find(z=>z.id===d.id); missObj[p.o]=(missObj[p.o]||0)+(d.total-d.got); }
        });
        const plan=Object.keys(missObj).sort((a,b)=>missObj[b]-missObj[a]);
        L.push("");
        L.push("### Attempt "+(ai+1)+" \u2014 "+new Date(at.when).toLocaleDateString()+" \u2014 "+at.pct+"%"+(at.expired?" (time expired)":""));
        L.push("Time: "+at.mins+" minutes");
        L.push("");
        L.push("Accuracy by domain:");
        [1,2,3,4,5].forEach(d=>{
          const b=at.byDom[d], p2=b.s?Math.round(b.c/b.s*100):0;
          L.push("- Domain "+d+".0 "+DNAME[d]+": "+Math.round(b.c*10)/10+"/"+b.s+" = "+p2+"%");
        });
        L.push("");
        L.push("Restudy plan, ranked by miss count:");
        if(plan.length) plan.forEach(o=>L.push("- Objective "+o+" ("+missObj[o]+" miss"+(missObj[o]>1?"es":"")+"): "+studyLine(o)));
        else L.push("- Nothing missed.");
        L.push("");
        L.push("Missed items:");
        const misses=at.detail.filter(d=>(d.t==="q"&&!d.ok)||(d.t==="p"&&d.pct<100));
        if(!misses.length) L.push("- None. Clean run.");
        misses.forEach(d=>{
          if(d.t==="q"){ const q=qById(d.id);
            L.push("- [Domain "+q.d+".0, objective "+q.o+", "+q.g.replace(/-/g," ")+"]");
            L.push("  Q: "+q.q);
            L.push("  Correct answer: "+q.c[q.a]);
            L.push("  Your answer: "+(d.pick!==undefined?q.c[d.pick]:"(unanswered)"));
            L.push("  Why: "+q.e);
          } else { const p=PBQ.find(z=>z.id===d.id);
            L.push("- [PBQ, Domain "+p.d+".0, objective "+p.o+", "+p.g.replace(/-/g," ")+"] "+p.title+" \u2014 "+d.pct+"% ("+d.got+"/"+d.total+")");
          }
        });
      });
      L.push("");
    });
    dl("exam-history-"+new Date().toISOString().slice(0,10)+".txt",L.join("\n"));
  }
  toast("Exam history exported");
}

  `:`
  <div class="card">
    <label style="display:block;margin-bottom:12px"><div class="zlab">Family group (controls which acronyms become distractors)</div>
      <input id="caG" list="knownGroups" type="text" value="custom">

    <p class="dim" style="font-size:12px;margin:8px 0 0">The third part is what makes an acronym drillable, so include it whenever you can.</p>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="parseAcr()">Add acronyms</button></div>
    <div id="caPreview"></div>
  </div>
  <h2>Your added acronyms (${S.customAcr.length})</h2>
  <div class="card">${S.customAcr.length?`<ul class="weaklist">${S.customAcr.map(a=>`<li><span><b class="mono">${esc(a.a)}</b> ${esc(a.d)}</span><button class="btn sm ghost" onclick="delAcr('${a.a.replace(/'/g,"\\'")}')">Remove</button></li>`).join("")}</ul>`:`<p class="dim" style="margin:0">Nothing added yet.</p>`}</div>
  `}
  <div class="row" style="margin-top:18px"><button class="btn ghost sm" onclick="home()">Back to home</button></div>`;

function parseCards(){
  const d=+$("ccD").value, o=($("ccO").value||"").trim()||("D"+d), g=($("ccG").value||"custom").trim().toLowerCase().replace(/\s+/g,"-");
  const lines=$("ccBox").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0;
  lines.forEach(line=>{
    const parts=line.split("||");
    if(parts.length<2){ skipped++; return; }
    const f=parts[0].trim(), b=parts.slice(1).join("||").trim();
    if(!f||!b){ skipped++; return; }
    S.customCards.push({id:100000+(S.cardSeq++),d,o,g,f,b}); added++;
  });
  save();
  $("ccPreview").innerHTML=`<p class="dim" style="margin:12px 0 0;font-size:13px">${added} card${added===1?"":"s"} added.${skipped?" "+skipped+" line"+(skipped===1?"":"s")+" skipped, each line needs a || with text on both sides.":""}</p>`;
  if(added){ $("ccBox").value=""; toast(added+" card"+(added===1?"":"s")+" added"); setTimeout(()=>content("cards"),600); }
}
function parseAcr(){
  const g=($("caG").value||"custom").trim().toLowerCase().replace(/\s+/g,"-");
  const lines=$("caBox").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0,dupes=0;
  const existing=new Set(allAcr().map(a=>a.a.toUpperCase()));
  lines.forEach(line=>{
    const parts=line.split("||");
    if(parts.length<2){ skipped++; return; }
    const a=parts[0].trim(), d=parts[1].trim(), u=(parts[2]||"").trim();
    if(!a||!d){ skipped++; return; }
    if(existing.has(a.toUpperCase())){ dupes++; return; }
    S.customAcr.push({a,d,g,u:u||undefined}); existing.add(a.toUpperCase()); added++;
  });
  save();
  $("caPreview").innerHTML=`<p class="dim" style="margin:12px 0 0;font-size:13px">${added} acronym${added===1?"":"s"} added.${dupes?" "+dupes+" already existed and were skipped.":""}${skipped?" "+skipped+" line"+(skipped===1?"":"s")+" skipped.":""}</p>`;
  if(added){ $("caBox").value=""; toast(added+" acronym"+(added===1?"":"s")+" added"); setTimeout(()=>content("acr"),600); }
}
function delCard(id){ S.customCards=S.customCards.filter(c=>c.id!==id); delete S.srs[id]; save(); content("cards"); }
function delAcr(a){ S.customAcr=S.customAcr.filter(x=>x.a!==a); delete S.acrStat[a]; save(); content("acr"); }

  L.push("");
  L.push("> I just missed these CompTIA Security+ SY0-701 concepts in practice. Give me a short refresher on");
  L.push("> each one, using a real-world analogy where it helps, then quiz me with new scenario-based questions");
  L.push("> on the same concepts, not the exact questions below, so I can prove I actually learned it rather");
  L.push("> than just memorized the answer. Flag anything where the exam answer differs from real-world practice.");

    L.push("");

  L.push("");
  L.push("## Accuracy by domain");

  L.push("## Specific questions missed (up to 25, most-missed first)");
  if(missedQ.length){
    missedQ.forEach((q,n)=>{
      L.push("");
      L.push((n+1)+". [Domain "+q.d+".0, objective "+q.o+", concept: "+q.g.replace(/-/g," ")+"] missed "+S.qStat[q.i].m+"x");
      L.push("   Q: "+q.q);
      L.push("   Correct answer: "+q.c[q.a]);
      L.push("   Why: "+q.e);

  } else L.push("- None.");
  L.push("");
  const missedA=Object.keys(S.acrStat).filter(a=>S.acrStat[a].m>0).sort((a,b)=>S.acrStat[b].m-S.acrStat[a].m);
  L.push("");

      L.push("- "+a+" ("+(o?o.d:"?")+"): missed "+S.acrStat[a].m+" of "+S.acrStat[a].s+(o&&o.u?" - function: "+o.u:"")); });
  } else L.push("- None.");
  L.push("");
  L.push("## Performance-based question scores");
  const attempted=PBQ.filter(p=>S.pbqStat[p.id]);
  if(attempted.length){
    attempted.forEach(p=>{ const st=S.pbqStat[p.id];
      L.push("- "+p.title+" (Domain "+p.d+".0, obj "+p.o+"): best "+st.best+"%, last "+st.last+"%, "+st.tries+" attempt(s)"); });
    const never=PBQ.filter(p=>!S.pbqStat[p.id]);

  const hardCards=allCards().filter(c=>{ const s=S.srs[c.id]; return s&&s.ease<=2.05; });

  L.push("- Flag whenever the exam-correct answer differs from real-world practice.");
  L.push("- Where a concept was missed more than once, treat it as a reasoning gap and not a memory gap.");
  dl("security-plus-coaching-brief-"+new Date().toISOString().slice(0,10)+".md", L.join("\n"));
  toast("Coaching brief downloaded");
}

function restoreIn(){

  if(!raw){ toast("Paste a backup first"); return; }
  let v; try{ v=JSON.parse(raw); }catch(e){ toast("That is not a valid backup file"); return; }
  if(!v||typeof v!=="object"||!v.dom){ toast("That file is missing progress data"); return; }
  if(!confirm("Replace all progress in this browser with the pasted backup?")) return;
  S=Object.assign(S,v);
  for(let d=1;d<=5;d++) if(!S.dom[d]) S.dom[d]={s:0,c:0};
  S.customCards=S.customCards||[]; S.customAcr=S.customAcr||[]; S.recent=S.recent||[]; S.pbqStat=S.pbqStat||{};

}

/* ================= keyboard ================= */
document.addEventListener("keydown",e=>{
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
  if(view==="exam"&&SX&&!SX.submitted){
    const it=SX.items[SX.i];
    if(e.key>="1"&&e.key<="4"&&it.t==="q"){ const oi=SX.orders[it.id][+e.key-1]; SX.answers[it.id]=oi; persistX(); examRender(); }
    else if(e.key==="ArrowRight"&&SX.i<SX.items.length-1){ SX.i++; persistX(); examRender(); }
    else if(e.key==="ArrowLeft"&&SX.i>0){ SX.i--; persistX(); examRender(); }
    else if(e.key==="f"||e.key==="F"){ SX.flags[SX.i]=!SX.flags[SX.i]; persistX(); examRender(); }
    else if(e.key==="Escape") goHome();
    return;
  }
  if(view==="ref"||view==="setup"||view==="review") return;
  if(PB&&!PB.done) return;
  if(e.key>="1"&&e.key<="4"){
    const btns=[...document.querySelectorAll(".opt:not([disabled])")];
    if(btns[+e.key-1]){ e.preventDefault(); btns[+e.key-1].click(); }
  }
  if(e.key==="Enter"||e.key===" "){ const n=$("nx")||$("rv"); if(n&&document.activeElement!==n){ e.preventDefault(); n.click(); } }
  if(e.key==="Escape"&&view!=="home"){ stopTimer(); home(); }
});

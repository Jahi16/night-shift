function pbqOrder(p){
  return `<div class="pbqlist">${PB.seq.map((it,pos)=>{
    const right=PB.done&&it===pos;
    const wrong=PB.done&&it!==pos;
    return `<div class="pbqitem ${PICK===it?"picked":""} ${right?"correct":""} ${wrong?"wrong":""}" data-zone="p${pos}"
      ${PB.done?"":`onpointerdown="dgStart(event,${it})" onclick="pbqZone('p${pos}')"`}>
      <span class="pos mono">${pos+1}</span><span class="txt">${esc(p.items[it])}</span>
      ${PB.done?"":`<span class="arrows"><button onclick="event.stopPropagation();pbqMove(${pos},-1)" aria-label="Move up">&#9650;</button><button onclick="event.stopPropagation();pbqMove(${pos},1)" aria-label="Move down">&#9660;</button></span>`}
    </div>`;}).join("")}</div>`;
}
function pbqMove(pos,dir){
  const t=pos+dir; if(t<0||t>=PB.seq.length) return;
  const s=PB.seq; [s[pos],s[t]]=[s[t],s[pos]]; PICK=null; rerender();
}
function pbqMatch(p){
  const chip=(i)=>{
    const right=PB.done&&PB.place[i]===p.items[i].b;
    const wrong=PB.done&&PB.place[i]!==p.items[i].b;
    return `<div class="pbqchip ${PICK===i?"picked":""} ${right?"correct":""} ${wrong?"wrong":""}"
      ${PB.done?"":`onpointerdown="dgStart(event,${i})"`}>${esc(p.items[i].x)}${PB.done&&wrong?`<span class="fix">&rarr; ${esc(p.buckets[p.items[i].b])}</span>`:""}</div>`;
  };
  const pool=p.items.map((_,i)=>i).filter(i=>PB.place[i]===null);
  return `
  <div class="pbqpool" data-zone="pool" ${PB.done?"":`onclick="pbqZone('pool')"`}>
    <div class="zlab">Unassigned (${pool.length})</div>
    <div class="chips">${pool.length?pool.map(chip).join(""):`<span class="dim" style="font-size:13px">All items placed.</span>`}</div>
  </div>
  <div class="pbqbuckets">${p.buckets.map((b,bi)=>{
    const inB=p.items.map((_,i)=>i).filter(i=>PB.place[i]===bi);
    return `<div class="pbqbucket" data-zone="b${bi}" ${PB.done?"":`onclick="pbqZone('b${bi}')"`}>
      <div class="zlab">${esc(b)}</div><div class="chips">${inB.map(chip).join("")}</div></div>`;}).join("")}</div>`;
}
function pbqGrid(p){
  return `<div class="card" style="padding:0">${p.rows.map((r,ri)=>{
    const right=PB.done&&PB.sel[ri]===r.a, wrong=PB.done&&PB.sel[ri]!==r.a;
    return `<div style="padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="mono" style="flex:1;min-width:200px;font-size:13px;color:${right?"var(--cyan)":wrong?"var(--red)":"var(--txt)"}">${esc(r.label)}</span>
      <select ${PB.done?"disabled":""} onchange="PB.sel[${ri}]=+this.value"
        style="background:var(--raise);border:1px solid ${right?"var(--cyan)":wrong?"var(--red)":"var(--line)"};color:var(--txt);border-radius:7px;padding:8px 10px;min-width:180px">
        <option value="-1">Choose...</option>
        ${r.opts.map((o,oi)=>`<option value="${oi}" ${PB.sel[ri]===oi?"selected":""}>${esc(o)}</option>`).join("")}
      </select>
      ${PB.done&&wrong?`<span class="mono" style="font-size:12px;color:var(--cyan)">&rarr; ${esc(r.opts[r.a])}</span>`:""}
    </div>`;}).join("")}</div>`;
}
function pbqSelect(p){
  return `<div class="pbqlist">${p.items.map((it,i)=>{
    const on=!!PB.on[i], isC=p.correct.indexOf(i)>=0;
    let cls="";
    if(PB.done) cls = on&&isC ? "correct" : on&&!isC ? "wrong" : !on&&isC ? "missed" : "";
    return `<button class="pbqitem sel ${on?"picked":""} ${cls}" ${PB.done?"disabled":""} onclick="PB.on[${i}]=!PB.on[${i}];rerender()">
      <span class="box">${on?"&#10003;":""}</span><span class="txt mono" style="font-size:13px">${esc(it)}</span>
      ${PB.done&&!on&&isC?`<span class="fix">missed indicator</span>`:""}
      ${PB.done&&on&&!isC?`<span class="fix">benign</span>`:""}</button>`;}).join("")}</div>`;
}
function pbqZone(z){
  if(PB.done||PICK===null) return;
  pbqDrop(PICK,z); PICK=null; rerender();
}
function pbqDrop(id,z){
  const p=PB.p;
  if(p.t==="match"){ PB.place[id] = z==="pool" ? null : +z.slice(1); }
  if(p.t==="order"){
    const to=+z.slice(1), from=PB.seq.indexOf(id);
    if(from<0||to===from) return;
    PB.seq.splice(from,1); PB.seq.splice(to,0,id);
  }
}
function scorePBQ(p,st){
  let got=0,total=0;
  if(p.t==="order"){ total=p.items.length; st.seq.forEach((it,pos)=>{ if(it===pos) got++; }); }
  if(p.t==="match"){ total=p.items.length; p.items.forEach((it,i)=>{ if(st.place[i]===it.b) got++; }); }
  if(p.t==="grid"){ total=p.rows.length; p.rows.forEach((r,i)=>{ if(st.sel[i]===r.a) got++; }); }
  if(p.t==="select"){
    total=p.items.length;
    p.items.forEach((_,i)=>{ const on=!!st.on[i], isC=p.correct.indexOf(i)>=0; if(on===isC) got++; });
  }
  return {got:got,total:total,pct:Math.round(got/total*100)};
}
function pbqGrade(){
  const p=PB.p; const sc=scorePBQ(p,PB);
  PB.score=sc.pct; PB.done=true;
  const st=S.pbqStat[p.id]||{tries:0,best:0,last:0};
  st.tries++; st.last=PB.score; if(PB.score>st.best) st.best=PB.score;
  S.pbqStat[p.id]=st;
  if(!S.tag[p.g]) S.tag[p.g]={s:0,m:0};
  S.tag[p.g].s++; if(PB.score<80) S.tag[p.g].m++;
  S.sessions.push({t:Date.now(),mode:"pbq",n:total,pct:PB.score,byDom:{[p.d]:{s:total,c:got}}});
  save(); PICK=null; pbqRender();
}
/* ---- unified pointer drag + tap-to-place ---- */
let DG={active:false};
function dgStart(e,id){
  if(e.button&&e.button!==0) return;
  DG={active:true,id:id,el:e.currentTarget,x0:e.clientX,y0:e.clientY,moved:false,ghost:null};
  document.addEventListener("pointermove",dgMove,{passive:false});
  document.addEventListener("pointerup",dgEnd);
  document.addEventListener("pointercancel",dgEnd);
}
function dgMove(e){
  if(!DG.active) return;
  const dx=e.clientX-DG.x0, dy=e.clientY-DG.y0;
  if(!DG.moved && Math.sqrt(dx*dx+dy*dy)>7){
    DG.moved=true;
    const r=DG.el.getBoundingClientRect();
    const g=DG.el.cloneNode(true);
    g.style.cssText="position:fixed;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;margin:0;pointer-events:none;opacity:.92;z-index:999;box-shadow:0 10px 26px rgba(0,0,0,.55)";
    document.body.appendChild(g); DG.ghost=g;
    DG.el.style.opacity=".3";
  }
  if(DG.moved){ e.preventDefault(); if(DG.ghost) DG.ghost.style.transform="translate("+dx+"px,"+dy+"px)"; }
}
function dgEnd(e){
  document.removeEventListener("pointermove",dgMove);
  document.removeEventListener("pointerup",dgEnd);
  document.removeEventListener("pointercancel",dgEnd);
  if(!DG.active) return;
  const moved=DG.moved;
  if(DG.ghost) DG.ghost.remove();
  if(DG.el) DG.el.style.opacity="";
  DG.active=false;
  if(moved){
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const zone=t&&t.closest?t.closest("[data-zone]"):null;
    if(zone){ pbqDrop(DG.id,zone.getAttribute("data-zone")); PICK=null; rerender(); }
    else rerender();
  } else {
    PICK = (PICK===DG.id)?null:DG.id;
    rerender();
  }
}

const EXAM_QUOTA={1:10,2:19,3:15,4:24,5:17};
const EXAM_PBQS={A:[1,3,7,8,14],B:[2,4,10,6,15],C:[12,5,13,11,17]};
const EXAM_NAMES=["A","B","C"];
function m32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sShuffle(arr,seed){const r=m32(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
let EXAMS=null;
function buildExams(){
  if(EXAMS) return EXAMS;
  EXAMS={};
  const byDom={};
  [1,2,3,4,5].forEach(d=>byDom[d]=sShuffle(QUESTIONS.filter(q=>q.d===d).map(q=>q.i),4200+d));
  EXAM_NAMES.forEach((nm,k)=>{
    let mcq=[];
    [1,2,3,4,5].forEach(d=>{
      const pool=byDom[d], need=EXAM_QUOTA[d], start=Math.floor(k*pool.length/3);
      for(let j=0;j<need;j++) mcq.push(pool[(start+j)%pool.length]);
    });
    EXAMS[nm]={pbq:EXAM_PBQS[nm].slice(),mcq:sShuffle(mcq,9000+k)};
  });
  return EXAMS;
}
function qById(i){ return QUESTIONS.find(q=>q.i===i); }
let SX=null;
function initPbqStateX(id){
  const p=PBQ.find(x=>x.id===id), st={};
  if(p.t==="order") st.seq=shuffle(p.items.map((_,ix)=>ix));
  if(p.t==="match"){ st.place={}; p.items.forEach((_,ix)=>st.place[ix]=null); }
  if(p.t==="grid") st.sel=p.rows.map(()=>-1);
  if(p.t==="select") st.on={};
  return st;
}
function persistX(){ if(SX&&!SX.submitted){ S.activeExam=SX; save(); } }

    return `<li><span><b>Exam ${nm}</b><br><span class="dim" style="font-size:12px">90 items \u00b7 5 PBQs + 85 multiple choice \u00b7 blueprint weighted</span></span>
      <span style="display:flex;gap:10px;align-items:center;flex-shrink:0">${st}

  $("app").innerHTML=`

  <div class="card"><ul class="weaklist">${rows}</ul></div>
  <p class="dim" style="font-size:12px;margin-top:10px">Scoring: multiple choice items are 1 point each, PBQs are 1 point with partial credit. 85%+ is the readiness bar and exam scores count toward the gate. Gibson chapter numbers follow the Get Certified Get Ahead SY0-701 edition.</p>
  <div class="row" style="margin-top:14px"><button class="btn ghost sm" onclick="goHome()">Back to home</button></div>`;
}
function examSetup(nm){
  const act=S.activeExam;
  if(act&&act.exam===nm&&!act.submitted){ examResume(); return; }
  if(act&&!act.submitted&&!confirm("Exam "+act.exam+" is paused mid-attempt. Starting Exam "+nm+" abandons that attempt. Continue?")) return;
  view="setup"; strip("exam "+nm+" setup",0,"on","","");
  $("app").innerHTML=`
  <p class="eyebrow">Exam ${nm}</p><h1>Set the clock</h1>
  <p class="lede">The real exam gives 90 minutes. Go untimed while accuracy is the priority, then move to timed runs as the date closes in. Either way you can hide the clock during the test.</p>
  <div class="tiles">
    <button class="tile" style="--accent:var(--cyan)" onclick="examBegin('${nm}',null)">
      <span class="tag">Relaxed</span><h3>No timer</h3><p>Work at your own pace. Elapsed time is still recorded for reference.</p></button>
    <button class="tile" style="--accent:var(--amber)" onclick="examBegin('${nm}',90)">
      <span class="tag">Real conditions</span><h3>90 minutes</h3><p>Match the actual exam clock.</p></button>
    <button class="tile" style="--accent:var(--violet)" onclick="examCustom('${nm}')">
      <span class="tag">Custom</span><h3>Set your own</h3><p>Any number of minutes, 1 to 600.</p></button>
  </div>
  <div class="row" style="margin-top:16px"><button class="btn ghost sm" onclick="examHome()">Back</button></div>`;
}
function examCustom(nm){
  const v=prompt("Minutes on the clock:","120");
  if(v===null) return;
  const m=parseInt(v,10);
  if(!m||m<1||m>600){ toast("Enter minutes between 1 and 600"); return; }
  examBegin(nm,m);
}
function examBegin(nm,mins){
  const def=buildExams()[nm];
  SX={exam:nm,i:0,answers:{},orders:{},flags:{},pbq:{},submitted:false,startTs:Date.now(),
      timer:mins?{total:mins*60,remain:mins*60,visible:true,expired:false}:null,
      items:def.pbq.map(id=>({t:"p",id:id})).concat(def.mcq.map(id=>({t:"q",id:id})))};
  def.mcq.forEach(id=>SX.orders[id]=shuffle([0,1,2,3]));
  def.pbq.forEach(id=>SX.pbq[id]=initPbqStateX(id));
  persistX();
  view="exam"; RENDER_CB=examRender;
  if(SX.timer) startExamClock();
  examRender();
}
function examResume(){
  SX=S.activeExam;
  view="exam"; RENDER_CB=examRender;
  if(SX.timer&&SX.timer.remain>0&&!SX.timer.expired) startExamClock();
  examRender();
  toast("Resumed \u2014 the clock paused while you were away");
}
function startExamClock(){
  stopTimer();
  tickHandle=setInterval(()=>{
    if(!SX||!SX.timer||SX.submitted){ stopTimer(); return; }
    if(SX.timer.remain>0){
      SX.timer.remain--;
      const el=$("xclk");
      if(el) el.textContent=SX.timer.visible?fmtT(SX.timer.remain):"";
      if(SX.timer.remain%30===0) persistX();
      if(SX.timer.remain===0){ SX.timer.expired=true; stopTimer(); persistX(); toast("Time expired \u2014 keep working or submit"); examRender(); }
    }
  },1000);
}
function fmtT(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }
function pbqUntouchedX(id){
  const p=PBQ.find(x=>x.id===id), st=SX.pbq[id];
  if(!st) return true;
  if(p.t==="match") return p.items.every((_,ix)=>st.place[ix]===null||st.place[ix]===undefined);
  if(p.t==="grid") return st.sel.every(v=>v===-1);
  if(p.t==="select") return !Object.keys(st.on).some(k=>st.on[k]);
  return false;
}
function examRender(){
  if(!SX){ examHome(); return; }
  if(!SX.submitted) persistX();
  const it=SX.items[SX.i];
  const answered=SX.items.filter(x=>x.t==="q"?SX.answers[x.id]!==undefined:!pbqUntouchedX(x.id)).length;
  strip("exam "+SX.exam, Math.round(answered/SX.items.length*100), "on",
    "Item <b>"+(SX.i+1)+"</b> / "+SX.items.length, "Answered <b>"+answered+"</b>");
  const tmr=SX.timer?`<span class="xtimer ${SX.timer.expired?"exp":""}"><span class="mono" id="xclk">${SX.timer.visible?fmtT(SX.timer.remain):""}</span>
    <button class="btn ghost sm" onclick="SX.timer.visible=!SX.timer.visible;persistX();examRender()">${SX.timer.visible?"Hide timer":"Show timer"}</button></span>`:"";
  const head=`<div class="xhead">
    <span class="mono" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)">Exam ${SX.exam} \u00b7 ${it.t==="p"?"Performance-based":"Multiple choice"} \u00b7 ${SX.i+1} of ${SX.items.length}</span>
    <span style="display:flex;gap:8px;align-items:center">${tmr}
    <button class="btn ghost sm ${SX.flags[SX.i]?"flon":""}" onclick="SX.flags[${SX.i}]=!SX.flags[${SX.i}];persistX();examRender()">${SX.flags[SX.i]?"\u2691 Flagged":"\u2690 Flag"}</button></span>
  </div>${SX.timer&&SX.timer.expired?`<div class="fb no" style="margin-bottom:12px"><div class="verdict">Time expired</div><p>You can keep answering for the practice value \u2014 the result will note that time ran out.</p></div>`:""}`;
  let body="";
  if(it.t==="q"){
    PB=null;
    const q=qById(it.id), ord=SX.orders[it.id];
    body=`<h1 style="font-size:19px;line-height:1.5">${esc(q.q)}</h1>
    <div class="opts">${ord.map((oi,pos)=>`<button class="opt ${SX.answers[it.id]===oi?"picked":""}" onclick="SX.answers['${it.id}']=${oi};persistX();examRender()"><span class="key mono">${pos+1}</span> ${esc(q.c[oi])}</button>`).join("")}</div>`;
  } else {
    const p=PBQ.find(x=>x.id===it.id), st=SX.pbq[it.id];
    PB={p:p,done:false,score:0,seq:st.seq,place:st.place,sel:st.sel,on:st.on};
    let inner="";
    if(p.t==="order") inner=pbqOrder(p);
    if(p.t==="match") inner=pbqMatch(p);
    if(p.t==="grid") inner=pbqGrid(p);
    if(p.t==="select") inner=pbqSelect(p);
    body=`<h1 style="font-size:19px">${esc(p.title)}</h1><p class="lede">${esc(p.brief)}</p>
    ${p.pre?`<pre class="pbqpre">${esc(p.pre)}</pre>`:""}${inner}`;
  }
  const pal=`<div class="pal">${SX.items.map((x,ix)=>{
    const done=x.t==="q"?SX.answers[x.id]!==undefined:!pbqUntouchedX(x.id);
    return `<button class="${ix===SX.i?"cur":""} ${SX.flags[ix]?"flg":""} ${done?"done":""}" onclick="SX.i=${ix};examRender()">${ix+1}</button>`;
  }).join("")}</div>`;
  $("app").innerHTML=head+body+`
  <div class="row" style="margin-top:18px">
    <button class="btn" ${SX.i===0?"disabled":""} onclick="SX.i--;examRender()">Prev</button>
    <button class="btn ${SX.i<SX.items.length-1?"pri":""}" ${SX.i===SX.items.length-1?"disabled":""} onclick="SX.i++;examRender()">Next</button>
    <button class="btn ${SX.i===SX.items.length-1?"pri":"ghost"}" onclick="examSubmit()">Submit exam</button>
  </div>
  <h2 style="margin-top:22px">Question map</h2>${pal}
  <p class="dim" style="font-size:11.5px;margin-top:8px">Keys: 1-4 answer \u00b7 arrows move \u00b7 F flag \u00b7 Esc pause and go home</p>`;
}
function recordExamStat(q,ok){
  if(!S.dom[q.d]) S.dom[q.d]={s:0,c:0};
  S.dom[q.d].s++; if(ok) S.dom[q.d].c++;
  if(!S.tag[q.g]) S.tag[q.g]={s:0,m:0};
  S.tag[q.g].s++; if(!ok) S.tag[q.g].m++;
  if(!S.qStat[q.i]) S.qStat[q.i]={s:0,m:0};
  S.qStat[q.i].s++; if(!ok) S.qStat[q.i].m++;
  if(!ok && S.tag[q.g].m>=2 && S.flagged.indexOf(q.g)<0) S.flagged.push(q.g);
}
function examSubmit(){
  const unQ=SX.items.filter(x=>x.t==="q"&&SX.answers[x.id]===undefined).length;
  const unP=SX.items.filter(x=>x.t==="p"&&pbqUntouchedX(x.id)).length;
  const un=unQ+unP;
  if(un>0&&!confirm(un+" item"+(un===1?"":"s")+" unanswered \u2014 they will score zero. Submit anyway?")) return;
  stopTimer();
  let pts=0; const byDom={}; [1,2,3,4,5].forEach(d=>byDom[d]={s:0,c:0});
  const detail=[];
  SX.items.forEach(x=>{
    if(x.t==="q"){
      const q=qById(x.id), pick=SX.answers[x.id], ok=pick===q.a;
      if(ok) pts++;
      byDom[q.d].s++; if(ok) byDom[q.d].c++;
      recordExamStat(q,ok);
      detail.push({t:"q",id:x.id,pick:pick,ok:ok});
    } else {
      const p=PBQ.find(z=>z.id===x.id), st=SX.pbq[x.id], sc=scorePBQ(p,st);
      pts+=sc.got/sc.total;
      byDom[p.d].s++; byDom[p.d].c+=sc.got/sc.total;
      if(!S.tag[p.g]) S.tag[p.g]={s:0,m:0};
      S.tag[p.g].s++; if(sc.pct<80) S.tag[p.g].m++;
      const ps=S.pbqStat[p.id]||{tries:0,best:0,last:0};
      ps.tries++; ps.last=sc.pct; if(sc.pct>ps.best) ps.best=sc.pct; S.pbqStat[p.id]=ps;
      detail.push({t:"p",id:x.id,pct:sc.pct,got:sc.got,total:sc.total});
    }
  });
  const pct=Math.round(pts/SX.items.length*100);
  const mins=Math.max(1,Math.round((Date.now()-SX.startTs)/60000));
  if(!S.examHist) S.examHist={};
  const h=S.examHist[SX.exam]||{tries:0,best:0,last:0};
  h.tries++; h.last=pct; if(pct>h.best) h.best=pct; h.when=Date.now(); S.examHist[SX.exam]=h;
  const bd={}; [1,2,3,4,5].forEach(d=>bd[d]={s:byDom[d].s,c:Math.round(byDom[d].c*100)/100});
  S.sessions.push({t:Date.now(),mode:"exam",n:SX.items.length,pct:pct,byDom:bd});
  SX.submitted=true;
  SX.result={pct:pct,detail:detail,byDom:bd,mins:mins,expired:SX.timer?SX.timer.expired:false};
  S.activeExam=null;
  save();
  examReview();
}
function examReview(){

  const missObj={};
  r.detail.forEach(d=>{
    if(d.t==="q"&&!d.ok){ const q=qById(d.id); missObj[q.o]=(missObj[q.o]||0)+1; }
    if(d.t==="p"&&d.pct<100){ const p=PBQ.find(z=>z.id===d.id); missObj[p.o]=(missObj[p.o]||0)+(d.total-d.got); }
  });

  let items="";

    if(d.t==="q"){

        <p style="margin:8px 0 10px;font-weight:600">${esc(q.q)}</p>
        ${ord.map(oi=>{
          const cls=oi===q.a?"correct":(d.pick===oi?"wrong":"");
          return `<div class="opt rv ${cls}">${esc(q.c[oi])}${oi===q.a?' <span class="ct">correct</span>':""}${d.pick===oi&&oi!==q.a?' <span class="ct">your pick</span>':""}</div>`;
        }).join("")}
        <p class="dim" style="font-size:13.5px;margin:10px 0 0">${esc(q.e)}</p>
        ${d.ok?"":q.w.map((t,wi)=>t&&wi!==q.a?`<p class="dim" style="font-size:12.5px;margin:6px 0 0">\u2022 <b>${esc(q.c[wi])}:</b> ${esc(t)}</p>`:"").join("")+`
        <p style="font-size:12.5px;margin:10px 0 0;color:var(--amber)">Restudy: ${esc(studyLine(q.o))}</p>`}
      </div>`;
    } else {
      const p=PBQ.find(z=>z.id===d.id), st=SX.pbq[d.id];
      PB={p:p,done:true,score:d.pct,seq:st.seq,place:st.place,sel:st.sel,on:st.on};
      let inner="";
      if(p.t==="order") inner=pbqOrder(p);
      if(p.t==="match") inner=pbqMatch(p);
      if(p.t==="grid") inner=pbqGrid(p);
      if(p.t==="select") inner=pbqSelect(p);
      items+=`<div class="card rvq ${d.pct===100?"":"rvmiss"}">
        <div class="mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:${d.pct>=90?"var(--cyan)":d.pct>=70?"var(--amber)":"var(--red)"}">Item ${ix+1} \u00b7 PBQ \u00b7 ${d.pct}% (${d.got}/${d.total}) \u00b7 D${p.d} \u00b7 obj ${p.o}</div>
        <p style="margin:8px 0 10px;font-weight:600">${esc(p.title)}</p>
        ${p.pre?`<pre class="pbqpre">${esc(p.pre)}</pre>`:""}${inner}
        <p class="dim" style="font-size:13.5px;margin:12px 0 0">${esc(p.explain)}</p>
        ${d.pct===100?"":`<p style="font-size:12.5px;margin:10px 0 0;color:var(--amber)">Restudy: ${esc(studyLine(p.o))}</p>`}
      </div>`;
    }
  });
  PB=null;
  $("app").innerHTML=`
  <p class="eyebrow">Exam ${nm} complete${r.expired?" \u00b7 time expired":""}</p>
  <h1>${r.pct}%</h1>
  <p class="lede">${r.pct>=85?"At or above the 85% readiness bar. One more score like this with no weak domain and the gate is met.":r.pct>=70?"Closing in. The restudy plan below is the fastest path to the 85% bar.":"Below the bar for now. Work the restudy plan top to bottom, then retake."}</p>
  <div class="card">${domBars}</div>
  <h2>Restudy plan \u2014 hit these first</h2>
  <div class="card"><ul class="weaklist">${planHtml}</ul></div>
  <p class="dim" style="font-size:11.5px;margin:8px 0 0">Messer sections are numbered by exam objective in both his videos and course notes PDF. Gibson chapters follow the Get Certified Get Ahead SY0-701 edition.</p>
  <h2 style="margin-top:20px">Every item, reviewed</h2>
  ${items}
  <div class="row" style="margin-top:18px">
    <button class="btn pri" onclick="examHome()">Practice exams</button>
    <button class="btn" onclick="stats()">Weak areas &amp; stats</button>
    <button class="btn ghost" onclick="goHome()">Home</button>
  </div>`;
  if(typeof window.scrollTo==="function"){ try{ window.scrollTo(0,0); }catch(e){} }
}

  <p class="eyebrow">Tracking</p><h1>Weak areas &amp; stats</h1>
  <div class="card"><h2 style="margin-top:0">Accuracy by domain</h2>${bars}
    <p class="dim" style="font-size:13px;margin:14px 0 0">Readiness gate: ${g.pass?"<b style='color:var(--cyan)'>MET</b>":"<b style='color:var(--amber)'>OPEN</b>"}. ${esc(g.label)}.</p></div>
  <h2>Concepts you keep missing</h2><div class="card"><ul class="weaklist">${wl}</ul></div>
  <h2>Acronyms you keep missing</h2><div class="card"><ul class="weaklist">${aw}</ul></div>
  <h2>PBQ history</h2><div class="card"><ul class="weaklist">${
    PBQ.filter(p=>S.pbqStat[p.id]).length
      ? PBQ.filter(p=>S.pbqStat[p.id]).map(p=>{const st=S.pbqStat[p.id];
          return `<li><span>${esc(p.title)} <span class="dim" style="font-size:12px">(${st.tries} attempt${st.tries>1?"s":""})</span></span>
          <span class="ct" style="color:${st.best>=90?"var(--cyan)":st.best>=70?"var(--amber)":"var(--red)"}">best ${st.best}%</span></li>`;}).join("")
      : `<li class="dim">No PBQs attempted yet.</li>`}</ul></div>
  <h2>Recent sessions</h2><div class="card"><ul class="weaklist">${recent}</ul></div>
  <div class="row" style="margin-top:18px"><button class="btn pri" onclick="coachBrief()">Export coaching brief for AI</button>
    <button class="btn" onclick="restoreScreen()">Backup / restore</button>
    <button class="btn ghost" onclick="wipe()">Reset all progress</button></div>`;
}

/* ================= ADD CONTENT ================= */

  $("app").innerHTML=`
  <p class="eyebrow">Extend the deck</p><h1>Add new content</h1>
  <p class="lede">Paste in new flashcards or acronyms as your roadmap introduces new material. They merge straight into quizzing, spaced repetition, weak-area tracking, and every export.</p>
  <div class="seg">
    <button class="${tab==='cards'?'on':''}" onclick="content('cards')">Flashcards</button>
    <button class="${tab==='acr'?'on':''}" onclick="content('acr')">Acronyms</button>
  </div>
  ${tab==='cards'?`
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <label style="flex:1;min-width:150px"><div class="zlab">Domain</div>
        <select id="ccD" style="width:100%;background:var(--raise);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:10px">
          ${[1,2,3,4,5].map(d=>`<option value="${d}">${d}.0 ${DNAME[d]}</option>`).join("")}
        </select></label>
      <label style="flex:1;min-width:130px"><div class="zlab">Objective</div>
        <input id="ccO" type="text" placeholder="4.6"></label>
      <label style="flex:1;min-width:130px"><div class="zlab">Tag / topic</div>
        <input id="ccG" type="text" placeholder="pam"></label>
    </div>
    <div class="zlab">One card per line: <span class="mono" style="text-transform:none;letter-spacing:0">Front text || Back text</span></div>
    <textarea id="ccBox" rows="7" style="width:100%;background:var(--raise);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-family:var(--sans);font-size:14px;padding:11px" placeholder="What does JIT mean in PAM? || Just-in-time. Elevated access is granted for the task and revoked automatically."></textarea>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="parseCards()">Add cards</button></div>
    <div id="ccPreview"></div>
  </div>
  <h2>Your added flashcards (${S.customCards.length})</h2>
  <div class="card">${S.customCards.length?`<ul class="weaklist">${S.customCards.map(c=>`<li><span>${esc(c.f.length>58?c.f.slice(0,58)+"...":c.f)} <span class="dim">(D${c.d})</span></span><button class="btn sm ghost" onclick="delCard(${c.id})">Remove</button></li>`).join("")}</ul>`:`<p class="dim" style="margin:0">Nothing added yet.</p>`}</div>
  `:`
  <div class="card">
    <label style="display:block;margin-bottom:12px"><div class="zlab">Family group (controls which acronyms become distractors)</div>
      <input id="caG" list="knownGroups" type="text" value="custom">
      <datalist id="knownGroups">${knownGroups.map(g=>`<option value="${g}">`).join("")}</datalist></label>
    <div class="zlab">One per line: <span class="mono" style="text-transform:none;letter-spacing:0">ACRONYM || Full expansion || what it does</span></div>
    <textarea id="caBox" rows="7" style="width:100%;background:var(--raise);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-family:var(--mono);font-size:13px;padding:11px" placeholder="ZTNA || Zero Trust Network Access || Grants app-level access without placing the user on the network"></textarea>
    <p class="dim" style="font-size:12px;margin:8px 0 0">The third part is what makes an acronym drillable, so include it whenever you can.</p>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="parseAcr()">Add acronyms</button></div>
    <div id="caPreview"></div>
  </div>
  <h2>Your added acronyms (${S.customAcr.length})</h2>
  <div class="card">${S.customAcr.length?`<ul class="weaklist">${S.customAcr.map(a=>`<li><span><b class="mono">${esc(a.a)}</b> ${esc(a.d)}</span><button class="btn sm ghost" onclick="delAcr('${a.a.replace(/'/g,"\\'")}')">Remove</button></li>`).join("")}</ul>`:`<p class="dim" style="margin:0">Nothing added yet.</p>`}</div>
  `}
  <div class="row" style="margin-top:18px"><button class="btn ghost sm" onclick="home()">Back to home</button></div>`;

function parseCards(){
  const d=+$("ccD").value, o=($("ccO").value||"").trim()||("D"+d), g=($("ccG").value||"custom").trim().toLowerCase().replace(/\s+/g,"-");
  const lines=$("ccBox").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0;
  lines.forEach(line=>{
    const parts=line.split("||");
    if(parts.length<2){ skipped++; return; }
    const f=parts[0].trim(), b=parts.slice(1).join("||").trim();
    if(!f||!b){ skipped++; return; }
    S.customCards.push({id:100000+(S.cardSeq++),d,o,g,f,b}); added++;
  });
  save();
  $("ccPreview").innerHTML=`<p class="dim" style="margin:12px 0 0;font-size:13px">${added} card${added===1?"":"s"} added.${skipped?" "+skipped+" line"+(skipped===1?"":"s")+" skipped, each line needs a || with text on both sides.":""}</p>`;
  if(added){ $("ccBox").value=""; toast(added+" card"+(added===1?"":"s")+" added"); setTimeout(()=>content("cards"),600); }
}
function parseAcr(){
  const g=($("caG").value||"custom").trim().toLowerCase().replace(/\s+/g,"-");
  const lines=$("caBox").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0,dupes=0;
  const existing=new Set(allAcr().map(a=>a.a.toUpperCase()));
  lines.forEach(line=>{
    const parts=line.split("||");
    if(parts.length<2){ skipped++; return; }
    const a=parts[0].trim(), d=parts[1].trim(), u=(parts[2]||"").trim();
    if(!a||!d){ skipped++; return; }
    if(existing.has(a.toUpperCase())){ dupes++; return; }
    S.customAcr.push({a,d,g,u:u||undefined}); existing.add(a.toUpperCase()); added++;
  });
  save();
  $("caPreview").innerHTML=`<p class="dim" style="margin:12px 0 0;font-size:13px">${added} acronym${added===1?"":"s"} added.${dupes?" "+dupes+" already existed and were skipped.":""}${skipped?" "+skipped+" line"+(skipped===1?"":"s")+" skipped.":""}</p>`;
  if(added){ $("caBox").value=""; toast(added+" acronym"+(added===1?"":"s")+" added"); setTimeout(()=>content("acr"),600); }
}
function delCard(id){ S.customCards=S.customCards.filter(c=>c.id!==id); delete S.srs[id]; save(); content("cards"); }
function delAcr(a){ S.customAcr=S.customAcr.filter(x=>x.a!==a); delete S.acrStat[a]; save(); content("acr"); }

/* ================= ANKI EXPORT ================= */
function pasteLine(f,b){ return String(f).replace(/\r?\n/g," ").replace(/\|\|/g,"/")+" || "+String(b).replace(/\r?\n/g," ").replace(/\|\|/g,"/")+"\n"; }
function exportMisses(){
  let out="";
  sess.misses.forEach(q=>{ out+=pasteLine(q.q, q.c[q.a]+". "+q.e); });
  dl("missed-as-flashcards-"+new Date().toISOString().slice(0,10)+".txt",out);
  toast("Paste this into Add Content");
}
function exportCards(list){
  let out=""; list.forEach(i=>{ const c=cardById(i); out+=pasteLine(c.f,c.b); });
  dl("cards-to-review-"+new Date().toISOString().slice(0,10)+".txt",out);
  toast("Paste this into Add Content");
}
function exportAcr(list){
  let out=""; list.forEach(a=>{ const o=allAcr().find(x=>x.a===a); if(o) out+=o.a+" || "+o.d+(o.u?" || "+o.u:"")+"\n"; });
  dl("acronyms-to-review-"+new Date().toISOString().slice(0,10)+".txt",out);
  toast("Paste this into Add Content");
}
/* ---- coaching brief: a prompt-ready diagnostic for any AI assistant ---- */
function coachBrief(){
  const total=Object.values(S.dom).reduce((a,b)=>a+b.s,0);
  if(!total){ toast("Answer some questions first, then export"); return; }
  const corr=Object.values(S.dom).reduce((a,b)=>a+b.c,0);
  const ed=(typeof examDate==="function")?examDate():(typeof EXAM_OPEN!=="undefined"?EXAM_OPEN:null);
  const g=gateStatus();
  const L=[];
  L.push("# CompTIA Security+ SY0-701 - Study Diagnostic");
  L.push("Generated "+new Date().toISOString().slice(0,10)+" from the Night Shift trainer.");
  L.push("");
  L.push("## How to use this file");
  L.push("Paste this whole document into an AI assistant along with a request such as:");
  L.push("");
  L.push("> I am studying for CompTIA Security+ SY0-701. Below is my real performance data from a practice trainer.");
  L.push("> Identify the underlying reasoning errors behind my weak areas rather than just restating the topics,");
  L.push("> then build me a focused study plan and quiz me on the concepts I keep missing.");
  L.push("");
  L.push("## Snapshot");
  if(ed) L.push("- Target exam date: "+ed.toISOString().slice(0,10)+" ("+days(ed)+" days out)");
  L.push("- Questions answered: "+total+", correct "+corr+" ("+pct(corr,total)+"%)");
  L.push("- Adaptive timer level: "+(S.tight+1)+" of 5 ("+limit()+" seconds per question)");
  L.push("- Readiness gate (two consecutive 85%+ shifts, no domain under 75%): "+(g.pass?"MET":"NOT MET")+" - "+g.label);
  L.push("- Sessions logged: "+S.sessions.length);
  L.push("");
  L.push("## Accuracy by domain");
  L.push("Exam weight shown in parentheses. A domain far below its weight is where score is being lost.");
  L.push("");
  [1,2,3,4,5].forEach(d=>{
    const b=S.dom[d];
    L.push("- Domain "+d+".0 "+DNAME[d]+" ("+DWEIGHT[d]+"% of exam): "+(b.s?b.c+"/"+b.s+" = "+pct(b.c,b.s)+"%":"not yet attempted"));
  });
  L.push("");
  const weak=Object.keys(S.tag).filter(t=>S.tag[t].m>0).sort((a,b)=>S.tag[b].m-S.tag[a].m);
  L.push("## Concepts missed, ranked by miss count");
  if(weak.length){
    weak.forEach(t=>{
      const w=S.tag[t];
      L.push("- "+t.replace(/-/g," ")+": missed "+w.m+" of "+w.s+" attempts"+(S.flagged.indexOf(t)>=0?"  [FLAGGED AS A REPEATING PATTERN]":""));
    });
  } else L.push("- Nothing missed yet.");
  L.push("");
  const missedQ=QUESTIONS.filter(q=>S.qStat[q.i]&&S.qStat[q.i].m>0).sort((a,b)=>S.qStat[b.i].m-S.qStat[a.i].m).slice(0,25);
  L.push("## Specific questions missed (up to 25, most-missed first)");
  if(missedQ.length){
    missedQ.forEach((q,n)=>{
      L.push("");
      L.push((n+1)+". [Domain "+q.d+".0, objective "+q.o+", concept: "+q.g.replace(/-/g," ")+"] missed "+S.qStat[q.i].m+"x");
      L.push("   Q: "+q.q);
      L.push("   Correct answer: "+q.c[q.a]);
      L.push("   Why: "+q.e);
    });
  } else L.push("- None.");
  L.push("");
  const missedA=Object.keys(S.acrStat).filter(a=>S.acrStat[a].m>0).sort((a,b)=>S.acrStat[b].m-S.acrStat[a].m);
  L.push("");
  L.push("## Acronyms missed");
  if(missedA.length){
    missedA.forEach(a=>{ const o=allAcr().find(x=>x.a===a);
      L.push("- "+a+" ("+(o?o.d:"?")+"): missed "+S.acrStat[a].m+" of "+S.acrStat[a].s+(o&&o.u?" - function: "+o.u:"")); });
  } else L.push("- None.");
  L.push("");
  L.push("## Performance-based question scores");
  const attempted=PBQ.filter(p=>S.pbqStat[p.id]);
  if(attempted.length){
    attempted.forEach(p=>{ const st=S.pbqStat[p.id];
      L.push("- "+p.title+" (Domain "+p.d+".0, obj "+p.o+"): best "+st.best+"%, last "+st.last+"%, "+st.tries+" attempt(s)"); });
    const never=PBQ.filter(p=>!S.pbqStat[p.id]);
    if(never.length) L.push("- Not yet attempted: "+never.map(p=>p.title).join("; "));
  } else L.push("- No PBQs attempted yet.");
  L.push("");
  const hardCards=allCards().filter(c=>{ const s=S.srs[c.id]; return s&&s.ease<=2.05; });
  L.push("## Flashcards that keep failing recall");
  if(hardCards.length){
    hardCards.slice(0,20).forEach(c=>L.push("- [D"+c.d+" obj "+c.o+"] "+c.f));
  } else L.push("- None flagged yet.");
  L.push("");
  L.push("## Recent session history");
  if(S.sessions.length){
    S.sessions.slice(-12).reverse().forEach(s=>{
      const nm={shift:"SOC Watch",drill:"Rapid Response",pbq:"PBQ"}[s.mode]||s.mode;
      L.push("- "+new Date(s.t).toISOString().slice(0,10)+"  "+nm+", "+s.n+" items, "+s.pct+"%");
    });
  } else L.push("- None.");
  L.push("");
  L.push("## Notes for the assistant");
  L.push("- Distractor reasoning matters more than the correct answer. Focus on why the wrong options were tempting.");
  L.push("- Spell out every acronym in parentheses on first use.");
  L.push("- Flag whenever the exam-correct answer differs from real-world practice.");
  L.push("- Where a concept was missed more than once, treat it as a reasoning gap and not a memory gap.");
  dl("security-plus-coaching-brief-"+new Date().toISOString().slice(0,10)+".md", L.join("\n"));
  toast("Coaching brief downloaded");
}

function restoreScreen(){
  view="setup"; strip("restore",0); stopTimer();
  $("app").innerHTML=`
  <p class="eyebrow">Transfer</p><h1>Backup and restore</h1>
  <p class="lede">Progress lives in this browser only. Export a backup here, then paste it on another device to carry your stats, weak areas, card scheduling, and anything you have added.</p>
  <div class="card">
    <div class="zlab">Paste a backup file's contents</div>
    <textarea id="rsBox" rows="6" style="width:100%;background:var(--raise);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-family:var(--mono);font-size:12px;padding:11px" placeholder='{"v":1,"dom":{...'></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn pri" onclick="restoreIn()">Restore from paste</button>
      <button class="btn" onclick="backupOut()">Download a backup</button>
    </div>
    <p class="dim" style="font-size:12px;margin:12px 0 0">Restoring replaces everything currently in this browser.</p>
  </div>
  <div class="row" style="margin-top:18px"><button class="btn ghost sm" onclick="stats()">Back to stats</button></div>`;
}
function restoreIn(){
  const raw=($("rsBox").value||"").trim();
  if(!raw){ toast("Paste a backup first"); return; }
  let v; try{ v=JSON.parse(raw); }catch(e){ toast("That is not a valid backup file"); return; }
  if(!v||typeof v!=="object"||!v.dom){ toast("That file is missing progress data"); return; }
  if(!confirm("Replace all progress in this browser with the pasted backup?")) return;
  S=Object.assign(S,v);
  for(let d=1;d<=5;d++) if(!S.dom[d]) S.dom[d]={s:0,c:0};
  S.customCards=S.customCards||[]; S.customAcr=S.customAcr||[]; S.recent=S.recent||[]; S.pbqStat=S.pbqStat||{};
  save(); toast("Progress restored"); home();
}

/* ================= keyboard ================= */
document.addEventListener("keydown",e=>{
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
  if(view==="exam"&&SX&&!SX.submitted){
    const it=SX.items[SX.i];
    if(e.key>="1"&&e.key<="4"&&it.t==="q"){ const oi=SX.orders[it.id][+e.key-1]; SX.answers[it.id]=oi; persistX(); examRender(); }
    else if(e.key==="ArrowRight"&&SX.i<SX.items.length-1){ SX.i++; persistX(); examRender(); }
    else if(e.key==="ArrowLeft"&&SX.i>0){ SX.i--; persistX(); examRender(); }
    else if(e.key==="f"||e.key==="F"){ SX.flags[SX.i]=!SX.flags[SX.i]; persistX(); examRender(); }
    else if(e.key==="Escape") goHome();
    return;
  }
  if(view==="ref"||view==="setup"||view==="review") return;
  if(PB&&!PB.done) return;
  if(e.key>="1"&&e.key<="4"){
    const btns=[...document.querySelectorAll(".opt:not([disabled])")];
    if(btns[+e.key-1]){ e.preventDefault(); btns[+e.key-1].click(); }
  }
  if(e.key==="Enter"||e.key===" "){ const n=$("nx")||$("rv"); if(n&&document.activeElement!==n){ e.preventDefault(); n.click(); } }
  if(e.key==="Escape"&&view!=="home"){ stopTimer(); home(); }
});

/* ================= boot ================= */
QUESTIONS.forEach(q=>DCOUNT[q.d]=(DCOUNT[q.d]||0)+1);
load().then(()=>{ if(!S.exam&&!S.name) profile(true); else home(); });
</script>

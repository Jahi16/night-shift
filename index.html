<title>Night Shift - SY0-701 Operations Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1017; --panel:#121C26; --raise:#1A2733; --line:#263644;
  --txt:#DDE7F1; --dim:#7C90A4; --faint:#4E6072;
  --amber:#F0A03C; --red:#E0574A; --cyan:#45D3C0; --violet:#9B87F5; --blue:#5AA9F0;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}

/* ---- signature: operations status strip ---- */
.strip{position:sticky;top:0;z-index:50;background:#070C11;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.strip-in{max-width:860px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stn{color:var(--amber);font-weight:600;white-space:nowrap}
.stn b{color:var(--txt);font-weight:600}
.lamps{display:flex;gap:2px;flex:1;min-width:110px}
.lamp{flex:1;height:10px;background:#182430;border-radius:1px;transition:background .25s}
.lamp.on{background:var(--cyan)}
.lamp.warn{background:var(--amber)}
.lamp.crit{background:var(--red)}
.readout{color:var(--dim);white-space:nowrap}
.readout b{color:var(--txt)}
.readout.hot b{color:var(--red)}

/* ---- generic ---- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
h1{font-size:26px;line-height:1.2;margin:22px 0 6px;letter-spacing:-.01em}
h2{font-size:18px;margin:30px 0 12px;letter-spacing:-.01em}
.lede{color:var(--dim);margin:0 0 22px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:10px 16px;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--amber);color:#0A1017;border-color:var(--amber);font-weight:600}
.btn.pri:hover{background:#FFB463}
.btn.ghost{background:none}
.btn.sm{padding:6px 11px;font-size:13px}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.hide{display:none !important}

/* ---- mode tiles ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 4px}
@media(max-width:620px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent,var(--amber));
  border-radius:10px;padding:15px 16px;text-align:left;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent,var(--amber))}
.tile h3{margin:0 0 4px;font-size:16px}
.tile p{margin:0;color:var(--dim);font-size:13px;line-height:1.45}
.tile .tag{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:7px}

/* ---- gate / countdown ---- */
.gate{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px}
@media(max-width:620px){.gate{grid-template-columns:1fr}}
.gcell{background:var(--panel);padding:13px 15px}
.gcell .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.gcell .v{font-size:19px;font-weight:600;font-family:var(--mono)}
.gcell .s{font-size:12px;color:var(--dim);margin-top:2px}

/* ---- ticket / question ---- */
.ticket{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;margin-bottom:14px}
.thead{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#0E1721;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);flex-wrap:wrap}
.sev{padding:2px 7px;border-radius:3px;font-weight:600;color:#0A1017}
.sev.p1{background:var(--red)} .sev.p2{background:var(--amber)} .sev.p3{background:var(--blue)}
.tbody{padding:16px 16px 4px}
.qtext{font-size:16px;line-height:1.6;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;background:var(--raise);border:1px solid var(--line);
  border-radius:8px;padding:11px 13px;transition:border-color .12s,background .12s;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--faint)}
.opt:disabled{cursor:default}
.opt .key{font-family:var(--mono);font-size:12px;color:var(--faint);flex:0 0 auto;margin-top:2px;width:14px}
.opt.correct{border-color:var(--cyan);background:rgba(69,211,192,.09)}
.opt.correct .key{color:var(--cyan)}
.opt.wrong{border-color:var(--red);background:rgba(224,87,74,.09)}
.opt.wrong .key{color:var(--red)}
.opt.faded{opacity:.5}

/* ---- feedback ---- */
.fb{border-radius:10px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);background:var(--panel)}
.fb.ok{border-left:3px solid var(--cyan)}
.fb.no{border-left:3px solid var(--red)}
.fb .verdict{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.fb.ok .verdict{color:var(--cyan)} .fb.no .verdict{color:var(--red)}
.fb p{margin:0 0 10px}
.traps{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.traps .th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.traps li{margin-bottom:7px;font-size:14px;color:var(--dim);line-height:1.5}
.traps li b{color:var(--txt);font-weight:600}
.traps ul{margin:0;padding-left:18px}
.pattern{border:1px solid var(--amber);background:rgba(240,160,60,.08);border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:14px}
.pattern b{color:var(--amber);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}

/* ---- flashcards ---- */
.fc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 24px;min-height:190px;
  display:flex;flex-direction:column;justify-content:center;margin-bottom:14px}
.fc .front{font-size:19px;line-height:1.5;font-weight:500}
.fc .back{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);color:var(--txt);font-size:15px;line-height:1.6}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{padding:11px 4px;border-radius:7px;border:1px solid var(--line);background:var(--raise);font-size:13px;font-weight:500}
.rate button small{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px}
.rate button:hover{border-color:var(--faint)}

/* ---- bars ---- */
.bar{height:7px;background:#182430;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);border-radius:4px;transition:width .4s}
.bar i.warn{background:var(--amber)} .bar i.bad{background:var(--red)}
.dstat{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.dstat .nm{flex:0 0 148px;font-size:13px}
.dstat .nm span{font-family:var(--mono);color:var(--faint);font-size:11px;margin-right:6px}
.dstat .bar{flex:1}
.dstat .pc{flex:0 0 62px;text-align:right;font-family:var(--mono);font-size:13px}
@media(max-width:560px){.dstat .nm{flex-basis:100px;font-size:12px}}

.weaklist{list-style:none;padding:0;margin:0}
.weaklist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.weaklist li:last-child{border-bottom:none}
.weaklist .ct{font-family:var(--mono);font-size:12px;color:var(--red);white-space:nowrap}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:14px;flex-wrap:wrap}
.seg button{padding:7px 13px;font-size:13px;background:var(--panel);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--amber);color:#0A1017;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--raise);border:1px solid var(--amber);
  color:var(--txt);padding:10px 18px;border-radius:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;z-index:99;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

.combo{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--amber);line-height:1}
.big{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1.1}

@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<div class="strip">
  <div class="strip-in">
    <span class="stn">NIGHT SHIFT <b id="sMode">/ console</b></span>
    <span class="lamps" id="sLamps"></span>
    <span class="readout" id="sMid"></span>
    <span class="readout" id="sRight"></span>
  </div>
</div>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const Q1 = [
// ---------- DOMAIN 1: General Security Concepts (12%) ----------
{i:101,d:1,o:"1.1",t:"s",g:"control-categories",
q:"A hospital installs steel bollards in front of its emergency room entrance after a vehicle rammed a nearby clinic. Which control category and type BEST describes the bollards?",
c:["Physical category, preventive type","Operational category, deterrent type","Physical category, detective type","Managerial category, directive type"],a:0,
e:"Bollards are a physical control (they exist in the real world, not in software or policy) and they are preventive, because they physically stop the vehicle rather than merely discouraging it.",
w:["","Deterrent is the trap. A sign saying NO VEHICLE ACCESS deters. Steel that physically blocks a truck prevents. Operational is also wrong since operational controls are people-driven processes.","Detective controls tell you something happened after the fact, like a camera. Bollards stop it from happening at all.","Managerial and directive both live in the policy world. Nothing about a steel post is a policy."]},

{i:102,d:1,o:"1.1",t:"b",g:"compensating-controls",
q:"A legacy medical device cannot support multifactor authentication, and the vendor will not patch it. Security restricts it to an isolated VLAN reachable only through a recorded jump host. Which control type BEST describes this arrangement?",
c:["Preventive","Compensating","Corrective","Detective"],a:1,
e:"A compensating control is what you deploy when the control you actually wanted cannot be implemented. The requirement was MFA, MFA is impossible, so an alternative set of protections stands in for it.",
w:["Preventive is tempting because the VLAN and jump host do prevent access. But the defining fact here is that they substitute for a required control that could not be applied, which makes compensating the more precise answer.","","Corrective controls act after an incident to restore or limit damage, like restoring from backup. Nothing has happened yet.","Session recording is detective, so this option feels partly right. But recording is one piece of a larger substitute arrangement, not the whole answer."]},

{i:103,d:1,o:"1.2",t:"s",g:"non-repudiation",
q:"A contractor claims she never approved a $400,000 purchase order, even though the approval was submitted from her account. The company wants proof that cannot be credibly denied. Which concept addresses this?",
c:["Confidentiality","Authentication","Non-repudiation","Integrity"],a:2,
e:"Non-repudiation means the actor cannot plausibly deny having taken the action. It is delivered through digital signatures, which bind an action to a private key only that person holds.",
w:["Confidentiality keeps the purchase order secret. That is not the dispute here.","Authentication is the near miss and the one people pick. Authentication proved who logged in at the time. Non-repudiation is what lets you prove it later to a third party who was not there.","","Integrity proves the document was not altered. It does not prove who signed it."]},

{i:104,d:1,o:"1.2",t:"s",g:"cia-triad",
q:"Ransomware encrypts a manufacturing company's file shares. Investigators confirm nothing was copied out and no files were modified before encryption. Which element of the CIA triad was MOST directly impacted?",
c:["Confidentiality","Integrity","Availability","Non-repudiation"],a:2,
e:"The data still exists and is unchanged, but nobody can reach it. Loss of access is availability.",
w:["Confidentiality is the reflex answer because ransomware is an attack. But investigators explicitly confirmed no exfiltration, which removes confidentiality from the table.","Integrity would mean the data was altered. Encryption for ransom locks data rather than corrupting it, and the question states files were not modified.","","Non-repudiation is not part of the CIA triad at all. Watch for it being slipped into CIA questions."]},

{i:105,d:1,o:"1.2",t:"b",g:"aaa-devices",
q:"A network team needs switches to authenticate to a central server before they accept administrator logins, with every command logged for billing and audit. Which combination BEST supports this?",
c:["802.1X with RADIUS","LDAP with Kerberos","SAML with an identity provider","OAuth with OpenID Connect"],a:0,
e:"AAA for network infrastructure runs on 802.1X for port-based authentication and RADIUS or TACACS+ as the AAA server, which handles authentication, authorization, and the accounting records the team needs.",
w:["","LDAP is a directory lookup protocol and Kerberos is ticket-based authentication. Neither provides the accounting leg of AAA, which is the detail the question hinges on.","SAML federates identity for web applications between organizations. Switches are not web applications.","OAuth is authorization delegation for apps and APIs. It has nothing to do with device administration."]},

{i:106,d:1,o:"1.2",t:"m",g:"zero-trust",
q:"In a Zero Trust architecture, which component makes the actual allow-or-deny decision about a request?",
c:["Policy Enforcement Point","Policy Engine","Policy Administrator","Implicit Trust Zone"],a:1,
e:"The Policy Engine is the brain. It evaluates the subject, the device, and the context, then decides. The Policy Administrator relays that decision, and the Policy Enforcement Point carries it out.",
w:["The Enforcement Point is where the block physically happens, so it feels like the decider. It only executes an order it was given.","","The Administrator is the messenger between the Engine and the Enforcement Point. It establishes or shuts down the session, but it does not decide.","An Implicit Trust Zone is the area past the enforcement point. It is a place, not a decision maker."]},

{i:107,d:1,o:"1.2",t:"s",g:"deception",
q:"A security team plants a fake credentials file named vpn_backup_creds.txt on a file server. It has no legitimate use, and any access to it generates an immediate alert. What is this?",
c:["Honeypot","Honeynet","Honeyfile","Honeytoken"],a:2,
e:"A honeyfile is a decoy file placed where an intruder would browse. Because no legitimate process touches it, any access is a high-confidence indicator of compromise.",
w:["A honeypot is a whole decoy system or service designed to attract attackers. This is one file on a real production server.","A honeynet is an entire decoy network of honeypots. Far larger in scope than what is described.","","Honeytoken is the closest miss and worth knowing cold. A honeytoken is fake data such as a bogus record or API key that is tracked wherever it travels. A honeyfile is specifically a decoy file used as a tripwire in place."]},

{i:108,d:1,o:"1.3",t:"b",g:"change-management",
q:"A change advisory board reviews a firewall upgrade scheduled for Saturday night. Which element of the change request BEST protects the business if the upgrade fails at 2 a.m.?",
c:["Impact analysis","Backout plan","Maintenance window","Standard operating procedure"],a:1,
e:"The backout plan is the documented path to return the system to its prior working state. It is the control that specifically answers what happens when the change goes wrong.",
w:["Impact analysis is done before the change to predict what it will affect. Valuable, but it does not help you at 2 a.m. once things are already broken.","","The maintenance window is when the work is allowed to happen. It limits who is affected, but it does not restore anything.","A standard operating procedure describes how routine work is done. It is not the recovery mechanism for a failed change."]},

{i:109,d:1,o:"1.4",t:"s",g:"asymmetric-direction",
q:"Jahi wants to send a contract to a supplier so that only the supplier can read it. Which key does he use to encrypt it?",
c:["Jahi's private key","Jahi's public key","The supplier's public key","The supplier's private key"],a:2,
e:"For confidentiality you encrypt with the recipient's public key, because only the recipient holds the matching private key needed to decrypt.",
w:["Encrypting with your own private key is how you create a digital signature. Anyone with your public key could then read it, which is the opposite of confidentiality.","Encrypting with your own public key means only you could decrypt it. The supplier would be locked out.","","Nobody ever has access to another party's private key. If an answer choice hands you someone else's private key, it is wrong on its face."]},

{i:110,d:1,o:"1.4",t:"b",g:"hashing-salting",
q:"An application stores password hashes. Attackers steal the database and use precomputed rainbow tables to recover many passwords instantly. Which change BEST defeats this specific technique?",
c:["Increase the minimum password length","Add a unique random salt to each password before hashing","Switch from SHA-1 to SHA-256","Encrypt the password column with AES"],a:1,
e:"Rainbow tables are precomputed hash lookups. A unique salt per password means the attacker would need a separate table for every user, which makes precomputation worthless.",
w:["Longer passwords help against brute force, but a rainbow table for common long passwords still works. It does not address the precomputation problem directly.","","A stronger hash algorithm is good practice, but rainbow tables can be built for SHA-256 just as easily. Algorithm strength is not the weakness being exploited.","Encrypting the column protects data at rest, but the moment the app decrypts to verify a login, and if the attacker has the key, you are back where you started. Salting is the targeted answer."]},

{i:111,d:1,o:"1.4",t:"a",g:"cert-lifecycle",
q:"A web server's certificate was compromised and revoked. Rather than have every client query the CA in real time, the server presents a timestamped, CA-signed revocation status with its certificate. What is this called?",
c:["CRL","OCSP stapling","CSR","SAN"],a:1,
e:"OCSP (Online Certificate Status Protocol) stapling has the server attach a recent, CA-signed status response to its own certificate, which removes the per-client lookup and its privacy and latency costs.",
w:["A CRL (Certificate Revocation List) is the downloadable list of revoked certificates. It is the older method the question is deliberately moving away from.","","A CSR (Certificate Signing Request) is what you submit to get a certificate issued. Wrong stage of the lifecycle entirely.","SAN (Subject Alternative Name) lets one certificate cover multiple hostnames. It has nothing to do with revocation."]},

{i:112,d:1,o:"1.4",t:"b",g:"encryption-levels",
q:"A company wants a laptop's entire storage device protected so that a thief who removes the drive cannot read anything, including the operating system files. Which BEST meets this?",
c:["File-level encryption","Full-disk encryption","Database encryption","Transport encryption"],a:1,
e:"Full-disk encryption protects the whole volume including system files, and is typically tied to a TPM (Trusted Platform Module) so the drive is useless when pulled from the original hardware.",
w:["File-level encryption protects selected files but leaves the OS, page file, and temp files readable. The question specifically includes operating system files.","","Database encryption protects records inside a database engine. It does nothing for a stolen laptop drive.","Transport encryption protects data in motion. The drive is data at rest."]},

// ---------- DOMAIN 2: Threats, Vulnerabilities, Mitigations (22%) ----------
{i:201,d:2,o:"2.1",t:"s",g:"threat-actors",
q:"An intrusion is traced to a group that has maintained quiet access to a defense contractor for 19 months, using custom tooling and zero-days, with no attempt to monetize. Which threat actor is MOST likely?",
c:["Organized crime","Nation-state","Hacktivist","Insider threat"],a:1,
e:"Long dwell time, custom tooling, zero-day access, and no financial motive point to a nation-state actor with high resources and an espionage objective.",
w:["Organized crime is the tempting one because of the sophistication. But criminal groups exist to make money, and the question explicitly says no monetization attempt.","","Hacktivists want attention. Nineteen months of silence is the opposite of a hacktivist's goal.","An insider would not typically need zero-days to reach data they already have access to."]},

{i:202,d:2,o:"2.2",t:"b",g:"social-engineering",
q:"An accounts payable clerk receives a phone call from someone claiming to be the CFO, who is traveling and needs an urgent wire transfer to close a deal before markets open. Which BEST describes this attack?",
c:["Vishing using pretexting","Whaling","Smishing","Watering hole attack"],a:0,
e:"Vishing is voice phishing, and pretexting is the invented backstory (traveling CFO, urgent deal) used to make the request believable. The call plus the fabricated scenario is the combination.",
w:["","Whaling is phishing that targets a high-value executive. Here the executive is being impersonated, not targeted. This reversal is a favorite CompTIA trap.","Smishing is SMS-based. The attack came by phone call.","A watering hole attack compromises a website the target group visits. No website is involved."]},

{i:203,d:2,o:"2.2",t:"s",g:"typosquatting",
q:"Employees are being directed to secuirty-portal.com, a near-identical clone of the company's real secure portal, differing by two transposed letters. What is this technique?",
c:["Watering hole","Typosquatting","Pharming","Business email compromise"],a:1,
e:"Typosquatting registers domains that exploit common misspellings or transpositions of a legitimate name so that a mistyped or misread URL lands on attacker infrastructure.",
w:["A watering hole compromises a legitimate site the victims already trust. Here the site is a fake the attacker built.","","Pharming redirects users to a fake site by poisoning DNS or a hosts file, even when the user types the correct address. Here the address itself is different.","Business email compromise involves a hijacked or spoofed internal mailbox used to authorize fraud. No mailbox is described."]},

{i:204,d:2,o:"2.4",t:"b",g:"malware-types",
q:"A financial system operates normally for months, then at 11:59 p.m. on the day after a specific employee's name is removed from the payroll table, it begins deleting transaction records. Which malware type BEST fits?",
c:["Logic bomb","Ransomware","Rootkit","Worm"],a:0,
e:"A logic bomb sits dormant until a defined condition is met, then fires. A trigger tied to a specific employee record is a classic disgruntled-insider logic bomb.",
w:["","Ransomware encrypts and demands payment. This destroys data with no demand mentioned.","A rootkit hides an attacker's presence at a deep system level. It is a concealment tool, not a triggered payload.","A worm spreads itself across systems without user action. Nothing here spreads."]},

{i:205,d:2,o:"2.4",t:"m",g:"worm-virus-trojan",
q:"Which characteristic distinguishes a worm from a virus?",
c:["A worm encrypts files while a virus deletes them","A worm self-propagates across networks without user interaction","A worm requires administrative privileges while a virus does not","A worm operates only in memory while a virus writes to disk"],a:1,
e:"The defining difference is propagation. A worm spreads on its own across a network. A virus needs a host file and a user action to spread.",
w:["Payload behavior does not define the category. Either can encrypt, delete, or do nothing at all.","","Privilege level is not part of either definition, though it is a plausible-sounding distractor.","Fileless malware operates in memory, and that can be true of either category. Memory residency is a separate concept."]},

{i:206,d:2,o:"2.4",t:"s",g:"rootkit",
q:"A workstation's antivirus reports clean, but network monitoring shows steady outbound traffic to an unknown host. Booting from external media and mounting the drive reveals files that the running operating system did not display. Which malware type is MOST likely present?",
c:["Spyware","Rootkit","Bloatware","Keylogger"],a:1,
e:"A rootkit subverts the operating system itself so that its files, processes, and connections are hidden from tools running on that OS. Files appearing only when booted externally is the signature finding.",
w:["Spyware collects information, which fits the outbound traffic, but spyware does not typically hide files from the OS at kernel level.","","Bloatware is unwanted preinstalled software. It is annoying, not stealthy or malicious in this way.","A keylogger captures keystrokes and would also explain outbound traffic, but the hiding behavior is what identifies a rootkit."]},

{i:207,d:2,o:"2.4",t:"b",g:"network-attacks",
q:"An attacker sends small spoofed DNS queries to thousands of open resolvers, listing the victim's IP as the source. The victim is buried in large DNS responses. Which BEST describes this?",
c:["SYN flood","Amplified DDoS","On-path attack","DNS poisoning"],a:1,
e:"Amplification abuses a protocol where a small request produces a much larger response, and reflection uses spoofed source addresses so those responses land on the victim. DNS is the classic vehicle.",
w:["A SYN flood exhausts a server's connection table with half-open TCP handshakes. It does not use third-party reflectors or produce size amplification.","","An on-path attack intercepts and relays traffic between two parties. The attacker here never sits in the path.","DNS poisoning corrupts cached DNS records to misdirect users. Here DNS is being used as a traffic cannon, not corrupted."]},

{i:208,d:2,o:"2.4",t:"s",g:"arp-onpath",
q:"On a flat office LAN, a workstation begins receiving traffic destined for the default gateway. Packet captures show gratuitous replies mapping the gateway's IP to the attacker's MAC address. What is occurring?",
c:["ARP poisoning enabling an on-path attack","DNS hijacking","VLAN hopping","MAC flooding"],a:0,
e:"ARP (Address Resolution Protocol) has no authentication, so forged replies let an attacker bind the gateway's IP to their own MAC and become the on-path relay for the segment.",
w:["","DNS hijacking would redirect name lookups. The evidence here is layer 2 address mapping, not name resolution.","VLAN hopping moves traffic across VLAN boundaries using double tagging or switch spoofing. The network described is flat with no VLANs in play.","MAC flooding overwhelms a switch's CAM table to force it to broadcast. That is a related attack, but the evidence given is forged ARP replies specifically."]},

{i:209,d:2,o:"2.3",t:"b",g:"application-attacks",
q:"A logged-in banking user clicks a link in a forum post. Their browser silently submits a funds transfer to the bank, which accepts it because the session cookie is attached automatically. Which attack is this?",
c:["Cross-site scripting","SQL injection","Cross-site request forgery","Directory traversal"],a:2,
e:"CSRF (Cross-Site Request Forgery) abuses the browser's automatic inclusion of session cookies to make an authenticated user perform an action they did not intend. Anti-CSRF tokens are the fix.",
w:["XSS is the constant near miss. XSS injects script that runs in the victim's browser to steal or manipulate data. CSRF does not require injecting script into the target site at all, it just triggers a request.","SQL injection attacks the database through unsanitized input. The bank's input handling is not the weakness here.","","Directory traversal reaches files outside the web root using path sequences. No file access is described."]},

{i:210,d:2,o:"2.4",t:"b",g:"password-attacks",
q:"Authentication logs show a single login attempt against 4,000 different usernames using the password Summer2026!, repeated once per week. No account lockouts triggered. Which attack is this?",
c:["Brute force","Dictionary attack","Password spraying","Credential stuffing"],a:2,
e:"Password spraying tries one common password across many accounts, deliberately staying under lockout thresholds. Wide and shallow is the signature, and the lack of lockouts confirms it.",
w:["Brute force hammers one account with many passwords. That is the opposite shape and would trip lockouts fast.","A dictionary attack also targets one account, using a wordlist. Same shape problem as brute force.","","Credential stuffing is the sharpest miss. Stuffing replays username and password pairs stolen from another breach. Here one password is being tried against everyone, which means the attacker has no matching pairs."]},

{i:211,d:2,o:"2.3",t:"s",g:"race-conditions",
q:"A gift card application verifies a card's balance, then a fraction of a second later deducts the amount. An attacker submits many simultaneous redemptions and spends the same balance repeatedly. Which vulnerability is being exploited?",
c:["Buffer overflow","Time-of-check to time-of-use race condition","Integer overflow","Memory injection"],a:1,
e:"A TOC/TOU (time-of-check to time-of-use) race condition exists when the state validated at check time can change before the action executes. Concurrent requests slip into that gap.",
w:["A buffer overflow writes past an allocated memory boundary. Nothing here involves memory boundaries.","","Integer overflow occurs when a value exceeds its type's maximum and wraps. Plausible in financial code, but the described flaw is timing, not arithmetic.","Memory injection places malicious code into a running process. Not what the gap between check and use describes."]},

{i:212,d:2,o:"2.3",t:"b",g:"supply-chain",
q:"A company is breached after an attacker compromised the build server of a network monitoring vendor and shipped a signed but backdoored update to all customers. Which vulnerability category BEST describes this?",
c:["Supply chain vulnerability","Zero-day vulnerability","Misconfiguration","Insider threat"],a:0,
e:"The trusted relationship with a software provider was the attack path. Compromising the supplier to reach many downstream customers is the defining supply chain scenario.",
w:["","Zero-day is tempting because the backdoor was unknown. But a zero-day is an unpatched flaw in software; here the software was intentionally altered upstream by an attacker.","Misconfiguration is a customer-side error. The customers did nothing wrong, they applied a legitimately signed update.","An insider threat originates from within the victim organization. The compromise originated at a third party."]},

{i:213,d:2,o:"2.4",t:"m",g:"crypto-attacks",
q:"A client and server both support TLS 1.3 but an attacker forces the negotiation to fall back to SSL 3.0, which has known flaws. What is this attack called?",
c:["Downgrade attack","Birthday attack","Collision attack","Replay attack"],a:0,
e:"A downgrade attack manipulates protocol negotiation so both parties settle on a weaker version the attacker can break, even though stronger options were available.",
w:["","A birthday attack exploits the probability of hash collisions. It targets hashing, not protocol negotiation.","A collision attack finds two inputs producing the same hash. Same domain problem as the birthday attack.","A replay attack captures and resends valid traffic. Nothing is being resent here."]},

{i:214,d:2,o:"2.5",t:"b",g:"mitigation-techniques",
q:"An OT (operational technology) network runs unpatchable controllers that must never touch the internet, but engineers still need to send read-only telemetry out. Which mitigation BEST fits?",
c:["Full air gap","Segmentation with a unidirectional gateway","Host-based firewall on each controller","Application allow list"],a:1,
e:"Segmentation isolates the OT network, and a unidirectional gateway or data diode permits telemetry out while making inbound traffic physically impossible.",
w:["A true air gap allows no connection at all, which breaks the stated requirement to send telemetry out. This is the trap: the question includes a business need the air gap cannot meet.","","Host-based firewalls on unpatchable legacy controllers are often unsupported, and they do not create the network boundary the scenario needs.","Application allow listing controls what runs on a host. It does not control the network path in or out."]},

{i:215,d:2,o:"2.5",t:"s",g:"hardening-mitigation",
q:"After a breach through an unused management service, leadership asks for the change that most reduces the number of ways an attacker can reach any given server. Which mitigation BEST accomplishes this?",
c:["Installing endpoint detection and response","Disabling unnecessary ports and services","Increasing password complexity requirements","Enabling verbose logging"],a:1,
e:"Every listening service is an entry point. Turning off what is not needed shrinks the attack surface directly, which is what the question asks for.",
w:["EDR (Endpoint Detection and Response) improves your ability to see and respond to an attacker. It does not reduce the number of doors.","","Stronger passwords protect accounts, but the unused service may not even require an account, and the question is about reachable paths.","Logging is detective. It records the intrusion rather than removing the route."]},

{i:216,d:2,o:"2.2",t:"b",g:"social-engineering",
q:"An attacker follows an employee through a badge-controlled door while carrying two coffee cups and smiling. The employee holds the door open. Which technique is this?",
c:["Tailgating","Piggybacking","Shoulder surfing","Impersonation"],a:1,
e:"Piggybacking is when the authorized person knowingly grants entry, usually out of courtesy. Consent is the distinguishing element.",
w:["Tailgating is the answer most people give, and CompTIA does sometimes use the terms loosely. But strictly, tailgating means slipping in without the employee's awareness or consent. Here the employee actively holds the door.","","Shoulder surfing is observing credentials or screens over someone's shoulder. No observation of data occurs.","Impersonation means posing as someone with authority. The attacker made no claim about who they were."]},

{i:217,d:2,o:"2.3",t:"s",g:"vuln-types",
q:"A cloud storage bucket holding customer records is publicly readable because a default setting was never changed during deployment. Which vulnerability type is this?",
c:["Zero-day","Misconfiguration","Legacy system vulnerability","Side loading"],a:1,
e:"The software worked exactly as designed. The exposure came from a setting left at an insecure default, which is a misconfiguration and a leading cause of cloud breaches.",
w:["Zero-day implies an unknown flaw in the product itself with no patch available. The product has no flaw here.","","A legacy vulnerability comes from unsupported or outdated software. Nothing indicates the platform is outdated.","Side loading is installing applications outside an approved store, typically on mobile. Unrelated to bucket permissions."]},

{i:218,d:2,o:"2.4",t:"b",g:"physical-attacks",
q:"Investigators find a thin device fitted over the card reader of a fuel pump, paired with a pinhole camera aimed at the keypad. Which attack does this represent?",
c:["RFID cloning","Card skimming","Environmental attack","Brute force entry"],a:1,
e:"Skimming captures magnetic stripe or chip data at the point of use, and the camera captures the PIN so the pair can be used together.",
w:["RFID cloning copies a contactless credential wirelessly. The device described physically overlays a contact reader.","","Environmental attacks target conditions like power or HVAC to disrupt a facility. Nothing environmental is involved.","Brute force in the physical domain means forcing a lock or barrier. Nothing was forced open."]},

{i:219,d:2,o:"2.4",t:"m",g:"indicators",
q:"Which of the following is the strongest indicator of compromise that credentials are being used by an unauthorized party?",
c:["A user resets their password twice in one month","Successful logins from two countries 40 minutes apart","An increase in blocked spam messages","A workstation shows high CPU usage during business hours"],a:1,
e:"Impossible travel, where the same account authenticates from locations too far apart to physically traverse in the elapsed time, is a high-confidence account compromise indicator.",
w:["Frequent password resets suggest a forgetful user or a policy issue. It is weakly suspicious at best.","","Blocked spam volume reflects inbound attack activity generally, not the state of a specific account.","High CPU has many benign explanations and is not tied to credential use."]},

{i:220,d:2,o:"2.1",t:"s",g:"shadow-it",
q:"A marketing team, frustrated by IT ticket delays, signs up for an unapproved cloud file-sharing service using a company card and begins storing customer lists there. Which threat does this represent?",
c:["Shadow IT","Insider threat with malicious intent","Nation-state actor","Hacktivism"],a:0,
e:"Shadow IT is unsanctioned technology adopted by employees to get work done. The intent is productivity, but the organization loses visibility and control over the data.",
w:["","A malicious insider intends harm. This team is trying to do their job, which is exactly what makes shadow IT so common and so hard to police.","Nation-state actors are external and highly resourced. Nobody attacked anything here.","Hacktivism is ideologically motivated disruption. No ideology or disruption is present."]}
];

const Q2 = [
// ---------- DOMAIN 3: Security Architecture (18%) ----------
{i:301,d:3,o:"3.1",t:"b",g:"cloud-responsibility",
q:"A company uses a SaaS payroll application. Under the shared responsibility model, which item remains the customer's responsibility?",
c:["Patching the application code","Securing the underlying hypervisor","Managing user accounts and access permissions","Maintaining physical data center security"],a:2,
e:"In SaaS the provider owns nearly the whole stack, but identity, access, and the data placed into the service always stay with the customer.",
w:["Application code is the provider's product in a SaaS model. They patch it.","The hypervisor sits deep in the provider's infrastructure and is never customer-facing in SaaS.","","Physical security is the provider's responsibility at every cloud service tier."]},

{i:302,d:3,o:"3.1",t:"m",g:"architecture-models",
q:"Which statement BEST describes serverless computing from a security standpoint?",
c:["The organization no longer manages the operating system, but remains responsible for its code and permissions","There are no servers involved, so the attack surface is eliminated","The provider assumes responsibility for the organization's application logic","It requires the organization to patch the container runtime"],a:0,
e:"Serverless shifts OS and runtime management to the provider. Function code, dependencies, secrets, and the permissions granted to those functions stay with the customer, and over-permissioned functions are a common finding.",
w:["","This is the marketing reading of the name. Servers exist, they are just abstracted away, and the attack surface moves rather than disappears.","Providers never take responsibility for your business logic in any cloud model.","Container runtime patching is a customer duty in a self-managed container platform, not in serverless."]},

{i:303,d:3,o:"3.2",t:"s",g:"failure-modes",
q:"A hospital's badge access system must never trap staff inside during a fire, even if the controller loses power. How should the door controls be configured?",
c:["Fail-closed, prioritizing security","Fail-open, prioritizing safety","Fail-closed with a manual override key","Fail-open with mandatory access control"],a:1,
e:"Fail-open means the control releases and allows passage on failure. When human life is at stake, safety outweighs the security loss, which is why egress doors fail open.",
w:["Fail-closed protects assets by denying passage on failure. Correct for a data center cage, dangerous for a fire exit full of people.","","The manual key is a nice thought, but it still requires someone to be present with it during an emergency. The design requirement is that failure itself is safe.","Mandatory access control is an authorization model, not a failure mode, and it does not address power loss at all."]},

{i:304,d:3,o:"3.2",t:"a",g:"firewall-types",
q:"An organization needs to block SQL injection and cross-site scripting attempts against a customer-facing web application. Which device is purpose-built for this?",
c:["NGFW","WAF","UTM","IDS"],a:1,
e:"A WAF (Web Application Firewall) inspects HTTP and HTTPS request content and understands web application attack patterns, which is exactly what SQL injection and XSS filtering requires.",
w:["An NGFW (Next-Generation Firewall) does deep packet inspection and application awareness, which makes it the strongest distractor. It identifies which application traffic is, but it is not specialized in web payload attacks the way a WAF is.","","A UTM (Unified Threat Management) appliance bundles many functions into one box. Broad coverage, but the question asks for the purpose-built answer.","An IDS (Intrusion Detection System) detects and alerts. It does not block, and the requirement is to block."]},

{i:305,d:3,o:"3.2",t:"b",g:"device-placement",
q:"Administrators must reach servers on an isolated management network. Security wants a single hardened, monitored point of entry rather than direct connections. Which appliance BEST fits?",
c:["Load balancer","Jump server","Forward proxy","Sensor"],a:1,
e:"A jump server is a hardened intermediary that administrators connect to first, concentrating administrative access into one auditable, monitored chokepoint.",
w:["A load balancer distributes client traffic across backend servers for availability. It is not an administrative access control.","","A forward proxy mediates outbound user traffic to the internet. Wrong direction and wrong purpose.","A sensor collects traffic for analysis. It observes, it does not provide access."]},

{i:306,d:3,o:"3.2",t:"m",g:"ids-ips-placement",
q:"Which deployment is required for a system to actively drop malicious packets before they reach the destination?",
c:["Passive tap with an IDS","Inline IPS","SPAN port with a network sensor","Out-of-band log collector"],a:1,
e:"Only a device physically in the traffic path can stop a packet. An inline IPS (Intrusion Prevention System) sits in the flow and can drop, reset, or modify traffic.",
w:["A passive tap gives the IDS a copy of traffic. Copies can be analyzed and alerted on, but the original packet has already moved on.","","A SPAN (Switched Port Analyzer) port mirrors traffic to a monitoring device. Same limitation as the tap: it sees, it cannot stop.","A log collector receives records after the fact. It is the furthest from real-time prevention."]},

{i:307,d:3,o:"3.3",t:"b",g:"data-protection-methods",
q:"A payment application must display the last four digits of a card number to support staff while ensuring the full number cannot be reconstructed from the application database, even by administrators. Which method BEST meets this?",
c:["Tokenization","Hashing","Masking","Full-disk encryption"],a:0,
e:"Tokenization replaces the card number with a meaningless surrogate value, with the real number held in a separate secure vault. The application database never contains recoverable card data.",
w:["","Hashing is one-way, which sounds appealing, but you cannot recover the value for legitimate transaction processing, and card numbers have a small enough keyspace to be brute-forced.","Masking is the strongest distractor because the question mentions showing the last four digits. Masking hides characters at display time, but the full value still sits in the database.","Full-disk encryption protects the drive at rest. An administrator with a running system and database access still sees the full numbers."]},

{i:308,d:3,o:"3.3",t:"m",g:"data-states",
q:"An analyst is asked to protect data in use. Which technology directly addresses this state?",
c:["TLS 1.3 for all connections","Full-disk encryption on endpoints","A trusted execution environment or secure enclave","Nightly encrypted backups"],a:2,
e:"Data in use is data loaded in memory and actively processed. A TEE (Trusted Execution Environment) or secure enclave isolates that processing so even a privileged OS cannot read it.",
w:["TLS protects data in transit. Correct technology, wrong state.","Full-disk encryption protects data at rest. Also correct technology, wrong state. These two options exist to test whether you can separate the three states.","","Backups are data at rest, stored elsewhere."]},

{i:309,d:3,o:"3.4",t:"b",g:"backup-types",
q:"A server is backed up in full on Sunday, then with backups on Monday through Saturday that each capture only what changed since Sunday. The Thursday drive fails. What is needed to restore?",
c:["Sunday full plus every daily backup Monday through Wednesday","Sunday full plus Wednesday's backup only","Wednesday's backup only","Sunday full plus Monday's backup only"],a:1,
e:"Backups measured against the last full backup are differential. You need only the full plus the single most recent differential, which is why differentials restore fast but grow larger each day.",
w:["This is the incremental restore procedure, and it is the most common wrong answer. Incrementals capture changes since the last backup of any type, so they must be applied in sequence. These backups reference Sunday every time, which makes them differential.","","A differential alone contains only changes, not the baseline. You cannot rebuild the system from it.","Monday's differential is stale by Thursday and would lose three days of changes."]},

{i:310,d:3,o:"3.4",t:"a",g:"rto-rpo",
q:"Leadership states the business can tolerate losing at most 15 minutes of transaction data in a disaster. Which metric are they defining?",
c:["RTO","RPO","MTTR","MTBF"],a:1,
e:"RPO (Recovery Point Objective) is the maximum acceptable amount of data loss, expressed as time. Fifteen minutes of tolerable loss drives backup or replication frequency.",
w:["RTO (Recovery Time Objective) is how long you may take to restore service. This pairing is the single most confused pair in Domain 3. RPO looks backward at data, RTO looks forward at downtime.","","MTTR (Mean Time To Repair) is the average time to fix a failed component. It is a measured average, not a target the business sets.","MTBF (Mean Time Between Failures) is a reliability statistic about how often something breaks."]},

{i:311,d:3,o:"3.4",t:"s",g:"site-considerations",
q:"An insurer needs a recovery site with hardware and network in place and data replicated nightly, but is willing to spend a day bringing it online to save cost. Which site type BEST fits?",
c:["Hot site","Warm site","Cold site","Mobile site"],a:1,
e:"A warm site has equipment and connectivity ready with reasonably current data, requiring some configuration and a final data load before it runs. That matches a roughly one-day recovery at moderate cost.",
w:["A hot site is fully live with real-time replication and near-instant failover. It would meet the need but contradicts the stated goal of saving cost by accepting a day of downtime.","","A cold site is space and power only. Standing it up takes weeks, not a day.","A mobile site is a transportable facility. It is a delivery method rather than a readiness tier."]},

{i:312,d:3,o:"3.4",t:"m",g:"high-availability",
q:"Which technology provides fault tolerance for a failed physical disk without requiring a restore from backup?",
c:["RAID 1","Differential backup","Journaling","Snapshot"],a:0,
e:"RAID 1 (Redundant Array of Independent Disks, level 1) mirrors data across drives so the system keeps running when one drive dies. It is fault tolerance, not backup.",
w:["","A differential backup is a recovery mechanism that requires downtime and a restore process. The question rules that out.","Journaling records pending changes to help maintain consistency after a crash. It does not survive a physical drive loss.","A snapshot captures a point in time on the same storage. If that storage fails, the snapshot goes with it."]},

{i:313,d:3,o:"3.1",t:"a",g:"ics-scada",
q:"A water treatment facility runs controllers that must respond to sensor input within guaranteed millisecond windows and cannot be taken offline for patching. Which two concepts are MOST relevant?",
c:["ICS/SCADA and RTOS","IaaS and SDN","MSP and MSSP","VDI and VLAN"],a:0,
e:"ICS/SCADA (Industrial Control Systems / Supervisory Control and Data Acquisition) describes the operational environment, and an RTOS (Real-Time Operating System) provides the guaranteed timing. Both are notoriously difficult to patch.",
w:["","IaaS (Infrastructure as a Service) and SDN (Software-Defined Networking) are cloud and network concepts with no timing guarantees.","MSP (Managed Service Provider) and MSSP (Managed Security Service Provider) are outsourcing arrangements, not control systems.","VDI (Virtual Desktop Infrastructure) and VLAN (Virtual Local Area Network) are end-user and segmentation technologies."]},

{i:314,d:3,o:"3.2",t:"b",g:"secure-access",
q:"A distributed workforce needs identity-aware access to cloud applications with security policy enforced at the edge rather than backhauled to headquarters. Which architecture BEST fits?",
c:["Site-to-site IPSec VPN","SASE","Screened subnet","Jump server"],a:1,
e:"SASE (Secure Access Service Edge) converges network connectivity and security services into a cloud-delivered edge, applying identity-based policy close to the user instead of forcing traffic back to a data center.",
w:["A site-to-site VPN links fixed offices. It is exactly the backhaul model the question rejects.","","A screened subnet is a DMZ design for hosting public-facing servers. It does not address distributed user access.","A jump server controls administrative access to internal systems, not workforce access to cloud apps."]},

{i:315,d:3,o:"3.3",t:"m",g:"data-classification",
q:"Which data classification applies to information whose disclosure is governed by external law, such as HIPAA-protected health records?",
c:["Proprietary","Regulated","Trade secret","Public"],a:1,
e:"Regulated data is subject to external legal or industry requirements that dictate how it must be handled, retained, and reported on.",
w:["Proprietary data is owned and valuable to the company but not necessarily governed by law.","","A trade secret derives value from being unknown, like a formula. Health records are not trade secrets.","Public data carries no disclosure restriction at all."]},

{i:316,d:3,o:"3.1",t:"b",g:"segmentation",
q:"A retailer must keep payment systems separate from the guest Wi-Fi network on the same physical infrastructure, with no physical rewiring. Which approach BEST accomplishes this?",
c:["Air gap","Logical segmentation with VLANs and firewall rules","Deploying a honeynet","Enabling full-disk encryption on point-of-sale terminals"],a:1,
e:"Logical segmentation divides one physical network into isolated broadcast domains, with firewall policy governing what may cross between them. No new cabling required.",
w:["An air gap requires complete physical separation, which contradicts the no-rewiring constraint.","","A honeynet is a decoy environment for studying attackers. It provides no separation for production traffic.","Full-disk encryption protects a stolen terminal's storage. It does nothing about network reachability between the two environments."]},

// ---------- DOMAIN 4: Security Operations (28%) ----------
{i:401,d:4,o:"4.1",t:"b",g:"secure-baselines",
q:"A company wants every new Windows server to start from a known, hardened configuration and to be flagged when it drifts. Which practice BEST supports this?",
c:["Establishing, deploying, and maintaining a secure baseline","Running a monthly vulnerability scan","Enabling host-based intrusion prevention","Requiring administrator approval for software installs"],a:0,
e:"The baseline is the documented secure configuration, deployment applies it consistently, and maintenance detects and corrects drift. The three-part cycle is what the objective tests.",
w:["","Scanning finds vulnerabilities but does not define or enforce a configuration standard.","HIPS (Host-based Intrusion Prevention System) blocks malicious behavior. It has no opinion about configuration drift.","Install approval is one hardening control that would live inside a baseline, not the overall practice."]},

{i:402,d:4,o:"4.1",t:"a",g:"wireless-security",
q:"An enterprise deploys wireless authentication where each user authenticates with their own directory credentials against a central AAA server, with no shared passphrase. Which combination is in use?",
c:["WPA3-Personal with SAE","WPA2-Personal with PSK","WPA3-Enterprise with 802.1X and RADIUS","WEP with a shared key"],a:2,
e:"Enterprise wireless uses 802.1X for port-based authentication and RADIUS (Remote Authentication Dial-In User Service) as the AAA server, so each user has individual credentials.",
w:["WPA3-Personal uses SAE (Simultaneous Authentication of Equals), which replaced the pre-shared key handshake. Stronger than WPA2-Personal, but still a shared passphrase.","WPA2-Personal uses a PSK (Pre-Shared Key), the single passphrase model the question explicitly rules out.","","WEP (Wired Equivalent Privacy) is deprecated and broken, and it is shared-key based."]},

{i:403,d:4,o:"4.2",t:"b",g:"asset-disposal",
q:"A hospital retires 200 drives containing patient data and must be able to prove to auditors that the data is unrecoverable. Which approach BEST satisfies the requirement?",
c:["Reformatting each drive and returning them to the vendor","Physical destruction with a certificate of destruction","Deleting all files and emptying the recycle bin","Encrypting the drives and storing them offsite"],a:1,
e:"Destruction renders the media unusable, and the certificate provides the documented proof of sanitization that auditors and regulators require.",
w:["Reformatting does not remove recoverable data, and no evidence is produced.","","Deletion only removes file table pointers. The data remains until overwritten.","Encrypting and storing still retains the media and the data. Crypto-shredding by destroying keys is a real technique, but retaining the drives offsite does not prove unrecoverability."]},

{i:404,d:4,o:"4.3",t:"b",g:"vuln-scanning",
q:"A vulnerability scan of internal servers returns far fewer findings than expected, and misses a known missing patch. The scanner had network access but no accounts. What is the MOST likely cause?",
c:["The scan was non-credentialed","The scanner signature database is out of date","The findings were false positives","The servers have host-based firewalls disabled"],a:0,
e:"A non-credentialed scan sees only what is exposed on the network. A credentialed scan logs in and reads installed patch levels and configuration, which is how missing patches are reliably found.",
w:["","An outdated signature set is plausible, but the question specifically highlights that the scanner had no accounts, which is the credentialed-versus-non-credentialed clue.","False positives are findings that are wrong. This scenario describes missing findings, which are false negatives. Watch that reversal.","Disabled host firewalls would make the scanner see more, not less."]},

{i:405,d:4,o:"4.3",t:"a",g:"cvss-cve",
q:"An analyst needs the standardized numeric severity rating for a specific published vulnerability. Which resource provides the score, and which provides the identifier?",
c:["CVE provides the score, CVSS provides the identifier","CVSS provides the score, CVE provides the identifier","SCAP provides the score, OVAL provides the identifier","CVSS provides both the score and the identifier"],a:1,
e:"CVSS (Common Vulnerability Scoring System) produces the 0.0 to 10.0 severity score. CVE (Common Vulnerabilities and Exposures) provides the unique identifier such as CVE-2024-1234.",
w:["This is the reversal, and it is the most commonly chosen wrong answer. Anchor it by the word Scoring inside CVSS.","","SCAP (Security Content Automation Protocol) is a framework of specifications, and OVAL (Open Vulnerability Assessment Language) describes system state. Neither is the score or the identifier.","CVSS scores but does not name. The naming is CVE's job."]},

{i:406,d:4,o:"4.3",t:"m",g:"code-analysis",
q:"Which technique examines application source code for vulnerabilities without executing the program?",
c:["Dynamic analysis","Static analysis","Fuzzing","Penetration testing"],a:1,
e:"Static analysis inspects source or compiled code at rest. It finds flaws early and cheaply, though it produces more false positives than runtime testing.",
w:["Dynamic analysis runs the application and observes behavior. Opposite of what is asked.","","Fuzzing feeds malformed input to a running program, which makes it a form of dynamic analysis.","Penetration testing exercises a live system. Also runtime."]},

{i:407,d:4,o:"4.4",t:"a",g:"siem-soar",
q:"A SOC wants alerts from many sources correlated into a single view, and separately wants repetitive containment steps executed automatically without an analyst. Which two tools address these needs, in order?",
c:["SOAR then SIEM","SIEM then SOAR","SCAP then SIEM","DLP then SOAR"],a:1,
e:"A SIEM (Security Information and Event Management) aggregates and correlates log data into alerts. A SOAR (Security Orchestration, Automation, and Response) platform executes automated playbooks against those alerts.",
w:["Correct tools, reversed order. The word Response inside SOAR is the anchor for the action half.","","SCAP (Security Content Automation Protocol) standardizes vulnerability and configuration content. It does no correlation.","DLP (Data Loss Prevention) watches for sensitive data leaving. It is not a correlation engine."]},

{i:408,d:4,o:"4.4",t:"s",g:"alert-tuning",
q:"A SIEM generates 900 alerts per day for a rule that has produced only two true positives in six months. Analysts have started ignoring the queue. What is the BEST response?",
c:["Disable the rule entirely","Tune the rule to reduce false positives","Hire additional analysts to work the queue","Increase the alert severity so it gets attention"],a:1,
e:"Alert tuning adjusts thresholds and conditions so the rule still catches real events while cutting noise. Alert fatigue is itself a security risk, and tuning addresses it without losing coverage.",
w:["Disabling is the overcorrection. The rule did catch two real events, so removing it creates a blind spot.","","More staff treats the symptom at high cost and leaves the noise in place.","Raising severity on a mostly false signal makes fatigue worse, not better."]},

{i:409,d:4,o:"4.5",t:"b",g:"firewall-rules",
q:"A firewall rule set permits inbound TCP 443 to the web tier, then permits inbound TCP 3389 from any source, then denies all. Which change BEST improves security posture?",
c:["Move the deny-all rule to the top","Remove the rule permitting 3389 from any source","Change the deny-all to an allow-all for troubleshooting","Reorder so 3389 is evaluated before 443"],a:1,
e:"Exposing RDP (Remote Desktop Protocol) on TCP 3389 to the entire internet is one of the most exploited misconfigurations. It should be removed and replaced with VPN or jump-host access.",
w:["Firewalls evaluate top down and stop at the first match. Putting deny-all first would block everything, including the legitimate web traffic.","","Allow-all removes the implicit deny that makes the rule set meaningful.","Reordering does not reduce exposure. The dangerous rule still permits the traffic."]},

{i:410,d:4,o:"4.5",t:"a",g:"email-security",
q:"An organization wants receiving mail servers to know what to do when a message fails authentication checks, and wants aggregate reports on spoofing attempts against its domain. Which record accomplishes this?",
c:["SPF","DKIM","DMARC","MX"],a:2,
e:"DMARC (Domain-based Message Authentication, Reporting, and Conformance) sits on top of SPF and DKIM. It publishes the policy for failures (none, quarantine, reject) and requests the aggregate reports.",
w:["SPF (Sender Policy Framework) lists which servers may send for a domain. It authenticates the sending host but sets no failure policy and returns no reports.","DKIM (DomainKeys Identified Mail) cryptographically signs messages so tampering is detectable. Also no policy or reporting layer.","","MX (Mail Exchange) records tell the internet where to deliver mail. Nothing to do with authentication."]},

{i:411,d:4,o:"4.5",t:"b",g:"dlp",
q:"An employee attempts to attach a spreadsheet of customer Social Security numbers to a personal webmail message. The action is blocked and security is notified. Which technology performed this?",
c:["Data loss prevention","Network access control","Endpoint detection and response","Web application firewall"],a:0,
e:"DLP (Data Loss Prevention) inspects content against patterns and classifications, then blocks or alerts when sensitive data attempts to leave through an unapproved channel.",
w:["","NAC (Network Access Control) decides whether a device may join the network. It does not inspect file content.","EDR (Endpoint Detection and Response) hunts malicious behavior and processes on hosts. Sensitive data content matching is not its role.","A WAF protects a web application from inbound attacks. Here data is going outbound from an employee."]},

{i:412,d:4,o:"4.5",t:"a",g:"nac",
q:"A laptop connects to the corporate LAN. Before it receives full network access, its patch level and antivirus status are checked and it is placed in a remediation VLAN if it fails. Which technology is in use?",
c:["NAC","XDR","UBA","EDR"],a:0,
e:"NAC (Network Access Control) performs posture assessment at connection time and can quarantine noncompliant devices until they are remediated.",
w:["","XDR (Extended Detection and Response) correlates threat telemetry across endpoints, network, and cloud. It detects attacks, it does not gate network admission.","UBA (User Behavior Analytics) baselines normal user activity and flags anomalies. Not an admission control.","EDR (Endpoint Detection and Response) monitors the endpoint for malicious behavior. It also does not control LAN admission."]},

{i:413,d:4,o:"4.6",t:"a",g:"sso-protocols",
q:"A company needs employees to sign in once and access a third-party SaaS application, with the identity provider passing signed authentication assertions to that application. Which standard is designed for this?",
c:["LDAP","SAML","OAuth","RADIUS"],a:1,
e:"SAML (Security Assertion Markup Language) is XML-based federated authentication. The identity provider issues a signed assertion that the service provider trusts, which is the classic enterprise web SSO pattern.",
w:["LDAP (Lightweight Directory Access Protocol) queries a directory for accounts and attributes. It authenticates against a directory, it does not federate to an external SaaS provider.","","OAuth is the strongest distractor. OAuth handles delegated authorization, granting an app permission to access resources on your behalf. It is about what an app may do, not proving who you are. OpenID Connect is the identity layer built on top of it.","RADIUS handles network device and remote access AAA, not web application federation."]},

{i:414,d:4,o:"4.6",t:"b",g:"access-control-models",
q:"A defense agency assigns every document a classification label and every user a clearance. The operating system enforces the comparison, and no document owner may override it. Which access control model is this?",
c:["Discretionary access control","Mandatory access control","Role-based access control","Attribute-based access control"],a:1,
e:"MAC (Mandatory Access Control) enforces labels and clearances centrally through the system. Owners cannot grant access, which is why it dominates military and intelligence environments.",
w:["DAC (Discretionary Access Control) lets the data owner decide who gets access. The question explicitly removes that ability, which is the giveaway.","","RBAC (Role-Based Access Control) grants access by job function. Common in business, but no clearance labels are involved.","ABAC (Attribute-Based Access Control) evaluates multiple attributes such as department, device, location, and time. More flexible, but not label-and-clearance based."]},

{i:415,d:4,o:"4.6",t:"b",g:"mfa-factors",
q:"A login requires a password and a fingerprint. A proposal adds a hardware token. Which factors would then be in use?",
c:["Something you know and something you have only","Something you know, something you are, and something you have","Something you are and somewhere you are","Something you know and something you do"],a:1,
e:"Password is something you know, fingerprint is something you are, and a hardware token is something you have. Three distinct factors.",
w:["This drops the biometric entirely, which is the fingerprint.","","Somewhere you are is geolocation, which is not present in this scenario.","Something you do refers to behavioral characteristics such as typing rhythm. Not described here."]},

{i:416,d:4,o:"4.6",t:"a",g:"pam",
q:"Administrators no longer hold standing domain admin rights. Instead they request elevated access for a specific task, receive it for 30 minutes, and it expires automatically. Which capability is this?",
c:["Just-in-time permissions","Password vaulting","Federation","Attestation"],a:0,
e:"JIT (just-in-time) permissions grant privilege only for the moment it is needed and revoke it automatically, which eliminates the standing privilege attackers love to find.",
w:["","Password vaulting stores and rotates privileged credentials in a secure repository. Related PAM (Privileged Access Management) capability, but it manages secrets rather than time-bounding rights.","Federation extends identity across organizational boundaries. Not a privilege duration control.","Attestation is the periodic review confirming that existing access is still appropriate. It is a review process, not a time-limited grant."]},

{i:417,d:4,o:"4.8",t:"b",g:"incident-response-phases",
q:"Malware is confirmed on 12 workstations. The team isolates those machines from the network while investigation continues. Which incident response phase does this action belong to?",
c:["Detection","Containment","Eradication","Recovery"],a:1,
e:"Containment limits the incident's spread and damage while the team works. Isolating affected hosts is the textbook containment action.",
w:["Detection is identifying that an incident occurred. That already happened when the malware was confirmed.","","Eradication is removing the malware and closing the entry point. That comes after containment stops the bleeding.","Recovery is returning systems to normal production and validating them. Last of the four listed here."]},

{i:418,d:4,o:"4.8",t:"m",g:"ir-testing",
q:"Which incident response exercise involves the team discussing their roles and decisions around a conference table, without touching production systems?",
c:["Simulation","Tabletop exercise","Failover test","Penetration test"],a:1,
e:"A tabletop exercise walks through a scenario in discussion form. It is low cost, low risk, and effective at surfacing gaps in the plan and in role clarity.",
w:["A simulation injects a realistic scenario and may involve live actions such as a mock phishing campaign. More hands-on than what is described.","","A failover test actually moves production to a secondary site. Very much touching production.","A penetration test is an authorized attack against systems, not a plan review."]},

{i:419,d:4,o:"4.8",t:"b",g:"forensics",
q:"An organization anticipates litigation over a security incident. Which step must be taken FIRST regarding potentially relevant data?",
c:["Begin forensic imaging of all endpoints","Issue a legal hold to suspend routine deletion","Notify affected customers","Restore systems from backup to resume operations"],a:1,
e:"A legal hold suspends normal retention and deletion so that potentially relevant evidence is preserved. Failing to issue it promptly can result in spoliation claims.",
w:["Imaging is important, but it is meaningless if automated retention policies are still purging mailboxes and logs elsewhere. Preservation comes first and is broader.","","Customer notification is driven by regulatory timelines and comes after facts are established.","Restoring from backup can overwrite evidence and is one of the fastest ways to destroy a case."]},

{i:420,d:4,o:"4.8",t:"m",g:"chain-of-custody",
q:"Which forensic concept documents every person who handled a piece of evidence, along with when and why?",
c:["Chain of custody","Legal hold","E-discovery","Acquisition"],a:0,
e:"Chain of custody is the unbroken documented record of evidence handling. A gap in it can make evidence inadmissible regardless of what it proves.",
w:["","Legal hold preserves data from deletion. It does not track handling.","E-discovery is the process of identifying and producing electronically stored information for legal proceedings.","Acquisition is the act of collecting the evidence, typically by creating a forensic image. It is one event in the chain, not the record of the whole chain."]},

{i:421,d:4,o:"4.9",t:"b",g:"log-sources",
q:"An analyst must determine whether a specific external IP address ever completed a TCP connection to an internal database server, and needs full payload content. Which source is BEST?",
c:["Firewall logs","NetFlow records","Full packet capture","Endpoint logs"],a:2,
e:"Only a full packet capture contains actual payload content. Flow and firewall data describe that a conversation occurred, not what was said.",
w:["Firewall logs record allow and deny decisions with addresses and ports. They confirm the connection but hold no payload.","NetFlow summarizes conversations by source, destination, port, and byte counts. Excellent for scale, but metadata only.","","Endpoint logs describe host activity. They may show the database process but will not contain wire-level payload."]},

{i:422,d:4,o:"4.4",t:"a",g:"monitoring-tools",
q:"A network team wants devices to push notifications to a central manager when a threshold such as interface error rate is exceeded. Which mechanism provides this?",
c:["SNMP traps","NetFlow exports","SCAP benchmarks","Syslog facility codes"],a:0,
e:"SNMP (Simple Network Management Protocol) traps are unsolicited messages pushed from a managed device to the manager when a defined condition occurs.",
w:["","NetFlow exports describe traffic flows. They are continuous statistics rather than threshold-triggered notifications.","SCAP (Security Content Automation Protocol) benchmarks measure configuration compliance. Not an event notification mechanism.","Syslog does forward event messages and is a genuinely close alternative, but facility codes simply categorize messages. The threshold-driven push from a network device is the SNMP trap pattern."]},

{i:423,d:4,o:"4.7",t:"b",g:"automation",
q:"A company wants new-hire accounts created, group memberships assigned, and a ticket closed automatically when HR marks a hire as complete. Which benefit is the PRIMARY security argument for this?",
c:["Reduced licensing cost","Consistent enforcement of least privilege through repeatable provisioning","Faster onboarding for the business","Elimination of the need for access reviews"],a:1,
e:"Automation removes human variability, so every account is provisioned to the same standard every time. Consistency is the security value, and it also produces a clean audit trail.",
w:["Cost reduction may be real but is a business argument, not a security one.","","Speed is the business benefit. The question asks specifically for the security argument, which is a common CompTIA qualifier.","Automation never eliminates access reviews. Attestation remains necessary because roles and needs change over time."]},

{i:424,d:4,o:"4.5",t:"b",g:"web-filter",
q:"A company must block access to gambling and malware-hosting sites for remote laptops that never connect through the corporate network. Which implementation BEST fits?",
c:["Centralized proxy with URL scanning","Agent-based web filtering","A screened subnet at headquarters","An inline network IPS"],a:1,
e:"Agent-based filtering enforces policy on the device itself, so protection follows the laptop regardless of where it connects. A centralized proxy only works when traffic passes through it.",
w:["A centralized proxy is the tempting answer because proxies are the classic web filtering tool. But the scenario states the laptops never traverse the corporate network, so nothing would reach the proxy.","","A screened subnet protects public-facing servers at the corporate site. Irrelevant to a remote laptop.","An inline IPS also requires the traffic to pass through the corporate network."]},

// ---------- DOMAIN 5: Security Program Management and Oversight (20%) ----------
{i:501,d:5,o:"5.1",t:"b",g:"policy-hierarchy",
q:"A document states that all company laptops must use AES-256 full-disk encryption. A separate document states only that company data must be protected from unauthorized disclosure. Which is which?",
c:["The first is a policy, the second is a standard","The first is a standard, the second is a policy","Both are policies","The first is a guideline, the second is a procedure"],a:1,
e:"Policies state intent and direction at a high level. Standards specify the mandatory technical requirements that carry the policy out. AES-256 is a specific mandatory requirement, so it is a standard.",
w:["This is the reversal, and it is the most-missed item in Domain 5. Anchor it: policy says what and why, standard says exactly how much or which one.","","They operate at different levels of the hierarchy, so they cannot both be policies.","A guideline is optional advice, and neither document is optional. A procedure is a step-by-step task list, which neither one is."]},

{i:502,d:5,o:"5.1",t:"a",g:"governance-roles",
q:"Under privacy regulations, which role determines the purposes and means of processing personal data, and which role acts only on that party's instructions?",
c:["Data custodian determines, data owner acts","Data controller determines, data processor acts","Data processor determines, data controller acts","Data subject determines, data steward acts"],a:1,
e:"The controller decides why and how personal data is processed. The processor handles the data solely on the controller's documented instructions, which is why processor contracts are so specific.",
w:["The custodian is the hands-on technical caretaker, and the owner holds accountability for the data. Neither term maps to the regulatory controller and processor pair.","","This is the reversal. Anchor it by the word control: the controller is in control of the decisions.","The data subject is the individual the data is about. The steward manages data quality and usage. Neither fits."]},

{i:503,d:5,o:"5.2",t:"s",g:"risk-calculation",
q:"A server worth $200,000 would lose 25 percent of its value in a flood, and flooding is expected once every 20 years. What is the annualized loss expectancy?",
c:["$50,000","$10,000","$2,500","$1,000,000"],a:2,
e:"SLE (Single Loss Expectancy) equals asset value times exposure factor, so $200,000 times 0.25 equals $50,000. ARO (Annualized Rate of Occurrence) is once per 20 years, or 0.05. ALE equals SLE times ARO, so $50,000 times 0.05 equals $2,500.",
w:["$50,000 is the SLE, the loss from a single event. Stopping there is the most common error because the number appears mid-calculation.","$10,000 comes from multiplying the full asset value by 0.05 and skipping the exposure factor.","","$1,000,000 comes from multiplying by 20 instead of dividing. Watch the direction of the frequency conversion."]},

{i:504,d:5,o:"5.2",t:"b",g:"risk-strategies",
q:"After analysis, a company decides that the cost of mitigating a low-impact risk exceeds the potential loss, documents this decision, and takes no further action. Which risk strategy is this?",
c:["Risk avoidance","Risk transference","Risk acceptance","Risk mitigation"],a:2,
e:"Acceptance is a deliberate, documented decision to live with a risk because treating it is not justified. The documentation is what separates acceptance from negligence.",
w:["Avoidance means eliminating the activity that creates the risk entirely, such as discontinuing a service.","Transference shifts financial impact to another party, typically through insurance or a contract clause.","","Mitigation means applying controls to reduce likelihood or impact. The company explicitly chose not to do this."]},

{i:505,d:5,o:"5.2",t:"m",g:"risk-appetite",
q:"Which term describes the broad amount of risk an organization is willing to pursue in order to meet its objectives?",
c:["Risk tolerance","Risk appetite","Risk threshold","Residual risk"],a:1,
e:"Risk appetite is the strategic, board-level statement of how much risk the organization will take on. It is usually expressed as expansionary, conservative, or neutral.",
w:["Risk tolerance is the acceptable variation around a specific objective. It is narrower and more operational than appetite, and this pair is heavily tested.","","A risk threshold is the specific trigger point at which action is required. More granular still.","Residual risk is what remains after controls are applied. Different concept entirely."]},

{i:506,d:5,o:"5.3",t:"a",g:"agreements",
q:"Two organizations enter a formal, legally binding contract establishing general terms that will govern all future work orders between them. Which document is this?",
c:["MOU","MSA","SLA","NDA"],a:1,
e:"An MSA (Master Service Agreement) sets the overarching legal terms once, so each subsequent SOW (Statement of Work) or work order only needs to define the specific deliverables.",
w:["An MOU (Memorandum of Understanding) records mutual intent and is generally not legally binding, which is the detail the question rules out with the word binding.","","An SLA (Service Level Agreement) defines measurable performance commitments such as uptime. It governs quality, not the overall legal relationship.","An NDA (Non-Disclosure Agreement) protects confidential information. Narrow in scope."]},

{i:507,d:5,o:"5.3",t:"b",g:"vendor-assessment",

q:"Before signing with a cloud provider, a bank wants contractual authority to inspect the provider's security controls directly. Which contract element BEST provides this?",
c:["Right-to-audit clause","Service level agreement","Non-disclosure agreement","Evidence of internal audits"],a:0,
e:"A right-to-audit clause is the negotiated contractual permission for the customer or their representative to examine the vendor's controls. Without it in writing, you have no such authority.",
w:["","An SLA sets performance targets and penalties. It does not grant inspection rights.","An NDA governs confidentiality of shared information. Unrelated to inspection authority.","Evidence of internal audits is a report the vendor gives you. Useful, but it is the vendor's own assessment rather than your right to look for yourself."]},

{i:508,d:5,o:"5.5",t:"b",g:"audits-assessments",
q:"An organization hires an unaffiliated firm to evaluate its controls against a framework and issue an opinion that customers will rely on. Which type of assessment is this?",
c:["Internal self-assessment","Independent third-party audit","Regulatory examination","Tabletop exercise"],a:1,
e:"An independent third-party audit is performed by an external party with no stake in the outcome, which is what gives the resulting opinion credibility with customers and partners.",
w:["A self-assessment is performed by the organization on itself. It lacks the independence the scenario requires.","","A regulatory examination is conducted by a government regulator with enforcement authority, not hired by the organization for customer assurance.","A tabletop exercise tests incident response readiness. It is not a controls audit."]},

{i:509,d:5,o:"5.5",t:"b",g:"pentest-types",
q:"A company hires testers and gives them nothing beyond the company name, wanting the engagement to mirror what an external attacker would face. Which environment type is this?",
c:["Known environment","Partially known environment","Unknown environment","Integrated assessment"],a:2,
e:"An unknown environment test, formerly called black box, gives the tester no internal information. It best simulates an outside attacker but spends significant time on reconnaissance.",
w:["A known environment test, formerly white box, provides full documentation, source, and architecture. Efficient but not attacker-realistic.","A partially known environment, formerly gray box, provides limited information such as credentials or a network diagram.","","An integrated assessment combines offensive and defensive teams working together. It describes team structure, not information level."]},

{i:510,d:5,o:"5.5",t:"m",g:"recon-types",
q:"During a penetration test, the tester queries public DNS records, reviews the company's LinkedIn presence, and reads SEC filings. Which activity is this?",
c:["Active reconnaissance","Passive reconnaissance","Exploitation","Privilege escalation"],a:1,
e:"Passive reconnaissance gathers information from third-party and public sources without touching the target's systems, so it generates no logs on the target.",
w:["Active reconnaissance interacts directly with the target, such as port scanning, and can be detected.","","Exploitation is using a vulnerability to gain access. No access is attempted here.","Privilege escalation happens after access is gained."]},

{i:511,d:5,o:"5.6",t:"b",g:"security-awareness",
q:"After a successful phishing attack, a company wants the change with the greatest effect on how quickly future attacks are detected. Which is BEST?",
c:["Longer password requirements","Training users to recognize and report suspicious messages","Increasing email attachment size limits","Adding a second antivirus product"],a:1,
e:"Users are the sensors that see phishing first. Training that pairs recognition with a frictionless reporting path turns the workforce into an early-warning system.",
w:["Password length does not affect detection speed at all, and phishing often captures the password regardless of length.","","Attachment size limits are unrelated to detection.","A second antivirus product adds conflicts and cost without improving human detection of social engineering."]},

{i:512,d:5,o:"5.1",t:"m",g:"governance-structures",
q:"Which governance structure is characterized by decision-making authority distributed to individual business units rather than held by a single central body?",
c:["Centralized governance","Decentralized governance","Regulatory governance","Committee governance"],a:1,
e:"Decentralized governance pushes authority outward to units, which increases responsiveness and local fit but makes consistency and enterprise-wide visibility harder.",
w:["Centralized governance concentrates authority in one body, producing consistency at the cost of agility.","","Regulatory bodies are external entities that impose requirements. Not an internal structure choice.","Committees are a mechanism that can exist within either model. It is not the answer to centralized versus distributed."]},

{i:513,d:5,o:"5.4",t:"b",g:"compliance",
q:"A regulated firm fails an examination. Which of the following is a consequence of non-compliance that is NOT financial?",
c:["Regulatory fines","Loss of license to operate","Contractual penalties","Increased insurance premiums"],a:1,
e:"Losing the license to operate is an existential, non-monetary consequence. The business simply cannot continue in that market regardless of ability to pay.",
w:["Fines are the definitional financial penalty.","","Contractual penalties are monetary damages owed to counterparties.","Higher premiums are an ongoing financial cost."]},

{i:514,d:5,o:"5.4",t:"m",g:"privacy",
q:"A customer requests that a company delete all personal data it holds about them. Which privacy concept does this request invoke?",
c:["Data minimization","Right to be forgotten","Data sovereignty","Purpose limitation"],a:1,
e:"The right to be forgotten, or right to erasure, lets a data subject require deletion of their personal data when there is no overriding lawful basis to retain it.",
w:["Data minimization is the principle of collecting only what is necessary. It governs collection, not deletion on request.","","Data sovereignty concerns which country's laws apply based on where data physically resides.","Purpose limitation restricts using data beyond the purpose it was collected for. Related, but not a deletion right."]}
];

const CARDS = [
// DOMAIN 1
{d:1,o:"1.1",g:"control-categories",f:"Name the four control CATEGORIES.",b:"Technical, Managerial, Operational, Physical. Category answers WHO or WHAT implements it."},
{d:1,o:"1.1",g:"control-types",f:"Name the six control TYPES.",b:"Preventive, Deterrent, Detective, Corrective, Compensating, Directive. Type answers WHAT IT DOES."},
{d:1,o:"1.1",g:"control-types",f:"Deterrent vs Preventive control: what is the real difference?",b:"Deterrent discourages an attacker who could still proceed (warning sign, visible camera). Preventive physically or logically stops the action (locked door, ACL)."},
{d:1,o:"1.1",g:"compensating-controls",f:"When is a control called compensating?",b:"When the required control cannot be implemented and an alternative stands in for it. The trigger is always 'we could not do X, so we did Y instead.'"},
{d:1,o:"1.1",g:"control-types",f:"Give an example of a directive control.",b:"A policy, standard, or posted instruction telling people what they must do. It directs behavior rather than enforcing it technically."},
{d:1,o:"1.2",g:"cia-triad",f:"What does the CIA triad stand for, and what does each protect against?",b:"Confidentiality (unauthorized disclosure), Integrity (unauthorized alteration), Availability (loss of access)."},
{d:1,o:"1.2",g:"non-repudiation",f:"Define non-repudiation and name the technology that delivers it.",b:"Proof that a party cannot credibly deny an action. Delivered by digital signatures using the signer's private key."},
{d:1,o:"1.2",g:"aaa",f:"What are the three A's in AAA, and what does the third one actually do?",b:"Authentication (who are you), Authorization (what may you do), Accounting (what did you do). Accounting is the logging and audit record."},
{d:1,o:"1.2",g:"zero-trust",f:"Name the three Zero Trust control plane components and their jobs.",b:"Policy Engine decides. Policy Administrator communicates the decision and establishes or kills the session. Policy Enforcement Point executes."},
{d:1,o:"1.2",g:"zero-trust",f:"What is an Implicit Trust Zone in Zero Trust?",b:"The area a subject reaches after passing the Policy Enforcement Point. Access there is granted only for the approved session."},
{d:1,o:"1.2",g:"deception",f:"Honeypot vs honeynet vs honeyfile vs honeytoken.",b:"Honeypot: one decoy system. Honeynet: a whole decoy network. Honeyfile: a decoy file used as a tripwire. Honeytoken: fake data tracked wherever it goes."},
{d:1,o:"1.2",g:"physical-controls",f:"What is the difference between an access control vestibule and a turnstile?",b:"A vestibule is a two-door airlock preventing tailgating by allowing only one person through at a time. A turnstile controls flow but is easier to defeat."},
{d:1,o:"1.3",g:"change-management",f:"Name five elements of a formal change request.",b:"Approval by the CAB, ownership, stakeholder identification, impact analysis, test results, backout plan, maintenance window, and standard operating procedure."},
{d:1,o:"1.3",g:"change-management",f:"What is a backout plan and why is it required?",b:"The documented steps to return a system to its previous working state if the change fails. It is the safety net for every approved change."},
{d:1,o:"1.4",g:"asymmetric-direction",f:"To send something ONLY the recipient can read, whose key do you encrypt with?",b:"The recipient's PUBLIC key. Only their private key can decrypt it."},
{d:1,o:"1.4",g:"asymmetric-direction",f:"To prove YOU sent something, whose key do you encrypt (sign) with?",b:"Your own PRIVATE key. Anyone with your public key can verify it, which is what gives non-repudiation."},
{d:1,o:"1.4",g:"hashing-salting",f:"What does a salt do, and what attack does it defeat?",b:"A unique random value added before hashing. It defeats rainbow tables because every user's hash needs its own precomputed table."},
{d:1,o:"1.4",g:"key-stretching",f:"What is key stretching, and name two algorithms.",b:"Deliberately slowing hashing to make guessing expensive. PBKDF2 and bcrypt are the common examples."},
{d:1,o:"1.4",g:"encryption-levels",f:"List the encryption levels from broadest to narrowest.",b:"Full-disk, partition, volume, file, database, record. Narrower means more granular control and more overhead."},
{d:1,o:"1.4",g:"tpm-hsm",f:"TPM vs HSM: what is the distinction?",b:"TPM is a chip on a single device's motherboard, typically for full-disk encryption keys. HSM is a dedicated appliance managing keys at enterprise scale."},
{d:1,o:"1.4",g:"cert-lifecycle",f:"CSR, CRL, OCSP: what stage is each?",b:"CSR requests issuance. CRL is the downloadable list of revoked certs. OCSP checks one cert's status in real time; stapling has the server present it."},
{d:1,o:"1.4",g:"certificates",f:"What does a SAN certificate do?",b:"Subject Alternative Name lets one certificate cover multiple specific hostnames or domains."},
{d:1,o:"1.4",g:"obfuscation",f:"Steganography, tokenization, and data masking: what does each do?",b:"Steganography hides data inside other media. Tokenization swaps the value for a meaningless surrogate. Masking hides part of the value at display time."},
{d:1,o:"1.4",g:"key-escrow",f:"What is key escrow?",b:"A trusted third party holds a copy of keys so encrypted data can be recovered if keys are lost. It trades availability against confidentiality risk."},

// DOMAIN 2
{d:2,o:"2.1",g:"threat-actors",f:"Rank these by typical resources: nation-state, organized crime, hacktivist, unskilled attacker.",b:"Nation-state (highest), organized crime, hacktivist, unskilled attacker (lowest)."},
{d:2,o:"2.1",g:"actor-motivations",f:"What primarily motivates organized crime versus a nation-state?",b:"Organized crime: financial gain. Nation-state: espionage, data exfiltration, war, and philosophical or political objectives."},
{d:2,o:"2.1",g:"shadow-it",f:"Define shadow IT and why it is dangerous.",b:"Unsanctioned technology adopted by employees to get work done. Intent is productive, but the organization loses visibility, control, and data governance."},
{d:2,o:"2.1",g:"threat-vectors",f:"Name six common threat vectors.",b:"Message-based (email, SMS, IM), image-based, file-based, voice call, removable device, vulnerable software, unsupported systems, unsecure networks, open ports, default credentials, supply chain."},
{d:2,o:"2.2",g:"social-engineering",f:"Phishing, vishing, smishing, whaling: differentiate.",b:"Phishing is email. Vishing is voice. Smishing is SMS. Whaling targets a high-value executive."},
{d:2,o:"2.2",g:"social-engineering",f:"What is pretexting?",b:"Inventing a believable backstory or scenario that gives the attacker a reason to be making the request."},
{d:2,o:"2.2",g:"social-engineering",f:"Tailgating vs piggybacking.",b:"Tailgating: entering behind someone without their knowledge or consent. Piggybacking: the authorized person knowingly lets you in."},
{d:2,o:"2.2",g:"social-engineering",f:"Watering hole attack: what makes it effective?",b:"The attacker compromises a legitimate site the target group already trusts and visits routinely, so no lure is needed."},
{d:2,o:"2.2",g:"social-engineering",f:"Typosquatting vs pharming.",b:"Typosquatting registers a lookalike domain and waits for a mistyped URL. Pharming poisons DNS or hosts files so the correct address goes to a fake site."},
{d:2,o:"2.2",g:"social-engineering",f:"What is BEC?",b:"Business Email Compromise. A spoofed or hijacked internal mailbox is used to authorize fraudulent payments or data release."},
{d:2,o:"2.3",g:"vuln-types",f:"Race condition: what are TOC and TOU?",b:"Time-of-check and time-of-use. The vulnerability is the gap between validating a condition and acting on it, during which state can change."},
{d:2,o:"2.3",g:"vuln-types",f:"What is a zero-day vulnerability?",b:"A flaw unknown to the vendor with no patch available, so defenders have had zero days to fix it."},
{d:2,o:"2.3",g:"vuln-types",f:"Name four mobile-specific vulnerabilities.",b:"Side loading (installing outside the approved store), jailbreaking or rooting, insecure Bluetooth, and unpatched or unsupported OS versions."},
{d:2,o:"2.3",g:"vuln-types",f:"VM escape vs resource reuse.",b:"VM escape breaks out of a guest to reach the hypervisor or other guests. Resource reuse means memory or storage released by one tenant is handed to another with data still present."},
{d:2,o:"2.3",g:"supply-chain",f:"Name three supply chain attack surfaces.",b:"Service providers (MSPs), hardware providers, and software providers including their build pipelines and dependencies."},
{d:2,o:"2.4",g:"malware-types",f:"Worm vs virus: the one-line difference.",b:"A worm self-propagates across networks with no user action. A virus needs a host file and a user to spread it."},
{d:2,o:"2.4",g:"malware-types",f:"What defines a logic bomb?",b:"Dormant code that executes when a specific condition is met, such as a date or the absence of an employee record."},
{d:2,o:"2.4",g:"malware-types",f:"What does a rootkit specifically do?",b:"Operates at kernel or boot level to hide files, processes, and connections from the operating system and the tools running on it."},
{d:2,o:"2.4",g:"malware-types",f:"RAT, spyware, keylogger, bloatware: quick differentiation.",b:"RAT gives remote control. Spyware collects information. Keylogger captures keystrokes. Bloatware is unwanted preinstalled software."},
{d:2,o:"2.4",g:"network-attacks",f:"Amplification vs reflection in a DDoS.",b:"Amplification means a small request yields a much larger response. Reflection means spoofing the victim's address so responses land on them. Most large attacks use both."},
{d:2,o:"2.4",g:"network-attacks",f:"Why does ARP poisoning work at all?",b:"ARP has no authentication. Any host can send an unsolicited reply mapping an IP to its own MAC, and the switch and hosts will believe it."},
{d:2,o:"2.4",g:"network-attacks",f:"What is a credential replay attack?",b:"Capturing valid authentication traffic and resending it to impersonate the user. Defeated by timestamps, nonces, and session tokens."},
{d:2,o:"2.4",g:"password-attacks",f:"Password spraying vs credential stuffing vs brute force.",b:"Spraying: one password against many accounts. Stuffing: known username and password pairs from another breach. Brute force: many passwords against one account."},
{d:2,o:"2.4",g:"crypto-attacks",f:"Birthday attack, collision, and downgrade: what does each target?",b:"Birthday and collision attack hashing by finding two inputs with the same output. Downgrade attacks protocol negotiation to force a weaker version."},
{d:2,o:"2.4",g:"application-attacks",f:"XSS vs CSRF in one line each.",b:"XSS injects script that runs in the victim's browser. CSRF tricks the victim's browser into sending an authenticated request the user never intended."},
{d:2,o:"2.4",g:"application-attacks",f:"What is directory traversal?",b:"Using path sequences such as ../ to read files outside the intended web root."},
{d:2,o:"2.4",g:"application-attacks",f:"Buffer overflow: what actually goes wrong?",b:"Input larger than the allocated buffer writes past its boundary into adjacent memory, which can overwrite control data and redirect execution."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"Name eight mitigation techniques from objective 2.5.",b:"Segmentation, access control (ACL and permissions), application allow list, isolation, patching, encryption, monitoring, least privilege, configuration enforcement, decommissioning, and hardening."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"Allow list vs deny list: which is more secure and why?",b:"Allow list. Only explicitly approved items run, so anything unknown is blocked by default. A deny list can only block what you already know about."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"What is a data diode or unidirectional gateway used for?",b:"Permitting data to flow out of a sensitive network while making inbound traffic physically impossible. Common in OT and ICS environments."},

// DOMAIN 3
{d:3,o:"3.1",g:"cloud-responsibility",f:"In IaaS, PaaS, and SaaS, what always stays with the customer?",b:"Data and identity or access management. No matter the model, you own your data and who can reach it."},
{d:3,o:"3.1",g:"architecture-models",f:"Serverless: what does the customer still own?",b:"Function code, dependencies, secrets, and the permissions granted to the function. Over-permissioned functions are a top finding."},
{d:3,o:"3.1",g:"architecture-models",f:"Microservices vs monolithic architecture security tradeoff.",b:"Microservices isolate failure and limit blast radius, but multiply the number of network interfaces and identities to secure."},
{d:3,o:"3.1",g:"ics-scada",f:"Why are ICS, SCADA, and RTOS environments hard to secure?",b:"They prioritize availability and deterministic timing, often cannot be taken offline for patching, and frequently run unsupported software."},
{d:3,o:"3.1",g:"segmentation",f:"Air gap vs logical segmentation.",b:"Air gap means no physical connection at all. Logical segmentation uses VLANs and firewall policy on shared physical infrastructure."},
{d:3,o:"3.2",g:"failure-modes",f:"Fail-open vs fail-closed: which do you use where?",b:"Fail-open prioritizes availability and human safety (emergency egress). Fail-closed prioritizes security (data center cage, firewall on failure)."},
{d:3,o:"3.2",g:"ids-ips-placement",f:"Inline vs tap/monitor: what capability does each give you?",b:"Inline sits in the traffic path and can block. Tap or monitor receives a copy and can only detect and alert."},
{d:3,o:"3.2",g:"firewall-types",f:"WAF vs NGFW vs UTM vs Layer 4 firewall.",b:"WAF inspects web application payloads. NGFW adds application awareness and deep inspection. UTM bundles many functions in one box. Layer 4 filters on ports and protocols only."},
{d:3,o:"3.2",g:"device-placement",f:"What is a jump server for?",b:"A hardened, monitored single point of entry through which administrators reach protected systems, concentrating admin access for auditing."},
{d:3,o:"3.2",g:"secure-access",f:"SASE vs SD-WAN.",b:"SD-WAN optimizes and manages WAN connectivity across links. SASE converges that connectivity with cloud-delivered security enforced at the edge by identity."},
{d:3,o:"3.2",g:"port-security",f:"What does 802.1X do?",b:"Port-based network access control. A device must authenticate, usually via EAP to a RADIUS server, before the switch port passes traffic."},
{d:3,o:"3.3",g:"data-types",f:"Name the data classifications in objective 3.3.",b:"Regulated, trade secret, intellectual property, legal information, financial information, human-readable, and non-human-readable."},
{d:3,o:"3.3",g:"data-states",f:"Name the three data states and one protection for each.",b:"At rest: full-disk or database encryption. In transit: TLS or IPSec. In use: trusted execution environment or secure enclave."},
{d:3,o:"3.3",g:"data-protection-methods",f:"Tokenization vs masking vs encryption.",b:"Tokenization substitutes a meaningless value with the real one held in a vault. Masking hides characters at display. Encryption transforms data reversibly with a key."},
{d:3,o:"3.3",g:"data-sovereignty",f:"What is data sovereignty?",b:"The principle that data is subject to the laws of the country where it is physically stored, which drives geographic restrictions on cloud regions."},
{d:3,o:"3.4",g:"backup-types",f:"Full, incremental, and differential: what does each capture and what does restore require?",b:"Full: everything. Incremental: changes since the last backup of any type, restore needs full plus all incrementals in order. Differential: changes since the last full, restore needs full plus the latest differential only."},
{d:3,o:"3.4",g:"rto-rpo",f:"RPO vs RTO in one line each.",b:"RPO is how much DATA you can afford to lose, measured backward in time. RTO is how long you can afford to be DOWN, measured forward."},
{d:3,o:"3.4",g:"rto-rpo",f:"MTTR vs MTBF.",b:"MTTR is the average time to repair a failed component. MTBF is the average time between failures. One measures recovery speed, the other measures reliability."},
{d:3,o:"3.4",g:"site-considerations",f:"Hot, warm, and cold site: readiness and cost.",b:"Hot: fully live with current data, near-instant failover, highest cost. Warm: equipment ready, data somewhat current, hours to a day. Cold: space and power only, cheapest, weeks."},
{d:3,o:"3.4",g:"high-availability",f:"Is RAID a backup?",b:"No. RAID provides fault tolerance against drive failure. It replicates deletions and ransomware encryption instantly, so it does not protect against them."},
{d:3,o:"3.4",g:"resilience",f:"What does capacity planning cover in objective 3.4?",b:"People, technology, and infrastructure. Enough staff, enough compute, and enough physical capacity to absorb demand or failure."},
{d:3,o:"3.4",g:"power",f:"UPS vs generator.",b:"A UPS provides immediate battery power for seconds to minutes, bridging the gap. A generator provides sustained power for hours or days but takes time to start."},

// DOMAIN 4
{d:4,o:"4.1",g:"secure-baselines",f:"Name the three baseline activities.",b:"Establish the baseline, deploy it consistently, and maintain it by detecting and correcting drift."},
{d:4,o:"4.1",g:"hardening",f:"List five hardening techniques.",b:"Encryption, endpoint protection installation, host-based firewall, HIPS, disabling unused ports and protocols, changing default passwords, and removing unnecessary software."},
{d:4,o:"4.1",g:"mobile-deployment",f:"BYOD, COPE, and CYOD.",b:"BYOD: employee-owned, least organizational control. COPE: corporate-owned, personally enabled, full control with permitted personal use. CYOD: employee chooses from an approved corporate-owned list."},
{d:4,o:"4.1",g:"wireless-security",f:"WPA3 replaced the WPA2 four-way handshake with what?",b:"SAE, Simultaneous Authentication of Equals, which resists offline dictionary attacks against the captured handshake."},
{d:4,o:"4.1",g:"wireless-security",f:"What is a site survey and heat map used for?",b:"Mapping actual wireless signal coverage and interference so access points are placed for coverage without leaking signal beyond the intended area."},
{d:4,o:"4.2",g:"asset-management",f:"Name the asset lifecycle stages in objective 4.2.",b:"Acquisition and procurement, assignment and accounting (ownership and classification), monitoring and asset tracking (inventory and enumeration), and disposal and decommissioning."},
{d:4,o:"4.2",g:"asset-disposal",f:"Sanitization, destruction, and certification: what is the sequence?",b:"Sanitize (wipe or degauss) or destroy (shred, pulverize) the media, then obtain certification documenting it, and honor data retention requirements throughout."},
{d:4,o:"4.3",g:"vuln-scanning",f:"Credentialed vs non-credentialed scan.",b:"Credentialed logs into the host and reads actual patch and configuration state, giving far more accuracy. Non-credentialed sees only what is exposed on the network."},
{d:4,o:"4.3",g:"false-positive-negative",f:"False positive vs false negative.",b:"False positive: an alert or finding that is not real. False negative: a real issue that was missed. False negatives are the more dangerous of the two."},
{d:4,o:"4.3",g:"cvss-cve",f:"CVSS vs CVE.",b:"CVSS is the Scoring System producing a 0.0 to 10.0 severity number. CVE is the unique identifier naming the specific vulnerability."},
{d:4,o:"4.3",g:"code-analysis",f:"Static vs dynamic analysis.",b:"Static inspects code without running it, finding flaws early with more false positives. Dynamic exercises the running application, including fuzzing."},
{d:4,o:"4.3",g:"vuln-response",f:"Name the vulnerability response options in objective 4.3.",b:"Patching, insurance, segmentation, compensating controls, and documented exceptions or exemptions."},
{d:4,o:"4.3",g:"vuln-response",f:"After remediation, how is the fix validated?",b:"Rescanning, audit, and verification. Remediation is not complete until it is proven."},
{d:4,o:"4.4",g:"siem-soar",f:"SIEM vs SOAR.",b:"SIEM aggregates and correlates logs into alerts. SOAR orchestrates and automates the response playbooks that act on those alerts."},
{d:4,o:"4.4",g:"alert-tuning",f:"What is alert tuning and why does it matter?",b:"Adjusting rule thresholds and conditions to cut false positives. Untuned alerting causes alert fatigue, which is itself a security failure."},
{d:4,o:"4.4",g:"monitoring-tools",f:"NetFlow vs full packet capture.",b:"NetFlow records conversation metadata (who, to whom, which port, how much). Packet capture records the actual payload content but at far greater storage cost."},
{d:4,o:"4.4",g:"monitoring-tools",f:"What is an SNMP trap?",b:"An unsolicited alert pushed from a managed device to the SNMP manager when a defined threshold or condition is crossed."},
{d:4,o:"4.4",g:"monitoring-tools",f:"Agent-based vs agentless monitoring.",b:"Agent-based installs software on the host for deeper, continuous visibility and offline coverage. Agentless uses remote access or network position with less depth but easier deployment."},
{d:4,o:"4.5",g:"firewall-rules",f:"How does a firewall evaluate its rule set?",b:"Top down, stopping at the first match, with an implicit deny at the bottom. Rule order determines behavior."},
{d:4,o:"4.5",g:"ids-ips",f:"Signature-based vs trend or anomaly-based detection.",b:"Signature matches known patterns, accurate but blind to new attacks. Anomaly compares against a baseline, catches novel activity but produces more false positives."},
{d:4,o:"4.5",g:"web-filter",f:"Agent-based web filter vs centralized proxy.",b:"Agent-based enforces policy on the device so it follows remote users. Centralized proxy only filters traffic that passes through the corporate network."},
{d:4,o:"4.5",g:"email-security",f:"SPF, DKIM, DMARC: what does each add?",b:"SPF authorizes which servers may send for the domain. DKIM signs the message so tampering is detectable. DMARC sets the failure policy and requests reports."},
{d:4,o:"4.5",g:"file-integrity",f:"What does file integrity monitoring do?",b:"Records a hash baseline of critical files and alerts when any change occurs, catching unauthorized modification of system or configuration files."},
{d:4,o:"4.5",g:"edr-xdr",f:"EDR vs XDR.",b:"EDR monitors and responds on endpoints. XDR extends that correlation across endpoints, network, email, and cloud for a unified detection picture."},
{d:4,o:"4.5",g:"nac",f:"What does NAC evaluate before granting network access?",b:"Device posture such as patch level, antivirus status, and configuration. Failing devices are placed in a quarantine or remediation VLAN."},
{d:4,o:"4.6",g:"sso-protocols",f:"SAML vs OAuth vs OpenID Connect.",b:"SAML: XML-based federated authentication for enterprise web SSO. OAuth: delegated authorization, what an app may do. OIDC: the identity layer built on OAuth."},
{d:4,o:"4.6",g:"access-control-models",f:"MAC, DAC, RBAC, ABAC, rule-based: one line each.",b:"MAC: system-enforced labels and clearances. DAC: owner decides. RBAC: access by job role. ABAC: evaluates multiple attributes. Rule-based: global conditions apply to everyone."},
{d:4,o:"4.6",g:"mfa-factors",f:"Name the authentication factors and attributes.",b:"Factors: something you know, have, are. Attributes: somewhere you are, something you can do, something you exhibit, someone you know."},
{d:4,o:"4.6",g:"mfa-factors",f:"Is a password plus a security question multifactor?",b:"No. Both are something you know, so it is single factor with two steps. Multifactor requires factors from different categories."},
{d:4,o:"4.6",g:"pam",f:"Name three privileged access management capabilities.",b:"Just-in-time permissions, password vaulting, and ephemeral credentials that exist only for the duration of the task."},
{d:4,o:"4.6",g:"iam",f:"What is attestation in identity management?",b:"A periodic review in which managers or owners confirm that each user's existing access is still appropriate. It catches privilege creep."},
{d:4,o:"4.6",g:"iam",f:"What is identity proofing?",b:"Verifying that a person is who they claim to be before an identity is issued, at enrollment time."},
{d:4,o:"4.7",g:"automation",f:"Name three security benefits of automation and orchestration.",b:"Consistent enforcement of baselines, faster reaction time, and reduced human error. Also scaling, workforce multiplication, and employee retention."},
{d:4,o:"4.7",g:"automation",f:"Name two risks of automation.",b:"Complexity and single point of failure, plus technical debt and ongoing supportability if the person who built it leaves."},
{d:4,o:"4.8",g:"incident-response-phases",f:"List the incident response phases in order.",b:"Preparation, Detection, Analysis, Containment, Eradication, Recovery, Lessons Learned."},
{d:4,o:"4.8",g:"ir-testing",f:"Tabletop vs simulation vs walkthrough.",b:"Tabletop: discussion-based scenario around a table. Simulation: a realistic injected event, such as a mock phishing campaign. Walkthrough: step-by-step review of the documented plan."},
{d:4,o:"4.8",g:"forensics",f:"What is a legal hold and when is it issued?",b:"A directive suspending routine deletion so potentially relevant evidence is preserved. It is issued as soon as litigation is reasonably anticipated, before imaging."},
{d:4,o:"4.8",g:"chain-of-custody",f:"What breaks a chain of custody, and why does it matter?",b:"Any undocumented handling, transfer, or storage gap. A break can make otherwise valid evidence inadmissible."},
{d:4,o:"4.8",g:"forensics",f:"What is order of volatility?",b:"Collect the most perishable evidence first: CPU registers and cache, RAM, network state and running processes, disk, then backups and archives."},
{d:4,o:"4.9",g:"log-sources",f:"Name six log or data sources from objective 4.9.",b:"Firewall logs, application logs, endpoint logs, OS-specific security logs, IPS and IDS logs, network logs, metadata, vulnerability scans, automated reports, dashboards, and packet captures."},

{d:5,o:"5.1",g:"policy-hierarchy",f:"Policy, standard, procedure, guideline: rank and define.",b:"Policy states intent (what and why). Standard sets the mandatory specific requirement. Procedure gives the step-by-step. Guideline is optional recommended practice."},
{d:5,o:"5.1",g:"governance-structures",f:"Centralized vs decentralized governance tradeoff.",b:"Centralized gives consistency and enterprise visibility but is slower. Decentralized gives speed and local fit but risks inconsistency and blind spots."},
{d:5,o:"5.1",g:"governance-roles",f:"Data owner, controller, processor, custodian, steward: one line each.",b:"Owner: accountable for the data. Controller: decides purposes and means of processing. Processor: acts on the controller's instructions. Custodian: hands-on technical care. Steward: manages quality and appropriate use."},
{d:5,o:"5.1",g:"policies",f:"Name six organizational policies from objective 5.1.",b:"Acceptable use (AUP), information security, business continuity, disaster recovery, incident response, software development lifecycle, and change management."},
{d:5,o:"5.2",g:"risk-assessment-types",f:"Name the four risk assessment frequencies.",b:"Ad hoc (as needed), recurring (on a schedule), one-time (for a specific event), and continuous (ongoing monitoring)."},
{d:5,o:"5.2",g:"risk-analysis",f:"Qualitative vs quantitative risk analysis.",b:"Qualitative uses descriptive ratings such as high, medium, low. Quantitative uses monetary values and probability, producing SLE, ARO, and ALE."},
{d:5,o:"5.2",g:"risk-calculation",f:"Write out the SLE, ARO, and ALE formulas.",b:"SLE = Asset Value x Exposure Factor. ALE = SLE x ARO. ARO is occurrences per year, so once in 20 years equals 0.05."},
{d:5,o:"5.2",g:"risk-appetite",f:"Risk appetite vs risk tolerance vs risk threshold.",b:"Appetite: strategic amount of risk pursued (expansionary, conservative, neutral). Tolerance: acceptable variation around a specific objective. Threshold: the trigger point requiring action."},
{d:5,o:"5.2",g:"risk-strategies",f:"Name the four risk management strategies.",b:"Transfer (insurance or contract), Accept (documented, may include exemption or exception), Avoid (stop the activity), Mitigate (apply controls)."},
{d:5,o:"5.2",g:"risk-register",f:"What lives in a risk register?",b:"Identified risks, key risk indicators, assigned risk owners, and risk thresholds. It is the running record of what the organization is tracking."},
{d:5,o:"5.2",g:"business-impact",f:"What does a business impact analysis produce?",b:"RTO, RPO, MTTR, and MTBF for critical processes, which then drive continuity and recovery investment."},
{d:5,o:"5.3",g:"vendor-assessment",f:"Name four vendor assessment methods.",b:"Penetration testing, right-to-audit clause, evidence of internal audits, independent third-party assessments, supply chain analysis, and vendor questionnaires."},
{d:5,o:"5.3",g:"agreements",f:"SLA, MOU, MOA, MSA, SOW, NDA, BPA: what is each for?",b:"SLA: measurable service commitments. MOU: non-binding statement of intent. MOA: more formal cooperative agreement. MSA: overarching legal terms. SOW or work order: specific deliverables. NDA: confidentiality. BPA: terms between business partners."},
{d:5,o:"5.4",g:"compliance",f:"Name five consequences of non-compliance.",b:"Fines, sanctions, reputational damage, loss of license, and contractual impacts."},
{d:5,o:"5.4",g:"privacy",f:"Local, regional, national, and global privacy scope: give an example of each.",b:"Local and regional: state laws such as CCPA. National: sector laws such as HIPAA. Global: cross-border regimes such as GDPR."},
{d:5,o:"5.4",g:"privacy",f:"What is the right to be forgotten?",b:"A data subject's right to require erasure of their personal data when no overriding lawful basis exists to keep it."},
{d:5,o:"5.5",g:"audits-assessments",f:"Internal vs external audit: name the sub-types.",b:"Internal: compliance reviews, audit committee oversight, self-assessments. External: regulatory examinations, independent third-party audits, and assessments."},
{d:5,o:"5.5",g:"pentest-types",f:"Known, partially known, and unknown environment testing.",b:"Known (formerly white box): full information. Partially known (gray box): limited information. Unknown (black box): nothing but the target name."},
{d:5,o:"5.5",g:"recon-types",f:"Passive vs active reconnaissance.",b:"Passive gathers from public and third-party sources without touching the target, leaving no logs. Active interacts directly, such as port scanning, and can be detected."},
{d:5,o:"5.6",g:"security-awareness",f:"Name the security awareness practices in objective 5.6.",b:"Phishing campaigns and recognition, anomalous behavior recognition, user guidance and training, reporting and monitoring, and program development and execution."},
{d:5,o:"5.6",g:"security-awareness",f:"What behaviors count as anomalous behavior recognition?",b:"Risky, unexpected, and unintentional behavior. Training users to notice and report it turns the workforce into a detection layer."}

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2100); }
function dl(name,text){ const b=new Blob([text],{type:"text/plain;charset=utf-8"}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),3000); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ================= adaptive pressure ================= */
function limit(){ return TIGHT[Math.max(0,Math.min(4,S.tight))]; }
function adapt(ok){
  S.roll.push(ok?1:0); if(S.roll.length>12) S.roll.shift();
  if(S.roll.length>=8){
    const acc=S.roll.reduce((a,b)=>a+b,0)/S.roll.length;
    if(acc>=.85&&S.tight<4){ S.tight++; S.roll=[]; toast("Pressure up - "+limit()+"s per item"); }
    else if(acc<.6&&S.tight>0){ S.tight--; S.roll=[]; toast("Pressure eased - "+limit()+"s per item"); }
  }
}

/* ================= weighting ================= */
const DCOUNT={};
function domWeight(d){
  let w=DWEIGHT[d];
  const st=S.dom[d];
  if(st.s>=5){ const a=st.c/st.s; w*= 1+(1-a)*1.4; }
  if(d===4) w*=1.3;                     // active weak area
  return w/(DCOUNT[d]||1);              // per-question, so bank size cannot skew the blueprint
}
function pick(pool,used){
  const cand=pool.filter(q=>!used.has(q.i));
  if(!cand.length) return null;
  const missed=cand.filter(q=>(S.qStat[q.i]&&S.qStat[q.i].m>0));
  if(missed.length&&Math.random()<.35) return missed[Math.floor(Math.random()*missed.length)];
  const ws=cand.map(q=>domWeight(q.d));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<cand.length;i++){ r-=ws[i]; if(r<=0) return cand[i]; }
  return cand[cand.length-1];
}

/* ================= scoring ================= */
function record(q,ok){
  S.dom[q.d].s++; if(ok) S.dom[q.d].c++;
  if(!S.tag[q.g]) S.tag[q.g]={s:0,m:0};
  S.tag[q.g].s++; if(!ok) S.tag[q.g].m++;
  if(!S.qStat[q.i]) S.qStat[q.i]={s:0,m:0};
  S.qStat[q.i].s++; if(!ok) S.qStat[q.i].m++;
  adapt(ok); save();
  if(!ok&&S.tag[q.g].m>=2&&S.flagged.indexOf(q.g)<0){ S.flagged.push(q.g); return true; }
  return false;
}
function gateStatus(){
  const runs=S.sessions.filter(x=>x.mode==="shift"&&x.n>=10).slice(-2);
  if(runs.length<2) return {pass:false,label:runs.length+" of 2 qualifying shifts logged"};
  const ok=runs.every(r=>r.pct>=85&&Object.keys(r.byDom).every(d=>r.byDom[d].s<3||pct(r.byDom[d].c,r.byDom[d].s)>=75));
  return {pass:ok,label:ok?"Gate met - book the exam":"Last two shifts: "+runs.map(r=>r.pct+"%").join(" / ")};
}

/* ================= status strip ================= */
function strip(mode,lampPct,lampMode,mid,right){
  $("sMode").textContent="/ "+mode;
  const L=$("sLamps"); if(L.children.length!==18){ L.innerHTML=""; for(let i=0;i<18;i++) L.appendChild(document.createElement("i")).className="lamp"; }
  const lit=Math.round((lampPct||0)/100*18);
  [...L.children].forEach((el,i)=>{ el.className="lamp"+(i<lit?" "+(lampMode||"on"):""); });
  $("sMid").innerHTML=mid||""; $("sRight").innerHTML=right||"";
}
function homeStrip(){
  const d=days(EXAM_OPEN);
  strip("console",0,"on","<b>"+QUESTIONS.length+"</b> items &nbsp; <b>"+allCards().length+"</b> cards &nbsp; <b>"+allAcr().length+"</b> acronyms",
    d>0?"Target window in <b>"+d+"d</b>":"Hard deadline in <b>"+days(EXAM_HARD)+"d</b>");
}

function startSess(){ sessStart=Date.now(); breakShown=false; }
function checkBreak(){
  if(!breakShown&&sessStart&&Date.now()-sessStart>32*60000){ breakShown=true; toast("32 minutes in - take a break when this ends"); }
}

/* ================= SOC WATCH ================= */
function shiftSetup(){
  view="setup"; strip("soc watch / setup",0);
  $("app").innerHTML=`
  <p class="eyebrow">Mode 01</p><h1>SOC Watch</h1>
  <p class="lede">Tickets arrive weighted to the real exam blueprint. Integrity starts at 100 and drops with every wrong call, more for a P1. Drop to zero and the shift is lost.</p>
  <h2>Shift length</h2>
  <div class="row">
    <button class="btn pri" onclick="shiftStart(10)">Short - 10 tickets</button>
    <button class="btn" onclick="shiftStart(20)">Standard - 20 tickets</button>
    <button class="btn" onclick="shiftStart(30)">Full - 30 tickets</button>
  </div>
  <p class="dim" style="margin-top:18px;font-size:13px">Timer is adaptive and currently at ${limit()} seconds per ticket. It tightens as your rolling accuracy climbs.</p>
  <div class="row" style="margin-top:20px"><button class="btn ghost sm" onclick="home()">Back to console</button></div>`;
}
function shiftStart(n){
  sess={mode:"shift",n:n,i:0,used:new Set(),correct:0,integrity:100,byDom:{},misses:[]};
  startSess(); nextTicket();
}
function sevFor(){ const r=Math.random(); return r<.22?"p1":(r<.6?"p2":"p3"); }
function nextTicket(){
  checkBreak();
  if(sess.i>=sess.n||sess.integrity<=0) return shiftReport();
  const q=pick(QUESTIONS,sess.used);
  if(!q) return shiftReport();
  sess.used.add(q.i); sess.i++; sess.q=q; sess.sev=sevFor(); sess.order=shuffle([0,1,2,3]);
  renderTicket(false);
  runTimer(limit(),()=>answer(-1));
}
function renderTicket(done,chosen){
  const q=sess.q, sv=sess.sev;
  const im=sess.integrity>60?"on":(sess.integrity>30?"warn":"crit");
  strip("soc watch",sess.integrity,im,"Integrity <b>"+sess.integrity+"%</b> &nbsp; Ticket <b>"+sess.i+"/"+sess.n+"</b>","<b id='clk'>--</b>s");
  const opts=sess.order.map((oi,pos)=>{
    let cls="opt";
    if(done){ if(oi===q.a) cls+=" correct"; else if(oi===chosen) cls+=" wrong"; else cls+=" faded"; }
    return `<button class="${cls}" ${done?"disabled":""} onclick="answer(${oi})">
      <span class="key">${String.fromCharCode(65+pos)}</span><span>${esc(q.c[oi])}</span></button>`;
  }).join("");
  const typeLabel={s:"Scenario",b:"Best answer",m:"Multiple choice",a:"Acronym"}[q.t];
  $("app").innerHTML=`
  <div class="ticket">
    <div class="thead"><span class="sev ${sv}">${sv.toUpperCase()}</span>
      <span>TKT-${String(1000+q.i)}</span><span>Domain ${q.d}.0</span><span>Obj ${q.o}</span><span>${typeLabel}</span></div>
    <div class="tbody"><p class="qtext">${esc(q.q)}</p></div>
    <div class="opts">${opts}</div>
  </div>
  <div id="fb"></div>`;
}
function answer(chosen){
  stopTimer();
  const q=sess.q, ok=chosen===q.a;
  const pat=record(q,ok);
  if(!sess.byDom[q.d]) sess.byDom[q.d]={s:0,c:0};
  sess.byDom[q.d].s++; if(ok) sess.byDom[q.d].c++;
  if(ok){ sess.correct++; sess.integrity=Math.min(100,sess.integrity+2); }
  else{ sess.integrity=Math.max(0,sess.integrity-({p1:14,p2:9,p3:5}[sess.sev])); sess.misses.push(q); }
  renderTicket(true,chosen);
  $("fb").innerHTML=feedback(q,ok,chosen,pat)+
    `<div class="row"><button class="btn pri" id="nx" onclick="nextTicket()">${sess.i>=sess.n||sess.integrity<=0?"End shift":"Next ticket"}</button>
     <button class="btn ghost" onclick="shiftReport()">End early</button></div>`;
  $("nx").focus();
}
function feedback(q,ok,chosen,pat){
  const traps=q.c.map((t,i)=>i===q.a?null:`<li><b>${esc(t.length>52?t.slice(0,52)+"...":t)}</b> ${esc(q.w[i])}</li>`).filter(Boolean).join("");
  return (pat?`<div class="pattern"><b>This is a pattern</b>You have now missed <b>${esc(q.g.replace(/-/g," "))}</b> twice. It is on your weak list and will resurface more often until you clear it.</div>`:"")+
  `<div class="fb ${ok?"ok":"no"}">
    <div class="verdict">${ok?"Resolved":(chosen<0?"Timed out - counted wrong":"Escalated - wrong call")}</div>
    <p><b>${esc(q.c[q.a])}</b></p><p>${esc(q.e)}</p>
    <div class="traps"><div class="th">Why the others pull you</div><ul>${traps}</ul></div>
  </div>`;
}
function shiftReport(){
  stopTimer();
  const p=pct(sess.correct,sess.i);
  S.sessions.push({t:Date.now(),mode:"shift",n:sess.i,pct:p,byDom:sess.byDom}); save();
  const g=gateStatus();
  const bars=Object.keys(sess.byDom).sort().map(d=>{
    const b=sess.byDom[d], v=pct(b.c,b.s);
    return `<div class="dstat"><div class="nm"><span>${d}.0</span>${DNAME[d]}</div>
      <div class="bar"><i class="${v>=85?"":v>=75?"warn":"bad"}" style="width:${v}%"></i></div><div class="pc">${v}%</div></div>`;
  }).join("");
  const missList=sess.misses.length?sess.misses.map(q=>`<li><span>${esc(q.g.replace(/-/g," "))} <span class="dim">(obj ${q.o})</span></span><span class="ct">D${q.d}</span></li>`).join(""):`<li class="dim">Nothing missed. Clean shift.</li>`;
  strip("shift report",p,p>=85?"on":p>=70?"warn":"crit","Score <b>"+p+"%</b>","<b>"+sess.correct+"/"+sess.i+"</b> resolved");
  $("app").innerHTML=`
  <p class="eyebrow">Shift report</p>
  <h1>${sess.integrity<=0?"Shift lost":"Shift complete"} - ${p}%</h1>
  <p class="lede">${sess.integrity<=0?"Integrity hit zero. Review the misses below before the next run.":"Network integrity closed at "+sess.integrity+"%."}</p>
  <div class="card"><h2 style="margin-top:0">Accuracy by domain</h2>${bars}
    <p class="dim" style="font-size:13px;margin:14px 0 0">Gate requires 85% overall with no domain under 75%, twice in a row. ${esc(g.label)}.</p></div>
  <h2>Missed concepts</h2><div class="card"><ul class="weaklist">${missList}</ul></div>
  <div class="row" style="margin-top:18px">
    <button class="btn pri" onclick="shiftStart(${sess.n})">Run another shift</button>
    ${sess.misses.length?`<button class="btn" onclick="exportMisses()">Export misses to Anki</button>`:""}
    <button class="btn ghost" onclick="home()">Console</button></div>`;
}

/* ================= RAPID RESPONSE ================= */
function drillStart(){
  sess={mode:"drill",used:new Set(),i:0,correct:0,lives:3,streak:0,mult:1,score:0,misses:[],byDom:{}};
  startSess(); nextDrill();
}
function nextDrill(){
  checkBreak();
  if(sess.lives<=0) return drillReport();
  const q=pick(QUESTIONS,sess.used);
  if(!q) return drillReport();
  sess.used.add(q.i); sess.i++; sess.q=q; sess.order=shuffle([0,1,2,3]); sess.t0=Date.now();
  renderDrill(false);
  runTimer(limit(),()=>dAnswer(-1));
}
function renderDrill(done,chosen){
  const q=sess.q;
  strip("rapid response",Math.min(100,sess.streak*10),sess.mult>=3?"crit":sess.mult>=2?"warn":"on",
    "Score <b>"+sess.score+"</b> &nbsp; x<b>"+sess.mult+"</b>","Lives <b>"+"|".repeat(Math.max(0,sess.lives))+"</b> &nbsp; <b id='clk'>--</b>s");
  const opts=sess.order.map((oi,pos)=>{
    let cls="opt";
    if(done){ if(oi===q.a) cls+=" correct"; else if(oi===chosen) cls+=" wrong"; else cls+=" faded"; }
    return `<button class="${cls}" ${done?"disabled":""} onclick="dAnswer(${oi})">
      <span class="key">${String.fromCharCode(65+pos)}</span><span>${esc(q.c[oi])}</span></button>`;
  }).join("");
  $("app").innerHTML=`
  <div style="display:flex;align-items:baseline;gap:14px;margin:18px 0 10px">
    <span class="combo">x${sess.mult}</span>
    <span class="dim mono" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase">streak ${sess.streak} &nbsp;/&nbsp; item ${sess.i}</span>
  </div>
  <div class="ticket"><div class="thead"><span>Domain ${q.d}.0</span><span>Obj ${q.o}</span></div>
    <div class="tbody"><p class="qtext">${esc(q.q)}</p></div><div class="opts">${opts}</div></div>
  <div id="fb"></div>`;
}
function dAnswer(chosen){
  stopTimer();
  const q=sess.q, ok=chosen===q.a;
  const pat=record(q,ok);
  if(!sess.byDom[q.d]) sess.byDom[q.d]={s:0,c:0};
  sess.byDom[q.d].s++; if(ok) sess.byDom[q.d].c++;
  if(ok){
    sess.correct++; sess.streak++;
    sess.mult = sess.streak>=10?4:sess.streak>=6?3:sess.streak>=3?2:1;
    const secs=(Date.now()-sess.t0)/1000;
    const bonus=Math.max(0,Math.round((limit()-secs)*2));
    sess.score += (100+bonus)*sess.mult;
  } else { sess.lives--; sess.streak=0; sess.mult=1; sess.misses.push(q); }
  renderDrill(true,chosen);
  $("fb").innerHTML=feedback(q,ok,chosen,pat)+
    `<div class="row"><button class="btn pri" id="nx" onclick="nextDrill()">${sess.lives<=0?"See results":"Next"}</button>
     <button class="btn ghost" onclick="drillReport()">Stop</button></div>`;
  $("nx").focus();
}
function drillReport(){
  stopTimer();
  const best=sess.score>S.bestDrill;
  if(best) S.bestDrill=sess.score;
  S.sessions.push({t:Date.now(),mode:"drill",n:sess.i,pct:pct(sess.correct,sess.i),byDom:sess.byDom}); save();
  strip("run complete",100,best?"on":"warn","Score <b>"+sess.score+"</b>","<b>"+sess.correct+"/"+sess.i+"</b> correct");
  const missList=sess.misses.length?sess.misses.map(q=>`<li><span>${esc(q.g.replace(/-/g," "))} <span class="dim">(obj ${q.o})</span></span><span class="ct">D${q.d}</span></li>`).join(""):`<li class="dim">Nothing missed.</li>`;
  $("app").innerHTML=`
  <p class="eyebrow">Run complete</p>
  <h1 class="big" style="color:var(--amber)">${sess.score}</h1>
  <p class="lede">${best?"New best score.":"Best is "+S.bestDrill+"."} ${sess.correct} of ${sess.i} correct at ${pct(sess.correct,sess.i)}%.</p>
  <h2>Missed concepts</h2><div class="card"><ul class="weaklist">${missList}</ul></div>
  <div class="row" style="margin-top:18px"><button class="btn pri" onclick="drillStart()">Run again</button>
    ${sess.misses.length?`<button class="btn" onclick="exportMisses()">Export misses to Anki</button>`:""}
    <button class="btn ghost" onclick="home()">Console</button></div>`;
}

/* ================= TIMER ================= */
function runTimer(secs,onEnd){
  stopTimer(); let left=secs;
  const tickFn=()=>{ const el=$("clk"); if(el){ el.textContent=left; el.parentElement.classList.toggle("hot",left<=10); }
    if(left<=0){ stopTimer(); onEnd(); return; } left--; };
  tickFn(); tickHandle=setInterval(tickFn,1000);
}
function stopTimer(){ if(tickHandle){ clearInterval(tickHandle); tickHandle=null; } }

/* ================= FLASHCARDS ================= */
function srsOf(i){ return S.srs[i]||{ease:2.3,iv:0,due:0,reps:0}; }
function dueCount(){ const now=Date.now(); return allCards().filter(c=>srsOf(c.id).due<=now).length; }
function cardSetup(){
  view="setup"; strip("flashcards / setup",0);
  const all=allCards();
  const per={}; all.forEach(c=>{ per[c.d]=(per[c.d]||0)+(srsOf(c.id).due<=Date.now()?1:0); });
  $("app").innerHTML=`
  <p class="eyebrow">Recall</p><h1>Flashcards</h1>
  <p class="lede">Read the front, answer out loud in your own words, then reveal. Rate yourself honestly. Anything you rate Again comes straight back.</p>
  <h2>Pick a deck</h2>
  <div class="row">
    <button class="btn pri" onclick="cardStart(0,true)">Due now (${dueCount()})</button>
    <button class="btn" onclick="cardStart(0,false)">All ${all.length} cards</button>
  </div>
  <div class="row" style="margin-top:10px">
    ${[1,2,3,4,5].map(d=>`<button class="btn sm" onclick="cardStart(${d},false)">Domain ${d}.0 <span class="dim">(${per[d]||0} due)</span></button>`).join("")}
  </div>
  <div class="row" style="margin-top:20px"><button class="btn ghost sm" onclick="home()">Back to console</button>
    <button class="btn ghost sm" onclick="content('cards')">Add new flashcards</button></div>`;
}
function cardStart(d,dueOnly){
  const now=Date.now();
  let ids=allCards().filter(c=>(!d||c.d===d)&&(!dueOnly||srsOf(c.id).due<=now)).map(c=>c.id);
  if(!ids.length){ toast("Nothing due in that deck yet"); return; }
  sess={mode:"cards",queue:shuffle(ids),done:0,total:ids.length,again:[]};
  startSess(); nextCard();
}
function nextCard(){
  checkBreak();
  if(!sess.queue.length) return cardReport();
  sess.ci=sess.queue[0]; renderCard(false);
}
function renderCard(revealed){
  const c=cardById(sess.ci);
  strip("flashcards",Math.round(sess.done/sess.total*100),"on","Card <b>"+(sess.done+1)+"</b> of <b>"+sess.total+"</b>","Domain <b>"+c.d+".0</b> obj "+c.o);
  $("app").innerHTML=`
  <div class="fc"><div class="front">${esc(c.f)}</div>
    ${revealed?`<div class="back">${esc(c.b)}</div>`:""}</div>
  ${revealed?`<div class="rate">
      <button onclick="rate(0)">Again<small>&lt; 1m</small></button>
      <button onclick="rate(1)">Hard<small>short</small></button>
      <button onclick="rate(2)">Good<small>normal</small></button>
      <button onclick="rate(3)">Easy<small>long</small></button></div>`
    :`<button class="btn pri" id="rv" style="width:100%" onclick="renderCard(true)">Show answer</button>`}
  <div class="row" style="margin-top:16px"><button class="btn ghost sm" onclick="cardReport()">End session</button></div>`;
  if(!revealed&&$("rv")) $("rv").focus();
}
function rate(r){
  const i=sess.ci, s=srsOf(i), D=86400000;
  if(r===0){ s.ease=Math.max(1.3,s.ease-.2); s.iv=0; s.due=Date.now(); sess.again.push(i); }
  else if(r===1){ s.ease=Math.max(1.3,s.ease-.15); s.iv=Math.max(1,(s.iv||1)*1.2); s.due=Date.now()+s.iv*D; }
  else if(r===2){ s.iv=s.iv?s.iv*s.ease:1; s.due=Date.now()+s.iv*D; }
  else { s.ease=s.ease+.15; s.iv=(s.iv||1)*s.ease*1.3; s.due=Date.now()+s.iv*D; }
  s.reps++; S.srs[i]=s; save();
  sess.queue.shift();
  if(r===0) sess.queue.push(i); else sess.done++;
  nextCard();
}
function cardReport(){
  const uniq=[...new Set(sess.again)];
  strip("session complete",100,"on","<b>"+sess.done+"</b> cards cleared","");
  $("app").innerHTML=`
  <p class="eyebrow">Session complete</p><h1>${sess.done} cards cleared</h1>
  <p class="lede">${uniq.length?uniq.length+" card"+(uniq.length>1?"s":"")+" needed a second pass. Those are due again soon.":"Nothing needed a second pass."}</p>
  ${uniq.length?`<div class="card"><ul class="weaklist">${uniq.map(i=>`<li><span>${esc(cardById(i).f)}</span><span class="ct">D${cardById(i).d}</span></li>`).join("")}</ul></div>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="exportCards([${uniq.join(",")}])">Export these to Anki</button></div>`:""}
  <div class="row" style="margin-top:18px"><button class="btn pri" onclick="cardSetup()">Another deck</button>
    <button class="btn ghost" onclick="home()">Console</button></div>`;
}

/* ================= ACRONYM RANGE ================= */
function acrSetup(){
  view="setup"; strip("acronym range / setup",0);
  $("app").innerHTML=`
  <p class="eyebrow">Range</p><h1>Acronym Range</h1>
  <p class="lede">All ${allAcr().length} acronyms, official plus anything you have added. Distractors are pulled from the same family, so guessing by category will not save you.</p>
  <div class="tiles">
    <button class="tile" style="--accent:var(--violet)" onclick="acrStart('mix')"><span class="tag">Recommended</span>
      <h3>Mixed fire</h3><p>All three formats shuffled. Closest to how the exam actually mixes them.</p></button>
    <button class="tile" style="--accent:var(--cyan)" onclick="acrStart('exp')"><span class="tag">Format A</span>
      <h3>Expand it</h3><p>You get the acronym. Pick what it stands for.</p></button>
    <button class="tile" style="--accent:var(--amber)" onclick="acrStart('rev')"><span class="tag">Format B</span>
      <h3>Name it</h3><p>You get the full name. Every answer choice is an acronym.</p></button>
    <button class="tile" style="--accent:var(--red)" onclick="acrStart('fun')"><span class="tag">Format C - hardest</span>
      <h3>What does it do</h3><p>You get a plain-language description of a function. Every answer choice is an acronym, no context.</p></button>
  </div>
  <div class="row" style="margin-top:18px"><button class="btn ghost sm" onclick="home()">Back to console</button>
    <button class="btn ghost sm" onclick="content('acr')">Add new acronyms</button></div>`;
}
function acrStart(kind){ sess={mode:"acr",kind:kind,i:0,correct:0,used:new Set(),misses:[]}; startSess(); nextAcr(); }
function nextAcr(){
  checkBreak();
  if(sess.i>=20) return acrReport();
  let kind=sess.kind==="mix"?["exp","rev","fun"][Math.floor(Math.random()*3)]:sess.kind;
  const pool=kind==="fun"?acrU():allAcr();
  const cand=pool.filter(a=>!sess.used.has(a.a));
  if(!cand.length) return acrReport();
  const weighted=cand.filter(a=>S.acrStat[a.a]&&S.acrStat[a.a].m>0);
  const target=(weighted.length&&Math.random()<.4)?weighted[Math.floor(Math.random()*weighted.length)]
    :cand[Math.floor(Math.random()*cand.length)];
  sess.used.add(target.a); sess.i++;
  let sib=pool.filter(a=>a.g===target.g&&a.a!==target.a);
  if(sib.length<3) sib=sib.concat(pool.filter(a=>a.g!==target.g&&a.a!==target.a&&sib.indexOf(a)<0));
  const wrong=shuffle(sib).slice(0,3);
  const all=shuffle([target].concat(wrong));
  sess.acr={kind:kind,target:target,all:all,ans:all.indexOf(target)};
  renderAcr(false);
  runTimer(kind==="fun"?limit():Math.round(limit()*.6),()=>aAnswer(-1));
}
function renderAcr(done,chosen){
  const A=sess.acr, k=A.kind;
  const prompt = k==="exp" ? A.target.a : k==="rev" ? A.target.d : A.target.u;
  const label  = k==="exp" ? "What does this stand for" : k==="rev" ? "Which acronym is this" : "Which acronym does this";
  strip("acronym range",Math.round(sess.i/20*100),"on","Item <b>"+sess.i+"</b>/20 &nbsp; <b>"+sess.correct+"</b> correct","<b id='clk'>--</b>s");
  const opts=A.all.map((o,pos)=>{
    let cls="opt";
    if(done){ if(pos===A.ans) cls+=" correct"; else if(pos===chosen) cls+=" wrong"; else cls+=" faded"; }
    const text = k==="exp" ? o.d : o.a;
    return `<button class="${cls}" ${done?"disabled":""} onclick="aAnswer(${pos})">
      <span class="key">${String.fromCharCode(65+pos)}</span><span${k!=="exp"?' class="mono"':''}>${esc(text)}</span></button>`;
  }).join("");
  $("app").innerHTML=`
  <div class="ticket">
    <div class="thead"><span style="color:var(--violet)">${label}</span><span>${A.target.g.toUpperCase()} family</span></div>
    <div class="tbody"><p class="qtext" ${k==="exp"?'style="font-family:var(--mono);font-size:30px;letter-spacing:.02em"':''}>${esc(prompt)}</p></div>
    <div class="opts">${opts}</div></div>
  <div id="fb"></div>`;
}
function aAnswer(chosen){
  stopTimer();
  const A=sess.acr, ok=chosen===A.ans, t=A.target;
  if(!S.acrStat[t.a]) S.acrStat[t.a]={s:0,m:0};
  S.acrStat[t.a].s++; if(!ok){ S.acrStat[t.a].m++; sess.misses.push(t); }
  if(ok) sess.correct++;
  adapt(ok); save();
  renderAcr(true,chosen);
  const others=A.all.filter((o,i)=>i!==A.ans).map(o=>`<li><b>${esc(o.a)}</b> is ${esc(o.d)}.${o.u?" "+esc(o.u)+".":""}</li>`).join("");
  $("fb").innerHTML=`
  <div class="fb ${ok?"ok":"no"}"><div class="verdict">${ok?"Hit":(chosen<0?"Timed out":"Miss")}</div>
    <p><b class="mono">${esc(t.a)}</b> &mdash; ${esc(t.d)}</p>${t.u?`<p>${esc(t.u)}.</p>`:""}
    <div class="traps"><div class="th">The near neighbours</div><ul>${others}</ul></div></div>
  <div class="row"><button class="btn pri" id="nx" onclick="nextAcr()">${sess.i>=20?"See results":"Next"}</button>
   <button class="btn ghost" onclick="acrReport()">Stop</button></div>`;
  $("nx").focus();
}
function acrReport(){
  stopTimer();
  const p=pct(sess.correct,sess.i);
  strip("range complete",p,p>=85?"on":p>=70?"warn":"crit","Score <b>"+p+"%</b>","");
  const miss=sess.misses.length?sess.misses.map(m=>`<li><span><b class="mono">${esc(m.a)}</b> ${esc(m.d)}</span><span class="ct">${esc(m.g)}</span></li>`).join(""):`<li class="dim">Clean run.</li>`;
  $("app").innerHTML=`
  <p class="eyebrow">Range complete</p><h1>${sess.correct} of ${sess.i} - ${p}%</h1>
  <p class="lede">Missed acronyms come back more often until you clear them.</p>
  <h2>Missed</h2><div class="card"><ul class="weaklist">${miss}</ul></div>
  <div class="row" style="margin-top:18px"><button class="btn pri" onclick="acrStart('${sess.kind}')">Run again</button>
    ${sess.misses.length?`<button class="btn" onclick="exportAcr([${sess.misses.map(m=>'"'+m.a+'"').join(",")}])">Export to Anki</button>`:""}
    <button class="btn ghost" onclick="acrSetup()">Change format</button>
    <button class="btn ghost" onclick="home()">Console</button></div>`;
}

/* ================= STATS ================= */
function stats(){
  view="stats"; homeStrip(); stopTimer();
  const bars=[1,2,3,4,5].map(d=>{
    const b=S.dom[d], v=pct(b.c,b.s);
    return `<div class="dstat"><div class="nm"><span>${d}.0</span>${DNAME[d]}</div>
      <div class="bar"><i class="${b.s<5?"warn":v>=85?"":v>=75?"warn":"bad"}" style="width:${b.s?v:0}%"></i></div>
      <div class="pc">${b.s?v+"%":"--"}</div></div>`;
  }).join("");
  const weak=Object.keys(S.tag).filter(t=>S.tag[t].m>0).sort((a,b)=>S.tag[b].m-S.tag[a].m).slice(0,15);
  const wl=weak.length?weak.map(t=>`<li><span>${esc(t.replace(/-/g," "))}${S.flagged.indexOf(t)>=0?' <b style="color:var(--amber);font-size:11px;font-family:var(--mono)">PATTERN</b>':""}</span>
    <span class="ct">${S.tag[t].m} miss${S.tag[t].m>1?"es":""} / ${S.tag[t].s}</span></li>`).join(""):`<li class="dim">No misses recorded yet.</li>`;
  const acrWeak=Object.keys(S.acrStat).filter(a=>S.acrStat[a].m>0).sort((a,b)=>S.acrStat[b].m-S.acrStat[a].m).slice(0,12);
  const aw=acrWeak.length?acrWeak.map(a=>{const o=allAcr().find(x=>x.a===a)||{d:""};
    return `<li><span><b class="mono">${esc(a)}</b> ${esc(o.d)}</span><span class="ct">${S.acrStat[a].m}x</span></li>`;}).join(""):`<li class="dim">No acronym misses yet.</li>`;
  const g=gateStatus();
  const recent=S.sessions.slice(-8).reverse().map(s=>`<li><span>${new Date(s.t).toLocaleDateString()} &nbsp;<span class="dim">${s.mode==="shift"?"SOC Watch":"Rapid Response"}, ${s.n} items</span></span><span class="ct" style="color:${s.pct>=85?"var(--cyan)":s.pct>=75?"var(--amber)":"var(--red)"}">${s.pct}%</span></li>`).join("")||`<li class="dim">No sessions yet.</li>`;
  $("app").innerHTML=`
  <p class="eyebrow">Tracking</p><h1>Weak areas &amp; stats</h1>
  <div class="card"><h2 style="margin-top:0">Accuracy by domain</h2>${bars}
    <p class="dim" style="font-size:13px;margin:14px 0 0">Readiness gate: ${g.pass?"<b style='color:var(--cyan)'>MET</b>":"<b style='color:var(--amber)'>OPEN</b>"}. ${esc(g.label)}.</p></div>
  <h2>Concepts you keep missing</h2><div class="card"><ul class="weaklist">${wl}</ul></div>
  <h2>Acronyms you keep missing</h2><div class="card"><ul class="weaklist">${aw}</ul></div>
  <h2>Recent sessions</h2><div class="card"><ul class="weaklist">${recent}</ul></div>
  <div class="row" style="margin-top:18px"><button class="btn" onclick="exportAll()">Export flagged cards to Anki</button>
    <button class="btn ghost" onclick="home()">Console</button>
    <button class="btn ghost" onclick="wipe()">Reset all progress</button></div>`;
}
function wipe(){ if(!confirm("Erase all progress, weak areas, and card scheduling? Your added flashcards and acronyms are kept.")) return;
  const cc=S.customCards,ca=S.customAcr,cs=S.cardSeq;
  S={v:1,dom:{},tag:{},qStat:{},srs:{},acrStat:{},sessions:[],bestDrill:0,tight:1,roll:[],flagged:[],customCards:cc,customAcr:ca,cardSeq:cs};
  for(let d=1;d<=5;d++) S.dom[d]={s:0,c:0}; save(); toast("Progress reset"); home(); }

/* ================= ADD CONTENT (roadmap extension) ================= */
function content(tab){
  view="setup"; strip("add content",0);
  tab = tab==="acr" ? "acr" : "cards";
  const knownGroups=[...new Set(ACR.map(a=>a.g))].sort();
  $("app").innerHTML=`
  <p class="eyebrow">Extend the deck</p><h1>Add new content</h1>
  <p class="lede">Paste in new flashcards or acronyms as your roadmap introduces new material. They merge straight into quizzing, spaced repetition, and Anki export - no redeploy needed.</p>
  <div class="seg">
    <button class="${tab==='cards'?'on':''}" onclick="content('cards')">Flashcards</button>
    <button class="${tab==='acr'?'on':''}" onclick="content('acr')">Acronyms</button>
  </div>
  ${tab==='cards'?`
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <label style="flex:1;min-width:140px"><div class="dim" style="font-size:12px;margin-bottom:5px">Domain</div>
        <select id="ccD" style="width:100%;background:var(--raise);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:9px">
          ${[1,2,3,4,5].map(d=>`<option value="${d}">${d}.0 ${DNAME[d]}</option>`).join("")}
        </select></label>
      <label style="flex:1;min-width:140px"><div class="dim" style="font-size:12px;margin-bottom:5px">Objective (e.g. 4.6)</div>
        <input id="ccO" type="text" placeholder="4.6"></label>
      <label style="flex:1;min-width:140px"><div class="dim" style="font-size:12px;margin-bottom:5px">Tag / topic</div>
        <input id="ccG" type="text" placeholder="e.g. pam"></label>
    </div>
    <div class="dim" style="font-size:12px;margin-bottom:6px">One card per line: <span class="mono">Front text || Back text</span></div>
    <textarea id="ccBox" rows="7" style="width:100%;background:var(--raise);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-family:var(--sans);font-size:14px;padding:11px" placeholder="What does JIT stand for in PAM? || Just-in-time. Grants elevated access only for the task and revokes it automatically."></textarea>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="parseCards()">Preview &amp; add</button></div>
    <div id="ccPreview"></div>
  </div>
  <h2>Your added flashcards (${S.customCards.length})</h2>
  <div class="card">${S.customCards.length?`<ul class="weaklist">${S.customCards.map(c=>`<li><span>${esc(c.f.length>60?c.f.slice(0,60)+"...":c.f)} <span class="dim">(D${c.d})</span></span><button class="btn sm ghost" onclick="delCard(${c.id})">Remove</button></li>`).join("")}</ul>`:`<p class="dim" style="margin:0">Nothing added yet.</p>`}</div>
  `:`
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <label style="flex:1;min-width:160px"><div class="dim" style="font-size:12px;margin-bottom:5px">Family group (for distractors)</div>
        <input id="caG" list="knownGroups" type="text" placeholder="e.g. cloud" value="custom">
        <datalist id="knownGroups">${knownGroups.map(g=>`<option value="${g}">`).join("")}</datalist></label>
    </div>
    <div class="dim" style="font-size:12px;margin-bottom:6px">One per line: <span class="mono">ACRONYM || Full expansion || optional plain-language function</span></div>
    <textarea id="caBox" rows="7" style="width:100%;background:var(--raise);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-family:var(--mono);font-size:14px;padding:11px" placeholder="CNAPP || Cloud-Native Application Protection Platform || Unifies cloud security posture and workload protection in one platform"></textarea>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="parseAcr()">Preview &amp; add</button></div>
    <div id="caPreview"></div>
  </div>
  <h2>Your added acronyms (${S.customAcr.length})</h2>
  <div class="card">${S.customAcr.length?`<ul class="weaklist">${S.customAcr.map(a=>`<li><span><b class="mono">${esc(a.a)}</b> ${esc(a.d)}</span><button class="btn sm ghost" onclick="delAcr('${a.a.replace(/'/g,"\\'")}')">Remove</button></li>`).join("")}</ul>`:`<p class="dim" style="margin:0">Nothing added yet.</p>`}</div>
  `}
  <div class="row" style="margin-top:18px"><button class="btn ghost sm" onclick="home()">Back to console</button></div>`;
}
function parseCards(){
  const d=+$("ccD").value, o=($("ccO").value||"").trim()||("D"+d), g=($("ccG").value||"custom").trim().toLowerCase().replace(/\s+/g,"-");
  const lines=$("ccBox").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0;
  lines.forEach(line=>{
    const parts=line.split("||");
    if(parts.length<2){ skipped++; return; }
    const f=parts[0].trim(), b=parts.slice(1).join("||").trim();
    if(!f||!b){ skipped++; return; }
    const id=100000+(S.cardSeq++);
    S.customCards.push({id,d,o,g,f,b});
    added++;
  });
  save();
  $("ccPreview").innerHTML=`<p style="margin:12px 0 0;font-size:13px" class="${added?'dim':''}">${added} card${added===1?"":"s"} added.${skipped?" "+skipped+" line"+(skipped===1?"":"s")+" skipped (need a || separator with text on both sides).":""}</p>`;
  if(added){ $("ccBox").value=""; toast(added+" card"+(added===1?"":"s")+" added"); setTimeout(()=>content('cards'),650); }
}
function parseAcr(){
  const g=($("caG").value||"custom").trim().toLowerCase().replace(/\s+/g,"-");
  const lines=$("caBox").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let added=0,skipped=0,dupes=0;
  const existing=new Set(allAcr().map(a=>a.a.toUpperCase()));
  lines.forEach(line=>{
    const parts=line.split("||");
    if(parts.length<2){ skipped++; return; }
    const a=parts[0].trim(), d=parts[1].trim(), u=(parts[2]||"").trim();
    if(!a||!d){ skipped++; return; }
    if(existing.has(a.toUpperCase())){ dupes++; return; }
    S.customAcr.push({a,d,g,u:u||undefined});
    existing.add(a.toUpperCase());
    added++;
  });
  save();
  $("caPreview").innerHTML=`<p style="margin:12px 0 0;font-size:13px">${added} acronym${added===1?"":"s"} added.${dupes?" "+dupes+" already existed and were skipped.":""}${skipped?" "+skipped+" line"+(skipped===1?"":"s")+" skipped (need a || separator).":""}</p>`;
  if(added){ $("caBox").value=""; toast(added+" acronym"+(added===1?"":"s")+" added"); setTimeout(()=>content('acr'),650); }
}
function delCard(id){ S.customCards=S.customCards.filter(c=>c.id!==id); delete S.srs[id]; save(); content('cards'); }
function delAcr(a){ S.customAcr=S.customAcr.filter(x=>x.a!==a); delete S.acrStat[a]; save(); content('acr'); }

/* ================= ANKI EXPORT ================= */
function ankiLine(f,b,tags){ return f.replace(/\t/g," ")+"\t"+b.replace(/\t/g," ")+"\t"+tags+"\n"; }
function exportMisses(){
  let out="";
  sess.misses.forEach(q=>{ out+=ankiLine(q.q, q.c[q.a]+" || "+q.e, "SY0-701 D"+q.d+" obj"+q.o+" "+q.g); });
  dl("night-shift-misses-"+new Date().toISOString().slice(0,10)+".txt",out); toast("Anki file downloaded");
}
function exportCards(list){
  let out=""; list.forEach(i=>{ const c=cardById(i); out+=ankiLine(c.f,c.b,"SY0-701 D"+c.d+" obj"+c.o+" "+c.g); });
  dl("night-shift-cards-"+new Date().toISOString().slice(0,10)+".txt",out); toast("Anki file downloaded");
}
function exportAcr(list){
  let out=""; list.forEach(a=>{ const o=allAcr().find(x=>x.a===a); if(o) out+=ankiLine(o.a,o.d+(o.u?" - "+o.u:""),"SY0-701 acronym "+o.g); });
  dl("night-shift-acronyms-"+new Date().toISOString().slice(0,10)+".txt",out); toast("Anki file downloaded");
}
function exportAll(){
  let out="";
  const weak=Object.keys(S.tag).filter(t=>S.tag[t].m>0);
  CARDS.forEach(c=>{ if(weak.indexOf(c.g)>=0) out+=ankiLine(c.f,c.b,"SY0-701 D"+c.d+" obj"+c.o+" "+c.g); });
  QUESTIONS.forEach(q=>{ if(S.qStat[q.i]&&S.qStat[q.i].m>0) out+=ankiLine(q.q,q.c[q.a]+" || "+q.e,"SY0-701 D"+q.d+" obj"+q.o+" "+q.g); });
  Object.keys(S.acrStat).forEach(a=>{ if(S.acrStat[a].m>0){ const o=allAcr().find(x=>x.a===a); if(o) out+=ankiLine(o.a,o.d+(o.u?" - "+o.u:""),"SY0-701 acronym "+o.g); } });
  if(!out){ toast("Nothing flagged yet - run a shift first"); return; }
  dl("night-shift-weak-areas-"+new Date().toISOString().slice(0,10)+".txt",out); toast("Anki file downloaded");
}

/* ================= keyboard ================= */
document.addEventListener("keydown",e=>{
  if(e.key>="1"&&e.key<="4"){
    const btns=[...document.querySelectorAll(".opt:not([disabled])")];
    if(btns[+e.key-1]){ e.preventDefault(); btns[+e.key-1].click(); }
  }
  if(e.key==="Enter"||e.key===" "){ const n=$("nx")||$("rv"); if(n&&document.activeElement!==n){ e.preventDefault(); n.click(); } }
  if(e.key==="Escape"&&view!=="home"){ stopTimer(); home(); }
});

/* ================= boot ================= */
QUESTIONS.forEach(q=>DCOUNT[q.d]=(DCOUNT[q.d]||0)+1);
load().then(home);
</script>

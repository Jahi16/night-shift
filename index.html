w:["This is the reversal, and it is the most-missed item in Domain 5. Anchor it: policy says what and why, standard says exactly how much or which one.","","They operate at different levels of the hierarchy, so they cannot both be policies.","A guideline is optional advice, and neither document is optional. A procedure is a step-by-step task list, which neither one is."]},

{i:502,d:5,o:"5.1",t:"a",g:"governance-roles",
q:"Under privacy regulations, which role determines the purposes and means of processing personal data, and which role acts only on that party's instructions?",
c:["Data custodian determines, data owner acts","Data controller determines, data processor acts","Data processor determines, data controller acts","Data subject determines, data steward acts"],a:1,
e:"The controller decides why and how personal data is processed. The processor handles the data solely on the controller's documented instructions, which is why processor contracts are so specific.",
w:["The custodian is the hands-on technical caretaker, and the owner holds accountability for the data. Neither term maps to the regulatory controller and processor pair.","","This is the reversal. Anchor it by the word control: the controller is in control of the decisions.","The data subject is the individual the data is about. The steward manages data quality and usage. Neither fits."]},

{i:503,d:5,o:"5.2",t:"s",g:"risk-calculation",
q:"A server worth $200,000 would lose 25 percent of its value in a flood, and flooding is expected once every 20 years. What is the annualized loss expectancy?",
c:["$50,000","$10,000","$2,500","$1,000,000"],a:2,
e:"SLE (Single Loss Expectancy) equals asset value times exposure factor, so $200,000 times 0.25 equals $50,000. ARO (Annualized Rate of Occurrence) is once per 20 years, or 0.05. ALE equals SLE times ARO, so $50,000 times 0.05 equals $2,500.",
w:["$50,000 is the SLE, the loss from a single event. Stopping there is the most common error because the number appears mid-calculation.","$10,000 comes from multiplying the full asset value by 0.05 and skipping the exposure factor.","","$1,000,000 comes from multiplying by 20 instead of dividing. Watch the direction of the frequency conversion."]},

{i:504,d:5,o:"5.2",t:"b",g:"risk-strategies",
q:"After analysis, a company decides that the cost of mitigating a low-impact risk exceeds the potential loss, documents this decision, and takes no further action. Which risk strategy is this?",
c:["Risk avoidance","Risk transference","Risk acceptance","Risk mitigation"],a:2,
e:"Acceptance is a deliberate, documented decision to live with a risk because treating it is not justified. The documentation is what separates acceptance from negligence.",
w:["Avoidance means eliminating the activity that creates the risk entirely, such as discontinuing a service.","Transference shifts financial impact to another party, typically through insurance or a contract clause.","","Mitigation means applying controls to reduce likelihood or impact. The company explicitly chose not to do this."]},

{i:505,d:5,o:"5.2",t:"m",g:"risk-appetite",
q:"Which term describes the broad amount of risk an organization is willing to pursue in order to meet its objectives?",
c:["Risk tolerance","Risk appetite","Risk threshold","Residual risk"],a:1,
e:"Risk appetite is the strategic, board-level statement of how much risk the organization will take on. It is usually expressed as expansionary, conservative, or neutral.",
w:["Risk tolerance is the acceptable variation around a specific objective. It is narrower and more operational than appetite, and this pair is heavily tested.","","A risk threshold is the specific trigger point at which action is required. More granular still.","Residual risk is what remains after controls are applied. Different concept entirely."]},

{i:506,d:5,o:"5.3",t:"a",g:"agreements",
q:"Two organizations enter a formal, legally binding contract establishing general terms that will govern all future work orders between them. Which document is this?",
c:["MOU","MSA","SLA","NDA"],a:1,
e:"An MSA (Master Service Agreement) sets the overarching legal terms once, so each subsequent SOW (Statement of Work) or work order only needs to define the specific deliverables.",
w:["An MOU (Memorandum of Understanding) records mutual intent and is generally not legally binding, which is the detail the question rules out with the word binding.","","An SLA (Service Level Agreement) defines measurable performance commitments such as uptime. It governs quality, not the overall legal relationship.","An NDA (Non-Disclosure Agreement) protects confidential information. Narrow in scope."]},

{i:507,d:5,o:"5.3",t:"b",g:"vendor-assessment",
q:"Before signing with a cloud provider, a bank wants contractual authority to inspect the provider's security controls directly. Which contract element BEST provides this?",
c:["Right-to-audit clause","Service level agreement","Non-disclosure agreement","Evidence of internal audits"],a:0,
e:"A right-to-audit clause is the negotiated contractual permission for the customer or their representative to examine the vendor's controls. Without it in writing, you have no such authority.",
w:["","An SLA sets performance targets and penalties. It does not grant inspection rights.","An NDA governs confidentiality of shared information. Unrelated to inspection authority.","Evidence of internal audits is a report the vendor gives you. Useful, but it is the vendor's own assessment rather than your right to look for yourself."]},

{i:508,d:5,o:"5.5",t:"b",g:"audits-assessments",
q:"An organization hires an unaffiliated firm to evaluate its controls against a framework and issue an opinion that customers will rely on. Which type of assessment is this?",
c:["Internal self-assessment","Independent third-party audit","Regulatory examination","Tabletop exercise"],a:1,
e:"An independent third-party audit is performed by an external party with no stake in the outcome, which is what gives the resulting opinion credibility with customers and partners.",
w:["A self-assessment is performed by the organization on itself. It lacks the independence the scenario requires.","","A regulatory examination is conducted by a government regulator with enforcement authority, not hired by the organization for customer assurance.","A tabletop exercise tests incident response readiness. It is not a controls audit."]},

{i:509,d:5,o:"5.5",t:"b",g:"pentest-types",
q:"A company hires testers and gives them nothing beyond the company name, wanting the engagement to mirror what an external attacker would face. Which environment type is this?",
c:["Known environment","Partially known environment","Unknown environment","Integrated assessment"],a:2,
e:"An unknown environment test, formerly called black box, gives the tester no internal information. It best simulates an outside attacker but spends significant time on reconnaissance.",
w:["A known environment test, formerly white box, provides full documentation, source, and architecture. Efficient but not attacker-realistic.","A partially known environment, formerly gray box, provides limited information such as credentials or a network diagram.","","An integrated assessment combines offensive and defensive teams working together. It describes team structure, not information level."]},

{i:510,d:5,o:"5.5",t:"m",g:"recon-types",
q:"During a penetration test, the tester queries public DNS records, reviews the company's LinkedIn presence, and reads SEC filings. Which activity is this?",
c:["Active reconnaissance","Passive reconnaissance","Exploitation","Privilege escalation"],a:1,
e:"Passive reconnaissance gathers information from third-party and public sources without touching the target's systems, so it generates no logs on the target.",
w:["Active reconnaissance interacts directly with the target, such as port scanning, and can be detected.","","Exploitation is using a vulnerability to gain access. No access is attempted here.","Privilege escalation happens after access is gained."]},

{i:511,d:5,o:"5.6",t:"b",g:"security-awareness",
q:"After a successful phishing attack, a company wants the change with the greatest effect on how quickly future attacks are detected. Which is BEST?",
c:["Longer password requirements","Training users to recognize and report suspicious messages","Increasing email attachment size limits","Adding a second antivirus product"],a:1,
e:"Users are the sensors that see phishing first. Training that pairs recognition with a frictionless reporting path turns the workforce into an early-warning system.",
w:["Password length does not affect detection speed at all, and phishing often captures the password regardless of length.","","Attachment size limits are unrelated to detection.","A second antivirus product adds conflicts and cost without improving human detection of social engineering."]},

{i:512,d:5,o:"5.1",t:"m",g:"governance-structures",
q:"Which governance structure is characterized by decision-making authority distributed to individual business units rather than held by a single central body?",
c:["Centralized governance","Decentralized governance","Regulatory governance","Committee governance"],a:1,
e:"Decentralized governance pushes authority outward to units, which increases responsiveness and local fit but makes consistency and enterprise-wide visibility harder.",
w:["Centralized governance concentrates authority in one body, producing consistency at the cost of agility.","","Regulatory bodies are external entities that impose requirements. Not an internal structure choice.","Committees are a mechanism that can exist within either model. It is not the answer to centralized versus distributed."]},

{i:513,d:5,o:"5.4",t:"b",g:"compliance",
q:"A regulated firm fails an examination. Which of the following is a consequence of non-compliance that is NOT financial?",
c:["Regulatory fines","Loss of license to operate","Contractual penalties","Increased insurance premiums"],a:1,
e:"Losing the license to operate is an existential, non-monetary consequence. The business simply cannot continue in that market regardless of ability to pay.",
w:["Fines are the definitional financial penalty.","","Contractual penalties are monetary damages owed to counterparties.","Higher premiums are an ongoing financial cost."]},

{i:514,d:5,o:"5.4",t:"m",g:"privacy",
q:"A customer requests that a company delete all personal data it holds about them. Which privacy concept does this request invoke?",
c:["Data minimization","Right to be forgotten","Data sovereignty","Purpose limitation"],a:1,
e:"The right to be forgotten, or right to erasure, lets a data subject require deletion of their personal data when there is no overriding lawful basis to retain it.",
w:["Data minimization is the principle of collecting only what is necessary. It governs collection, not deletion on request.","","Data sovereignty concerns which country's laws apply based on where data physically resides.","Purpose limitation restricts using data beyond the purpose it was collected for. Related, but not a deletion right."]}
];

const Q3 = [
{i:601,d:1,o:"1.4",t:"b",g:"key-management",
q:"A cloud architect needs encryption keys automatically rotated on a defined schedule across dozens of services, with centralized policy control over who can use each key. Which technology BEST fits?",
c:["TPM","Key management system","Secure enclave","XDR"],a:1,
e:"A key management system (KMS) centrally generates, rotates, stores, and controls access to encryption keys across many services, which is exactly the automated, policy-driven rotation being described.",
w:["A TPM is a chip on a single device's motherboard. It has no concept of managing keys across dozens of cloud services.","","A secure enclave protects data actively being processed on one system. It does not perform fleet-wide key rotation.","XDR (Extended Detection and Response) correlates threat telemetry. It has nothing to do with encryption key lifecycle."]},

{i:602,d:4,o:"4.8",t:"m",g:"root-cause-threat-hunting",
q:"After an incident is closed, a team investigates why the vulnerability existed in the first place so the same failure cannot recur. Which activity is this?",
c:["Threat hunting","Root cause analysis","Digital forensics","E-discovery"],a:1,
e:"Root cause analysis happens after containment and eradication, and asks why the underlying weakness existed, so the organization can fix the actual cause rather than just the symptom.",
w:["Threat hunting is a proactive search for undetected threats already present in the environment, done independent of a specific closed incident.","","Digital forensics collects and preserves evidence for legal or investigative purposes. It documents what happened, not why the systemic weakness existed.","E-discovery is the legal process of identifying and producing electronically stored information for litigation. Unrelated to internal process improvement."]},

{i:603,d:4,o:"4.8",t:"b",g:"e-discovery",
q:"A company is named in a lawsuit and must identify, collect, and produce relevant emails and documents for opposing counsel. Which process governs this?",
c:["Chain of custody","Legal hold","E-discovery","Root cause analysis"],a:2,
e:"E-discovery (electronic discovery) is the formal legal process of locating, collecting, and producing electronically stored information in response to litigation or investigation.",
w:["Chain of custody documents who handled a specific piece of evidence and when. It is one component used during e-discovery, not the overall process.","Legal hold suspends deletion of potentially relevant data. It is a preservation step that precedes e-discovery, not the production process itself.","","Root cause analysis explains why a technical failure occurred. It has no legal production component."]},

{i:604,d:5,o:"5.1",t:"s",g:"governance-roles",
q:"A vice president directs the IT department to back up the sales database daily and approves who may access the reports generated from it. Which role does the vice president hold with respect to this data?",
c:["Data processor","Data custodian","Data owner","Data steward"],a:2,
e:"The data owner holds ultimate accountability for a data asset, including decisions about protection requirements and who may access it. Directing backups and approving access are owner-level decisions.",
w:["A data processor acts strictly on another party's instructions, typically an external service. The VP is directing policy, not executing someone else's instructions.","A custodian is the hands-on technical caretaker, the person actually performing the backup, not the one deciding it should happen.","","A steward manages day-to-day data quality and appropriate use. Approving access and setting protection requirements is a level above stewardship."]},

{i:605,d:4,o:"4.3",t:"s",g:"vuln-scanning",
q:"A vulnerability scan flags a critical Java runtime vulnerability on a web server, but the administrator confirms Java is not installed anywhere on that system. What is the BEST next step?",
c:["Install the flagged version of Java and patch it immediately","Investigate why the scanner produced this false positive before dismissing it","Ignore the finding since Java is not installed","Quarantine the server as a precaution"],a:1,
e:"Confirming Java isn't installed doesn't fully close the loop. The right move is to investigate the false positive, since scanners can misfire due to banner grabbing, cached results, or a genuinely misconfigured plugin, and documenting why protects the finding from being dismissed incorrectly in the future.",
w:["Installing software that isn't needed just to patch it creates a new attack surface for no benefit, and doesn't address why the scanner was wrong.","","Dismissing it outright without investigation risks missing a real issue, such as an embedded JRE bundled inside another application the administrator didn't think to check.","Quarantining an otherwise unaffected production server over an unconfirmed false positive is a disproportionate response with real business cost."]},

{i:606,d:4,o:"4.4",t:"b",g:"alert-tuning",
q:"A newly deployed IPS signature begins blocking a legitimate internal application's normal traffic pattern. Which response BEST resolves this without reopening a security gap?",
c:["Disable the IPS entirely until the issue is investigated","Tune the specific signature that is misfiring","Move the application to a network segment with no IPS coverage","Permanently allow-list the application's source IP across all signatures"],a:1,
e:"Tuning the specific signature adjusts its condition so it stops misfiring on this legitimate traffic while every other signature, and this one for genuine attacks, stays active.",
w:["Disabling the whole IPS removes protection against everything else it was catching, a massive overcorrection for one bad signature.","","Relocating the application sidesteps the detection problem instead of fixing it, and leaves that segment blind to real attacks against the same application.","A blanket allow-list by source IP defeats inspection entirely for that host, which an attacker who compromises it could then exploit undetected."]},

{i:607,d:5,o:"5.3",t:"a",g:"agreements",
q:"A company signs an overarching contract with a consulting firm establishing payment terms, liability, and confidentiality that will govern every future engagement. Individual projects will each be defined afterward in their own short document specifying deliverables and timeline. What is that second, per-project document called?",
c:["MSA","SOW","NDA","MOU"],a:1,
e:"A SOW (Statement of Work), sometimes issued as a work order, defines the specific deliverables, timeline, and scope for one engagement, operating underneath the umbrella terms already set by the MSA.",
w:["The MSA (Master Service Agreement) is the overarching contract already described in the question, the one that will NOT need to be redone per project.","","An NDA protects confidential information specifically. It doesn't define deliverables or project scope.","An MOU records mutual intent and is generally not binding. A per-project deliverables document under a binding master contract is not an MOU."]},

{i:608,d:2,o:"2.4",t:"b",g:"physical-attacks",
q:"Investigators discover a small waterproof enclosure taped inside a server room's dropped ceiling, containing a tiny wireless access point plugged into a live network jack. Which attack does this represent?",
c:["Rogue access point","Evil twin","RFID cloning","Bluesnarfing"],a:0,
e:"A rogue access point is any unauthorized AP physically connected to a legitimate network, giving an attacker a foothold inside the perimeter. Hidden physical placement is the hallmark of this specific attack rather than a wireless-only spoof.",
w:["","An evil twin mimics a legitimate SSID to trick users into connecting to a fake network. This device is physically wired into the real network rather than impersonating an existing one.","RFID cloning copies a contactless credential's data. No credential is involved here.","Bluesnarfing steals data from a Bluetooth device without pairing authorization. This is a Wi-Fi device wired to Ethernet, not a Bluetooth attack."]},

{i:609,d:3,o:"3.4",t:"m",g:"testing",
q:"Which resilience test actually shifts live production traffic to a secondary system to confirm it can handle full load, rather than only discussing or simulating the process?",
c:["Tabletop exercise","Simulation","Failover test","Parallel processing test"],a:2,
e:"A failover test performs the real cutover to the secondary system, which is the only listed option that moves actual production traffic rather than talking through or partially emulating the response.",
w:["A tabletop exercise is a discussion-based walkthrough around a table. No systems are touched.","A simulation injects a realistic scenario, sometimes with limited live actions, but stops short of a full production cutover.","","Parallel processing runs the new and old systems side by side to compare output, which validates correctness but is not specifically a cutover-under-load test."]},

{i:610,d:5,o:"5.5",t:"s",g:"pentest-types",
q:"A penetration testing engagement is explicitly scoped to include both an offensive red team and a defensive blue team working together and sharing findings in real time. What is this engagement style called?",
c:["Known environment test","Purple team (integrated) engagement","Unknown environment test","Passive reconnaissance engagement"],a:1,
e:"An integrated, or purple team, engagement deliberately combines offensive and defensive teams collaborating together, which is distinct from the environment-knowledge classifications (known, partially known, unknown) that describe a different aspect of a test.",
w:["Known environment describes how much internal information the tester was given, not whether defenders were included in real time.","","Unknown environment is also an information-level classification, not a team-structure one.","Passive reconnaissance is an information-gathering technique, not an overall engagement style."]}
];

const Q4 = [
{i:701,d:1,o:"1.2",t:"b",g:"gap-analysis",
q:"A new CISO wants to compare the security controls the organization currently has against the controls a chosen framework says it should have, and produce a prioritized list of what is missing. Which activity is this?",
c:["Penetration test","Risk transference","Gap analysis","Tabletop exercise"],a:2,
e:"A gap analysis compares the current state against a desired baseline or framework and documents the differences so they can be prioritized and closed.",
w:["A penetration test finds exploitable weaknesses by attacking, not by comparing against a framework.","Risk transference shifts financial impact to another party, such as insurance.","","A tabletop exercise tests incident response readiness through discussion."]},
{i:702,d:1,o:"1.4",t:"b",g:"certificates",
q:"A company hosts portal.example.com, mail.example.com, and vpn.example.com and wants a single certificate covering every current and future subdomain of example.com. Which certificate type BEST fits?",
c:["Wildcard certificate","Self-signed certificate","Root certificate","Certificate signing request"],a:0,
e:"A wildcard certificate for *.example.com covers all first-level subdomains, including ones created later, with one certificate.",
w:["","Self-signed refers to who signed it, not how many names it covers, and browsers will not trust it by default.","A root certificate belongs to a certificate authority at the top of a trust chain, not to a web host.","A CSR is the request used to obtain a certificate, not a certificate type."]},
{i:703,d:1,o:"1.4",t:"s",g:"certificates",
q:"A developer secures an internal-only test server with a certificate the server generated and signed itself. Users on the team see browser warnings. What is the MOST accurate description of the situation?",
c:["The certificate has expired and must be renewed","The certificate was revoked by the CA","The private key was compromised","The certificate is self-signed, so no trusted third party vouches for it"],a:3,
e:"A self-signed certificate still encrypts traffic, but no trusted certificate authority has verified the identity, so browsers warn because the trust chain ends at an unknown signer.",
w:["Expiration produces a different, date-specific warning, and nothing indicates the date passed.","No CA issued it, so no CA could have revoked it.","Nothing suggests key compromise; the warning is about trust, not secrecy.",""]},
{i:704,d:1,o:"1.4",t:"b",g:"encryption",
q:"An application must encrypt terabytes of stored video with the least processing overhead, and key distribution is handled separately. Which approach BEST fits the bulk encryption itself?",
c:["Asymmetric encryption with RSA","Symmetric encryption with AES","Hashing with SHA-256","Key stretching with PBKDF2"],a:1,
e:"Symmetric ciphers such as AES are orders of magnitude faster than asymmetric algorithms, which is why bulk data is always encrypted symmetrically, with asymmetric crypto reserved for exchanging the symmetric key.",
w:["RSA is far too slow for bulk data and is used to protect keys, not terabytes.","","Hashing is one-way and cannot be decrypted, so the video could never be played back.","Key stretching hardens passwords against guessing; it is not a data encryption method."]},
{i:705,d:1,o:"1.4",t:"s",g:"key-escrow",
q:"A regulated firm requires that encrypted employee files remain recoverable if an employee leaves or loses their key, so copies of encryption keys are held by a secured internal authority. Which practice is this?",
c:["Key stretching","Perfect forward secrecy","Key escrow","Certificate pinning"],a:2,
e:"Key escrow places copies of keys with a trusted party so encrypted data stays recoverable, trading some confidentiality risk for guaranteed availability.",
w:["Key stretching slows password guessing and has nothing to do with recovery.","Perfect forward secrecy is the opposite goal: it ensures past sessions cannot be decrypted even if a key is later obtained.","","Pinning ties an application to an expected certificate to defeat impostors, not to enable recovery."]},
{i:706,d:2,o:"2.1",t:"b",g:"threat-actors",
q:"A public-facing web server is hit with an attack copied directly from a tutorial, using an unmodified downloaded tool, with no attempt to hide the source address. Which threat actor BEST fits this profile?",
c:["Unskilled attacker","Nation-state","Organized crime","Insider threat"],a:0,
e:"An unskilled attacker, sometimes called a script kiddie, runs pre-built tools without customization or operational security, which matches the unmodified tooling and exposed source.",
w:["","Nation-states use custom tooling and take great care to stay hidden.","Organized crime operates with more sophistication and a clear monetization path.","An insider would already have access and would rarely announce themselves from outside."]},
{i:707,d:2,o:"2.1",t:"s",g:"threat-actors",
q:"Two weeks after being passed over for promotion, a systems administrator deletes a production database and disables its backups on their last day. Which motivation BEST describes this insider's action?",
c:["Financial gain","Espionage","Philosophical beliefs","Revenge"],a:3,
e:"Destructive action timed to a personal grievance with no monetization or data theft is the classic revenge-motivated insider incident.",
w:["Nothing was sold or ransomed, so financial gain does not fit.","Espionage involves stealing information for another party; the data was destroyed, not taken.","No cause or ideology is expressed by deleting an employer's database over a promotion.",""]},
{i:708,d:2,o:"2.2",t:"b",g:"threat-vectors",
q:"A botnet compromises thousands of internet-connected cameras within minutes of each coming online. No exploit is used. Which weakness is MOST likely being abused?",
c:["Zero-day vulnerability","Default credentials","Supply chain implant","SQL injection"],a:1,
e:"Mass compromise of IoT devices without any exploit points to factory-default usernames and passwords that were never changed, the exact pattern behind large IoT botnets.",
w:["A zero-day is an exploit by definition, and the scenario says none was used.","","A supply chain implant would ship inside the product; the scenario describes login access, not embedded code.","SQL injection attacks a database through application input, which cameras rarely expose and which is still an exploit."]},
{i:709,d:2,o:"2.2",t:"m",g:"misinformation",
q:"Which statement correctly distinguishes misinformation from disinformation?",
c:["Misinformation targets companies while disinformation targets individuals","Misinformation is always political while disinformation is always financial","Misinformation is false content shared without intent to deceive; disinformation is deliberately created to deceive","They are interchangeable terms for the same activity"],a:2,
e:"Intent is the dividing line. Misinformation is wrong but spread in good faith; disinformation is manufactured or spread deliberately to mislead.",
w:["The target does not define the terms.","Neither term is tied to a particular subject area.","","The exam treats them as distinct precisely because intent differs."]},
{i:710,d:2,o:"2.2",t:"b",g:"brand-impersonation",
q:"Customers receive emails using a retailer's exact logo, colors, and formatting, directing them to a payment update page on a domain the retailer does not own. Which technique BEST describes this?",
c:["Brand impersonation","Watering hole attack","Pharming","Shoulder surfing"],a:0,
e:"Brand impersonation copies a trusted company's visual identity to make fraudulent messages and sites believable.",
w:["","A watering hole compromises a real site the victims already visit; here the site is a fake.","Pharming redirects correctly typed addresses via DNS manipulation; these victims are clicking an emailed link.","Shoulder surfing is physically observing someone's screen or keypad."]},
{i:711,d:2,o:"2.3",t:"b",g:"legacy-eol",
q:"A plant runs equipment controlled by software whose vendor ended all support and patches three years ago. The software works fine today. What is the PRIMARY security concern?",
c:["The software will stop functioning on a set date","Newly discovered vulnerabilities will never be fixed","The license will automatically expire","The vendor can remotely disable it"],a:1,
e:"End-of-life software keeps running, but any vulnerability found after support ends stays exploitable forever, and attackers actively hunt for exactly these systems.",
w:["EOL does not mean the software self-terminates.","","Licensing is a legal matter, not the security exposure.","Remote kill switches are not what EOL implies."]},
{i:712,d:2,o:"2.3",t:"s",g:"virtualization-vulns",
q:"A cloud tenant discovers that code running inside their virtual machine can break out and execute commands on the host, potentially reaching other tenants' VMs. Which vulnerability is this?",
c:["Resource reuse","Side loading","Race condition","VM escape"],a:3,
e:"VM escape breaks the isolation boundary between a guest and its hypervisor or host, which is the most serious virtualization flaw because it threatens every tenant on the hardware.",
w:["Resource reuse leaks leftover data when memory or storage is reassigned between tenants; no boundary is crossed by running code.","Side loading is installing mobile apps outside an official store.","A race condition exploits a timing gap between check and use.",""]},
{i:713,d:2,o:"2.3",t:"b",g:"malicious-update",
q:"Users are prompted by a convincing pop-up to install a browser update. The installer is signed with a stolen certificate and delivers a backdoor. Which vulnerability category BEST describes the delivery method?",
c:["Buffer overflow","Jailbreaking","Malicious update","Firmware vulnerability"],a:2,
e:"A malicious update disguises malware as legitimate software maintenance, often abusing stolen signing certificates so the package appears trustworthy.",
w:["A buffer overflow corrupts memory through oversized input; nothing here involves memory boundaries.","Jailbreaking is a user removing their own device's restrictions.","","Firmware vulnerabilities live in device-level code, not in an application update prompt."]},
{i:714,d:3,o:"3.1",t:"b",g:"iac",
q:"A security team wants every new cloud environment to be deployed from version-controlled definition files so configurations are identical, reviewable, and auditable before deployment. Which concept BEST supports this?",
c:["Infrastructure as code","Serverless computing","Software-defined networking","Containerization"],a:0,
e:"Infrastructure as code defines environments in files that can be reviewed, versioned, and redeployed identically, eliminating configuration drift between environments.",
w:["","Serverless abstracts away servers for running functions; it does not define whole environments declaratively.","SDN separates the network control plane from the data plane, a narrower concept.","Containers package applications; they do not define the surrounding infrastructure."]},
{i:715,d:3,o:"3.1",t:"m",g:"containerization",
q:"Which statement BEST describes a security difference between containers and virtual machines?",
c:["Containers each include a full guest operating system","Containers share the host kernel, so a kernel flaw can affect every container","Virtual machines cannot be isolated from one another","Containers cannot run untrusted code under any circumstances"],a:1,
e:"Containers isolate at the process level but share one kernel, so a kernel vulnerability is a shared risk across all containers on the host, unlike VMs which each run their own OS.",
w:["Not carrying a full guest OS is precisely what makes containers lightweight.","","VM isolation via the hypervisor is one of virtualization's core strengths.","Containers routinely run varied workloads; the point is the shared-kernel risk, not a prohibition."]},
{i:716,d:3,o:"3.1",t:"m",g:"sdn",
q:"In software-defined networking, which plane makes forwarding decisions and pushes them to the switches?",
c:["Data plane","Management plane","Control plane","Application plane"],a:2,
e:"SDN centralizes decision-making in the control plane, which programs the data plane devices that simply forward packets as instructed.",
w:["The data plane moves packets; it follows instructions rather than deciding.","The management plane handles device administration and monitoring.","","Applications sit above the controller and express intent; they do not program switches directly."]},
{i:717,d:3,o:"3.3",t:"b",g:"data-classification",
q:"A defense contractor labels certain documents so that only specifically cleared individuals on a named list may ever view them, regardless of department or rank. Which classification BEST fits?",
c:["Public","Sensitive","Confidential","Restricted"],a:3,
e:"Restricted is the tightest business classification, limiting access to an explicitly named set of people rather than a role or department.",
w:["Public data has no access limits at all.","Sensitive marks data needing protection but is broader than a named-individuals list.","Confidential typically limits to internal roles or groups, still wider than named individuals.",""]},
{i:718,d:3,o:"3.3",t:"b",g:"data-sovereignty",
q:"A European subsidiary must ensure customer records are stored only in data centers physically located inside the EU because local law governs data stored on local soil. Which concept drives this requirement?",
c:["Data sovereignty","Tokenization","Non-repudiation","Journaling"],a:0,
e:"Data sovereignty means data is subject to the laws of the country where it physically resides, which is why regulated organizations constrain cloud regions geographically.",
w:["","Tokenization substitutes surrogate values for sensitive data; it does not address legal jurisdiction.","Non-repudiation proves who performed an action.","Journaling records changes for crash recovery."]},
{i:719,d:3,o:"3.4",t:"m",g:"high-availability",
q:"Which statement correctly contrasts load balancing with clustering?",
c:["Load balancing requires identical hardware while clustering does not","Load balancing distributes requests across independent servers, while clustering makes multiple servers act as one system with shared state","Clustering only works in the cloud","Load balancing provides fault tolerance while clustering cannot"],a:1,
e:"A load balancer spreads traffic across separate servers, while a cluster couples servers so they operate as a single logical system, often with shared storage and automatic failover of state.",
w:["Hardware uniformity is an implementation detail, not the distinction.","","Clustering predates cloud computing by decades.","Both approaches contribute to fault tolerance in different ways."]},
{i:720,d:4,o:"4.1",t:"b",g:"mdm",
q:"An executive reports a phone containing corporate email was left in a taxi. Which mobile device management capability MOST directly limits the data exposure?",
c:["Site survey","Heat map","Remote wipe","Sideloading"],a:2,
e:"Remote wipe erases the device or its corporate container over the air, which directly removes the exposed data from the lost phone.",
w:["A site survey maps wireless coverage during deployment planning.","A heat map visualizes that coverage; neither helps a lost device.","","Sideloading is installing apps outside the official store, a risk rather than a control."]},
{i:721,d:4,o:"4.1",t:"b",g:"mobile-deployment",
q:"A company issues phones it owns and manages fully, but explicitly permits employees to use them for reasonable personal activities. Which deployment model is this?",
c:["COPE","BYOD","CYOD","VDI"],a:0,
e:"COPE, corporate-owned personally enabled, is company hardware under company control with sanctioned personal use.",
w:["","BYOD is the reverse ownership model: the employee owns the device.","CYOD lets the employee choose from an approved corporate list, but personal enablement is not its defining trait.","VDI streams a hosted desktop and is not a device ownership model at all."]},
{i:722,d:4,o:"4.1",t:"b",g:"application-security",
q:"Users must be able to verify that a downloaded utility was published by the vendor and has not been altered since release. Which application security practice provides this?",
c:["Input validation","Code signing","Sandboxing","Static analysis"],a:1,
e:"Code signing applies the publisher's digital signature to the release, letting any recipient verify both origin and integrity before running it.",
w:["Input validation cleans data entering an application; it says nothing about the binary's origin.","","Sandboxing isolates execution to observe behavior, useful but not proof of publisher.","Static analysis inspects source for flaws during development."]},
{i:723,d:4,o:"4.1",t:"s",g:"application-security",
q:"A web form passes whatever users type directly into database queries. Attackers have begun extracting records. Which single development practice would MOST directly have prevented this?",
c:["Enabling verbose logging","Deploying a honeypot","Increasing password complexity","Validating and sanitizing all application input"],a:3,
e:"Injection succeeds because untrusted input reaches the interpreter unmodified. Input validation and parameterized handling close the flaw at its source.",
w:["Logging records the attack but does not stop it.","A honeypot attracts attackers elsewhere; the real form remains vulnerable.","Password rules are unrelated to query injection.",""]},
{i:724,d:4,o:"4.2",t:"s",g:"asset-disposal",
q:"A storage team plans to degauss a pallet of retired solid-state drives before disposal. Why should this plan be rejected?",
c:["Degaussing takes too long for large batches","Degaussing voids the manufacturer warranty","Degaussing does not affect flash memory, so data would remain recoverable","Degaussing only works on drives larger than one terabyte"],a:2,
e:"Degaussing destroys magnetic fields, but SSDs store data in flash cells with no magnetic component, so the data survives. SSDs require cryptographic erase or physical destruction.",
w:["Speed is not the issue; ineffectiveness is.","Warranty on retired drives is irrelevant to sanitization.","","Capacity has no bearing on the physics."]},
{i:725,d:4,o:"4.3",t:"b",g:"threat-feeds",
q:"An analyst gathers indicators from public blogs, security researcher posts, and vendor advisories that anyone can access. Which threat intelligence source is this?",
c:["OSINT","Dark web monitoring","Proprietary feed","Information-sharing organization"],a:0,
e:"Open-source intelligence is derived from publicly available sources requiring no purchase or membership.",
w:["","Dark web monitoring watches criminal marketplaces and forums that are deliberately hidden.","Proprietary feeds are commercial products purchased from a vendor.","Information-sharing organizations, such as ISACs, exchange intelligence among vetted members."]},
{i:726,d:4,o:"4.3",t:"b",g:"responsible-disclosure",
q:"A company publishes a program inviting outside researchers to report vulnerabilities in exchange for defined monetary rewards and legal safe harbor. What is this program called?",
c:["Penetration test","Bug bounty program","Regulatory examination","Red team engagement"],a:1,
e:"A bug bounty formalizes responsible disclosure by paying external researchers for validated findings under agreed rules.",
w:["A penetration test is a contracted engagement with a chosen firm, not an open invitation.","","A regulatory examination is conducted by a government authority.","A red team is an internal or hired adversarial team, not the public."]},
{i:727,d:4,o:"4.3",t:"s",g:"vuln-prioritization",
q:"Two servers report the same CVE with a 9.8 base score. One is internet-facing and holds regulated data; the other is isolated in a lab with no sensitive data. The team patches the internet-facing server first. Which analysis concept justifies this?",
c:["False positive confirmation","Package monitoring","Static analysis","Environmental variables and organizational impact"],a:3,
e:"Base CVSS scores ignore context. Environmental factors, exposure, and the business impact of the specific asset are what turn identical scores into different priorities.",
w:["Neither finding is being disputed as false.","Package monitoring tracks third-party dependencies.","Static analysis examines source code, unrelated to patch ordering.",""]},
{i:728,d:4,o:"4.4",t:"b",g:"quarantine",
q:"A monitoring platform detects a workstation beaconing to a known command-and-control address and automatically moves it to an isolated network segment pending investigation. Which alert response action occurred?",
c:["Archiving","Log aggregation","Quarantine","Alert tuning"],a:2,
e:"Quarantine isolates a suspect system so it cannot spread or communicate while analysts investigate, containing damage without powering the machine off.",
w:["Archiving stores older logs for retention.","Aggregation collects logs centrally; it is passive.","","Tuning adjusts alert rules to reduce noise; it does not act on a host."]},
{i:729,d:5,o:"5.1",t:"m",g:"policy-hierarchy",
q:"Which statement BEST distinguishes a guideline from a policy?",
c:["A guideline is recommended and optional, while a policy is mandatory","A guideline is written by regulators, while a policy is written internally","A guideline applies to contractors only","A guideline expires annually while policies never expire"],a:0,
e:"Guidelines offer recommended practices that allow judgment; policies state mandatory requirements. The binding-versus-advisory distinction is the tested difference.",
w:["","Both documents are typically internal.","Applicability to contractors is set by scope statements, not document type.","Review cycles vary by organization for both."]},
{i:730,d:5,o:"5.1",t:"b",g:"procedures",
q:"An employee resigns effective immediately. Which offboarding step should occur FIRST?",
c:["Schedule the exit interview","Disable the user's accounts and access","Redistribute the employee's projects","Collect signed handover documentation"],a:1,
e:"Access termination is the time-critical security step; every other offboarding task can happen afterward without risk, but live credentials in a departed employee's hands cannot wait.",
w:["The interview matters but creates no exposure if delayed.","","Project handoff is an operational concern, not a security one.","Documentation can be completed after access is cut."]},
{i:731,d:5,o:"5.4",t:"m",g:"due-diligence",
q:"Which pairing correctly describes due diligence versus due care?",
c:["Due diligence is acting on known risks; due care is discovering them","Due diligence applies to vendors only; due care applies internally only","Due diligence is investigating and understanding risks before acting; due care is the ongoing reasonable actions taken to address them","They are legal synonyms with no practical difference"],a:2,
e:"Due diligence is the homework: researching and understanding risk. Due care is the follow-through: acting reasonably on what was learned, continuously.",
w:["This reverses the two terms, which is the standard trap.","Both concepts apply across internal and vendor contexts.","","Courts and auditors treat them as distinct duties."]},
{i:732,d:5,o:"5.3",t:"b",g:"rules-of-engagement",
q:"Before a penetration test begins, both parties sign a document defining which systems are in scope, testing hours, prohibited techniques, and emergency contacts. What is this document?",
c:["Non-disclosure agreement","Service-level agreement","Memorandum of understanding","Rules of engagement"],a:3,
e:"Rules of engagement set the operational boundaries of a security test: scope, timing, permitted methods, and escalation paths, protecting both tester and client.",
w:["An NDA protects confidentiality of what is learned, not how testing is conducted.","An SLA defines ongoing service performance commitments.","An MOU records general intent between parties and is typically non-binding.",""]},
{i:733,d:5,o:"5.2",t:"m",g:"risk-strategies",
q:"Within a risk acceptance decision, what distinguishes an exemption from an exception?",

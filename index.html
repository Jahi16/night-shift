{i:1418,d:4,o:"4.4",t:"b",g:"log-management",
q:"Compliance requires that logs older than 90 days be moved from the expensive live SIEM into cheap long-term storage where they remain retrievable for seven years. Which activity is this?",
c:["Alert tuning","Archiving","Aggregation","Quarantine"],a:1,
e:"Archiving moves aged log data to economical long-term storage while preserving retrievability, satisfying retention requirements without paying live-search prices for cold data.",
w:["Alert tuning adjusts detection thresholds to cut noise.","","Aggregation is the collection of logs into one place at ingest.","Quarantine isolates suspicious files or hosts."]},
{i:1419,d:4,o:"4.6",t:"s",g:"access-reviews",

w:["","Federation shares identities across organizations.","Identity proofing verifies a person is who they claim during enrollment.","Vaulting stores privileged credentials for controlled checkout."]},
{i:1420,d:5,o:"5.2",t:"b",g:"risk-register",

w:["A data subject is the person personal data describes.","Assessors evaluate risks but accountability rests with the owner.","","A threat actor is the adversary creating the risk."]},
{i:1421,d:5,o:"5.4",t:"b",g:"privacy-roles",

w:["","The custodian maintains and protects stored data operationally.","The processor handles data on the controller's instructions.","The controller decides why and how data is processed."]},
{i:1422,d:5,o:"5.3",t:"s",g:"vendor-selection",
q:"During vendor selection, a company discovers the procurement lead scoring the bids is the brother-in-law of one bidder's CEO and stands to benefit from that award. Which vendor selection concern is this?",
c:["Right-to-audit","Conflict of interest","Supply chain analysis","Rules of engagement"],a:1,

{i:1423,d:5,o:"5.3",t:"b",g:"vendor-monitoring",

{i:1424,d:5,o:"5.4",t:"b",g:"compliance-monitoring",

{d:1,o:"1.1",g:"control-categories",f:"Name the four control CATEGORIES.",b:"Technical, Managerial, Operational, Physical. Category answers WHO or WHAT implements it."},
{d:1,o:"1.1",g:"control-types",f:"Name the six control TYPES.",b:"Preventive stops the action outright. Deterrent discourages someone who could still proceed. Detective identifies that it happened, after the fact. Corrective fixes or restores afterward. Compensating stands in when the required control cannot be implemented. Directive tells people what they must do through policy or instruction."},
{d:1,o:"1.1",g:"control-types",f:"Deterrent vs Preventive control: what is the real difference?",b:"Deterrent discourages an attacker who could still proceed (warning sign, visible camera). Preventive physically or logically stops the action (locked door, ACL)."},
{d:1,o:"1.1",g:"compensating-controls",f:"When is a control called compensating?",b:"When the required control cannot be implemented and an alternative stands in for it. The trigger is always 'we could not do X, so we did Y instead.'"},
{d:1,o:"1.1",g:"control-types",f:"Give an example of a directive control.",b:"A policy, standard, or posted instruction telling people what they must do. It directs behavior rather than enforcing it technically."},
{d:1,o:"1.2",g:"cia-triad",f:"What does the CIA triad stand for, and what does each protect against?",b:"Confidentiality (unauthorized disclosure), Integrity (unauthorized alteration), Availability (loss of access)."},

{d:1,o:"1.2",g:"aaa",f:"What are the three A's in AAA, and what does the third one actually do?",b:"Authentication (who are you), Authorization (what may you do), Accounting (what did you do). Accounting is the logging and audit record."},

{d:1,o:"1.2",g:"zero-trust",f:"What is an Implicit Trust Zone in Zero Trust?",b:"The area a subject reaches after passing the Policy Enforcement Point. Access there is granted only for the approved session."},
{d:1,o:"1.2",g:"deception",f:"Honeypot vs honeynet vs honeyfile vs honeytoken.",b:"Honeypot: one decoy system. Honeynet: a whole decoy network. Honeyfile: a decoy file used as a tripwire. Honeytoken: fake data tracked wherever it goes."},
{d:1,o:"1.2",g:"physical-controls",f:"What is the difference between an access control vestibule and a turnstile?",b:"A vestibule is a two-door airlock preventing tailgating by allowing only one person through at a time. A turnstile controls flow but is easier to defeat."},
{d:1,o:"1.3",g:"change-management",f:"Name five elements of a formal change request.",b:"Approval by the CAB, ownership, stakeholder identification, impact analysis, test results, backout plan, maintenance window, and standard operating procedure."},
{d:1,o:"1.3",g:"change-management",f:"What is a backout plan and why is it required?",b:"The documented steps to return a system to its previous working state if the change fails. It is the safety net for every approved change."},
{d:1,o:"1.4",g:"asymmetric-direction",f:"To send something ONLY the recipient can read, whose key do you encrypt with?",b:"The recipient's PUBLIC key. Only their private key can decrypt it."},
{d:1,o:"1.4",g:"asymmetric-direction",f:"To prove YOU sent something, whose key do you encrypt (sign) with?",b:"Your own PRIVATE key. Anyone with your public key can verify it, which is what gives non-repudiation."},
{d:1,o:"1.4",g:"hashing-salting",f:"What does a salt do, and what attack does it defeat?",b:"A unique random value added before hashing. It defeats rainbow tables because every user's hash needs its own precomputed table."},
{d:1,o:"1.4",g:"key-stretching",f:"What is key stretching, and name two algorithms.",b:"Deliberately slowing hashing to make guessing expensive. PBKDF2 and bcrypt are the common examples."},
{d:1,o:"1.4",g:"encryption-levels",f:"List the encryption levels from broadest to narrowest.",b:"Full-disk, partition, volume, file, database, record. Narrower means more granular control and more overhead."},
{d:1,o:"1.4",g:"tpm-hsm",f:"TPM vs HSM: what is the distinction?",b:"TPM is a chip on a single device's motherboard, typically for full-disk encryption keys. HSM is a dedicated appliance managing keys at enterprise scale."},
{d:1,o:"1.4",g:"cert-lifecycle",f:"CSR, CRL, OCSP: what stage is each?",b:"CSR requests issuance. CRL is the downloadable list of revoked certs. OCSP checks one cert's status in real time; stapling has the server present it."},
{d:1,o:"1.4",g:"certificates",f:"What does a SAN certificate do?",b:"Subject Alternative Name lets one certificate cover multiple specific hostnames or domains."},
{d:1,o:"1.4",g:"obfuscation",f:"Steganography, tokenization, and data masking: what does each do?",b:"Steganography hides data inside other media. Tokenization swaps the value for a meaningless surrogate. Masking hides part of the value at display time."},

{d:2,o:"2.3",g:"vuln-types",f:"VM escape vs resource reuse.",b:"VM escape breaks out of a guest to reach the hypervisor or other guests. Resource reuse means memory or storage released by one tenant is handed to another with data still present."},
{d:2,o:"2.3",g:"supply-chain",f:"Name three supply chain attack surfaces.",b:"Service providers (MSPs), hardware providers, and software providers including their build pipelines and dependencies."},
{d:2,o:"2.4",g:"malware-types",f:"Worm vs virus: the one-line difference.",b:"A worm self-propagates across networks with no user action. A virus needs a host file and a user to spread it."},
{d:2,o:"2.4",g:"malware-types",f:"What defines a logic bomb?",b:"Dormant code that executes when a specific condition is met, such as a date or the absence of an employee record."},
{d:2,o:"2.4",g:"malware-types",f:"What does a rootkit specifically do?",b:"Operates at kernel or boot level to hide files, processes, and connections from the operating system and the tools running on it."},
{d:2,o:"2.4",g:"malware-types",f:"RAT, spyware, keylogger, bloatware: quick differentiation.",b:"RAT gives remote control. Spyware collects information. Keylogger captures keystrokes. Bloatware is unwanted preinstalled software."},
{d:2,o:"2.4",g:"network-attacks",f:"Amplification vs reflection in a DDoS.",b:"Amplification means a small request yields a much larger response. Reflection means spoofing the victim's address so responses land on them. Most large attacks use both."},
{d:2,o:"2.4",g:"network-attacks",f:"Why does ARP poisoning work at all?",b:"ARP has no authentication. Any host can send an unsolicited reply mapping an IP to its own MAC, and the switch and hosts will believe it."},
{d:2,o:"2.4",g:"network-attacks",f:"What is a credential replay attack?",b:"Capturing valid authentication traffic and resending it to impersonate the user. Defeated by timestamps, nonces, and session tokens."},
{d:2,o:"2.4",g:"password-attacks",f:"Password spraying vs credential stuffing vs brute force.",b:"Spraying: one password against many accounts. Stuffing: known username and password pairs from another breach. Brute force: many passwords against one account."},
{d:2,o:"2.4",g:"crypto-attacks",f:"Birthday attack, collision, and downgrade: what does each target?",b:"Birthday and collision attack hashing by finding two inputs with the same output. Downgrade attacks protocol negotiation to force a weaker version."},
{d:2,o:"2.4",g:"application-attacks",f:"XSS vs CSRF in one line each.",b:"XSS injects script that runs in the victim's browser. CSRF tricks the victim's browser into sending an authenticated request the user never intended."},
{d:2,o:"2.4",g:"application-attacks",f:"What is directory traversal?",b:"Using path sequences such as ../ to read files outside the intended web root."},
{d:2,o:"2.4",g:"application-attacks",f:"Buffer overflow: what actually goes wrong?",b:"Input larger than the allocated buffer writes past its boundary into adjacent memory, which can overwrite control data and redirect execution."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"Name eight mitigation techniques from objective 2.5.",b:"Segmentation, access control (ACL and permissions), application allow list, isolation, patching, encryption, monitoring, least privilege, configuration enforcement, decommissioning, and hardening."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"Allow list vs deny list: which is more secure and why?",b:"Allow list. Only explicitly approved items run, so anything unknown is blocked by default. A deny list can only block what you already know about."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"What is a data diode or unidirectional gateway used for?",b:"Permitting data to flow out of a sensitive network while making inbound traffic physically impossible. Common in OT and ICS environments."},

// DOMAIN 3
{d:3,o:"3.1",g:"cloud-responsibility",f:"In IaaS, PaaS, and SaaS, what always stays with the customer?",b:"Data and identity or access management. No matter the model, you own your data and who can reach it."},
{d:3,o:"3.1",g:"architecture-models",f:"Serverless: what does the customer still own?",b:"Function code, dependencies, secrets, and the permissions granted to the function. Over-permissioned functions are a top finding."},
{d:3,o:"3.1",g:"architecture-models",f:"Microservices vs monolithic architecture security tradeoff.",b:"Microservices isolate failure and limit blast radius, but multiply the number of network interfaces and identities to secure."},
{d:3,o:"3.1",g:"ics-scada",f:"Why are ICS, SCADA, and RTOS environments hard to secure?",b:"They prioritize availability and deterministic timing, often cannot be taken offline for patching, and frequently run unsupported software."},
{d:3,o:"3.1",g:"segmentation",f:"Air gap vs logical segmentation.",b:"Air gap means no physical connection at all. Logical segmentation uses VLANs and firewall policy on shared physical infrastructure."},
{d:3,o:"3.2",g:"failure-modes",f:"Fail-open vs fail-closed: which do you use where?",b:"Fail-open prioritizes availability and human safety (emergency egress). Fail-closed prioritizes security (data center cage, firewall on failure)."},
{d:3,o:"3.2",g:"ids-ips-placement",f:"Inline vs tap/monitor: what capability does each give you?",b:"Inline sits in the traffic path and can block. Tap or monitor receives a copy and can only detect and alert."},
{d:3,o:"3.2",g:"firewall-types",f:"WAF vs NGFW vs UTM vs Layer 4 firewall.",b:"WAF inspects web application payloads. NGFW adds application awareness and deep inspection. UTM bundles many functions in one box. Layer 4 filters on ports and protocols only."},
{d:3,o:"3.2",g:"device-placement",f:"What is a jump server for?",b:"A hardened, monitored single point of entry through which administrators reach protected systems, concentrating admin access for auditing."},
{d:3,o:"3.2",g:"secure-access",f:"SASE vs SD-WAN.",b:"SD-WAN optimizes and manages WAN connectivity across links. SASE converges that connectivity with cloud-delivered security enforced at the edge by identity."},
{d:3,o:"3.2",g:"port-security",f:"What does 802.1X do?",b:"Port-based network access control. A device must authenticate, usually via EAP to a RADIUS server, before the switch port passes traffic."},
{d:3,o:"3.3",g:"data-types",f:"Name the data classifications in objective 3.3.",b:"Regulated, trade secret, intellectual property, legal information, financial information, human-readable, and non-human-readable."},
{d:3,o:"3.3",g:"data-states",f:"Name the three data states and one protection for each.",b:"At rest: full-disk or database encryption. In transit: TLS or IPSec. In use: trusted execution environment or secure enclave."},
{d:3,o:"3.3",g:"data-protection-methods",f:"Tokenization vs masking vs encryption.",b:"Tokenization substitutes a meaningless value with the real one held in a vault. Masking hides characters at display. Encryption transforms data reversibly with a key."},
{d:3,o:"3.3",g:"data-sovereignty",f:"What is data sovereignty?",b:"The principle that data is subject to the laws of the country where it is physically stored, which drives geographic restrictions on cloud regions."},
{d:3,o:"3.4",g:"backup-types",f:"Full, incremental, and differential: what does each capture and what does restore require?",b:"Full: everything. Incremental: changes since the last backup of any type, restore needs full plus all incrementals in order. Differential: changes since the last full, restore needs full plus the latest differential only."},
{d:3,o:"3.4",g:"rto-rpo",f:"RPO vs RTO in one line each.",b:"RPO is how much DATA you can afford to lose, measured backward in time. RTO is how long you can afford to be DOWN, measured forward."},
{d:3,o:"3.4",g:"rto-rpo",f:"MTTR vs MTBF.",b:"MTTR is the average time to repair a failed component. MTBF is the average time between failures. One measures recovery speed, the other measures reliability."},
{d:3,o:"3.4",g:"site-considerations",f:"Hot, warm, and cold site: readiness and cost.",b:"Hot: fully live with current data, near-instant failover, highest cost. Warm: equipment ready, data somewhat current, hours to a day. Cold: space and power only, cheapest, weeks."},
{d:3,o:"3.4",g:"high-availability",f:"Is RAID a backup?",b:"No. RAID provides fault tolerance against drive failure. It replicates deletions and ransomware encryption instantly, so it does not protect against them."},
{d:3,o:"3.4",g:"resilience",f:"What does capacity planning cover in objective 3.4?",b:"People, technology, and infrastructure. Enough staff, enough compute, and enough physical capacity to absorb demand or failure."},
{d:3,o:"3.4",g:"power",f:"UPS vs generator.",b:"A UPS provides immediate battery power for seconds to minutes, bridging the gap. A generator provides sustained power for hours or days but takes time to start."},

// DOMAIN 4
{d:4,o:"4.1",g:"secure-baselines",f:"Name the three baseline activities.",b:"Establish the baseline, deploy it consistently, and maintain it by detecting and correcting drift."},
{d:4,o:"4.1",g:"hardening",f:"List five hardening techniques.",b:"Encryption, endpoint protection installation, host-based firewall, HIPS, disabling unused ports and protocols, changing default passwords, and removing unnecessary software."},
{d:4,o:"4.1",g:"mobile-deployment",f:"BYOD, COPE, and CYOD.",b:"BYOD: employee-owned, least organizational control. COPE: corporate-owned, personally enabled, full control with permitted personal use. CYOD: employee chooses from an approved corporate-owned list."},
{d:4,o:"4.1",g:"wireless-security",f:"WPA3 replaced the WPA2 four-way handshake with what?",b:"SAE, Simultaneous Authentication of Equals, which resists offline dictionary attacks against the captured handshake."},
{d:4,o:"4.1",g:"wireless-security",f:"What is a site survey and heat map used for?",b:"Mapping actual wireless signal coverage and interference so access points are placed for coverage without leaking signal beyond the intended area."},
{d:4,o:"4.2",g:"asset-management",f:"Name the asset lifecycle stages in objective 4.2.",b:"Acquisition and procurement, assignment and accounting (ownership and classification), monitoring and asset tracking (inventory and enumeration), and disposal and decommissioning."},
{d:4,o:"4.2",g:"asset-disposal",f:"Sanitization, destruction, and certification: what is the sequence?",b:"Sanitize (wipe or degauss) or destroy (shred, pulverize) the media, then obtain certification documenting it, and honor data retention requirements throughout."},
{d:4,o:"4.3",g:"vuln-scanning",f:"Credentialed vs non-credentialed scan.",b:"Credentialed logs into the host and reads actual patch and configuration state, giving far more accuracy. Non-credentialed sees only what is exposed on the network."},
{d:4,o:"4.3",g:"false-positive-negative",f:"False positive vs false negative.",b:"False positive: an alert or finding that is not real. False negative: a real issue that was missed. False negatives are the more dangerous of the two."},
{d:4,o:"4.3",g:"cvss-cve",f:"CVSS vs CVE.",b:"CVSS is the Scoring System producing a 0.0 to 10.0 severity number. CVE is the unique identifier naming the specific vulnerability."},
{d:4,o:"4.3",g:"code-analysis",f:"Static vs dynamic analysis.",b:"Static inspects code without running it, finding flaws early with more false positives. Dynamic exercises the running application, including fuzzing."},
{d:4,o:"4.3",g:"vuln-response",f:"Name the vulnerability response options in objective 4.3.",b:"Patching, insurance, segmentation, compensating controls, and documented exceptions or exemptions."},
{d:4,o:"4.3",g:"vuln-response",f:"After remediation, how is the fix validated?",b:"Rescanning, audit, and verification. Remediation is not complete until it is proven."},
{d:4,o:"4.4",g:"siem-soar",f:"SIEM vs SOAR.",b:"SIEM aggregates and correlates logs into alerts. SOAR orchestrates and automates the response playbooks that act on those alerts."},
{d:4,o:"4.4",g:"alert-tuning",f:"What is alert tuning and why does it matter?",b:"Adjusting rule thresholds and conditions to cut false positives. Untuned alerting causes alert fatigue, which is itself a security failure."},
{d:4,o:"4.4",g:"monitoring-tools",f:"NetFlow vs full packet capture.",b:"NetFlow records conversation metadata (who, to whom, which port, how much). Packet capture records the actual payload content but at far greater storage cost."},
{d:4,o:"4.4",g:"monitoring-tools",f:"What is an SNMP trap?",b:"An unsolicited alert pushed from a managed device to the SNMP manager when a defined threshold or condition is crossed."},
{d:4,o:"4.4",g:"monitoring-tools",f:"Agent-based vs agentless monitoring.",b:"Agent-based installs software on the host for deeper, continuous visibility and offline coverage. Agentless uses remote access or network position with less depth but easier deployment."},
{d:4,o:"4.5",g:"firewall-rules",f:"How does a firewall evaluate its rule set?",b:"Top down, stopping at the first match, with an implicit deny at the bottom. Rule order determines behavior."},
{d:4,o:"4.5",g:"ids-ips",f:"Signature-based vs trend or anomaly-based detection.",b:"Signature matches known patterns, accurate but blind to new attacks. Anomaly compares against a baseline, catches novel activity but produces more false positives."},
{d:4,o:"4.5",g:"web-filter",f:"Agent-based web filter vs centralized proxy.",b:"Agent-based enforces policy on the device so it follows remote users. Centralized proxy only filters traffic that passes through the corporate network."},
{d:4,o:"4.5",g:"email-security",f:"SPF, DKIM, DMARC: what does each add?",b:"SPF authorizes which servers may send for the domain. DKIM signs the message so tampering is detectable. DMARC sets the failure policy and requests reports."},
{d:4,o:"4.5",g:"file-integrity",f:"What does file integrity monitoring do?",b:"Records a hash baseline of critical files and alerts when any change occurs, catching unauthorized modification of system or configuration files."},
{d:4,o:"4.5",g:"edr-xdr",f:"EDR vs XDR.",b:"EDR monitors and responds on endpoints. XDR extends that correlation across endpoints, network, email, and cloud for a unified detection picture."},
{d:4,o:"4.5",g:"nac",f:"What does NAC evaluate before granting network access?",b:"Device posture such as patch level, antivirus status, and configuration. Failing devices are placed in a quarantine or remediation VLAN."},
{d:4,o:"4.6",g:"sso-protocols",f:"SAML vs OAuth vs OpenID Connect.",b:"SAML: XML-based federated authentication for enterprise web SSO. OAuth: delegated authorization, what an app may do. OIDC: the identity layer built on OAuth."},
{d:4,o:"4.6",g:"access-control-models",f:"MAC, DAC, RBAC, ABAC, rule-based: one line each.",b:"MAC: system-enforced labels and clearances. DAC: owner decides. RBAC: access by job role. ABAC: evaluates multiple attributes. Rule-based: global conditions apply to everyone."},
{d:4,o:"4.6",g:"mfa-factors",f:"Name the authentication factors and attributes.",b:"Factors: something you know, have, are. Attributes: somewhere you are, something you can do, something you exhibit, someone you know."},
{d:4,o:"4.6",g:"mfa-factors",f:"Is a password plus a security question multifactor?",b:"No. Both are something you know, so it is single factor with two steps. Multifactor requires factors from different categories."},
{d:4,o:"4.6",g:"pam",f:"Name three privileged access management capabilities.",b:"Just-in-time permissions, password vaulting, and ephemeral credentials that exist only for the duration of the task."},
{d:4,o:"4.6",g:"iam",f:"What is attestation in identity management?",b:"A periodic review in which managers or owners confirm that each user's existing access is still appropriate. It catches privilege creep."},
{d:4,o:"4.6",g:"iam",f:"What is identity proofing?",b:"Verifying that a person is who they claim to be before an identity is issued, at enrollment time."},
{d:4,o:"4.7",g:"automation",f:"Name three security benefits of automation and orchestration.",b:"Consistent enforcement of baselines, faster reaction time, and reduced human error. Also scaling, workforce multiplication, and employee retention."},
{d:4,o:"4.7",g:"automation",f:"Name two risks of automation.",b:"Complexity and single point of failure, plus technical debt and ongoing supportability if the person who built it leaves."},
{d:4,o:"4.8",g:"incident-response-phases",f:"List the incident response phases in order.",b:"Preparation, Detection, Analysis, Containment, Eradication, Recovery, Lessons Learned."},
{d:4,o:"4.8",g:"ir-testing",f:"Tabletop vs simulation vs walkthrough.",b:"Tabletop: discussion-based scenario around a table. Simulation: a realistic injected event, such as a mock phishing campaign. Walkthrough: step-by-step review of the documented plan."},
{d:4,o:"4.8",g:"forensics",f:"What is a legal hold and when is it issued?",b:"A directive suspending routine deletion so potentially relevant evidence is preserved. It is issued as soon as litigation is reasonably anticipated, before imaging."},
{d:4,o:"4.8",g:"chain-of-custody",f:"What breaks a chain of custody, and why does it matter?",b:"Any undocumented handling, transfer, or storage gap. A break can make otherwise valid evidence inadmissible."},
{d:4,o:"4.8",g:"forensics",f:"What is order of volatility?",b:"Collect the most perishable evidence first: CPU registers and cache, RAM, network state and running processes, disk, then backups and archives."},
{d:4,o:"4.9",g:"log-sources",f:"Name six log or data sources from objective 4.9.",b:"Firewall logs, application logs, endpoint logs, OS-specific security logs, IPS and IDS logs, network logs, metadata, vulnerability scans, automated reports, dashboards, and packet captures."},

// DOMAIN 5
{d:5,o:"5.1",g:"policy-hierarchy",f:"Policy, standard, procedure, guideline: rank and define.",b:"Policy states intent (what and why). Standard sets the mandatory specific requirement. Procedure gives the step-by-step. Guideline is optional recommended practice."},
{d:5,o:"5.1",g:"governance-structures",f:"Centralized vs decentralized governance tradeoff.",b:"Centralized gives consistency and enterprise visibility but is slower. Decentralized gives speed and local fit but risks inconsistency and blind spots."},
{d:5,o:"5.1",g:"governance-roles",f:"Data owner, controller, processor, custodian, steward: one line each.",b:"Owner: accountable for the data. Controller: decides purposes and means of processing. Processor: acts on the controller's instructions. Custodian: hands-on technical care. Steward: manages quality and appropriate use."},
{d:5,o:"5.1",g:"policies",f:"Name six organizational policies from objective 5.1.",b:"Acceptable use (AUP), information security, business continuity, disaster recovery, incident response, software development lifecycle, and change management."},
{d:5,o:"5.2",g:"risk-assessment-types",f:"Name the four risk assessment frequencies.",b:"Ad hoc (as needed), recurring (on a schedule), one-time (for a specific event), and continuous (ongoing monitoring)."},
{d:5,o:"5.2",g:"risk-analysis",f:"Qualitative vs quantitative risk analysis.",b:"Qualitative uses descriptive ratings such as high, medium, low. Quantitative uses monetary values and probability, producing SLE, ARO, and ALE."},
{d:5,o:"5.2",g:"risk-calculation",f:"Write out the SLE, ARO, and ALE formulas.",b:"SLE = Asset Value x Exposure Factor. ALE = SLE x ARO. ARO is occurrences per year, so once in 20 years equals 0.05."},
{d:5,o:"5.2",g:"risk-appetite",f:"Risk appetite vs risk tolerance vs risk threshold.",b:"Appetite: strategic amount of risk pursued (expansionary, conservative, neutral). Tolerance: acceptable variation around a specific objective. Threshold: the trigger point requiring action."},
{d:5,o:"5.2",g:"risk-strategies",f:"Name the four risk management strategies.",b:"Transfer (insurance or contract), Accept (documented, may include exemption or exception), Avoid (stop the activity), Mitigate (apply controls)."},
{d:5,o:"5.2",g:"risk-register",f:"What lives in a risk register?",b:"Identified risks, key risk indicators, assigned risk owners, and risk thresholds. It is the running record of what the organization is tracking."},
{d:5,o:"5.2",g:"business-impact",f:"What does a business impact analysis produce?",b:"RTO, RPO, MTTR, and MTBF for critical processes, which then drive continuity and recovery investment."},
{d:5,o:"5.3",g:"vendor-assessment",f:"Name four vendor assessment methods.",b:"Penetration testing, right-to-audit clause, evidence of internal audits, independent third-party assessments, supply chain analysis, and vendor questionnaires."},
{d:5,o:"5.3",g:"agreements",f:"SLA, MOU, MOA, MSA, SOW, NDA, BPA: what is each for?",b:"SLA: measurable service commitments. MOU: non-binding statement of intent. MOA: more formal cooperative agreement. MSA: overarching legal terms. SOW or work order: specific deliverables. NDA: confidentiality. BPA: terms between business partners."},
{d:5,o:"5.4",g:"compliance",f:"Name five consequences of non-compliance.",b:"Fines, sanctions, reputational damage, loss of license, and contractual impacts."},
{d:5,o:"5.4",g:"privacy",f:"Local, regional, national, and global privacy scope: give an example of each.",b:"Local and regional: state laws such as CCPA. National: sector laws such as HIPAA. Global: cross-border regimes such as GDPR."},
{d:5,o:"5.4",g:"privacy",f:"What is the right to be forgotten?",b:"A data subject's right to require erasure of their personal data when no overriding lawful basis exists to keep it."},
{d:5,o:"5.5",g:"audits-assessments",f:"Internal vs external audit: name the sub-types.",b:"Internal: compliance reviews, audit committee oversight, self-assessments. External: regulatory examinations, independent third-party audits, and assessments."},
{d:5,o:"5.5",g:"pentest-types",f:"Known, partially known, and unknown environment testing.",b:"Known (formerly white box): full information. Partially known (gray box): limited information. Unknown (black box): nothing but the target name."},
{d:5,o:"5.5",g:"recon-types",f:"Passive vs active reconnaissance.",b:"Passive gathers from public and third-party sources without touching the target, leaving no logs. Active interacts directly, such as port scanning, and can be detected."},
{d:5,o:"5.6",g:"security-awareness",f:"Name the security awareness practices in objective 5.6.",b:"Phishing campaigns and recognition, anomalous behavior recognition, user guidance and training, reporting and monitoring, and program development and execution."},
{d:5,o:"5.6",g:"security-awareness",f:"What behaviors count as anomalous behavior recognition?",b:"Risky, unexpected, and unintentional behavior. Training users to notice and report it turns the workforce into a detection layer."},
/* ---- LEVELING WAVE: bolstered to match the 350-question blueprint proportions, sourced from the objectives PDF, every objective raised to 4+ cards ---- */
{d:1,o:"1.1",g:"gap-analysis",f:"What is a gap analysis and what does it produce?",b:"A comparison of current controls against a target framework or standard. It produces a prioritized list of missing controls to implement."},
{d:1,o:"1.3",g:"change-management",f:"Name the roles involved in approving a change and what each does.",b:"Owner is accountable for the system. Stakeholders are affected parties consulted. The CAB (change advisory board) formally approves. Approval must happen before implementation."},
{d:1,o:"1.3",g:"documentation",f:"Why must diagrams and procedures be updated after every change?",b:"Stale documentation misleads future troubleshooting, incident response, and audits. Updating diagrams and policies/procedures is a named change management requirement, not optional cleanup."},
{d:1,o:"1.4",g:"pki-components",f:"Public key, private key, and key escrow: what does each do in PKI?",b:"Public key encrypts or verifies and is shared freely. Private key decrypts or signs and never leaves the owner. Key escrow stores a backup copy with a trusted third party for recovery."},
{d:2,o:"2.1",g:"threat-actors",f:"What distinguishes a hacktivist from an insider threat in motivation?",b:"A hacktivist is externally motivated by political or philosophical beliefs. An insider threat abuses legitimate internal access, often for revenge, financial gain, or espionage."},
{d:2,o:"2.1",g:"actor-attributes",f:"Name the three attributes used to profile a threat actor.",b:"Internal vs external, resources/funding, and level of sophistication/capability. These determine what an actor can realistically pull off."},
{d:2,o:"2.1",g:"actor-motivations",f:"Data exfiltration vs espionage: what do they have in common and how do they differ?",b:"Both seek sensitive or confidential information. Exfiltration can be for any goal including resale; espionage specifically targets strategic or tactical advantage for a rival entity."},
{d:2,o:"2.1",g:"actor-motivations",f:"What motivates a threat actor driven by 'disruption/chaos' as opposed to financial gain?",b:"Chaos-motivated actors want visible damage or disorder for its own sake, not profit. Ransomware crews want payment; chaos actors may deploy wipers that destroy data with no ransom demand."},
{d:2,o:"2.1",g:"threat-vectors",f:"Client-based vs agentless as a threat vector distinction: what is actually being compared?",b:"Client-based means software installed on the endpoint, adding local patchable attack surface. Agentless shifts exposure to the browser or server side instead of the device."},
{d:2,o:"2.2",g:"threat-vectors",f:"Name the three message-based threat vectors.",b:"Email, SMS (smishing), and instant messaging (IM). All three deliver phishing-style payloads through a messaging channel rather than a file or website."},
{d:2,o:"2.2",g:"social-engineering",f:"What makes brand impersonation different from typosquatting?",b:"Brand impersonation counterfeits a company's public identity (site, logo, ads) to exploit trust in the brand. Typosquatting relies specifically on users mistyping a URL."},
{d:2,o:"2.2",g:"threat-vectors",f:"Why are default credentials a listed threat vector on their own, separate from weak passwords?",b:"Default credentials are publicly documented by the manufacturer and identical across every unit shipped, letting attackers harvest them at scale by simply scanning for the device type."},
{d:2,o:"2.2",g:"supply-chain",f:"Why does compromising a single MSP threaten many organizations at once?",b:"An MSP holds privileged, trusted access into every client network it manages, so one compromised MSP becomes a force multiplier reaching all of its downstream customers simultaneously."},
{d:2,o:"2.2",g:"social-engineering",f:"Misinformation vs disinformation: what is the actual difference?",b:"Misinformation is false content shared by people who believe it is true. Disinformation is knowingly fabricated and spread specifically to deceive."},
{d:2,o:"2.3",g:"vuln-types",f:"Memory injection vs buffer overflow: what's the distinction?",b:"Memory injection inserts and executes malicious code directly into a running process's memory space. Buffer overflow overwrites adjacent memory by sending more data than an allocated buffer can hold."},
{d:2,o:"2.3",g:"vuln-types",f:"What makes a misconfiguration different from a true vulnerability in the software itself?",b:"Misconfiguration is a setup error, an insecure default left unchanged, weak permissions, or open ports, not a flaw in the code. It's fixed by changing settings, not patching."},
{d:2,o:"2.3",g:"vuln-types",f:"End-of-life vs legacy: are these the same thing?",b:"End-of-life means the vendor no longer supports or patches it. Legacy just means old and possibly still supported. Something can be legacy without being EOL, but EOL is always a hard security risk."},
{d:2,o:"2.3",g:"supply-chain",f:"Name the three supply chain vulnerability sources listed in objective 2.3.",b:"Service provider, hardware provider, and software provider. A compromise at any one of the three can poison every downstream customer."},
{d:2,o:"2.4",g:"network-attacks",f:"What is an on-path attack, and name one common tool that enables it.",b:"Interception of traffic between two communicating parties, letting the attacker read or modify it in transit. Enabled by a rogue access point, ARP poisoning, or a compromised proxy."},
{d:2,o:"2.4",g:"indicators",f:"Impossible travel vs concurrent session usage: what does each indicate?",b:"Impossible travel flags logins from two locations no human could physically reach in the elapsed time. Concurrent session usage flags the same account active from two places at once, even if travel time isn't impossible."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"Isolation vs segmentation: how do these differ as mitigations?",b:"Segmentation divides a network into zones that can still communicate under policy. Isolation fully separates a system so it cannot communicate with the rest of the network at all."},
{d:2,o:"2.5",g:"hardening",f:"Name the hardening techniques listed under objective 2.5.",b:"Encryption, endpoint protection installation, host-based firewall, HIPS, disabling unused ports/protocols, changing default passwords, and removing unnecessary software."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"Why is decommissioning listed as its own mitigation technique, separate from patching?",b:"A system that's fully retired, network access pulled, accounts disabled, DNS records removed, can't be exploited at all. A half-retired system keeps risk alive with no one watching it."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"Application allow list vs deny list: which is the stronger default-deny posture?",b:"An allow list is default-deny: only explicitly approved programs run, blocking everything else including unknown malware. A deny list is default-allow: only named bad things are blocked."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"What does 'configuration enforcement' actually do that patching does not?",b:"It continuously checks systems against an approved baseline and reverts unauthorized drift. Patching fixes known code flaws; configuration enforcement catches settings that quietly changed."},
{d:3,o:"3.1",g:"architecture-models",f:"IaC (Infrastructure as Code): what security benefit does it provide beyond convenience?",b:"Infrastructure is defined in version-controlled files, so every change is tracked, reviewable, and repeatable. Manual console changes cannot hide or go undocumented the same way."},
{d:3,o:"3.1",g:"architecture-models",f:"SDN (software-defined networking): what does centralizing the control plane change about security?",b:"Policy for the whole network is defined once, centrally, and pushed programmatically to every device, instead of configuring firewall and routing rules by hand on each one."},
{d:3,o:"3.1",g:"architecture-models",f:"Centralized vs decentralized architecture: name one security tradeoff of each.",b:"Centralized is easier to secure and monitor but is a single point of failure. Decentralized has no single point of failure but is harder to enforce consistent policy across."},
{d:3,o:"3.1",g:"considerations",f:"Ease of recovery vs patch availability as architecture considerations: what does each ask?",b:"Ease of recovery asks how fast a system can be restored after disruption. Patch availability asks whether the vendor will even issue a fix when a flaw is found. Both shape architecture risk beyond initial security."},
{d:3,o:"3.1",g:"architecture-models",f:"Why is patching a real-time operating system (RTOS) uniquely difficult?",b:"An RTOS must meet strict deterministic timing guarantees. Any patch risks disrupting certified real-time behavior, so changes typically require vendor requalification and scheduled downtime."},
{d:3,o:"3.2",g:"network-appliances",f:"Proxy server vs load balancer: what does each actually do?",b:"A proxy server sits between clients and destinations, forwarding and filtering requests. A load balancer distributes incoming traffic across multiple servers for availability and performance."},
{d:3,o:"3.2",g:"device-attributes",f:"Active vs passive device attribute: what's the operational difference?",b:"An active device interacts with traffic and can block or alter it in real time. A passive device only observes traffic (tap/monitor) without touching it."},
{d:3,o:"3.2",g:"secure-communication",f:"TLS vs IPSec as tunneling protocols: where does each typically operate?",b:"TLS secures a specific application connection, commonly used for VPN client tunnels and HTTPS. IPSec secures traffic at the network layer, commonly used for site-to-site VPNs between whole networks."},
{d:3,o:"3.2",g:"firewall-rules",f:"What is a screened subnet, and why is it also called a DMZ?",b:"A network zone sandwiched between two firewalls that hosts public-facing services (web, mail) while keeping the internal network separated behind the second firewall. It demilitarizes the boundary between public and private."},
{d:3,o:"3.2",g:"secure-access",f:"What problem does SASE solve that a traditional VPN doesn't?",b:"SASE combines networking and security (SWG, CASB, ZTNA, firewall) into one cloud-delivered service close to the user, instead of backhauling all remote traffic through a central VPN concentrator."},
{d:3,o:"3.3",g:"data-types",f:"Trade secret vs intellectual property: is there a meaningful difference on the exam?",b:"Trade secret is confidential business information that derives value from secrecy (a recipe, a process). Intellectual property is a broader legal category including patents, copyrights, and trademarks, secret or not."},
{d:3,o:"3.3",g:"data-protection-methods",f:"Permission restrictions as a data protection method: what does it actually control?",b:"Who may read, write, or modify data through access rights, independent of encryption. Data can be perfectly encrypted and still leak if permissions are too broad."},
{d:3,o:"3.3",g:"data-classifications",f:"Sensitive vs confidential vs restricted: how are these classification tiers typically ordered?",b:"Public is open to anyone. Sensitive needs some protection. Confidential requires controlled access with real consequences if disclosed. Restricted is the tightest tier, often need-to-know only."},
{d:3,o:"3.3",g:"data-states",f:"Why does 'data in use' need a different protection than 'data at rest'?",b:"Data at rest sits encrypted on disk. Data in use is loaded into memory and being actively computed on, historically unprotected. Secure enclave technology extends protection into that active processing state."},
{d:3,o:"3.3",g:"geographic-restrictions",f:"What is a geographic restriction on data, and what problem does it solve?",b:"Access is allowed or denied based on the user's physical location. It enforces licensing boundaries and data sovereignty requirements that vary by country."},
{d:3,o:"3.4",g:"testing",f:"Tabletop exercise vs simulation: what's the core difference?",b:"A tabletop is a verbal, discussion-based walkthrough of the plan. A simulation injects a realistic scenario and has participants actually perform response actions."},
{d:3,o:"3.4",g:"testing",f:"What does a 'parallel processing' resilience test actually validate?",b:"The backup site processes the same live workload as the primary simultaneously, and results are compared, validating the recovery environment under real load without ever taking the primary offline."},
{d:3,o:"3.4",g:"platform-diversity",f:"What problem does platform diversity solve that redundancy alone does not?",b:"If every redundant layer uses the same vendor's product, one vendor's flaw can defeat all of them at once. Platform diversity mixes vendors so a single flaw can't cascade through every layer."},
{d:3,o:"3.4",g:"backups",f:"Why must offsite backup tapes be encrypted even though they're already offsite?",b:"Offsite protects against disasters at the primary site, but a tape can still be lost or stolen in transit or storage. Encryption ensures a lost tape yields ciphertext, not the whole dataset."},
{d:4,o:"4.1",g:"wireless-security",f:"What does RADIUS actually do in an 802.1X wireless deployment?",b:"It's the authentication server: it validates credentials and tells the access point whether to grant access. The access point itself just relays the EAP conversation."},
{d:4,o:"4.1",g:"application-security",f:"Input validation vs secure cookies: what does each protect against?",b:"Input validation rejects malformed or malicious data before it reaches application logic, defending against injection and overflow. Secure cookies (HttpOnly, Secure flags) protect session tokens from theft via script or unencrypted transit."},
{d:4,o:"4.2",g:"asset-management",f:"Ownership vs classification in asset assignment: what does each establish?",b:"Ownership establishes who is accountable for the asset. Classification establishes how sensitive its data is and what handling rules apply. Both are assigned at acquisition, not left implicit."},
{d:4,o:"4.2",g:"asset-management",f:"Inventory vs enumeration in asset monitoring: how do they differ?",b:"Inventory is the maintained record of what assets the organization owns. Enumeration is actively scanning the network to discover what's actually connected, catching assets inventory missed."},
{d:4,o:"4.2",g:"asset-disposal",f:"Why does data retention appear as a disposal consideration, not just a storage one?",b:"Before sanitizing or destroying media, the organization must confirm the data isn't still under a legal or regulatory retention requirement. Disposing of data too early can itself be a compliance violation."},
{d:4,o:"4.2",g:"asset-management",f:"What triggers the acquisition/procurement process to include security review?",b:"Every new asset entering the environment should be vetted for security posture before purchase, not after deployment. Skipping this step is how unvetted hardware and software get onto the network."},
{d:4,o:"4.3",g:"vuln-analysis",f:"Exposure factor vs CVSS score: what does each actually measure?",b:"Exposure factor is the percentage of an asset's value lost in a single incident. CVSS scores the technical severity of the vulnerability itself, independent of what asset it's on."},
{d:4,o:"4.3",g:"threat-feeds",f:"Proprietary threat feed vs information-sharing organization (ISAC): what's the access model difference?",b:"A proprietary feed is a paid commercial product from a vendor. An ISAC shares intelligence only among vetted members of the same industry, membership-gated rather than purchased."},
{d:4,o:"4.4",g:"monitoring-tools",f:"What does SCAP standardize, and why does that matter for benchmarks?",b:"Security Content Automation Protocol standardizes how vulnerability and configuration data is expressed, letting tools automatically check systems against benchmarks like CIS at scale."},
{d:4,o:"4.4",g:"monitoring-activities",f:"Log aggregation vs archiving: what's the difference in purpose?",b:"Aggregation collects logs from many sources into one place for active searching and correlation. Archiving moves aged logs to cheap long-term storage once they're no longer needed live, preserving them for retention requirements."},
{d:4,o:"4.5",g:"dns-filtering",f:"How does DNS filtering block a malicious site before a connection is even made?",b:"When a device tries to resolve a known-bad domain, the resolver returns a block page address instead of the real one, so the connection never establishes at all."},
{d:4,o:"4.5",g:"os-security",f:"Group Policy vs SELinux: what do they have in common and how do they differ?",b:"Both enforce OS-level security settings centrally. Group Policy is Windows domain-based and pushes settings to joined machines. SELinux is a Linux mandatory access control system enforcing policy locally."},
{d:4,o:"4.6",g:"password-concepts",f:"Why is password expiration now considered less valuable than length and a password manager?",b:"Forced frequent expiration pushes users toward predictable incremented passwords (Summer2025! to Summer2026!). Modern guidance favors long, unique passwords stored in a manager over frequent forced changes."},
{d:4,o:"4.7",g:"automation",f:"What is technical debt in the context of automation, and why does it compound?",b:"The accumulating future cost of past shortcuts, undocumented scripts, quick fixes. It compounds because every new change has to work around the old shortcut instead of a clean foundation."},
{d:4,o:"4.7",g:"automation",f:"What is a 'guard rail' in automated deployment pipelines?",b:"An automated policy boundary that rejects unsafe configurations before they deploy, such as blocking a publicly readable storage bucket, regardless of who submits the change."},
{d:4,o:"4.7",g:"automation",f:"How does continuous integration improve security specifically, not just development speed?",b:"Automated security tests run on every commit, so vulnerabilities surface within minutes of being introduced, when they're cheapest to fix, instead of surfacing at release time."},
{d:4,o:"4.7",g:"automation",f:"What does 'workforce multiplier' mean as an automation benefit?",b:"Automation lets a small team handle a workload that would otherwise require many more people, freeing humans for judgment-based work like investigation instead of repetitive tasks."},
{d:4,o:"4.8",g:"forensics",f:"Why is RAM captured before the disk during evidence acquisition?",b:"Order of volatility: RAM contents vanish the instant power is lost, while disk data persists. The most perishable evidence, running processes, network state, encryption keys, must be captured first."},
{d:4,o:"4.8",g:"incident-response",f:"Root cause analysis vs lessons learned: how do these differ in the IR process?",b:"Root cause analysis identifies the technical why behind the incident. Lessons learned is the broader post-incident review of what worked, what didn't, and what process changes are needed."},
{d:4,o:"4.9",g:"data-sources",f:"What is metadata, and why does it matter in an investigation even without reading the file's content?",b:"Data about the data: author, creation timestamp, originating application. It can establish when a document was created and by whom even if the visible content has been edited."},
{d:4,o:"4.9",g:"log-sources",f:"IPS/IDS logs vs firewall logs: what does each actually record?",b:"Firewall logs record what traffic was allowed or blocked at the boundary based on rules. IPS/IDS logs record detected attack signatures and anomalies within traffic that was already permitted through."},
{d:4,o:"4.9",g:"data-sources",f:"What does an automated report provide that a raw log file doesn't?",b:"A generated summary, open findings, trends, compliance status, delivered on schedule without requiring an analyst to manually query and assemble raw logs each time."},
{d:4,o:"4.9",g:"log-sources",f:"OS-specific security logs: what kind of event would you find there that a firewall log never would?",b:"Local account activity: who logged in, what file was deleted, what permission changed. Firewall logs only see traffic crossing the network boundary, never local system events."},
{d:4,o:"4.9",g:"data-sources",f:"Why is a dashboard the right data source for an executive but the wrong one for a forensic analyst?",b:"Dashboards aggregate and visualize trends for fast, high-level decisions. Forensic work needs raw, granular evidence a dashboard deliberately abstracts away."},
{d:5,o:"5.1",g:"governance-structures",f:"Board vs committee in security governance: what's the functional difference?",b:"A board holds ultimate strategic decision-making authority. A committee is a specialized group of subject matter experts that feeds analysis and recommendations up to the board."},
{d:5,o:"5.1",g:"governance",f:"What does 'monitoring and revision' mean as a governance element?",b:"Policies must have an owner and a scheduled review date so they're updated as threats, laws, and the business change, instead of quietly going stale."},
{d:5,o:"5.1",g:"external-considerations",f:"Name the six scopes of external consideration listed under objective 5.1.",b:"Regulatory, legal, industry, local/regional, national, and global. A single organization can be bound by requirements at every one of these levels simultaneously."},
{d:5,o:"5.1",g:"policy-hierarchy",f:"Which document type is legally mandatory vs merely advisory: standard, guideline, or procedure?",b:"A standard is mandatory and specific (14-character minimum password). A guideline is advisory, a recommendation. A procedure is the mandatory step-by-step method for complying with policy."},
{d:5,o:"5.2",g:"risk-appetite",f:"Expansionary vs conservative risk appetite: give a one-line example of each.",b:"Expansionary: a startup entering risky new markets to chase growth. Conservative: a nuclear plant minimizing risk in every decision regardless of cost or speed."},
{d:5,o:"5.2",g:"risk-register",f:"What is a risk owner, and why does every register entry need one?",b:"The individual accountable for monitoring and driving treatment of a specific risk. Without a named owner, risks quietly go unmanaged even while sitting visibly on the register."},
{d:5,o:"5.2",g:"risk-strategies",f:"Exception vs exemption under risk acceptance: what's the distinction?",b:"Both are formal, documented deviations from a required control. An exception is typically time-bound and expected to close. An exemption is a longer-standing carve-out, often for a specific justified reason."},
{d:5,o:"5.2",g:"risk-metrics",f:"Probability vs likelihood: which is quantitative and which is qualitative?",b:"Probability is a numeric, statistical measure (a percentage or 0-1 value). Likelihood is the qualitative scale (low/medium/high) used when precise numbers aren't available."},
{d:5,o:"5.2",g:"business-impact",f:"MTTR vs MTBF: which measures reliability and which measures recovery speed?",b:"MTBF (Mean Time Between Failures) measures how long a system runs before failing, reliability. MTTR (Mean Time To Repair) measures how long it takes to fix once it does fail, recovery speed."},
{d:5,o:"5.3",g:"vendor-selection",f:"What is a conflict of interest in vendor selection, and why does it matter?",b:"When a decision-maker has a personal stake that could bias vendor choice away from the organization's best interest. It's why selection processes require disclosure and recusal."},
{d:5,o:"5.3",g:"vendor-monitoring",f:"Why doesn't vendor risk management end once the contract is signed?",b:"Ongoing monitoring, SLA performance reviews, incident tracking, and recurring security questionnaires verify the vendor still deserves the trust placed in them long after signature."},
{d:5,o:"5.3",g:"agreements",f:"MOU vs BPA: which one is typically non-binding?",b:"An MOU (memorandum of understanding) records shared intent and is typically non-binding. A BPA (business partners agreement) is a binding contract structuring ownership, profit split, and governance between partners."},
{d:5,o:"5.3",g:"vendor-assessment",f:"What does a right-to-audit clause actually guarantee the customer?",b:"The contractual ability to inspect a vendor's controls, facilities, and records directly, rather than relying only on the vendor's own self-reported claims."},
{d:5,o:"5.4",g:"privacy-roles",f:"Data controller vs data processor: who decides and who executes?",b:"The controller decides why and how data is processed and remains accountable for it. The processor handles the data only on the controller's documented instructions."},
{d:5,o:"5.4",g:"privacy-data",f:"What must a data inventory establish before a company can honor a deletion request?",b:"Every system holding personal data, what categories it holds, and why. Without that map, erasure requests and regulator inquiries can't be answered completely or provably."},
{d:5,o:"5.4",g:"compliance-monitoring",f:"What is attestation and acknowledgement as a compliance monitoring practice?",b:"Employees formally sign, typically annually, confirming they've read and accepted policy. The signatures become the evidence trail auditors and regulators ask for first."},
{d:5,o:"5.4",g:"due-care",f:"What is 'due care,' and how does failing it increase liability after a breach?",b:"The ongoing obligation to act on known risks the way a reasonable organization would. Knowing about a vulnerability and doing nothing is the textbook breach of due care, and courts treat it as an aggravating factor."},
{d:5,o:"5.5",g:"audits-assessments",f:"Self-assessment vs independent third-party audit: what's the key difference in credibility?",b:"A self-assessment is the organization grading itself, useful for internal prep but carrying no independent assurance. A third-party audit carries external credibility because the assessor has no stake in the outcome."},
{d:5,o:"5.5",g:"pentest-types",f:"Physical vs offensive vs defensive vs integrated penetration testing: what does each target?",b:"Physical tests facility security. Offensive (red team) attacks. Defensive (blue team) detects and responds. Integrated (purple team) combines both collaboratively in the same exercise."},
{d:5,o:"5.5",g:"audits-assessments",f:"Regulatory examination vs independent third-party audit: who performs each?",b:"A regulatory examination is performed by the government authority itself under legal mandate. A third-party audit is performed by a private, independent firm hired for assurance."},
{d:5,o:"5.5",g:"attestation",f:"What does an auditor's attestation actually assert?",b:"A formal, signed statement that the auditor examined the organization's controls and found the claims about them to hold, backed by the auditor's own professional standing."},
{d:5,o:"5.6",g:"security-awareness",f:"Initial vs recurring security awareness training: why do you need both?",b:"Initial training onboards new hires with baseline knowledge. Recurring training keeps everyone current as threats evolve and counters the natural decay of security habits over time."},
{d:5,o:"5.6",g:"phishing-response",f:"What should happen after an employee reports a suspicious message, beyond just deleting it?",b:"The reported message should be analyzed, and if malicious, related indicators should be searched for and blocked across the organization, since one report often means many employees received it."},
{d:5,o:"5.6",g:"security-awareness",f:"Risky, unexpected, and unintentional: what do these three categories of anomalous behavior have in common?",b:"All three describe user actions worth flagging even without proven malicious intent, unusual login times, unexpected data access, or accidental policy violations. They're detection triggers, not accusations."},
{d:5,o:"5.6",g:"security-awareness",f:"Why does 'operational security' training matter even for employees with no access to sensitive systems?",b:"OPSEC covers what people say and share, in public, online, or casually, that could reveal exploitable information about the organization regardless of that employee's own system access level."}

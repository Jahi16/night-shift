{i:1117,d:3,o:"3.1",t:"b",g:"isolation",
q:"A weapons research lab requires that its classified network have no physical or wireless connection of any kind to any other network. Which control is this?",
c:["Logical segmentation","Screened subnet","Containerization","Air gap"],a:3,
e:"An air gap is complete physical isolation: no cable, no wireless, no shared infrastructure, making remote network attack impossible and forcing any data transfer through controlled physical media.",
w:["Logical segmentation separates traffic on shared infrastructure, which still physically connects.","A screened subnet exposes services between two firewalls; it is connected by design.","Containers isolate applications on one host, not networks.",""]},
{i:1118,d:3,o:"3.1",t:"s",g:"ics-scada",
q:"A water utility's SCADA network currently shares infrastructure with the corporate office network. Which redesign MOST reduces the chance that a phishing compromise of an office workstation reaches pump controllers?",
c:["Move both networks onto faster switches to reduce latency between them","Add antivirus software to the SCADA historian server only, leaving other SCADA hosts untouched","Segment the SCADA environment behind its own firewalled zone with tightly controlled crossings","Rename the SCADA VLAN to something less obvious so attackers cannot easily find it"],a:2,
e:"Placing industrial control systems in their own restricted zone forces all office-to-SCADA traffic through inspected, minimal pathways, containing IT compromises before they touch physical processes.",
w:["Switch speed changes performance, not security posture, and has no bearing on this scenario.","Protecting one host with antivirus leaves every other controller on the SCADA network just as exposed as before.","","Renaming a VLAN is obscurity, not a genuine security boundary, and won't stop an attacker who's already pivoted onto the network."]},
{i:1119,d:3,o:"3.4",t:"m",g:"site-considerations",
q:"Which recovery site option keeps equipment installed and configured but does not run live data replication, requiring recent backups to be restored before operations resume?",
c:["Warm site","Hot site","Cold site","Mirror site"],a:0,
e:"A warm site has hardware and connectivity ready but not current data, so recovery means restoring backups, slower than a hot site, far faster than a cold one.",
w:["","A hot site runs continuously synchronized systems ready for near-immediate cutover.","A cold site is empty space with power and cooling; equipment must be brought in.","A mirror site is effectively a fully live duplicate."]},
{i:1120,d:3,o:"3.4",t:"m",g:"power",
q:"During a power outage, which sequence correctly describes how a UPS and a generator work together for a data center?",
c:["The generator responds instantly to the outage while the UPS spends the next several minutes warming up","The UPS carries the load instantly from batteries, bridging the seconds until the generator starts","The UPS and generator both remain idle and simply wait for utility power to return on its own","The generator charges the UPS, which then powers the entire building indefinitely without further fuel"],a:1,
e:"A UPS exists to bridge the gap: it takes over in milliseconds from batteries, keeping systems alive during the seconds a generator needs to start, spin up, and stabilize before assuming the load.",
w:["Generators need real time to start and stabilize; the UPS is the instant responder here, not the reverse.","","Waiting passively for utility power to return is what happens when there is no continuity plan at all.","UPS batteries last only minutes, not indefinitely; the generator is what carries the sustained, longer-term load."]},
{i:1121,d:3,o:"3.3",t:"b",g:"data-protection",
q:"A retailer wants its payment application servers removed from most PCI DSS audit scope by ensuring they never store real card numbers, only surrogate values with no exploitable relationship to the originals. Which technique achieves this?",
c:["Masking","Hashing","Segmentation","Tokenization"],a:3,
e:"Tokenization swaps card numbers for surrogate tokens meaningless outside the secured vault, so systems holding only tokens hold nothing an attacker can monetize, shrinking audit scope.",
w:["Masking hides digits at display time but the real number still exists in the system.","Hashes of card numbers can be brute-forced from the small keyspace and cannot be detokenized for legitimate use.","Segmentation limits network reach; the real data would still reside on the servers.",""]},
{i:1122,d:3,o:"3.1",t:"m",g:"serverless",
q:"Which security implication is MOST characteristic of serverless computing?",
c:["The customer is still responsible for patching the underlying operating system on their own schedule","Physical server hardening and rack-level security become the customer's direct responsibility","Traditional host-based agents cannot be installed, shifting focus to code and permissions","Serverless removes the need for identity and access management entirely across the environment"],a:2,
e:"With no accessible server or OS, endpoint agents and host hardening no longer apply; security concentrates on function code, IAM permissions, third-party libraries, and event inputs.",
w:["The provider owns and patches the underlying OS entirely; the customer never touches it in a serverless model.","The customer never touches physical hardware at all in a serverless deployment, so hardening it isn't their concern.","","Identity and permissions actually become more important, not less, since every function runs on a granted role."]},
{i:1123,d:4,o:"4.1",t:"b",g:"wireless-security",
q:"An enterprise wireless deployment requires both the network and every connecting device to prove identity with certificates before access, eliminating shared passwords entirely. Which configuration delivers this?",
c:["WPA3-Personal with a strong passphrase","802.1X with EAP-TLS mutual certificate authentication","MAC address filtering","Hidden SSID with WPA2-PSK"],a:1,
e:"EAP-TLS performs mutual authentication: the RADIUS server presents its certificate and each client presents its own, removing shared secrets and defeating credential phishing for network access.",
w:["A passphrase is a shared secret, exactly what was excluded.","","MAC addresses are trivially spoofed and prove nothing.","Hiding an SSID is obscurity, and PSK is still a shared password."]},
{i:1124,d:4,o:"4.5",t:"b",g:"email-security",
q:"A domain owner publishes a DNS record listing exactly which mail servers are permitted to send email for the domain. Which email security standard is this?",
c:["SPF","DKIM","S/MIME","DMARC"],a:0,
e:"SPF (Sender Policy Framework) is the DNS record naming authorized sending servers, letting receivers reject mail claiming the domain but arriving from anywhere else.",
w:["","DKIM signs messages cryptographically; it does not list servers.","S/MIME encrypts and signs individual messages between users.","DMARC is the policy layer built on top of SPF and DKIM results."]},
{i:1125,d:4,o:"4.5",t:"b",g:"email-security",
q:"Receiving mail servers validate a cryptographic signature on each incoming message against a public key published in the sender's DNS, proving the message was authorized by the domain and unaltered. Which standard is at work?",
c:["SPF","Gateway filtering","DKIM","POP3"],a:2,
e:"DKIM (DomainKeys Identified Mail) attaches a signature generated with the domain's private key; receivers verify it via the public key in DNS, confirming origin and integrity.",
w:["SPF checks the sending server's address, not a signature.","A gateway filters content; it is not the signing standard.","","POP3 retrieves mail and provides no authentication of origin."]},
{i:1126,d:4,o:"4.5",t:"b",g:"email-security",
q:"A domain's email keeps being spoofed despite SPF and DKIM being configured. The admin publishes a policy telling receiving servers to reject any message failing both checks, and to send aggregate reports. Which standard did the admin implement?",
c:["SMTP","TLS","IMAP","DMARC"],a:3,
e:"DMARC is the policy and reporting layer on top of SPF and DKIM: it instructs receivers what to do with failing mail (none, quarantine, reject) and returns reports on enforcement.",
w:["SMTP transports mail with no anti-spoofing policy.","TLS encrypts the connection between servers, not sender validation.","IMAP is a mailbox retrieval protocol.",""]},
{i:1127,d:4,o:"4.5",t:"b",g:"email-security",
q:"Inbound messages are routed through a service that detonates attachments in a sandbox, rewrites suspicious links, quarantines spam, and only then delivers clean mail to user mailboxes. Which control is this?",
c:["Email security gateway","DKIM selector","SPF record","Mail transfer agent"],a:0,
e:"An email gateway is the inspection chokepoint sitting in front of the mail system, filtering, sandboxing, and quarantining before delivery.",
w:["","A DKIM selector locates the signing key in DNS.","SPF lists authorized senders; it does not inspect content.","An MTA routes mail; routing alone performs no security inspection."]},
{i:1128,d:4,o:"4.4",t:"s",g:"monitoring-tools",
q:"Analysts suspect slow data theft over several weeks. Full packet capture was not enabled, but routers exported records of every conversation: source, destination, ports, bytes, and duration. Which data source will the analysts use?",
c:["SNMP traps","NetFlow","Antivirus logs","DLP content matches"],a:1,
e:"NetFlow records conversation metadata for every flow crossing the device, cheap enough to retain for weeks, which is exactly what reconstructing a slow exfiltration timeline requires.",
w:["SNMP traps report device health events, not per-conversation records.","","Antivirus logs cover malware detections on hosts.","DLP matches require content inspection that was not running."]},
{i:1129,d:4,o:"4.5",t:"b",g:"web-filtering",
q:"A company blocks entire classes of websites, gambling, weapons, adult content, based on the topic each site belongs to rather than evaluating each URL individually. Which web filter mechanism is this?",
c:["Reputation scoring","URL allow list","Content categorization","Agent-based inspection"],a:2,
e:"Content categorization assigns sites to topical categories and lets policy admit or block whole categories at once.",
w:["Reputation scores risk signals such as domain age and abuse history.","An allow list permits only named sites, far blunter than category policy.","","Agent-based describes where filtering executes, not how decisions are made."]},
{i:1130,d:4,o:"4.4",t:"b",g:"monitoring-tools",
q:"A switch is configured to immediately push an alert message to the monitoring server the moment one of its interfaces goes down, rather than waiting to be polled. Which mechanism sends that alert?",
c:["NetFlow export","Syslog archive","Vulnerability scan","SNMP trap"],a:3,
e:"SNMP traps are unsolicited, event-driven notifications a device pushes to its manager when something notable happens, the inverse of the manager polling on a schedule.",
w:["NetFlow exports traffic conversation records, not device events.","Syslog archiving stores messages; the push-on-event mechanism described is the trap.","A vulnerability scan is an assessment, not a device alert.",""]},
{i:1131,d:5,o:"5.2",t:"b",g:"risk-appetite",
q:"A startup announces it will aggressively enter risky new markets and accept substantial potential losses in exchange for growth. Which risk appetite posture is this?",
c:["Expansionary","Conservative","Neutral","Avoidant"],a:0,
e:"An expansionary appetite deliberately accepts more risk in pursuit of opportunity and growth.",
w:["","Conservative appetite minimizes risk acceptance, prioritizing protection over opportunity.","Neutral balances the two without leaning either way.","Avoidant is not one of the named appetite postures; avoidance is a per-risk strategy."]},
{i:1132,d:5,o:"5.2",t:"m",g:"risk-analysis",
q:"Which statement correctly distinguishes probability from likelihood in risk analysis?",
c:["They are functionally interchangeable once an organization moves to a formal quantitative risk model","Probability is numeric; likelihood is qualitative","Likelihood applies only to insider threats and has no meaning in external threat scenarios","Probability can only ever be calculated retroactively, after an incident has already occurred"],a:1,
e:"Probability is numeric, derived from data, a percentage or a value between 0 and 1, while likelihood is the qualitative scale used when precise numbers are unavailable.",
w:["Formal quantitative analysis specifically requires numeric probability; a qualitative label is not an acceptable substitute there.","","Likelihood applies to any risk type an organization assesses, not insider threats specifically.","Probability is commonly estimated from historical data before an incident happens, which is the entire point of proactive risk analysis."]},
{i:1133,d:5,o:"5.2",t:"b",g:"bia-metrics",
q:"After a ransomware incident, an online retailer determines its order system must be restored within 4 hours or losses become unacceptable. What is the 4-hour figure called?",
c:["RPO","MTBF","RTO","ALE"],a:2,
e:"The RTO (Recovery Time Objective) is the maximum tolerable time to restore a function after disruption; it drives how capable, and expensive, the recovery architecture must be.",
w:["RPO measures tolerable data loss in time, not restoration speed.","MTBF is observed average time between failures.","","ALE is the expected annualized dollar loss from a risk."]},
{i:1134,d:5,o:"5.4",t:"b",g:"privacy-roles",
q:"A marketing firm decides what customer data to collect and why. It hires a cloud analytics company that crunches that data strictly per the firm's instructions. In privacy terms, what is the analytics company?",
c:["Data controller","Data subject","Data owner","Data processor"],a:3,
e:"A processor handles personal data only on the documented instructions of the controller; deciding nothing about purpose or means is what defines the role.",
w:["The marketing firm is the controller because it determines purpose and means.","Data subjects are the individuals the data describes.","Data owner is an internal accountability role, not the party processing under instruction.",""]},
{i:1135,d:5,o:"5.5",t:"b",g:"audits",
q:"After completing a SOC 2 examination, an audit firm issues a formal signed statement asserting that the company's controls were evaluated and found effective. What is this formal assertion called?",
c:["Attestation","Self-assessment","Gap analysis","Sanction"],a:0,
e:"Attestation is the auditor's formal declaration, backed by their professional standing, that the controls were examined and the claims about them hold.",
w:["","Self-assessment is the organization grading itself without external assertion.","Gap analysis compares current state to a target framework.","A sanction is a penalty for non-compliance."]},
{i:1136,d:5,o:"5.3",t:"b",g:"vendor-assessment",
q:"A contract clause reserves the customer's ability to inspect a vendor's security controls, facilities, and records directly, rather than relying only on the vendor's self-reports. What is this clause?",
c:["Non-disclosure agreement","Right-to-audit clause","Statement of work","Service-level agreement"],a:1,
e:"A right-to-audit clause contractually preserves the customer's option to verify vendor claims firsthand, the backstop that makes questionnaires and attestations trustworthy.",
w:["An NDA protects confidential information exchanged.","","A SOW defines deliverables for an engagement.","An SLA sets performance targets, not inspection rights."]}
];

const Q9 = [
{i:1201,d:2,o:"2.4",t:"s",g:"ddos",
q:"An attacker sends small spoofed DNS queries to open resolvers, each answering with responses fifty times larger, all delivered to the victim's address. The defining feature is the traffic multiplication. Which attack is this?",
c:["Reflected-only DDoS","On-path interception","Amplified DDoS","Credential stuffing"],a:2,
e:"Amplification abuses services whose responses vastly outweigh the requests, multiplying attacker bandwidth; the spoofed source makes it reflected as well, but the size multiplication is what defines amplification.",
w:["Reflection alone bounces traffic without the size multiplier; the fifty-fold growth is the amplification signature.","No traffic is intercepted; it is generated.","","Credential stuffing replays breached passwords at login pages."]},
{i:1202,d:2,o:"2.4",t:"b",g:"account-indicators",
q:"An account authenticates from Chicago at 2:05 PM and from Singapore at 2:40 PM the same day. Which indicator of compromise is this?",
c:["Impossible travel","Resource consumption","Blocked content","Out-of-cycle logging"],a:0,
e:"Impossible travel flags logins from locations no human could physically span in the elapsed time, strongly indicating credentials in use by more than one party.",
w:["","Resource consumption is abnormal CPU, memory, or bandwidth usage.","Blocked content is filtered access attempts.","Out-of-cycle logging is activity at abnormal times, not impossible geography."]},
{i:1203,d:2,o:"2.3",t:"b",g:"mobile-vulns",
q:"An employee installs an app on their Android phone directly from a website APK file, bypassing the official app store and its vetting. Which mobile vulnerability does this create?",
c:["Jailbreaking","Side loading","Firmware rollback","VM escape"],a:1,
e:"Side loading installs applications from outside the official store, skipping the store's malware screening and update chain, a named mobile device vulnerability.",
w:["Jailbreaking removes the OS vendor's restrictions entirely; installing one outside app does not.","","Firmware rollback is downgrading device firmware.","VM escape is a virtualization boundary break."]},
{i:1204,d:2,o:"2.3",t:"s",g:"supply-chain",
q:"Investigators discover that network cards from one supplier shipped with implanted firmware providing covert remote access, affecting every organization that bought them. Which vulnerability category does this represent?",
c:["Zero-day in the operating system","Misconfiguration","Cloud-specific vulnerability","Hardware provider supply chain compromise"],a:3,
e:"A hardware provider compromise poisons equipment before delivery, so victims install the backdoor themselves through entirely legitimate procurement.",
w:["The OS is not the flaw; the hardware arrived compromised.","Nothing was configured wrongly by the victims.","The issue exists wherever the cards are installed, cloud or not.",""]},
{i:1205,d:2,o:"2.4",t:"s",g:"application-attacks",
q:"Web server logs show requests containing sequences like ' OR 1=1-- submitted through a login form, followed by the application returning unexpected database records. Which attack do the logs indicate?",
c:["Cross-site scripting","SQL injection","Directory traversal","Buffer overflow"],a:1,
e:"' OR 1=1-- is classic SQL injection syntax: input crafted to alter the database query's logic so it returns or exposes records the attacker should never see.",
w:["XSS payloads are script tags aimed at browsers, not query logic.","","Traversal uses ../ path sequences to reach files.","Overflow attacks memory limits with oversized input, not query syntax."]},
{i:1206,d:2,o:"2.4",t:"b",g:"application-attacks",
q:"A request for /view?file=../../../etc/passwd returns the server's password file to the attacker. Which attack succeeded?",
c:["Directory traversal","Replay","Privilege escalation","Forgery"],a:0,
e:"Directory traversal walks up and out of the intended web directory using ../ sequences to read files the application never meant to expose.",
w:["","Replay resends captured legitimate traffic.","Privilege escalation raises an account's rights; this reads a file with existing rights.","Forgery tricks a victim's browser into submitting requests."]},
{i:1207,d:2,o:"2.4",t:"m",g:"password-attacks",
q:"Which attack tries a small set of very common passwords against thousands of different accounts, staying under lockout thresholds?",
c:["Brute force against one account","Credential stuffing with breached pairs","Password spraying","Rainbow table lookup"],a:2,
e:"Spraying inverts brute force: few passwords, many accounts, so no single account sees enough failures to lock, while the odds of someone using Winter2026! remain excellent.",
w:["Brute force hammers one account with many guesses, triggering lockout.","Stuffing replays known username-password pairs from breaches.","","Rainbow tables reverse stolen hashes offline."]},
{i:1208,d:2,o:"2.4",t:"b",g:"malware-types",
q:"A new laptop arrives preloaded with trial software, toolbars, and promotional apps that slow the system and expand its attack surface, though none of it is overtly malicious. What is this software called?",
c:["Rootkit","Ransomware","Spyware","Bloatware"],a:3,
e:"Bloatware is unwanted preinstalled software: not designed to harm, but consuming resources and adding unpatched attack surface, which is why hardening includes removing it.",
w:["A rootkit hides malicious presence at privileged levels.","Ransomware encrypts data for extortion.","Spyware covertly collects user information.",""]},
{i:1209,d:3,o:"3.1",t:"b",g:"sdn",
q:"A security team wants firewall and routing policy for two hundred switches defined once, centrally, and pushed programmatically, instead of configuring each device by hand. Which architecture enables this?",
c:["Software-defined networking","Air-gapped segments","Thick client architecture","Peer-to-peer networking"],a:0,
e:"SDN centralizes the control plane in a controller that programs all forwarding devices, turning network-wide policy into software instead of per-device configuration.",
w:["","Air gaps isolate; they do not centralize control.","Thick clients describe where application processing occurs.","Peer-to-peer removes central control, the opposite direction."]},
{i:1210,d:3,o:"3.1",t:"s",g:"iac",
q:"A production outage is traced to an engineer's manual console change that no one documented. The team wants any manual drift automatically detected and reverted to the approved definition. Which practice provides this?",
c:["Serverless computing, running code without provisioning or managing underlying servers directly","Manual change logs kept by administrators after each configuration change","Infrastructure as code with enforced state","Vertical scaling, adding more CPU or memory capacity to an existing single server"],a:2,
e:"With IaC, the version-controlled definition is the source of truth; tooling continuously compares reality against it and reverts undocumented drift, making the console change visible and reversible.",
w:["Serverless changes the compute model entirely; it says nothing about how configuration drift is governed.","Manual logs depend entirely on the person remembering to write them, which is exactly what failed in this scenario.","","Scaling adds capacity to handle load; it has nothing to do with detecting or reverting configuration drift."]},
{i:1211,d:3,o:"3.3",t:"b",g:"data-states",
q:"A processor feature keeps data encrypted even while it is being actively computed on, protecting it from a compromised operating system on the same machine. Which data state does this protect?",
c:["Data at rest","Data in use","Data in transit","Archived data"],a:1,
e:"Data in use is data loaded in memory and under computation, historically the unprotected state; enclave technologies extend protection into active processing.",
w:["At rest is stored data, covered by disk and file encryption.","","In transit is data moving across networks, covered by TLS and IPSec.","Archived data is a form of data at rest."]},
{i:1212,d:3,o:"3.3",t:"b",g:"data-protection",
q:"A file server restricts each department folder so only that department's group can read it, with write access limited further to team leads. Which method of securing data is this?",
c:["Hashing","Geographic restriction","Obfuscation","Permission restrictions"],a:3,
e:"Permission restrictions control who may read or modify data through access rights, one of the named methods to secure data.",
w:["Hashing verifies integrity; it grants no one access.","Geographic restriction gates access by location.","Obfuscation makes data unintelligible rather than access-controlled.",""]},
{i:1213,d:3,o:"3.4",t:"m",g:"site-considerations",
q:"Which statement BEST captures the tradeoff of a cold site?",
c:["Lowest ongoing cost, but longest recovery time","Highest cost with instant failover, matching production exactly at all times","Moderate cost with live data replication kept continuously in sync","No cost at all, since the site does not exist until it is actually needed"],a:0,
e:"A cold site is essentially prepared empty space, cheap to maintain, but recovery means installing equipment and restoring everything, taking days rather than minutes.",
w:["","Instant failover at premium, always-on cost describes a hot site, not a cold one.","Live, continuously-synced replication at moderate-to-high cost describes a warm or hot arrangement.","The lease, power, and physical readiness of a cold site still cost real money well before any disaster occurs."]},
{i:1214,d:3,o:"3.4",t:"m",g:"capacity-planning",
q:"A disaster recovery review concludes that even though standby systems exist, only one employee knows how to perform the failover. Which capacity planning dimension is deficient?",
c:["Technology","People","Infrastructure","Power"],a:1,
e:"Capacity planning covers people, technology, and infrastructure; a single human point of failure in critical procedures is a people-capacity gap regardless of how good the systems are.",
w:["The standby technology exists and works.","","Infrastructure covers facilities and connectivity, which are not the gap here.","Power is part of infrastructure and is not the issue."]},
{i:1215,d:3,o:"3.4",t:"m",g:"testing",
q:"Which statement correctly contrasts a tabletop exercise with a simulation?",
c:["A tabletop touches live production systems while a simulation stays entirely theoretical","Simulations are purely verbal discussions while tabletops involve live hands-on actions","A tabletop is a discussion-based walkthrough, while a simulation injects a scenario with real actions","They are identical exercises that simply go by two different names depending on the organization"],a:2,
e:"Tabletops talk through the plan around a table; simulations execute it against a staged scenario, revealing gaps that discussion alone misses, at higher cost and effort.",
w:["This reverses the two entirely: a tabletop is the discussion-only format, not the one touching live systems.","This is also reversed: tabletops are the verbal ones, simulations are the ones involving actual response actions.","","The exam specifically tests the distinction between discussing a plan and actually executing it."]},
{i:1216,d:3,o:"3.4",t:"b",g:"backups",
q:"A company's backup tapes are stored offsite. Why must those backups be encrypted?",
c:["Encryption makes the tapes restore faster","Encryption compresses data to fit more on each tape","Unencrypted tapes cannot be transported legally in any jurisdiction","A lost or stolen tape would otherwise hand over the entire data set in readable form"],a:3,
e:"Backups concentrate everything valuable in one portable object; encryption ensures a tape lost in transit or stolen from storage yields ciphertext instead of the whole business.",
w:["Encryption adds slight overhead rather than speed.","Compression is a separate function.","Transport legality varies and is not the core security reason.",""]},
{i:1217,d:4,o:"4.7",t:"b",g:"automation-use-cases",
q:"When a SIEM detects a critical alert, automation immediately opens a tracked incident record, assigns it to the on-call analyst, and pages them if it goes unacknowledged for ten minutes. Which automation use cases are demonstrated?",
c:["Ticket creation and escalation","Guard rails and sandboxing","User provisioning and federation","Continuous integration and version control"],a:0,
e:"Automated ticket creation guarantees every alert becomes a tracked, assigned work item, and escalation ensures unacknowledged criticals climb the chain instead of aging silently.",
w:["","Guard rails block unsafe configurations; nothing is blocked here.","Provisioning manages accounts, not incidents.","CI automates software build and test."]},
{i:1218,d:4,o:"4.7",t:"b",g:"automation-benefits",
q:"A development pipeline automatically runs security tests on every single code commit, failing the build when a vulnerability appears. Which practice does this describe?",
c:["Penetration testing, having a skilled team actively attempt exploitation against a running system","Continuous integration with automated security testing","Annual code audit, a scheduled once-a-year deep review of the full codebase","Manual peer review, a colleague reading and approving another developer's code changes"],a:1,
e:"Continuous integration merges and tests code constantly, so security defects surface within minutes of introduction, when they are cheapest to fix, instead of at release time.",
w:["Penetration testing attacks a running system, typically on a periodic schedule, not on every commit.","","Annual audits find a year's accumulated flaws all at once, the direct opposite of the per-commit cadence described here.","Peer review is human and valuable, but it is not the automated, tool-driven gate this scenario describes."]},
{i:1219,d:4,o:"4.7",t:"m",g:"automation-considerations",
q:"A team automated its deployments years ago with custom scripts nobody fully understands anymore. Each change now requires reverse-engineering fragile code, and errors are frequent. Which automation consideration does this exemplify?",
c:["Workforce multiplier","Reaction time","Technical debt","Employee retention"],a:2,
e:"Technical debt is the accumulating future cost of past shortcuts: the undocumented scripts saved time once and now tax every change made on top of them.",
w:["Workforce multiplier is a benefit; this is the liability side.","Reaction time is a speed benefit, not the maintenance burden described.","","Retention is a listed automation benefit, unrelated here."]},
{i:1220,d:4,o:"4.7",t:"b",g:"automation-benefits",
q:"Automation lets a five-person security team handle alert volume that previously required fifteen analysts, freeing the humans for investigation and hunting. Which named benefit is this?",
c:["Single point of failure","Ongoing supportability","Complexity","Workforce multiplier"],a:3,
e:"Workforce multiplier means automation amplifies each person's output, letting a small team deliver large-team capacity while humans do the judgment work machines cannot.",
w:["Single point of failure is a risk consideration, not a benefit.","Supportability is a maintenance consideration.","Complexity is a cost consideration.",""]},
{i:1221,d:4,o:"4.4",t:"s",g:"siem",
q:"A failed VPN login, an antivirus alert on the same user's laptop, and an unusual file share access appear in three separate systems within five minutes. Only one platform pieced them together into a single incident. Which capability did that?",
c:["SIEM correlation across aggregated log sources","Antivirus signature matching against a database of known malware patterns on the local endpoint","NetFlow sampling of traffic conversations passing through routers and switches","Vulnerability scanning of hosts to identify unpatched software weaknesses"],a:0,
e:"A SIEM's core value is correlation: aggregating logs from many sources and connecting individually minor events into one coherent attack narrative worth investigating.",
w:["","Antivirus sees only its own endpoint's detections and has no visibility into VPN logins or file share activity elsewhere.","NetFlow records traffic conversations without any cross-system correlation or context about what generated them.","Scanners assess weaknesses that exist, not live events unfolding across multiple systems in real time."]},
{i:1222,d:4,o:"4.5",t:"s",g:"web-filtering",
q:"Remote employees work from home and coffee shops, never touching the corporate network, yet their web traffic must still be filtered by company policy. Which web filter deployment fits?",
c:["A centralized proxy inside the office data center only","Agent-based filtering installed on each laptop","A firewall rule on the office perimeter","DNS filtering on the office resolver only"],a:1,
e:"An agent on the endpoint enforces filtering wherever the device goes, independent of which network it uses, which office-anchored controls cannot do for roaming users.",
w:["Traffic from a coffee shop never reaches the office proxy.","","The office perimeter never sees remote traffic.","Remote devices use whatever resolver their network provides unless an agent redirects them."]},
{i:1223,d:4,o:"4.1",t:"m",g:"wireless-security",
q:"Which WPA3 improvement specifically addresses the weakness that let attackers capture a WPA2 handshake and crack the password offline?",
c:["Longer SSID names, which increase the character length of the visible network name","Hidden network broadcast, which suppresses the SSID from appearing in scan results","Simultaneous Authentication of Equals replacing the PSK handshake","MAC address randomization, which rotates a client device's hardware address to limit tracking"],a:2,
e:"SAE replaces WPA2's crackable four-way handshake with an exchange resistant to offline dictionary attacks: captured traffic no longer lets attackers grind passwords at leisure.",
w:["SSID length is purely cosmetic and has no bearing on the handshake or how it's cracked.","Hiding an SSID is a weak form of obscurity that does nothing to protect the handshake exchange itself.","","MAC randomization is a client-side privacy feature that limits device tracking; it has no relationship to handshake security."]},
{i:1224,d:4,o:"4.1",t:"b",g:"wireless-security",
q:"In an enterprise wireless deployment using 802.1X, which component actually checks the user's credentials and tells the access point whether to grant access?",
c:["The DHCP server","The DNS resolver","The wireless client's TPM","The RADIUS authentication server"],a:3,
e:"The access point merely relays the EAP conversation; the RADIUS server performs the credential validation and returns the accept-or-reject decision, along with authorization details.",
w:["DHCP assigns addresses after access is granted.","DNS resolves names and plays no authentication role.","A client TPM may protect the client's own keys, but it does not decide network admission.",""]},
{i:1225,d:4,o:"4.1",t:"m",g:"application-security",
q:"Which pairing correctly matches the analysis technique to when it examines the application?",
c:["Static analysis inspects source code without executing it; dynamic analysis tests the running application","Static analysis requires production deployment; dynamic analysis reads source code","Both require the application to be running","Both examine only third-party dependencies"],a:0,
e:"Static analysis reads code at rest, catching flaws before anything runs; dynamic analysis probes the executing application, catching what only manifests at runtime. Mature pipelines use both.",
w:["","This reverses the two definitions.","Static analysis specifically does not execute the code.","Dependency review is package monitoring, a distinct activity."]},
{i:1226,d:5,o:"5.2",t:"m",g:"risk-appetite",
q:"Which statement BEST distinguishes risk appetite from risk tolerance?",
c:["They are formal synonyms used interchangeably throughout governance documentation","Appetite is the broad amount of risk the organization is willing to take; tolerance is the acceptable deviation for a specific risk","Tolerance applies exclusively to financial risk and has no bearing on operational or reputational risk","Appetite is set entirely by external regulators while tolerance is determined internally by leadership"],a:1,
e:"Appetite is the strategic posture, how much risk the organization wants in pursuit of its goals; tolerance is the operational boundary, how much variation from that target is acceptable before action is required.",
w:["The exam treats them as related but genuinely distinct concepts, which is exactly why both terms exist separately.","","Both concepts apply broadly across every risk category, not financial risk exclusively.","Both appetite and tolerance are internal governance decisions set by the organization itself, not imposed externally."]},
{i:1227,d:5,o:"5.2",t:"b",g:"risk-register",
q:"A risk register entry states that if the percentage of unpatched critical servers exceeds 5 percent, remediation must be escalated to leadership. What is the 5 percent value called?",
c:["Exposure factor","Annualized rate","Risk threshold","Impact rating"],a:2,
e:"A risk threshold is the defined trigger point at which a monitored risk demands action or escalation, converting a metric into a decision rule.",
w:["Exposure factor is the fraction of asset value one incident destroys.","ARO estimates event frequency per year.","","Impact rates severity, not the action trigger."]},
{i:1228,d:5,o:"5.2",t:"s",g:"risk-strategies",
q:"A legacy system cannot support a required security control. Leadership formally documents acceptance of the risk for twelve months while a replacement is procured, with compensating monitoring in the interim. Which strategy and mechanism does this describe?",
c:["Avoidance via decommissioning the legacy system before the replacement is ready","Transfer via insurance, shifting the financial consequence to a third-party underwriter","Mitigation via patching, applying a technical fix that closes the control gap directly","Acceptance via a documented, time-bound exception"],a:3,
e:"The organization is accepting the risk knowingly, through a formal exception: documented, time-limited, with compensations, rather than pretending the gap does not exist.",
w:["The system continues operating throughout, so nothing was actually avoided here.","No insurance or third party is described as assuming any financial burden in this scenario.","The control gap itself remains open the whole time; monitoring compensates for it but doesn't close it through a technical fix.",""]},
{i:1229,d:5,o:"5.3",t:"b",g:"agreements",
q:"Two organizations sign a document expressing shared intent to collaborate on research, explicitly noting it creates no binding legal obligations. Which agreement is this?",
c:["Memorandum of understanding","Service-level agreement","Business partners agreement","Statement of work"],a:0,
e:"An MOU records mutual intent and shared expectations while typically remaining non-binding, the diplomatic handshake preceding enforceable contracts.",
w:["","An SLA sets enforceable service performance commitments.","A BPA is a binding agreement establishing partnership terms.","A SOW defines binding deliverables and timelines."]},
{i:1230,d:5,o:"5.3",t:"b",g:"agreements",
q:"Two companies form a joint venture, and a document defines each partner's ownership share, profit split, decision rights, and what happens if one exits. Which agreement governs this?",
c:["Non-disclosure agreement","Business partners agreement","Memorandum of understanding","Master service agreement"],a:1,
e:"A BPA (Business Partners Agreement) structures the partnership itself: contributions, shares, governance, and exit terms between co-venturing parties.",
w:["An NDA protects shared confidential information but structures nothing.","","An MOU is typically non-binding intent.","An MSA governs a customer-vendor service relationship, not co-ownership."]},
{i:1231,d:5,o:"5.4",t:"s",g:"privacy-roles",
q:"A European regulator investigates a breach at a cloud analytics vendor. The regulator holds the retailer that hired the vendor primarily accountable, because the retailer decided what data to collect and why. Which privacy principle does this reflect?",
c:["Processors carry all legal responsibility for a breach regardless of who directed the processing","Data subjects are personally liable for how their own data was ultimately handled","The controller remains accountable for processing it directs","Accountability transfers entirely to whichever party physically holds the data at the time"],a:2,
e:"Privacy law holds the controller, the party deciding purpose and means, accountable for the processing chain it directs; hiring a processor delegates work, not responsibility.",
w:["Processors do carry certain obligations, but primary accountability follows the party who made the decisions, not the one executing them.","Data subjects are the protected party under privacy law, never the liable one for a breach of their own data.","","Responsibility does not simply transfer away by outsourcing the physical processing to someone else."]},
{i:1232,d:5,o:"5.4",t:"b",g:"privacy-data",
q:"A person invokes their legal right to have a company delete all personal data held about them. Which privacy concept are they exercising?",
c:["Data sovereignty","Attestation","Data inventory","Right to be forgotten"],a:3,
e:"The right to be forgotten, or right to erasure, lets individuals compel deletion of their personal data when no overriding legal basis requires retention.",
w:["Sovereignty ties data to the laws of where it resides.","Attestation is a formal compliance assertion.","A data inventory is what lets the company find everything it must delete, the prerequisite rather than the right.",""]},
{i:1233,d:5,o:"5.5",t:"m",g:"audits",
q:"Which option correctly describes an internal self-assessment?",
c:["The organization evaluates its own controls against a framework","A regulator's formal examination conducted with statutory authority behind it","An independent third-party audit resulting in a signed attestation report","A penetration test carried out by an external firm hired for that purpose"],a:0,
e:"Self-assessments are the organization grading itself: valuable for finding gaps before real audits, but without the independence that gives external stakeholders assurance.",
w:["","Regulatory examinations are external by definition, carried out by a body with statutory authority, not the organization itself.","Third-party attestation from an independent auditor is precisely what a self-assessment lacks.","External penetration testing is a technical assessment performed by outside specialists, a different exercise entirely."]},
{i:1234,d:5,o:"5.2",t:"b",g:"risk-assessment",
q:"An organization performs a formal risk assessment every quarter on a fixed schedule, in addition to assessments triggered by major changes. What is the scheduled quarterly assessment called?",
c:["Ad hoc","Recurring","One-time","Continuous"],a:1,
e:"A recurring assessment repeats on a defined cadence, quarterly here, distinct from event-triggered ad hoc reviews and from always-on continuous evaluation.",
w:["Ad hoc assessments are unscheduled, triggered by circumstances.","","One-time assessments serve a single project or moment.","Continuous assessment runs in real time rather than on a calendar."]},
{i:1235,d:5,o:"5.4",t:"b",g:"compliance-consequences",
q:"After repeated privacy violations, a regulator bars a firm from processing citizens' data in its jurisdiction until remediation is proven. Which consequence of non-compliance is this?",
c:["Reputational damage","Fine","Sanction","Contractual impact"],a:2,
e:"Sanctions are punitive restrictions imposed by an authority, here a processing ban, distinct from monetary fines, though they often arrive together.",
w:["Reputation suffers too, but the regulator's imposed restriction is the sanction.","A fine is specifically monetary.","","Contractual impacts flow from private agreements, not regulators."]},
{i:1236,d:5,o:"5.1",t:"b",g:"governance-structures",
q:"A national data protection authority issues binding rules that every company processing citizen data must follow, and can compel changes to their programs. Which governance structure type is this?",
c:["Internal audit committee","Board of directors","Advisory council","Government entity"],a:3,
e:"Government entities are external governance structures whose rules carry legal force over organizations within their jurisdiction, unlike internal boards and committees.",
w:["Audit committees are internal oversight bodies.","A board governs one organization from within.","Advisory councils recommend without binding force.",""]}
];

const Q10 = [
{i:1301,d:2,o:"2.2",t:"s",g:"misinformation",
q:"Ahead of a product safety vote, a coordinated network of fake accounts posing as ordinary customers floods forums with fabricated injury stories about a competitor's product. The creators know the stories are false. Which technique is this?",
c:["Misinformation spread in good faith","Disinformation deliberately manufactured to deceive","Pretexting","Typosquatting"],a:1,
e:"Deliberately fabricated false content spread to deceive is disinformation; the manufactured grassroots appearance is the delivery mechanism, but the knowing falsehood is what defines it.",
w:["Misinformation is false content shared by people who believe it; these creators know it is false.","","Pretexting is a fabricated backstory used against a specific target in social engineering.","Typosquatting registers look-alike domains."]},
{i:1302,d:2,o:"2.2",t:"b",g:"typosquatting",
q:"An attacker registers gooogle-mail.com and hosts a pixel-perfect copy of a webmail login page there, harvesting credentials from users who mistype the address. Which technique is this?",
c:["Typosquatting","Watering hole","Smishing","Domain hijacking"],a:0,
e:"Typosquatting registers domains that capitalize on predictable typing mistakes, catching users who arrive by error and see a convincing clone.",
w:["","A watering hole compromises a legitimate site victims already visit.","Smishing is SMS-based phishing.","Domain hijacking seizes control of the real domain's registration."]},
{i:1303,d:2,o:"2.2",t:"s",g:"bec",
q:"An attacker who has quietly monitored a CFO's mailbox for weeks waits until a real acquisition payment is due, then sends the accounts team an email from the CFO's actual account changing the wire destination. Which attack is this?",
c:["Vishing","Brand impersonation","Business email compromise","Watering hole"],a:2,
e:"BEC abuses control of, or convincing imitation of, a genuine business email account to redirect legitimate financial transactions, with reconnaissance making the timing and details plausible.",
w:["No phone call is involved.","Brand impersonation mimics a company's public identity toward outsiders; this weaponizes an internal account.","","A watering hole poisons a website victims visit."]},
{i:1304,d:2,o:"2.4",t:"s",g:"wireless-attacks",
q:"Attackers repeatedly knock conference attendees off the venue Wi-Fi with forged disconnect frames while broadcasting a stronger network with the identical name, which victims' devices then auto-join. Which attack pairing is this?",
c:["Bluesnarfing feeding RFID cloning, two attacks against entirely different radio technologies","Amplification feeding reflection, techniques used in volumetric denial-of-service attacks","Domain hijacking feeding pharming, both operating at the DNS and domain layer","A deauthentication attack herding victims onto an evil twin"],a:3,
e:"The deauth flood forcibly disconnects clients, and the evil twin with the same SSID and stronger signal captures them on reconnect, a classic two-stage wireless attack.",
w:["Neither Bluetooth nor physical badges are involved in this Wi-Fi scenario.","Amplification and reflection are DDoS techniques operating on spoofed traffic volume, not disconnect frames or rogue access points.","Those attacks operate on DNS resolution and domain names, not 802.11 wireless frames.",""]},
{i:1305,d:2,o:"2.4",t:"b",g:"resource-indicators",
q:"Cloud bills triple in a month. Investigation finds unknown processes consuming maximum CPU on dozens of servers around the clock, communicating with mining pools. Which indicator first flagged the compromise?",
c:["Impossible travel","Resource consumption","Missing logs","Blocked content"],a:1,
e:"Abnormal resource consumption, sustained maximum CPU with matching cost explosion, is the named indicator; cryptomining steals compute rather than data.",
w:["No authentication geography is involved.","","Logs exist; the bill exposed the issue.","Nothing was filtered."]},
{i:1306,d:2,o:"2.4",t:"s",g:"log-indicators",
q:"During an investigation, analysts find that security logs for the exact two-hour window of the suspected intrusion are absent on three systems, while logs before and after are intact. Which indicator is this?",
c:["Missing logs","Out-of-cycle logging","Published or documented credentials","Account lockout"],a:0,
e:"Selectively absent logs covering the attack window indicate deliberate deletion to cover tracks, a named indicator that itself constitutes evidence.",
w:["","Out-of-cycle logging is activity at abnormal times, not absence.","Published credentials are leaked secrets appearing publicly.","No lockouts are described."]},
{i:1307,d:2,o:"2.4",t:"b",g:"physical-attacks",
q:"Attackers cut power and disable the cooling system serving a competitor's server room, causing thermal shutdown of its infrastructure. Which physical attack category is this?",
c:["Brute force entry","RFID cloning","Environmental attack","Tailgating"],a:2,
e:"Environmental attacks target the physical conditions systems depend on, power, cooling, water, rather than the systems or their credentials directly.",
w:["No entry was forced.","No badge was copied.","","No one followed anyone through a door."]},
{i:1308,d:2,o:"2.3",t:"m",g:"zero-day",
q:"Which situation constitutes a zero-day vulnerability?",
c:["A flaw patched last year but still unpatched on some systems","A misconfigured firewall rule","A weak password on an administrator account","A flaw actively exploited before the vendor knows it exists or has any fix available"],a:3,
e:"Zero-day means defenders have had zero days to respond: the vulnerability is unknown to the vendor, so no patch, signature, or advisory exists while exploitation occurs.",
w:["A patched-but-unapplied flaw is a patch management failure, not a zero-day.","Misconfiguration is a known-class error, fixable immediately.","Weak credentials are a hygiene failure with a known remedy.",""]},
{i:1309,d:3,o:"3.1",t:"m",g:"microservices",
q:"Which security tradeoff comes with decomposing an application into microservices?",
c:["Compromise blast radius shrinks per service, but the number of interfaces to secure multiplies","Security responsibility transfers entirely to the cloud provider once services are broken apart","Attack surface disappears completely because each individual service is small","Ongoing monitoring becomes unnecessary due to the natural isolation between services"],a:0,
e:"Each service is a smaller target, but every service-to-service call is now a network API needing authentication, authorization, and encryption, so the coordination surface grows even as individual blast radius shrinks.",
w:["","Choosing a microservices architecture does not transfer any security responsibility to the cloud provider automatically.","Attack surface actually multiplies across many small APIs rather than disappearing.","More independent moving parts calling each other demands more monitoring, not less."]},
{i:1310,d:3,o:"3.1",t:"m",g:"rtos",
q:"Why is patching a real-time operating system in industrial equipment uniquely difficult?",
c:["RTOS vendors release patches on a near-daily basis, overwhelming operations staff completely","RTOS platforms have no known vulnerabilities that would ever require patching in the first place","The system must meet strict deterministic timing guarantees, and any change risks breaking that","RTOS devices are designed to patch themselves automatically without any operator involvement at all"],a:2,
e:"An RTOS is valued for guaranteed response timing; patches can perturb that determinism, so changes need vendor requalification and production windows, leaving vulnerabilities open far longer than on IT systems.",
w:["Updates for these platforms are typically sparse and tightly vendor-controlled, the opposite of overwhelming and frequent.","RTOS platforms absolutely have vulnerabilities; they simply stay unpatched for far longer than typical IT systems.","","Automatic self-patching is precisely what certified real-time industrial equipment avoids, given the risk to timing guarantees."]},
{i:1311,d:3,o:"3.3",t:"m",g:"data-states",
q:"Which option correctly matches each data state to a protection commonly applied to it?",
c:["At rest: TLS; in transit: disk encryption; in use: tape storage","At rest: full-disk encryption; in transit: TLS; in use: secure enclave protection","At rest: NetFlow; in transit: hashing; in use: replication","All three states are protected by the same single control"],a:1,
e:"Stored data gets disk and file encryption, moving data gets transport encryption such as TLS or IPSec, and actively processed data gets enclave or memory protection, three states, three control families.",
w:["This swaps rest and transit protections.","","Those tools serve monitoring, integrity, and availability, not the three states as matched.","No single control covers all three states, which is why the states are distinguished."]},
{i:1312,d:3,o:"3.4",t:"b",g:"backups",
q:"A backup design keeps one copy onsite for fast restores and a second copy offsite for disaster survival, refreshed on a defined schedule. Which two backup considerations does this design address?",
c:["Journaling and snapshots, point-in-time techniques for capturing incremental state changes","Encryption and compression, protecting confidentiality and reducing storage footprint of the copies","Replication and RAID, techniques focused on live availability rather than backup placement","Onsite/offsite placement and backup frequency"],a:3,
e:"Where copies live (onsite for speed, offsite for disaster) and how often they refresh (the schedule) are the two named considerations this design decides.",
w:["Journaling and snapshots are point-in-time capture techniques, not decisions about where copies are stored.","Neither encryption nor compression is what's being described in this particular design scenario.","Replication and RAID address live availability of running systems, not the placement and cadence of backup copies.",""]},
{i:1313,d:3,o:"3.4",t:"b",g:"platform-diversity",
q:"After a single vendor's firewall zero-day compromised every security layer at once, a company rebuilds using firewalls from two different vendors at different tiers. Which resilience concept is this?",
c:["Platform diversity","Vertical scaling","Warm site recovery","Capacity planning"],a:0,
e:"Platform diversity mixes vendors and technologies so one product's flaw cannot defeat every layer simultaneously, trading operational simplicity for survivability.",
w:["","Scaling adds capacity to one system.","Recovery sites address facility loss, not shared-flaw monoculture.","Capacity planning sizes resources for demand."]},
{i:1314,d:3,o:"3.4",t:"b",g:"coop",
q:"A plan defines how the organization keeps delivering its essential functions during a prolonged disruption, including alternate procedures, relocated operations, and succession of authority. Which concept is this?",
c:["Penetration testing","Capacity planning","Continuity of operations","Journaling"],a:2,
e:"Continuity of operations (COOP) is the umbrella plan for sustaining mission-essential functions through disruption, spanning people, process, and alternate arrangements, broader than restoring any one system.",
w:["Testing assesses security, not operational continuity.","Capacity planning sizes resources for normal demand.","","Journaling is a file system recovery technique."]},
{i:1315,d:3,o:"3.2",t:"m",g:"failure-modes",
q:"A hospital configures its inline network IPS to fail-open. What tradeoff did it accept?",
c:["Attacks are always blocked automatically even during a complete device failure","If the IPS dies, traffic flows uninspected","Network traffic halts entirely the moment the IPS fails, protecting the environment above all else","Fail-open eliminates the organization's need for any device redundancy going forward"],a:1,
e:"Fail-open chooses availability over inspection: a dead IPS passes traffic through unexamined, which a hospital may prefer to blocking access to clinical systems, accepting the temporary protection gap.",
w:["A failed device inspects nothing at all; fail-open specifically means it passes traffic unblocked instead of catching attacks.","","Halting all traffic on failure is the definition of fail-closed, the opposite configuration from what's described here.","Redundancy is still exactly how an organization avoids ever having to face this tradeoff in the first place."]},
{i:1316,d:4,o:"4.5",t:"s",g:"host-firewall",
q:"Policy requires that on each laptop, only the approved mail client may reach port 443 on the mail server, while the browser and all other applications on the same laptop must be blocked from that destination. Which control can enforce this per-application distinction?",
c:["Network perimeter firewall, positioned at the edge of the corporate network where it inspects traffic crossing between zones","Screened subnet, a network segment isolated between two firewalls to expose specific services safely","Host-based firewall with per-application rules","DNS filtering, which blocks or allows domain name resolution requests device-wide"],a:2,
e:"Only a control on the endpoint can see which local application generated a connection; a host-based firewall filters by program, something network devices, which see only addresses and ports, cannot distinguish.",
w:["A perimeter firewall sees identical packets on the wire regardless of which local application generated them.","A screened subnet is a network zone design concept, unrelated to distinguishing between applications on a single laptop.","","DNS filtering gates name resolution for the whole device; it can't tell which specific application initiated a given lookup."]},
{i:1317,d:4,o:"4.5",t:"m",g:"ids-ips",
q:"Which statement correctly contrasts a host-based IPS with a host-based IDS?",
c:["A HIPS blocks; a HIDS only alerts","A HIDS blocks while a HIPS only observes traffic and generates alerts without ever intervening","Both are network appliances installed at the perimeter, not software running on the host itself","Neither can detect anything meaningful without a SIEM aggregating and correlating their output"],a:0,
e:"The IDS/IPS distinction holds at the host level: detection alerts, prevention intervenes, and the choice trades response speed against the risk of blocking legitimate activity.",
w:["","This reverses the two entirely: prevention systems block, detection systems only observe and alert.","The host-based variants of both run as software directly on the endpoint, not as network appliances.","Both function standalone and can detect and act independently; a SIEM adds cross-source correlation on top, not basic detection capability."]},
{i:1318,d:4,o:"4.8",t:"s",g:"forensics",
q:"Defense counsel challenges digital evidence by demanding proof of every person who possessed the drive, when, and for what purpose, from seizure to courtroom. Which forensic practice answers this challenge?",
c:["Legal hold notification","Chain of custody documentation","Sandbox detonation","Root cause analysis"],a:1,
e:"Chain of custody is the unbroken documented record of evidence handling; any gap lets opposing counsel argue tampering, regardless of what the evidence shows.",
w:["Legal hold preserves data from deletion; it does not document handling.","","Sandboxing analyzes malware behavior.","RCA explains why an incident happened."]},
{i:1319,d:4,o:"4.8",t:"b",g:"forensics",
q:"The moment litigation becomes reasonably likely, a company must notify custodians and suspend automatic deletion of potentially relevant records, before any collection begins. Which obligation is this?",
c:["E-discovery production","Chain of custody","Acquisition","Legal hold"],a:3,
e:"A legal hold freezes normal retention and deletion for potentially relevant data as soon as litigation is anticipated; destroying data after that point is spoliation with serious penalties.",
w:["E-discovery is the later identification and production of the preserved records.","Chain of custody documents evidence handling once collected.","Acquisition is the forensic imaging step, after preservation.",""]},
{i:1320,d:4,o:"4.8",t:"m",g:"forensics",
q:"During evidence acquisition, why do forensic responders capture RAM before imaging the disk?",
c:["Order of volatility: memory vanishes at power-off, so it's collected first","Disk images are illegal to capture before RAM has been acquired under most evidentiary standards","RAM capacity is larger than disk capacity, so acquiring it takes considerably longer and should be started earlier","Memory cannot contain evidence of value, so it's a quick step to get out of the way before the real work begins"],a:0,
e:"The order of volatility principle collects the most perishable data first: running processes, network connections, and keys live in RAM and vanish at power-off, while the disk waits patiently.",
w:["","No such legal rule exists; the ordering is a forensic best practice based on volatility, not a legal requirement.","RAM is far smaller than disk and is actually quicker to capture, the opposite of this claim.","Memory frequently holds the single best evidence available: injected code, encryption keys, and live session data that exist nowhere on disk."]},
{i:1321,d:4,o:"4.9",t:"b",g:"data-sources",

c:["Packet capture","Automated report","Metadata","Endpoint log"],a:1,
e:"Automated reports are system-generated summaries produced on schedule or trigger, delivering consistent visibility without manual assembly.",
w:["Packet captures are raw traffic evidence.","","Metadata is data about data, such as file properties.","Endpoint logs are raw host event records, the inputs such reports summarize."]},
{i:1322,d:4,o:"4.3",t:"m",g:"vuln-scanning",
q:"Which statement correctly contrasts credentialed and non-credentialed vulnerability scans?",
c:["Non-credentialed scans see more because they bypass authentication entirely and probe every port regardless of access controls","Credentialed scans log in and see internal detail; non-credentialed scans see only the outside","Credentialed scans are illegal on production systems without a separate penetration testing authorization","They produce identical results regardless of whether login credentials are supplied"],a:1,
e:"Logging in transforms visibility: a credentialed scan enumerates from inside what is installed and misconfigured, while a non-credentialed scan probes externally like an unauthenticated attacker, seeing far less but modeling the outsider view.",
w:["Authentication grants more visibility, not less; this claim has the relationship backwards.","","Credentialed scanning is standard, authorized practice on production systems and requires no separate testing agreement beyond normal scan authorization.","The inside and outside views differ substantially in what they reveal, which is exactly why organizations typically run both."]},
{i:1323,d:4,o:"4.4",t:"b",g:"benchmarks",
q:"An organization hardens its servers against a published, industry-consensus configuration checklist maintained by a standards body, checking each setting against the recommended value. What is this checklist called?",
c:["A packet capture profile","A risk register","A vulnerability feed","A security benchmark"],a:3,
e:"Benchmarks, such as CIS Benchmarks, are consensus hardening checklists specifying secure values per setting, and SCAP tooling can assess systems against them automatically.",
w:["Packet captures record traffic.","A risk register tracks organizational risks.","Vulnerability feeds list flaws, not target configurations.",""]},
{i:1324,d:4,o:"4.5",t:"s",g:"edr",
q:"Ransomware begins encrypting a laptop at 2 AM. The endpoint security platform kills the process, isolates the machine from the network, and preserves the process telemetry timeline for investigators, all automatically. Which tool class did this?",
c:["Signature antivirus alone","Endpoint detection and response","NetFlow collector","Vulnerability scanner"],a:1,
e:"EDR combines behavioral detection with automated response, kill, isolate, and preserve, plus the recorded timeline that lets analysts reconstruct the attack afterward.",
w:["Signature AV without the behavioral and response layer stops at detection of known patterns.","","NetFlow observes network conversations from afar.","Scanners assess weaknesses on a schedule; they do not respond to live attacks."]},
{i:1325,d:5,o:"5.5",t:"b",g:"pentest-types",

e:"An unknown environment test (formerly black box) provides zero internal information, modeling a genuine outside attacker at the cost of time spent discovering what insiders already know.",
w:["","Known environment gives full documentation and access.","Partially known provides limited insider information.","Defensive describes the blue team role, not information level."]},
{i:1326,d:5,o:"5.5",t:"b",g:"pentest-types",

w:["Unknown provides nothing at all.","","Physical testing targets facilities and entry controls.","Passive reconnaissance is an information-gathering technique within a test."]},
{i:1327,d:5,o:"5.5",t:"b",g:"pentest-types",

{i:1328,d:5,o:"5.5",t:"b",g:"audits",

c:["Self-assessment","Internal audit","Peer review","Regulatory examination"],a:3,
e:"A regulatory examination is performed by the government authority itself under legal mandate, the most consequential form of external assessment.",

{i:1329,d:5,o:"5.4",t:"s",g:"due-diligence",

w:["","Right to audit is a contract clause about inspecting vendors.","Attestation is a formal compliance assertion.","Sovereignty ties data to local law."]},
{i:1330,d:5,o:"5.1",t:"b",g:"policy-hierarchy",

c:["Guideline","Password standard","Playbook","Acceptable use policy"],a:1,
e:"Standards translate policy intent into mandatory, uniform technical specifications, here the password standard defining exact enforceable values.",
w:["Guidelines are advisory recommendations.","","Playbooks are step-by-step response procedures for scenarios.","An AUP governs how users may use company resources broadly."]},
{i:1331,d:5,o:"5.1",t:"m",g:"policy-hierarchy",
q:"Which statement correctly relates a change management policy to a change management procedure?",
c:["The procedure sets the organizational mandate while the policy lists the granular technical steps","They are the same underlying document, simply reformatted at different font sizes for different audiences","The policy states that changes must be controlled and approved, while the procedure details the exact steps","Procedures are entirely optional while policies carry only advisory, non-binding weight"],a:2,
e:"Policy declares the requirement and authority; procedure operationalizes it into repeatable steps. The pairing appears throughout governance, and the exam tests the direction.",
w:["This reverses the actual relationship between the two document types.","Policy and procedure are genuinely distinct document types serving different governance purposes, not one document at two font sizes.","","Policies are mandatory requirements, and procedures are the required method by which staff comply with them."]},
{i:1332,d:5,o:"5.1",t:"b",g:"governance",
q:"A governance program requires every policy to have a named owner and a scheduled review date, so documents are updated as threats, laws, and the business change. Which governance element is this?",
c:["Sanction enforcement","Data inventory","Attestation","Monitoring and revision"],a:3,
e:"Monitoring and revision keeps governance documents alive: owned, reviewed on schedule, and updated when reality shifts, preventing the slow rot of outdated policy.",
w:["Sanctions punish violations.","A data inventory catalogs information assets.","Attestation asserts compliance at a point in time.",""]},
{i:1333,d:5,o:"5.4",t:"s",g:"privacy-jurisdictions",
q:"A multinational finds that one country requires it to retain communication records for two years while another requires deleting the same records on request. Which compliance challenge does this illustrate?",
c:["Conflicting local, national, and global legal requirements across jurisdictions","A failure in the encryption scheme protecting the communication records themselves","An insider threat originating from an employee mishandling the retention rules","A general lack of security awareness training among staff handling the records"],a:0,
e:"Privacy and retention obligations vary and sometimes directly conflict across jurisdictions, forcing per-region data handling architectures and careful legal navigation, a named external consideration.",
w:["","Encryption strength has no bearing on resolving two contradictory legal mandates from different countries.","No malicious or negligent insider is described anywhere in this scenario.","Training cannot reconcile two governments' genuinely conflicting legal requirements."]},
{i:1334,d:5,o:"5.4",t:"b",g:"privacy-data",
q:"Before a company can honor deletion requests or answer a regulator's questions, it must first know every system holding personal data, what categories, and why. Which practice provides this foundation?",
c:["Right to be forgotten, the individual's legal ability to request erasure of their personal data","Data inventory and retention documentation","Sanctions, the penalties a regulator can impose for confirmed non-compliance","Attestation, a formal signed declaration that policies have been read and followed"],a:1,
e:"A data inventory maps where personal data lives and why it is kept; without it, erasure requests and regulator inquiries cannot be answered completely or provably.",
w:["The right to be forgotten is the very request that a data inventory enables the company to actually fulfill.","","Sanctions are the penalty imposed for failing to comply, not the foundation that enables compliance in the first place.","Attestation asserts that compliance exists, but the inventory is what actually demonstrates and enables it."]},
{i:1335,d:5,o:"5.2",t:"b",g:"risk-appetite",
q:"A nuclear plant operator states it will accept only minimal risk in every operational decision, prioritizing safety over cost and speed without exception. Which risk appetite posture is this?",
c:["Expansionary","Neutral","Conservative","Opportunistic"],a:2,
e:"A conservative appetite minimizes accepted risk as a standing posture, characteristic of organizations where failure consequences are catastrophic.",
w:["Expansionary accepts more risk in pursuit of growth.","Neutral balances risk and opportunity evenly.","","Opportunistic is not one of the named postures."]},
{i:1336,d:5,o:"5.2",t:"b",g:"bia",
q:"Before designing recovery capabilities, a team ranks business functions by how badly and how quickly their loss harms the organization, producing the RTO and RPO targets for each. Which analysis produces this?",
c:["Vulnerability assessment","Gap analysis","Penetration test","Business impact analysis"],a:3,
e:"The BIA quantifies what each function's downtime and data loss cost, producing the prioritization and the RTO/RPO targets that recovery architecture must then meet.",
w:["Vulnerability assessment finds technical weaknesses.","Gap analysis compares current controls to a framework.","Penetration testing proves exploitability.",""]}
];

const Q11 = [

c:["Penetration test","Risk transference","Tabletop exercise","Gap analysis"],a:3,
e:"Gap analysis measures the distance between the current security state and a target standard, and its output is the roadmap of missing controls to implement.",
w:["A penetration test proves exploitability of live systems rather than comparing against a framework.","Transference shifts risk to a third party such as an insurer.","A tabletop talks through incident response, not control inventory.",""]},

e:"Infrared sensors passively detect the heat signature of a body moving through the field of view, emitting nothing themselves.",
w:["Pressure sensors detect weight on a surface, requiring the intruder to step on them.","Ultrasonic sensors actively emit sound waves and read reflections, which is detectable.","","Microwave sensors actively emit radio energy and can even penetrate thin walls, but they are not passive."]},

w:["A maintenance window schedules when changes happen.","","Impact analysis predicts consequences before the change.","Approval authorizes the change but does not preserve history."]},
{i:1404,d:2,o:"2.2",t:"b",g:"default-credentials",

{i:1405,d:2,o:"2.2",t:"s",g:"supply-chain",
q:"Attackers compromise the remote management platform of an IT services firm and use its trusted agent, installed on hundreds of client networks, to push ransomware to every client at once. Which supply chain element was the attack vector?",

{i:1406,d:2,o:"2.2",t:"m",g:"software-vectors",
q:"Which statement correctly contrasts client-based and agentless software as threat vectors?",
c:["Agentless software cannot be attacked since there's nothing installed on the endpoint","Client-based software runs exclusively inside the browser sandbox and never touches the OS directly","Installed client software adds a persistent, updatable attack surface on the endpoint, while agentless shifts exposure elsewhere","They present identical risk profiles regardless of deployment model"],a:2,
e:"An installed client is code living on the endpoint that must be patched and can be exploited locally, while agentless access trades that for reliance on browser and server security, different surfaces, not absence of risk.",
w:["Agentless still exposes the browser, session, and server pathway to attack; it isn't attack-proof.","Client-based specifically means software installed on the device itself, the opposite of browser-only.","","The exam pairs these two precisely because their risk profiles genuinely differ."]},
{i:1407,d:2,o:"2.2",t:"s",g:"watering-hole",
q:"Instead of attacking a hardened defense contractor directly, attackers compromise the small industry news site its engineers read daily, planting an exploit that infects visitors from the contractor's IP range. Which attack is this?",
c:["Watering hole attack","Typosquatting","Smishing","Credential stuffing"],a:0,
e:"A watering hole compromises a legitimate site the targets already trust and visit, letting the victims come to the trap, effective against organizations too hardened for direct approach.",
w:["","Typosquatting relies on mistyped domains, not a compromised legitimate site.","No SMS is involved.","No breached credential lists are replayed."]},
{i:1408,d:2,o:"2.2",t:"b",g:"brand-impersonation",

e:"Brand impersonation counterfeits an organization's public identity, its site, logos, and ads, to exploit the trust customers place in the brand.",
w:["BEC abuses email accounts inside a business relationship.","A watering hole compromises the real site victims already visit; this is a fake one.","No insider is involved.",""]},
{i:1409,d:3,o:"3.2",t:"b",g:"jump-server",
q:"Administrators may reach servers in the secure zone only by first authenticating to a single hardened intermediary host, where every session is logged and recorded. What is this intermediary called?",

e:"A jump server is the controlled, monitored chokepoint for administrative access into a protected zone: one hardened door instead of many direct paths.",
w:["A load balancer distributes user traffic across servers.","","PAC files tell browsers which proxy to use.","A honeypot is a decoy meant for attackers, not administrators."]},
{i:1410,d:3,o:"3.4",t:"m",g:"ha-designs",
q:"Which statement correctly contrasts load balancing with clustering for high availability?",
c:["Load balancing distributes requests across independent servers, while clustering joins servers so they act as one system","Clustering distributes web requests across servers while load balancing joins servers together into a single unit","Both terms describe exactly the same underlying mechanism using different names","Load balancing always requires shared storage while clustering never uses shared storage"],a:0,
e:"A load balancer spreads incoming work across separate servers; a cluster couples servers into one logical system with shared state so a failed node's work moves to a survivor. Both raise availability by different mechanisms.",
w:["","This description swaps the two mechanisms entirely, reversing which one distributes and which one joins.","The exam specifically contrasts these two terms because the distinction between them is the actual point being tested.","Shared storage is typical of clustering, not a load balancing requirement, so this claim reverses the association too."]},
{i:1411,d:3,o:"3.2",t:"b",g:"sd-wan",
q:"A retail chain replaces expensive dedicated circuits by intelligently routing branch traffic across broadband, LTE, and MPLS simultaneously, with policies applied centrally in software. Which technology is this?",
c:["Air gap","802.1X","SD-WAN","Screened subnet"],a:2,

w:["An air gap disconnects networks entirely.","802.1X authenticates devices at the port.","","A screened subnet is a firewalled zone design, not WAN transport."]},
{i:1412,d:3,o:"3.4",t:"b",g:"resilience-testing",
q:"During a recovery test, the backup site processes the same live workload alongside the primary site, and results are compared to prove the backup produces identical output, without ever removing the primary from service. Which test type is this?",
c:["Tabletop exercise","Fail over test","Simulation","Parallel processing"],a:3,
e:"Parallel processing runs production work at both sites simultaneously and compares results, validating the recovery environment under real load with zero disruption to the primary.",
w:["A tabletop is discussion only.","A fail over test actually transfers operations to the backup, briefly risking service.","A simulation injects a fictional scenario for responders to work.",""]},
{i:1413,d:4,o:"4.1",t:"b",g:"wireless-installation",
q:"Before installing access points in a new office, engineers walk the space with measurement tools and produce a color map showing signal strength in every area, revealing dead zones and coverage bleeding into the parking lot. Which two practices are these?",

w:["","Port scans enumerate services, not radio coverage.","War driving is an attacker technique for finding networks.","Penetration testing assesses exploitability, not AP placement."]},
{i:1414,d:4,o:"4.1",t:"s",g:"input-validation",
q:"A web form rejects any submission where the age field contains letters, the email field lacks a valid format, or any field exceeds its maximum length, before the data ever reaches application logic. Which application security technique is this?",

{i:1415,d:4,o:"4.5",t:"b",g:"dns-filtering",
q:"When any device on the network tries to resolve a known phishing domain, the resolver returns a block page address instead of the real one, stopping the connection before it starts. Which control is this?",

w:["","Port security controls which devices connect to switch ports.","NetFlow observes traffic; it blocks nothing.","FIM watches files for changes."]},
{i:1416,d:4,o:"4.5",t:"b",g:"os-security",

w:["SELinux enforces mandatory access control on Linux, not Windows domains.","A host firewall filters that machine's traffic only.","","EDR detects and responds to threats rather than distributing settings."]},
{i:1417,d:4,o:"4.3",t:"b",g:"threat-feeds",

q:"Conference attendees keep dropping off the venue Wi-Fi every few seconds. A capture shows floods of management frames ordering clients to disconnect, sourced from a spoofed access point address. Which attack is underway?",
c:["Evil twin","Bluesnarfing","Deauthentication attack","RFID cloning"],a:2,
e:"A deauthentication attack forges 802.11 management frames that command clients to disconnect, and is often the setup for capturing reconnection handshakes or pushing victims to a rogue AP.",
w:["An evil twin would keep victims connected to a fake network, not repeatedly kicked off.","Bluesnarfing is Bluetooth data theft.","","RFID cloning copies badges, unrelated to Wi-Fi frames."]},
{i:912,d:2,o:"2.4",t:"s",g:"log-indicators",
q:"A server that normally uploads its logs at 02:00 suddenly pushes large log archives at random mid-day hours, shortly after which several log files are found truncated. Which indicator category do these events represent?",
c:["Resource inaccessibility","Blocked content","Impossible travel","Out-of-cycle logging and missing logs"],a:3,
e:"Logging outside its established schedule paired with truncated files suggests an intruder manipulating and covering tracks, both named indicators of malicious activity.",
w:["No resource became unavailable to users.","Nothing was filtered.","No authentication geography is involved.",""]},
{i:913,d:3,o:"3.2",t:"m",g:"security-zones",
q:"A network design places internet-facing services, internal user workstations, and regulated database servers into separate areas with firewalls controlling every crossing. Which infrastructure concept does this illustrate?",
c:["Platform diversity","Security zones","Port security","Continuity of operations"],a:1,
e:"Security zones group systems by trust and sensitivity, forcing all traffic between zones through inspection and policy enforcement points.",
w:["Platform diversity mixes vendors to avoid a shared flaw.","","Port security limits MAC addresses on individual switch ports.","COOP is continuity planning, not network layout."]},
{i:914,d:3,o:"3.2",t:"b",g:"device-attributes",
q:"A monitoring appliance receives a mirrored copy of traffic from a switch SPAN port and can alert on threats but can never block them. Which device attribute pair describes it?",
c:["Passive and out-of-band (tap/monitor)","Active and inline","Fail-closed and inline","Active and fail-open"],a:0,
e:"A device fed by mirrored traffic sits out-of-band and is passive: it observes a copy and cannot interrupt the original flow, which is the IDS posture as opposed to an inline IPS.",
w:["","Active inline devices sit in the traffic path and can block.","Fail-closed describes inline failure behavior; a mirror feed has no path to fail closed.","Fail-open likewise applies to inline placement."]},
{i:915,d:3,o:"3.2",t:"m",g:"firewall-types",
q:"Which capability distinguishes a layer 7 firewall from a layer 4 firewall?",
c:["Filtering by source IP address","Filtering by TCP port number","Inspecting application content, such as HTTP methods and URLs, to make decisions","Operating at faster speeds in all deployments"],a:2,
e:"Layer 7 firewalls understand application protocols and can act on content like specific URLs or API calls, while layer 4 devices see only addresses, ports, and session state.",
w:["Both layers filter by IP.","Port filtering is the classic layer 4 capability.","","Deep inspection typically costs performance rather than gaining it."]},
{i:916,d:3,o:"3.2",t:"s",g:"tunneling",
q:"A company needs site-to-site encryption for ALL traffic between two offices, regardless of application, at the network layer. Which tunneling choice fits this requirement BEST?",
c:["TLS for each individual application","IPSec tunnel between the site gateways","SSH port forwarding per service","Unencrypted GRE alone"],a:1,
e:"IPSec at the network layer encrypts everything crossing the gateway-to-gateway tunnel, covering every application automatically, which per-application TLS or SSH forwarding cannot do practically.",
w:["TLS secures individual application sessions, requiring every app to support it.","","Port forwarding per service does not scale to all traffic.","GRE encapsulates but provides no encryption by itself."]},
{i:917,d:3,o:"3.1",t:"s",g:"multi-cloud",
q:"After a provider-wide outage took down its only cloud platform for a day, a company re-architects critical services to run across two different cloud providers simultaneously. Which consideration drove this design?",
c:["Reducing licensing cost","Simplifying patch management","Increasing vendor lock-in","Avoiding single-provider dependence for availability"],a:3,
e:"Multi-cloud spreads critical workloads across providers so no single vendor's outage, pricing change, or failure takes the business down, trading added complexity for resilience.",
w:["Running two platforms usually raises cost and licensing complexity.","Two environments make patching harder, not simpler.","Multi-cloud reduces lock-in; increasing it would be a drawback.",""]},
{i:918,d:3,o:"3.4",t:"b",g:"geographic-dispersion",
q:"A company places its two data centers 500 miles apart specifically so one hurricane, grid failure, or regional disaster cannot disable both. Which resilience concept is this?",
c:["Geographic dispersion","Vertical scaling","Warm site testing","Capacity planning"],a:0,
e:"Geographic dispersion separates redundant infrastructure far enough that a single regional event cannot affect both locations.",
w:["","Vertical scaling adds resources to one system.","Warm site testing validates a recovery facility; the question is about placement distance.","Capacity planning sizes resources for demand."]},
{i:919,d:4,o:"4.2",t:"b",g:"asset-inventory",
q:"A security team cannot say how many servers exist, what software they run, or who owns them. Which foundational process must come FIRST before vulnerability management can function?",
c:["Penetration testing","Alert tuning","Asset inventory and enumeration","Digital forensics"],a:2,
e:"You cannot scan, patch, or assign risk to assets you do not know exist. Inventory and enumeration are the prerequisite for every downstream security process.",
w:["Testing unknown assets is impossible to scope.","There are no meaningful alerts without knowing the estate.","","Forensics investigates incidents after the fact."]},
{i:920,d:4,o:"4.2",t:"b",g:"asset-ownership",
q:"During procurement, each new system is assigned a named individual responsible for its security decisions, access approvals, and lifecycle. Which asset management practice is this?",
c:["Sanitization","Assignment of ownership","Enumeration","Certification of destruction"],a:1,
e:"Assigning ownership attaches accountability to every asset, so someone specific answers for its protection and decisions throughout its life.",
w:["Sanitization removes data at disposal time.","","Enumeration discovers and lists assets.","Destruction certification documents end-of-life disposal."]},
{i:921,d:4,o:"4.2",t:"s",g:"data-retention",
q:"Legal requires financial records kept for seven years, while the privacy office wants personal data deleted as soon as possible. Which practice reconciles both demands systematically?",
c:["A retention policy with defined schedules per data type, enforced by automated lifecycle rules","Keeping everything forever to be safe","Deleting everything annually","Letting each department decide informally"],a:0,
e:"Retention schedules assign each data category a keep period satisfying its legal obligations and a defined destruction point satisfying minimization, with automation enforcing both consistently.",
w:["","Indefinite retention violates minimization principles and increases breach impact.","Blanket annual deletion violates the seven-year legal mandate.","Informal discretion guarantees inconsistency and non-compliance somewhere."]},
{i:922,d:4,o:"4.3",t:"m",g:"pentest-vs-scan",
q:"Which statement BEST distinguishes a penetration test from a vulnerability scan?",
c:["A scan requires more skill than a test","A test is always cheaper than scanning","Scans run only once per year","A scan identifies potential weaknesses automatically, while a test actively exploits them to prove real-world impact"],a:3,
e:"Scanners enumerate possible flaws; penetration testers attempt actual exploitation, demonstrating what an attacker could truly achieve and chaining findings together.",
w:["Testing requires substantially more skill than running a scanner.","Manual testing costs more than automated scanning.","Scans typically run continuously or on frequent schedules.",""]},
{i:923,d:4,o:"4.3",t:"b",g:"vuln-prioritization",
q:"A vulnerability affecting industrial pump controllers is rated moderate generally, but a water utility treats it as critical because exploitation could halt water treatment for a city. Which prioritization factor raised the severity?",
c:["CVSS base score","Organizational and industry impact","Patch availability","Scan frequency"],a:1,
e:"The same flaw carries different consequences per organization. Industry and mission impact, here public water service, legitimately override a generic severity rating.",
w:["The base score is what stayed moderate.","","Patch availability affects remediation speed, not severity to the mission.","How often you scan does not change what the flaw could do."]},
{i:924,d:4,o:"4.4",t:"b",g:"log-archiving",
q:"Regulations require a firm to retain security logs for five years, while the SIEM only keeps ninety days online for performance. Which practice satisfies the requirement?",
c:["Archiving logs to long-term storage","Deleting logs after ninety days","Raising alert thresholds","Disabling verbose logging"],a:0,
e:"Archiving moves older logs to durable long-term storage, meeting retention mandates while keeping the SIEM's active window fast.",
w:["","Deletion at ninety days directly violates the five-year mandate.","Alert thresholds have nothing to do with retention.","Reducing logging shrinks the evidence collected, worsening compliance."]},
{i:925,d:4,o:"4.5",t:"m",g:"edr-vs-av",
q:"Which capability distinguishes endpoint detection and response (EDR) from traditional signature-based antivirus?",
c:["EDR only works on servers","Antivirus can remove malware while EDR cannot","EDR continuously records endpoint behavior and enables investigation and response to threats that match no known signature","EDR requires no software on the endpoint"],a:2,
e:"EDR watches process behavior, connections, and changes over time, letting analysts detect novel attacks, trace their path, and respond remotely, where signature AV only matches known malware patterns.",
w:["EDR deploys across workstations and servers alike.","EDR includes removal plus far more response capability.","","EDR runs as an agent on the endpoint."]},
{i:926,d:4,o:"4.5",t:"b",g:"web-filtering",
q:"A web filter blocks a newly registered domain not because of its content, but because the domain is two hours old and has already been reported in early phishing telemetry. Which filtering approach is this?",
c:["Content categorization","Reputation-based filtering","Agent-based inspection","URL allow listing"],a:1,
e:"Reputation filtering scores destinations on signals such as age, hosting history, and abuse reports, blocking risky sites before category databases catch up.",
w:["Categorization assigns topics like gambling or news; a two-hour-old domain has no meaningful category yet.","","Agent-based describes where filtering runs, not the decision logic.","Allow listing permits only pre-approved sites, a much blunter model."]},
{i:927,d:4,o:"4.6",t:"s",g:"access-controls",
q:"A hospital configures nurse accounts so they can access patient systems only during their scheduled shifts, with logins outside those hours rejected automatically. Which access control is this?",
c:["Discretionary access control","Attribute-based sensitivity labels","Federation","Time-of-day restrictions"],a:3,
e:"Time-of-day restrictions bind access to approved hours, shrinking the window in which stolen credentials are useful.",
w:["DAC lets resource owners grant access at their discretion.","Sensitivity labels drive mandatory access control decisions.","Federation shares identity across organizations.",""]},
{i:928,d:4,o:"4.6",t:"b",g:"password-tools",
q:"An organization wants employees to keep a unique, long, random password for every site without writing any down, requiring them to remember only one strong master passphrase. Which tool accomplishes this?",
c:["Password manager","Password expiration policy","Shared credential spreadsheet","Single sign-on portal"],a:0,
e:"A password manager generates and vaults unique random credentials per site behind one master secret, eliminating reuse without memorization burden.",
w:["","Expiration forces rotation but does nothing about uniqueness or strength.","A shared spreadsheet is the anti-pattern this replaces.","SSO reduces how many passwords exist; it cannot cover external personal-site accounts the way a vault does."]},
{i:929,d:5,o:"5.1",t:"b",g:"sdlc-policy",
q:"A development organization mandates that threat modeling occurs during design, security testing before release, and dependency review at every build. Which policy embeds these requirements?",
c:["Acceptable use policy","Business continuity policy","Software development lifecycle policy","Physical security standard"],a:2,
e:"An SDLC policy defines the security activities required at each development phase, making security a gate in the process rather than an afterthought.",
w:["AUP governs how users may use company systems.","BC policy covers operating through disruption.","","Physical standards govern facilities."]},
{i:930,d:5,o:"5.3",t:"s",g:"conflict-of-interest",
q:"A procurement manager awards a security monitoring contract to a firm owned by their sibling without disclosing the relationship. Which third-party risk concept has been violated?",
c:["Right-to-audit","Conflict of interest disclosure","Service-level agreement","Supply chain diversity"],a:1,
e:"An undisclosed personal stake in a vendor decision is a conflict of interest, corrupting the objectivity that vendor selection requires and typically violating policy requiring disclosure.",
w:["Right-to-audit concerns inspecting a vendor's controls.","","An SLA defines service performance terms.","Diversity concerns avoiding single-source dependence."]},
{i:931,d:5,o:"5.5",t:"b",g:"audits",
q:"A regulator requires that a firm's security controls be evaluated by an outside organization with no financial or operational ties to the firm. Which assessment type satisfies this?",
c:["Independent third-party assessment","Self-assessment","Internal audit by the compliance team","Peer review by another department"],a:0,
e:"An independent assessment is performed by an unaffiliated external party, providing the objectivity regulators demand when self-interest could bias internal findings.",
w:["","Self-assessment is the firm grading itself.","Internal audit, while separated by reporting lines, is still inside the organization.","Another department is even less independent."]},
{i:932,d:5,o:"5.4",t:"s",g:"compliance-automation",
q:"A company replaces quarterly manual compliance spreadsheets with a system that continuously pulls control evidence from its tools and updates a live dashboard, flagging failures within minutes. Which practice is this?",
c:["Annual attestation","Manual examination","Gap analysis","Automated compliance monitoring"],a:3,
e:"Compliance automation collects evidence and evaluates control status continuously, replacing point-in-time manual checks with real-time visibility and faster failure detection.",
w:["Attestation is a periodic formal declaration, exactly what is being augmented.","Manual examination is the process being replaced.","Gap analysis is a point-in-time comparison exercise.",""]},
{i:933,d:5,o:"5.4",t:"b",g:"privacy-data",
q:"To answer regulator questions, a privacy team builds a catalog of every system holding personal data, what categories it holds, why, and how long each is kept. Which privacy practice is this?",
c:["Right to be forgotten processing","Data inventory and retention documentation","Data subject access request","Breach notification"],a:1,
e:"A data inventory with retention documentation maps where personal data lives, its purpose, and its lifecycle, the foundation regulators expect for demonstrating lawful processing.",
w:["Right to be forgotten handles individual erasure requests.","","A DSAR responds to one person's request for their data.","Breach notification is post-incident communication."]},
{i:934,d:5,o:"5.6",t:"m",g:"phishing-campaigns",
q:"After an internal simulated phishing campaign, which metric MOST directly measures improvement in the human layer of defense?",
c:["Number of emails sent by the campaign","Mail server uptime during the test","Declining click rate and rising report rate across successive campaigns","Total employees enrolled in the directory"],a:2,
e:"Fewer employees clicking and more employees reporting over successive campaigns is the direct evidence that awareness behavior is improving.",
w:["Volume sent measures the test's size, not the workforce's response.","Server uptime is an infrastructure metric.","","Directory enrollment says nothing about behavior."]}
];

const CARDS = [
// DOMAIN 1
{d:1,o:"1.1",g:"control-categories",f:"Name the four control CATEGORIES.",b:"Technical, Managerial, Operational, Physical. Category answers WHO or WHAT implements it."},
{d:1,o:"1.1",g:"control-types",f:"Name the six control TYPES.",b:"Preventive, Deterrent, Detective, Corrective, Compensating, Directive. Type answers WHAT IT DOES."},
{d:1,o:"1.1",g:"control-types",f:"Deterrent vs Preventive control: what is the real difference?",b:"Deterrent discourages an attacker who could still proceed (warning sign, visible camera). Preventive physically or logically stops the action (locked door, ACL)."},
{d:1,o:"1.1",g:"compensating-controls",f:"When is a control called compensating?",b:"When the required control cannot be implemented and an alternative stands in for it. The trigger is always 'we could not do X, so we did Y instead.'"},
{d:1,o:"1.1",g:"control-types",f:"Give an example of a directive control.",b:"A policy, standard, or posted instruction telling people what they must do. It directs behavior rather than enforcing it technically."},
{d:1,o:"1.2",g:"cia-triad",f:"What does the CIA triad stand for, and what does each protect against?",b:"Confidentiality (unauthorized disclosure), Integrity (unauthorized alteration), Availability (loss of access)."},
{d:1,o:"1.2",g:"non-repudiation",f:"Define non-repudiation and name the technology that delivers it.",b:"Proof that a party cannot credibly deny an action. Delivered by digital signatures using the signer's private key."},
{d:1,o:"1.2",g:"aaa",f:"What are the three A's in AAA, and what does the third one actually do?",b:"Authentication (who are you), Authorization (what may you do), Accounting (what did you do). Accounting is the logging and audit record."},
{d:1,o:"1.2",g:"zero-trust",f:"Name the three Zero Trust control plane components and their jobs.",b:"Policy Engine decides. Policy Administrator communicates the decision and establishes or kills the session. Policy Enforcement Point executes."},
{d:1,o:"1.2",g:"zero-trust",f:"What is an Implicit Trust Zone in Zero Trust?",b:"The area a subject reaches after passing the Policy Enforcement Point. Access there is granted only for the approved session."},
{d:1,o:"1.2",g:"deception",f:"Honeypot vs honeynet vs honeyfile vs honeytoken.",b:"Honeypot: one decoy system. Honeynet: a whole decoy network. Honeyfile: a decoy file used as a tripwire. Honeytoken: fake data tracked wherever it goes."},
{d:1,o:"1.2",g:"physical-controls",f:"What is the difference between an access control vestibule and a turnstile?",b:"A vestibule is a two-door airlock preventing tailgating by allowing only one person through at a time. A turnstile controls flow but is easier to defeat."},
{d:1,o:"1.3",g:"change-management",f:"Name five elements of a formal change request.",b:"Approval by the CAB, ownership, stakeholder identification, impact analysis, test results, backout plan, maintenance window, and standard operating procedure."},
{d:1,o:"1.3",g:"change-management",f:"What is a backout plan and why is it required?",b:"The documented steps to return a system to its previous working state if the change fails. It is the safety net for every approved change."},
{d:1,o:"1.4",g:"asymmetric-direction",f:"To send something ONLY the recipient can read, whose key do you encrypt with?",b:"The recipient's PUBLIC key. Only their private key can decrypt it."},
{d:1,o:"1.4",g:"asymmetric-direction",f:"To prove YOU sent something, whose key do you encrypt (sign) with?",b:"Your own PRIVATE key. Anyone with your public key can verify it, which is what gives non-repudiation."},
{d:1,o:"1.4",g:"hashing-salting",f:"What does a salt do, and what attack does it defeat?",b:"A unique random value added before hashing. It defeats rainbow tables because every user's hash needs its own precomputed table."},
{d:1,o:"1.4",g:"key-stretching",f:"What is key stretching, and name two algorithms.",b:"Deliberately slowing hashing to make guessing expensive. PBKDF2 and bcrypt are the common examples."},
{d:1,o:"1.4",g:"encryption-levels",f:"List the encryption levels from broadest to narrowest.",b:"Full-disk, partition, volume, file, database, record. Narrower means more granular control and more overhead."},
{d:1,o:"1.4",g:"tpm-hsm",f:"TPM vs HSM: what is the distinction?",b:"TPM is a chip on a single device's motherboard, typically for full-disk encryption keys. HSM is a dedicated appliance managing keys at enterprise scale."},
{d:1,o:"1.4",g:"cert-lifecycle",f:"CSR, CRL, OCSP: what stage is each?",b:"CSR requests issuance. CRL is the downloadable list of revoked certs. OCSP checks one cert's status in real time; stapling has the server present it."},
{d:1,o:"1.4",g:"certificates",f:"What does a SAN certificate do?",b:"Subject Alternative Name lets one certificate cover multiple specific hostnames or domains."},
{d:1,o:"1.4",g:"obfuscation",f:"Steganography, tokenization, and data masking: what does each do?",b:"Steganography hides data inside other media. Tokenization swaps the value for a meaningless surrogate. Masking hides part of the value at display time."},
{d:1,o:"1.4",g:"key-escrow",f:"What is key escrow?",b:"A trusted third party holds a copy of keys so encrypted data can be recovered if keys are lost. It trades availability against confidentiality risk."},

// DOMAIN 2
{d:2,o:"2.1",g:"threat-actors",f:"Rank these by typical resources: nation-state, organized crime, hacktivist, unskilled attacker.",b:"Nation-state (highest), organized crime, hacktivist, unskilled attacker (lowest)."},
{d:2,o:"2.1",g:"actor-motivations",f:"What primarily motivates organized crime versus a nation-state?",b:"Organized crime: financial gain. Nation-state: espionage, data exfiltration, war, and philosophical or political objectives."},
{d:2,o:"2.1",g:"shadow-it",f:"Define shadow IT and why it is dangerous.",b:"Unsanctioned technology adopted by employees to get work done. Intent is productive, but the organization loses visibility, control, and data governance."},
{d:2,o:"2.1",g:"threat-vectors",f:"Name six common threat vectors.",b:"Message-based (email, SMS, IM), image-based, file-based, voice call, removable device, vulnerable software, unsupported systems, unsecure networks, open ports, default credentials, supply chain."},
{d:2,o:"2.2",g:"social-engineering",f:"Phishing, vishing, smishing, whaling: differentiate.",b:"Phishing is email. Vishing is voice. Smishing is SMS. Whaling targets a high-value executive."},
{d:2,o:"2.2",g:"social-engineering",f:"What is pretexting?",b:"Inventing a believable backstory or scenario that gives the attacker a reason to be making the request."},
{d:2,o:"2.2",g:"social-engineering",f:"Tailgating vs piggybacking.",b:"Tailgating: entering behind someone without their knowledge or consent. Piggybacking: the authorized person knowingly lets you in."},
{d:2,o:"2.2",g:"social-engineering",f:"Watering hole attack: what makes it effective?",b:"The attacker compromises a legitimate site the target group already trusts and visits routinely, so no lure is needed."},
{d:2,o:"2.2",g:"social-engineering",f:"Typosquatting vs pharming.",b:"Typosquatting registers a lookalike domain and waits for a mistyped URL. Pharming poisons DNS or hosts files so the correct address goes to a fake site."},
{d:2,o:"2.2",g:"social-engineering",f:"What is BEC?",b:"Business Email Compromise. A spoofed or hijacked internal mailbox is used to authorize fraudulent payments or data release."},
{d:2,o:"2.3",g:"vuln-types",f:"Race condition: what are TOC and TOU?",b:"Time-of-check and time-of-use. The vulnerability is the gap between validating a condition and acting on it, during which state can change."},
{d:2,o:"2.3",g:"vuln-types",f:"What is a zero-day vulnerability?",b:"A flaw unknown to the vendor with no patch available, so defenders have had zero days to fix it."},
{d:2,o:"2.3",g:"vuln-types",f:"Name four mobile-specific vulnerabilities.",b:"Side loading (installing outside the approved store), jailbreaking or rooting, insecure Bluetooth, and unpatched or unsupported OS versions."},
{d:2,o:"2.3",g:"vuln-types",f:"VM escape vs resource reuse.",b:"VM escape breaks out of a guest to reach the hypervisor or other guests. Resource reuse means memory or storage released by one tenant is handed to another with data still present."},
{d:2,o:"2.3",g:"supply-chain",f:"Name three supply chain attack surfaces.",b:"Service providers (MSPs), hardware providers, and software providers including their build pipelines and dependencies."},
{d:2,o:"2.4",g:"malware-types",f:"Worm vs virus: the one-line difference.",b:"A worm self-propagates across networks with no user action. A virus needs a host file and a user to spread it."},
{d:2,o:"2.4",g:"malware-types",f:"What defines a logic bomb?",b:"Dormant code that executes when a specific condition is met, such as a date or the absence of an employee record."},
{d:2,o:"2.4",g:"malware-types",f:"What does a rootkit specifically do?",b:"Operates at kernel or boot level to hide files, processes, and connections from the operating system and the tools running on it."},
{d:2,o:"2.4",g:"malware-types",f:"RAT, spyware, keylogger, bloatware: quick differentiation.",b:"RAT gives remote control. Spyware collects information. Keylogger captures keystrokes. Bloatware is unwanted preinstalled software."},
{d:2,o:"2.4",g:"network-attacks",f:"Amplification vs reflection in a DDoS.",b:"Amplification means a small request yields a much larger response. Reflection means spoofing the victim's address so responses land on them. Most large attacks use both."},
{d:2,o:"2.4",g:"network-attacks",f:"Why does ARP poisoning work at all?",b:"ARP has no authentication. Any host can send an unsolicited reply mapping an IP to its own MAC, and the switch and hosts will believe it."},
{d:2,o:"2.4",g:"network-attacks",f:"What is a credential replay attack?",b:"Capturing valid authentication traffic and resending it to impersonate the user. Defeated by timestamps, nonces, and session tokens."},
{d:2,o:"2.4",g:"password-attacks",f:"Password spraying vs credential stuffing vs brute force.",b:"Spraying: one password against many accounts. Stuffing: known username and password pairs from another breach. Brute force: many passwords against one account."},
{d:2,o:"2.4",g:"crypto-attacks",f:"Birthday attack, collision, and downgrade: what does each target?",b:"Birthday and collision attack hashing by finding two inputs with the same output. Downgrade attacks protocol negotiation to force a weaker version."},
{d:2,o:"2.4",g:"application-attacks",f:"XSS vs CSRF in one line each.",b:"XSS injects script that runs in the victim's browser. CSRF tricks the victim's browser into sending an authenticated request the user never intended."},
{d:2,o:"2.4",g:"application-attacks",f:"What is directory traversal?",b:"Using path sequences such as ../ to read files outside the intended web root."},
{d:2,o:"2.4",g:"application-attacks",f:"Buffer overflow: what actually goes wrong?",b:"Input larger than the allocated buffer writes past its boundary into adjacent memory, which can overwrite control data and redirect execution."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"Name eight mitigation techniques from objective 2.5.",b:"Segmentation, access control (ACL and permissions), application allow list, isolation, patching, encryption, monitoring, least privilege, configuration enforcement, decommissioning, and hardening."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"Allow list vs deny list: which is more secure and why?",b:"Allow list. Only explicitly approved items run, so anything unknown is blocked by default. A deny list can only block what you already know about."},
{d:2,o:"2.5",g:"mitigation-techniques",f:"What is a data diode or unidirectional gateway used for?",b:"Permitting data to flow out of a sensitive network while making inbound traffic physically impossible. Common in OT and ICS environments."},

// DOMAIN 3
{d:3,o:"3.1",g:"cloud-responsibility",f:"In IaaS, PaaS, and SaaS, what always stays with the customer?",b:"Data and identity or access management. No matter the model, you own your data and who can reach it."},
{d:3,o:"3.1",g:"architecture-models",f:"Serverless: what does the customer still own?",b:"Function code, dependencies, secrets, and the permissions granted to the function. Over-permissioned functions are a top finding."},
{d:3,o:"3.1",g:"architecture-models",f:"Microservices vs monolithic architecture security tradeoff.",b:"Microservices isolate failure and limit blast radius, but multiply the number of network interfaces and identities to secure."},
{d:3,o:"3.1",g:"ics-scada",f:"Why are ICS, SCADA, and RTOS environments hard to secure?",b:"They prioritize availability and deterministic timing, often cannot be taken offline for patching, and frequently run unsupported software."},
{d:3,o:"3.1",g:"segmentation",f:"Air gap vs logical segmentation.",b:"Air gap means no physical connection at all. Logical segmentation uses VLANs and firewall policy on shared physical infrastructure."},
{d:3,o:"3.2",g:"failure-modes",f:"Fail-open vs fail-closed: which do you use where?",b:"Fail-open prioritizes availability and human safety (emergency egress). Fail-closed prioritizes security (data center cage, firewall on failure)."},
{d:3,o:"3.2",g:"ids-ips-placement",f:"Inline vs tap/monitor: what capability does each give you?",b:"Inline sits in the traffic path and can block. Tap or monitor receives a copy and can only detect and alert."},
{d:3,o:"3.2",g:"firewall-types",f:"WAF vs NGFW vs UTM vs Layer 4 firewall.",b:"WAF inspects web application payloads. NGFW adds application awareness and deep inspection. UTM bundles many functions in one box. Layer 4 filters on ports and protocols only."},
{d:3,o:"3.2",g:"device-placement",f:"What is a jump server for?",b:"A hardened, monitored single point of entry through which administrators reach protected systems, concentrating admin access for auditing."},
{d:3,o:"3.2",g:"secure-access",f:"SASE vs SD-WAN.",b:"SD-WAN optimizes and manages WAN connectivity across links. SASE converges that connectivity with cloud-delivered security enforced at the edge by identity."},
{d:3,o:"3.2",g:"port-security",f:"What does 802.1X do?",b:"Port-based network access control. A device must authenticate, usually via EAP to a RADIUS server, before the switch port passes traffic."},
{d:3,o:"3.3",g:"data-types",f:"Name the data classifications in objective 3.3.",b:"Regulated, trade secret, intellectual property, legal information, financial information, human-readable, and non-human-readable."},
{d:3,o:"3.3",g:"data-states",f:"Name the three data states and one protection for each.",b:"At rest: full-disk or database encryption. In transit: TLS or IPSec. In use: trusted execution environment or secure enclave."},
{d:3,o:"3.3",g:"data-protection-methods",f:"Tokenization vs masking vs encryption.",b:"Tokenization substitutes a meaningless value with the real one held in a vault. Masking hides characters at display. Encryption transforms data reversibly with a key."},
{d:3,o:"3.3",g:"data-sovereignty",f:"What is data sovereignty?",b:"The principle that data is subject to the laws of the country where it is physically stored, which drives geographic restrictions on cloud regions."},
{d:3,o:"3.4",g:"backup-types",f:"Full, incremental, and differential: what does each capture and what does restore require?",b:"Full: everything. Incremental: changes since the last backup of any type, restore needs full plus all incrementals in order. Differential: changes since the last full, restore needs full plus the latest differential only."},
{d:3,o:"3.4",g:"rto-rpo",f:"RPO vs RTO in one line each.",b:"RPO is how much DATA you can afford to lose, measured backward in time. RTO is how long you can afford to be DOWN, measured forward."},
{d:3,o:"3.4",g:"rto-rpo",f:"MTTR vs MTBF.",b:"MTTR is the average time to repair a failed component. MTBF is the average time between failures. One measures recovery speed, the other measures reliability."},
{d:3,o:"3.4",g:"site-considerations",f:"Hot, warm, and cold site: readiness and cost.",b:"Hot: fully live with current data, near-instant failover, highest cost. Warm: equipment ready, data somewhat current, hours to a day. Cold: space and power only, cheapest, weeks."},
{d:3,o:"3.4",g:"high-availability",f:"Is RAID a backup?",b:"No. RAID provides fault tolerance against drive failure. It replicates deletions and ransomware encryption instantly, so it does not protect against them."},
{d:3,o:"3.4",g:"resilience",f:"What does capacity planning cover in objective 3.4?",b:"People, technology, and infrastructure. Enough staff, enough compute, and enough physical capacity to absorb demand or failure."},
{d:3,o:"3.4",g:"power",f:"UPS vs generator.",b:"A UPS provides immediate battery power for seconds to minutes, bridging the gap. A generator provides sustained power for hours or days but takes time to start."},

// DOMAIN 4
{d:4,o:"4.1",g:"secure-baselines",f:"Name the three baseline activities.",b:"Establish the baseline, deploy it consistently, and maintain it by detecting and correcting drift."},
{d:4,o:"4.1",g:"hardening",f:"List five hardening techniques.",b:"Encryption, endpoint protection installation, host-based firewall, HIPS, disabling unused ports and protocols, changing default passwords, and removing unnecessary software."},
{d:4,o:"4.1",g:"mobile-deployment",f:"BYOD, COPE, and CYOD.",b:"BYOD: employee-owned, least organizational control. COPE: corporate-owned, personally enabled, full control with permitted personal use. CYOD: employee chooses from an approved corporate-owned list."},
{d:4,o:"4.1",g:"wireless-security",f:"WPA3 replaced the WPA2 four-way handshake with what?",b:"SAE, Simultaneous Authentication of Equals, which resists offline dictionary attacks against the captured handshake."},
{d:4,o:"4.1",g:"wireless-security",f:"What is a site survey and heat map used for?",b:"Mapping actual wireless signal coverage and interference so access points are placed for coverage without leaking signal beyond the intended area."},
{d:4,o:"4.2",g:"asset-management",f:"Name the asset lifecycle stages in objective 4.2.",b:"Acquisition and procurement, assignment and accounting (ownership and classification), monitoring and asset tracking (inventory and enumeration), and disposal and decommissioning."},
{d:4,o:"4.2",g:"asset-disposal",f:"Sanitization, destruction, and certification: what is the sequence?",b:"Sanitize (wipe or degauss) or destroy (shred, pulverize) the media, then obtain certification documenting it, and honor data retention requirements throughout."},
{d:4,o:"4.3",g:"vuln-scanning",f:"Credentialed vs non-credentialed scan.",b:"Credentialed logs into the host and reads actual patch and configuration state, giving far more accuracy. Non-credentialed sees only what is exposed on the network."},
{d:4,o:"4.3",g:"false-positive-negative",f:"False positive vs false negative.",b:"False positive: an alert or finding that is not real. False negative: a real issue that was missed. False negatives are the more dangerous of the two."},
{d:4,o:"4.3",g:"cvss-cve",f:"CVSS vs CVE.",b:"CVSS is the Scoring System producing a 0.0 to 10.0 severity number. CVE is the unique identifier naming the specific vulnerability."},
{d:4,o:"4.3",g:"code-analysis",f:"Static vs dynamic analysis.",b:"Static inspects code without running it, finding flaws early with more false positives. Dynamic exercises the running application, including fuzzing."},
{d:4,o:"4.3",g:"vuln-response",f:"Name the vulnerability response options in objective 4.3.",b:"Patching, insurance, segmentation, compensating controls, and documented exceptions or exemptions."},
{d:4,o:"4.3",g:"vuln-response",f:"After remediation, how is the fix validated?",b:"Rescanning, audit, and verification. Remediation is not complete until it is proven."},
{d:4,o:"4.4",g:"siem-soar",f:"SIEM vs SOAR.",b:"SIEM aggregates and correlates logs into alerts. SOAR orchestrates and automates the response playbooks that act on those alerts."},
{d:4,o:"4.4",g:"alert-tuning",f:"What is alert tuning and why does it matter?",b:"Adjusting rule thresholds and conditions to cut false positives. Untuned alerting causes alert fatigue, which is itself a security failure."},
{d:4,o:"4.4",g:"monitoring-tools",f:"NetFlow vs full packet capture.",b:"NetFlow records conversation metadata (who, to whom, which port, how much). Packet capture records the actual payload content but at far greater storage cost."},
{d:4,o:"4.4",g:"monitoring-tools",f:"What is an SNMP trap?",b:"An unsolicited alert pushed from a managed device to the SNMP manager when a defined threshold or condition is crossed."},
{d:4,o:"4.4",g:"monitoring-tools",f:"Agent-based vs agentless monitoring.",b:"Agent-based installs software on the host for deeper, continuous visibility and offline coverage. Agentless uses remote access or network position with less depth but easier deployment."},
{d:4,o:"4.5",g:"firewall-rules",f:"How does a firewall evaluate its rule set?",b:"Top down, stopping at the first match, with an implicit deny at the bottom. Rule order determines behavior."},
{d:4,o:"4.5",g:"ids-ips",f:"Signature-based vs trend or anomaly-based detection.",b:"Signature matches known patterns, accurate but blind to new attacks. Anomaly compares against a baseline, catches novel activity but produces more false positives."},
{d:4,o:"4.5",g:"web-filter",f:"Agent-based web filter vs centralized proxy.",b:"Agent-based enforces policy on the device so it follows remote users. Centralized proxy only filters traffic that passes through the corporate network."},
{d:4,o:"4.5",g:"email-security",f:"SPF, DKIM, DMARC: what does each add?",b:"SPF authorizes which servers may send for the domain. DKIM signs the message so tampering is detectable. DMARC sets the failure policy and requests reports."},
{d:4,o:"4.5",g:"file-integrity",f:"What does file integrity monitoring do?",b:"Records a hash baseline of critical files and alerts when any change occurs, catching unauthorized modification of system or configuration files."},
{d:4,o:"4.5",g:"edr-xdr",f:"EDR vs XDR.",b:"EDR monitors and responds on endpoints. XDR extends that correlation across endpoints, network, email, and cloud for a unified detection picture."},
{d:4,o:"4.5",g:"nac",f:"What does NAC evaluate before granting network access?",b:"Device posture such as patch level, antivirus status, and configuration. Failing devices are placed in a quarantine or remediation VLAN."},
{d:4,o:"4.6",g:"sso-protocols",f:"SAML vs OAuth vs OpenID Connect.",b:"SAML: XML-based federated authentication for enterprise web SSO. OAuth: delegated authorization, what an app may do. OIDC: the identity layer built on OAuth."},
{d:4,o:"4.6",g:"access-control-models",f:"MAC, DAC, RBAC, ABAC, rule-based: one line each.",b:"MAC: system-enforced labels and clearances. DAC: owner decides. RBAC: access by job role. ABAC: evaluates multiple attributes. Rule-based: global conditions apply to everyone."},
{d:4,o:"4.6",g:"mfa-factors",f:"Name the authentication factors and attributes.",b:"Factors: something you know, have, are. Attributes: somewhere you are, something you can do, something you exhibit, someone you know."},
{d:4,o:"4.6",g:"mfa-factors",f:"Is a password plus a security question multifactor?",b:"No. Both are something you know, so it is single factor with two steps. Multifactor requires factors from different categories."},
{d:4,o:"4.6",g:"pam",f:"Name three privileged access management capabilities.",b:"Just-in-time permissions, password vaulting, and ephemeral credentials that exist only for the duration of the task."},
{d:4,o:"4.6",g:"iam",f:"What is attestation in identity management?",b:"A periodic review in which managers or owners confirm that each user's existing access is still appropriate. It catches privilege creep."},
{d:4,o:"4.6",g:"iam",f:"What is identity proofing?",b:"Verifying that a person is who they claim to be before an identity is issued, at enrollment time."},
{d:4,o:"4.7",g:"automation",f:"Name three security benefits of automation and orchestration.",b:"Consistent enforcement of baselines, faster reaction time, and reduced human error. Also scaling, workforce multiplication, and employee retention."},
{d:4,o:"4.7",g:"automation",f:"Name two risks of automation.",b:"Complexity and single point of failure, plus technical debt and ongoing supportability if the person who built it leaves."},
{d:4,o:"4.8",g:"incident-response-phases",f:"List the incident response phases in order.",b:"Preparation, Detection, Analysis, Containment, Eradication, Recovery, Lessons Learned."},
{d:4,o:"4.8",g:"ir-testing",f:"Tabletop vs simulation vs walkthrough.",b:"Tabletop: discussion-based scenario around a table. Simulation: a realistic injected event, such as a mock phishing campaign. Walkthrough: step-by-step review of the documented plan."},
{d:4,o:"4.8",g:"forensics",f:"What is a legal hold and when is it issued?",b:"A directive suspending routine deletion so potentially relevant evidence is preserved. It is issued as soon as litigation is reasonably anticipated, before imaging."},
{d:4,o:"4.8",g:"chain-of-custody",f:"What breaks a chain of custody, and why does it matter?",b:"Any undocumented handling, transfer, or storage gap. A break can make otherwise valid evidence inadmissible."},
{d:4,o:"4.8",g:"forensics",f:"What is order of volatility?",b:"Collect the most perishable evidence first: CPU registers and cache, RAM, network state and running processes, disk, then backups and archives."},
{d:4,o:"4.9",g:"log-sources",f:"Name six log or data sources from objective 4.9.",b:"Firewall logs, application logs, endpoint logs, OS-specific security logs, IPS and IDS logs, network logs, metadata, vulnerability scans, automated reports, dashboards, and packet captures."},

{d:5,o:"5.1",g:"policy-hierarchy",f:"Policy, standard, procedure, guideline: rank and define.",b:"Policy states intent (what and why). Standard sets the mandatory specific requirement. Procedure gives the step-by-step. Guideline is optional recommended practice."},
{d:5,o:"5.1",g:"governance-structures",f:"Centralized vs decentralized governance tradeoff.",b:"Centralized gives consistency and enterprise visibility but is slower. Decentralized gives speed and local fit but risks inconsistency and blind spots."},
{d:5,o:"5.1",g:"governance-roles",f:"Data owner, controller, processor, custodian, steward: one line each.",b:"Owner: accountable for the data. Controller: decides purposes and means of processing. Processor: acts on the controller's instructions. Custodian: hands-on technical care. Steward: manages quality and appropriate use."},
{d:5,o:"5.1",g:"policies",f:"Name six organizational policies from objective 5.1.",b:"Acceptable use (AUP), information security, business continuity, disaster recovery, incident response, software development lifecycle, and change management."},
{d:5,o:"5.2",g:"risk-assessment-types",f:"Name the four risk assessment frequencies.",b:"Ad hoc (as needed), recurring (on a schedule), one-time (for a specific event), and continuous (ongoing monitoring)."},
{d:5,o:"5.2",g:"risk-analysis",f:"Qualitative vs quantitative risk analysis.",b:"Qualitative uses descriptive ratings such as high, medium, low. Quantitative uses monetary values and probability, producing SLE, ARO, and ALE."},
{d:5,o:"5.2",g:"risk-calculation",f:"Write out the SLE, ARO, and ALE formulas.",b:"SLE = Asset Value x Exposure Factor. ALE = SLE x ARO. ARO is occurrences per year, so once in 20 years equals 0.05."},
{d:5,o:"5.2",g:"risk-appetite",f:"Risk appetite vs risk tolerance vs risk threshold.",b:"Appetite: strategic amount of risk pursued (expansionary, conservative, neutral). Tolerance: acceptable variation around a specific objective. Threshold: the trigger point requiring action."},
{d:5,o:"5.2",g:"risk-strategies",f:"Name the four risk management strategies.",b:"Transfer (insurance or contract), Accept (documented, may include exemption or exception), Avoid (stop the activity), Mitigate (apply controls)."},
{d:5,o:"5.2",g:"risk-register",f:"What lives in a risk register?",b:"Identified risks, key risk indicators, assigned risk owners, and risk thresholds. It is the running record of what the organization is tracking."},
{d:5,o:"5.2",g:"business-impact",f:"What does a business impact analysis produce?",b:"RTO, RPO, MTTR, and MTBF for critical processes, which then drive continuity and recovery investment."},
{d:5,o:"5.3",g:"vendor-assessment",f:"Name four vendor assessment methods.",b:"Penetration testing, right-to-audit clause, evidence of internal audits, independent third-party assessments, supply chain analysis, and vendor questionnaires."},
{d:5,o:"5.3",g:"agreements",f:"SLA, MOU, MOA, MSA, SOW, NDA, BPA: what is each for?",b:"SLA: measurable service commitments. MOU: non-binding statement of intent. MOA: more formal cooperative agreement. MSA: overarching legal terms. SOW or work order: specific deliverables. NDA: confidentiality. BPA: terms between business partners."},
{d:5,o:"5.4",g:"compliance",f:"Name five consequences of non-compliance.",b:"Fines, sanctions, reputational damage, loss of license, and contractual impacts."},
{d:5,o:"5.4",g:"privacy",f:"Local, regional, national, and global privacy scope: give an example of each.",b:"Local and regional: state laws such as CCPA. National: sector laws such as HIPAA. Global: cross-border regimes such as GDPR."},
{d:5,o:"5.4",g:"privacy",f:"What is the right to be forgotten?",b:"A data subject's right to require erasure of their personal data when no overriding lawful basis exists to keep it."},
{d:5,o:"5.5",g:"audits-assessments",f:"Internal vs external audit: name the sub-types.",b:"Internal: compliance reviews, audit committee oversight, self-assessments. External: regulatory examinations, independent third-party audits, and assessments."},
{d:5,o:"5.5",g:"pentest-types",f:"Known, partially known, and unknown environment testing.",b:"Known (formerly white box): full information. Partially known (gray box): limited information. Unknown (black box): nothing but the target name."},
{d:5,o:"5.5",g:"recon-types",f:"Passive vs active reconnaissance.",b:"Passive gathers from public and third-party sources without touching the target, leaving no logs. Active interacts directly, such as port scanning, and can be detected."},
{d:5,o:"5.6",g:"security-awareness",f:"Name the security awareness practices in objective 5.6.",b:"Phishing campaigns and recognition, anomalous behavior recognition, user guidance and training, reporting and monitoring, and program development and execution."},
{d:5,o:"5.6",g:"security-awareness",f:"What behaviors count as anomalous behavior recognition?",b:"Risky, unexpected, and unintentional behavior. Training users to notice and report it turns the workforce into a detection layer."}

 explain:"Preparation happens before anything occurs. Detection identifies that something is wrong, Analysis determines what and how bad, Containment stops the spread, Eradication removes the threat and closes the entry point, Recovery restores and validates production, and Lessons Learned feeds back into Preparation. The most commonly missed placement is putting Eradication before Containment. You stop the bleeding first."},

{id:2,t:"order",d:4,o:"4.8",g:"order-of-volatility",
 title:"Order of Volatility",
 brief:"You are collecting forensic evidence from a live compromised server. Order these sources from MOST volatile to LEAST volatile.",
 items:["CPU registers and cache","RAM and running processes","Network connections and ARP cache","Temporary file systems and swap","Disk and local storage","Remote logging and archived backups"],
 explain:"Collect what disappears fastest first. Registers and cache are gone in nanoseconds, RAM is lost on power-off, network state changes constantly, temp and swap survive briefly, disk persists, and archives are the most stable of all. Pulling the power before capturing RAM destroys the most valuable evidence in a live intrusion."},

{id:3,t:"match",d:1,o:"1.1",g:"control-categories",
 title:"Classify the Security Controls",
 brief:"Drag each control into the correct CATEGORY. Category answers who or what implements the control.",
 buckets:["Technical","Managerial","Operational","Physical"],
 items:[{x:"Firewall access control list",b:0},{x:"Full-disk encryption",b:0},{x:"Intrusion prevention system",b:0},
        {x:"Risk assessment program",b:1},{x:"Change management policy",b:1},{x:"System security plan",b:1},
        {x:"Security awareness training",b:2},{x:"Incident response drills",b:2},{x:"Guard staffing schedule",b:2},
        {x:"Bollards at the entrance",b:3},{x:"Access control vestibule",b:3},{x:"Badge reader on a server room door",b:3}],
 explain:"Technical controls are implemented by technology. Managerial controls are administrative and planning oriented, largely paperwork and process design. Operational controls are carried out by people day to day. Physical controls exist in the real world and stop or slow physical access. The frequent trap is putting security awareness training under Managerial. Writing the training policy is managerial, but running the training is operational."},

{id:4,t:"match",d:1,o:"1.1",g:"control-types",
 title:"Classify the Control Types",
 brief:"Drag each control into the correct TYPE. Type answers what the control actually does.",
 buckets:["Preventive","Deterrent","Detective","Corrective"],
 items:[{x:"Door lock",b:0},{x:"Application allow list",b:0},{x:"Least privilege permissions",b:0},
        {x:"Warning sign about prosecution",b:1},{x:"Visible security camera dome",b:1},
        {x:"Log review and SIEM alerting",b:2},{x:"File integrity monitoring",b:2},{x:"Motion sensor",b:2},
        {x:"Restoring from backup",b:3},{x:"Patching an exploited vulnerability",b:3}],
 explain:"Preventive controls stop the action outright. Deterrent controls discourage someone who could still proceed anyway. Detective controls tell you it happened. Corrective controls fix or restore afterward. A visible camera is doing double duty in real life, but CompTIA treats the visible dome as deterrent and the recorded footage review as detective. Read what the control is doing in the question."},

{id:5,t:"match",d:3,o:"3.1",g:"cloud-responsibility",
 title:"Cloud Shared Responsibility",
 brief:"For each item, drag it to the LOWEST service model at which the CUSTOMER is still responsible for it. If the customer owns it in all three, place it under IaaS.",
 buckets:["Customer owns in IaaS only","Customer owns in IaaS and PaaS","Customer owns in all three"],
 items:[{x:"Guest operating system patching",b:0},{x:"Host-based firewall configuration",b:0},{x:"Runtime and middleware",b:0},
        {x:"Application code and dependencies",b:1},{x:"Application-level secrets",b:1},
        {x:"Data classification and content",b:2},{x:"User accounts and access permissions",b:2},{x:"Identity federation configuration",b:2}],
 explain:"Data and identity never transfer to the provider at any tier. That is the single most testable fact in the shared responsibility model. In IaaS the customer also owns the OS and everything above it. In PaaS the provider takes the OS and runtime, leaving the customer their code and data. In SaaS the provider takes nearly everything except data and access."},

{id:6,t:"match",d:2,o:"2.4",g:"attack-identification",
 title:"Identify the Attack",
 brief:"Drag each observed behavior onto the attack it indicates.",
 buckets:["Password spraying","Credential stuffing","On-path attack","Amplified DDoS"],
 items:[{x:"One common password tried against 3,000 accounts, weekly, no lockouts",b:0},
        {x:"Attacker stays under the lockout threshold deliberately",b:0},
        {x:"Username and password pairs from an unrelated breach replayed here",b:1},
        {x:"High success rate on accounts that reuse credentials",b:1},
        {x:"Gratuitous ARP replies mapping the gateway IP to an unknown MAC",b:2},
        {x:"A workstation begins receiving traffic destined for the router",b:2},
        {x:"Small spoofed DNS queries sent to thousands of open resolvers",b:3},
        {x:"Victim buried under large responses it never requested",b:3}],
 explain:"Spraying is wide and shallow, one password across many accounts. Stuffing replays known valid pairs from another breach, which is why its success rate is high. On-path attacks require the attacker to sit in the traffic flow, and forged ARP is the classic way onto a flat LAN. Amplification uses a protocol where a small request yields a large response, with reflection putting the victim's address in the source field."},

{id:7,t:"grid",d:4,o:"4.5",g:"firewall-rules",
 title:"Build the Firewall Rule Set",
 brief:"Configure the perimeter firewall to meet the stated requirements. Rules evaluate top down and stop at the first match.",
 pre:"REQUIREMENTS\n1. Public users must reach the web server on HTTPS.\n2. Administrators must NOT reach RDP from the internet.\n3. The web server must query the internal database on TCP 1433.\n4. Nothing else may pass.",
 rows:[
  {label:"Rule 1  ANY -> WEB-SRV  TCP 443",opts:["Permit","Deny"],a:0},
  {label:"Rule 2  ANY -> ANY  TCP 3389",opts:["Permit","Deny"],a:1},
  {label:"Rule 3  WEB-SRV -> DB-SRV  TCP 1433",opts:["Permit","Deny"],a:0},
  {label:"Rule 4  ANY -> ANY  ANY",opts:["Permit","Deny"],a:1}],
 explain:"Requirement 1 needs an explicit permit on 443. Requirement 2 is satisfied by denying 3389 from any source, and exposing RDP to the internet is one of the most exploited misconfigurations there is. Requirement 3 needs a targeted permit from the web tier to the database only, not from anywhere. Requirement 4 is the implicit deny made explicit at the bottom. Note that the deny-all must stay LAST. Moving it to the top would block everything above it."},

{id:8,t:"select",d:4,o:"4.9",g:"log-analysis",
 title:"Log Analysis: Identify the Indicators",
 brief:"Review the authentication log below. Select EVERY line that is an indicator of the attack in progress. Selecting benign lines costs you.",
 pre:"08:14:02  auth  SUCCESS  user=jmoore     src=10.20.4.51    geo=US-VA\n08:14:09  auth  FAILED   user=aandrews   src=203.0.113.77  geo=RU\n08:14:10  auth  FAILED   user=bcastillo  src=203.0.113.77  geo=RU\n08:14:11  auth  FAILED   user=cnguyen    src=203.0.113.77  geo=RU\n08:16:44  auth  SUCCESS  user=jmoore     src=198.51.100.9  geo=RU\n08:17:01  auth  SUCCESS  user=dpatel     src=10.20.4.62    geo=US-VA\n08:19:30  priv  GRANTED  user=jmoore     role=domain_admin src=198.51.100.9\n08:22:15  auth  FAILED   user=dpatel     src=10.20.4.62    geo=US-VA",
 items:["08:14:09 FAILED aandrews from 203.0.113.77",
        "08:14:10 FAILED bcastillo from 203.0.113.77",
        "08:14:11 FAILED cnguyen from 203.0.113.77",
        "08:16:44 SUCCESS jmoore from 198.51.100.9 (RU)",
        "08:17:01 SUCCESS dpatel from 10.20.4.62 (US-VA)",
        "08:19:30 priv GRANTED jmoore role=domain_admin",
        "08:22:15 FAILED dpatel from 10.20.4.62 (US-VA)"],
 correct:[0,1,2,3,5],
 explain:"Three different usernames failing from one foreign address within seconds is password spraying, wide and shallow. The jmoore success at 08:16 is impossible travel: the same account authenticated from Virginia at 08:14 and from Russia two minutes later. The privilege grant at 08:19 from that same foreign address is the escalation and the most serious line in the log. The dpatel lines are benign. A single failed login from an internal address during business hours is a person mistyping their password, and treating it as an indicator is exactly the false positive that causes alert fatigue."},

{id:9,t:"match",d:3,o:"3.3",g:"data-protection-methods",
 title:"Match Protection to Data State",
 brief:"Drag each protection method to the data state it addresses.",
 buckets:["Data at rest","Data in transit","Data in use"],
 items:[{x:"Full-disk encryption",b:0},{x:"Database transparent encryption",b:0},{x:"Self-encrypting drive",b:0},
        {x:"TLS 1.3",b:1},{x:"IPSec tunnel",b:1},{x:"SFTP",b:1},
        {x:"Trusted execution environment",b:2},{x:"Secure enclave",b:2}],
 explain:"At rest means stored and not being accessed. In transit means moving across a network. In use means loaded into memory and actively being processed, which is the state most people forget exists. Data in use is the hardest to protect because the data must be readable to be worked on, which is why it requires hardware isolation rather than ordinary encryption."},

{id:10,t:"grid",d:4,o:"4.6",g:"access-control-models",
 title:"Assign Least Privilege",
 brief:"A small firm needs access assigned according to least privilege. Choose the MINIMUM access level that still lets each person do their job.",
 rows:[
  {label:"Help desk technician, resets user passwords",opts:["Domain Admin","Delegated password reset rights","Read-only directory access","No access"],a:1},
  {label:"External auditor, reviews configurations for 30 days",opts:["Domain Admin","Local Admin on all servers","Read-only, time-limited account","Standard user"],a:2},
  {label:"Backup service that copies files nightly",opts:["Domain Admin","Interactive admin account","Service account with backup rights only","Shared team account"],a:2},
  {label:"Developer who needs production logs to debug",opts:["Production Domain Admin","Write access to production","Read-only access to the log store","Database owner"],a:2},
  {label:"Departing employee on their final day",opts:["Unchanged access","Disabled account, data retained","Deleted account and data","Elevated for handover"],a:1}],
 explain:"Least privilege means the minimum access needed to perform the function, and nothing beyond it. Delegation exists precisely so help desk staff never need domain admin. Auditors read, they do not change, and their access should expire. Service accounts get scoped rights and should never be interactive. Developers debugging need to read logs, not write to production. For departures, disabling rather than deleting preserves evidence and any data the business still needs, which is why deletion is the wrong answer even though it feels more secure."},

{id:11,t:"match",d:5,o:"5.2",g:"risk-strategies",
 title:"Choose the Risk Strategy",
 brief:"Drag each management decision onto the risk strategy it represents.",
 buckets:["Mitigate","Transfer","Accept","Avoid"],
 items:[{x:"Deploy MFA to reduce account takeover likelihood",b:0},{x:"Segment the network to limit blast radius",b:0},
        {x:"Purchase cyber liability insurance",b:1},{x:"Contractually shift breach liability to the vendor",b:1},
        {x:"Document that the cost of the fix exceeds the loss, take no action",b:2},{x:"Grant a formal, time-bound exception",b:2},
        {x:"Discontinue the legacy service entirely",b:3},{x:"Decline to enter a market with unmanageable regulation",b:3}],
 explain:"Mitigate applies controls to lower likelihood or impact. Transfer moves the financial consequence to someone else, and insurance is the textbook example. Accept is a documented, deliberate decision to live with the risk, and the documentation is what separates it from negligence. Avoid eliminates the activity that creates the risk in the first place. The frequently confused pair is Transfer and Accept, since insurance still leaves you exposed operationally. Ask who absorbs the cost."},

{id:12,t:"order",d:1,o:"1.4",g:"cert-lifecycle",
 title:"Certificate Request Flow",
 brief:"Order the steps required to obtain and deploy a TLS certificate for a new web server.",
 items:["Generate a key pair on the server","Create a certificate signing request containing the public key",
        "Registration Authority verifies the requester's identity","Certificate Authority signs and issues the certificate",
        "Install the certificate and chain on the web server","Client validates the chain and checks revocation status"],
 explain:"The private key is generated on the server and never leaves it, which is why key generation comes first. The CSR carries the public key and identifying details to the CA. The Registration Authority handles identity verification on the CA's behalf. Only then does the CA sign. Installation includes the intermediate chain, and a missing intermediate is one of the most common real-world TLS failures. Validation and revocation checking happen on the client side at connection time."},
{id:13,t:"grid",d:4,o:"4.5",g:"firewall-rules",
 title:"Interpret an Existing Firewall Rule Set",
 brief:"The firewall below is already configured with the rules shown. For each traffic flow described, decide whether the firewall allows or blocks it. Rules are evaluated top to bottom, first match wins.",
 pre:"RULE #   SOURCE   DESTINATION      PROTOCOL   PORT   ACTION\n  1        Any      10.5.20.10       TCP        22     Allow\n  2        Any      10.5.20.40       TCP        443    Allow\n  3        Any      10.5.20.40       TCP        3389   Allow\n  4        Any      Any              UDP        53     Allow\n  5        Any      Any              UDP        123    Allow\n  6        Any      Any              ICMP       -      Block\n  7        Any      Any              Any        Any    Block",
 rows:[
  {label:"SSH session to 10.5.20.10",opts:["Allowed","Blocked"],a:0},
  {label:"RDP session to 10.5.20.40",opts:["Allowed","Blocked"],a:0},
  {label:"HTTP (not HTTPS) request to 10.5.20.40",opts:["Allowed","Blocked"],a:1},
  {label:"DNS query to 8.8.8.8",opts:["Allowed","Blocked"],a:0},
  {label:"Ping (ICMP echo) to 10.5.20.10",opts:["Allowed","Blocked"],a:1},
  {label:"NTP sync to an internal time server",opts:["Allowed","Blocked"],a:0}],
 explain:"Rule 1 permits SSH (TCP 22) to the .10 host, so that session is allowed. Rule 3 permits RDP (TCP 3389) to the .40 host, so that's allowed too. HTTP is TCP 80, and only TCP 443 is permitted to .40 by rule 2, so plain HTTP falls through to the implicit deny at rule 7 and is blocked. DNS (UDP 53) and NTP (UDP 123) are both permitted from any source to any destination by rules 4 and 5. ICMP is explicitly blocked by rule 6, which sits before the final catch-all. The skill being tested is reading a rule table as an ordered, first-match list rather than treating every row as independent."},

{id:14,t:"match",d:3,o:"3.2",g:"device-placement",
 title:"Match Network Appliance to Function",
 brief:"Drag each appliance onto the function it actually performs. Some appliances look similar on paper but solve different problems.",
 buckets:["WAF","Load balancer","Jump server","Proxy server","IPS","Sensor"],
 items:[{x:"Blocks SQL injection and XSS payloads aimed at a public web app",b:0},
        {x:"Inspects and filters HTTP request content specifically",b:0},
        {x:"Distributes incoming connections across a pool of identical web servers",b:1},
        {x:"Keeps a single server from being overwhelmed by spreading the load",b:1},
        {x:"Hardened, monitored host that administrators connect through before reaching internal systems",b:2},
        {x:"Concentrates and audits administrative access into one chokepoint",b:2},
        {x:"Caches and filters outbound requests on behalf of internal users",b:3},
        {x:"Sits between users and the internet to enforce acceptable-use policy",b:3},
        {x:"Sits inline and actively drops malicious packets before they arrive",b:4},
        {x:"A passive collector feeding traffic to a monitoring platform",b:5}],
 explain:"A WAF is purpose-built for web application payloads specifically, which is narrower than a general firewall. A load balancer solves an availability and scaling problem, not a security-filtering one. A jump server exists purely to concentrate and audit administrative access, nothing else. A proxy server mediates outbound traffic for internal users, the opposite direction from a WAF. An IPS is defined by sitting inline and actively blocking; a sensor by contrast is passive and only feeds a monitoring platform, which is why the exam separates the two even though both watch traffic."},

{id:15,t:"match",d:4,o:"4.6",g:"mfa-factors",
 title:"Authentication Factor Recognition",
 brief:"Drag each scenario onto the authentication factor category it demonstrates.",
 buckets:["Something you know","Something you have","Something you are","Somewhere you are"],
 items:[{x:"Typing a PIN into a payment terminal",b:0},{x:"Answering a security question about your first pet",b:0},
        {x:"A hardware token generating a rotating six-digit code",b:1},{x:"A smart card inserted into a reader",b:1},
        {x:"A retina scan at a secure facility entrance",b:2},{x:"Voice pattern matching during a phone banking call",b:2},
        {x:"Access is denied unless the connection originates from the corporate office IP range",b:3},{x:"A login attempt is blocked because it comes from an unexpected country",b:3}],
 explain:"Something you know is memorized information: PINs, passwords, security question answers. Something you have is a physical possession: a token, a smart card, a phone receiving a code. Something you are is a biometric trait inherent to the person. Somewhere you are is geolocation or network-origin based, which CompTIA treats as a distinct attribute rather than a true factor, and it is the one most commonly left out when people list authentication factors from memory."},

{id:16,t:"match",d:3,o:"3.2",g:"secure-access",
 title:"Select the Right Security Technology",
 brief:"Drag each scenario onto the technology that best addresses it. Several options look plausible; pick the one that matches the specific requirement stated.",
 buckets:["SASE","802.1X","NGFW","Sandboxing","SD-WAN"],
 items:[{x:"A fully remote workforce needs identity-based policy enforced at the edge instead of backhauled to headquarters",b:0},
        {x:"A device must authenticate before its switch port passes any traffic",b:1},
        {x:"Traffic must be inspected with awareness of which application generated it, not just port and protocol",b:2},
        {x:"A suspicious executable needs to run in isolation to observe its behavior before it touches production",b:3},
        {x:"A retailer with dozens of branch locations wants to manage and prioritize traffic across multiple WAN links centrally",b:4}],
 explain:"SASE converges connectivity and security into a cloud-delivered edge, which is exactly the model a distributed, identity-first remote workforce needs. 802.1X is specifically port-based network access control, the mechanism that gates a switch port on authentication. An NGFW is defined by application-aware deep packet inspection, beyond simple port and protocol filtering. Sandboxing isolates something suspicious to observe it safely. SD-WAN is about centrally managing and steering traffic across multiple WAN links, a connectivity and cost problem rather than a security-enforcement one, which is the detail that separates it from SASE."},

{id:17,t:"match",d:1,o:"1.4",g:"obfuscation",
 title:"Cryptographic Technique Recognition",
 brief:"Drag each description onto the technique it demonstrates.",
 buckets:["Salting","Key stretching","Masking","Tokenization","Steganography","Digital signature"],
 items:[{x:"A random value is added to a password before hashing so identical passwords produce different hashes",b:0},
        {x:"A hashing algorithm is deliberately slowed down to make brute-force guessing expensive",b:1},
        {x:"A credit card number is displayed as **** **** **** 4412 on a receipt",b:2},
        {x:"A card number is replaced with a surrogate value that is meaningless outside the issuing vault",b:3},
        {x:"A secret message is hidden inside the pixel data of an ordinary-looking image",b:4},
        {x:"A document is signed with a private key so the recipient can verify both origin and integrity",b:5}],
 explain:"Salting defeats precomputed rainbow tables by making every hash unique even for identical inputs. Key stretching (PBKDF2, bcrypt) adds computational cost to slow down guessing. Masking hides part of a value at display time while the full value may still exist elsewhere. Tokenization goes further, replacing the value with a surrogate that has no mathematical relationship to the original outside the vault. Steganography hides data inside unrelated media rather than transforming the data itself. A digital signature is the one item here that proves authenticity and integrity together, not just secrecy or transformation."}
];

/* ================= storage ================= */
const MEM={};
function ls(){ try{ const t="__ns"; localStorage.setItem(t,t); localStorage.removeItem(t); return localStorage; }catch(e){ return null; } }
const store={
  async get(k){
    try{ const r=await window.storage.get(k); if(r) return JSON.parse(r.value); }catch(e){}
    const L=ls(); if(L){ const v=L.getItem(k); if(v) return JSON.parse(v); }
    return MEM[k]!==undefined?MEM[k]:null;
  },
  async set(k,v){
    MEM[k]=v; const s=JSON.stringify(v);
    try{ await window.storage.set(k,s); }catch(e){}
    const L=ls(); if(L){ try{ L.setItem(k,s); }catch(e){} }
  }
};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(c,s)=>s?Math.round(c/s*100):0;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ================= adaptive pressure ================= */
function limit(){ return TIGHT[Math.max(0,Math.min(4,S.tight))]; }
function adapt(ok){
  S.roll.push(ok?1:0); if(S.roll.length>12) S.roll.shift();
  if(S.roll.length>=8){
    const acc=S.roll.reduce((a,b)=>a+b,0)/S.roll.length;
    if(acc>=.85&&S.tight<4){ S.tight++; S.roll=[]; toast("Pressure up - "+limit()+"s per item"); }
    else if(acc<.6&&S.tight>0){ S.tight--; S.roll=[]; toast("Pressure eased - "+limit()+"s per item"); }
  }
}

/* ================= weighting ================= */
const DCOUNT={};
function domWeight(d){
  let w=DWEIGHT[d];
  const st=S.dom[d];
  if(st.s>=5){ const a=st.c/st.s; w*= 1+(1-a)*1.4; }
  return w/(DCOUNT[d]||1);              // per-question, so bank size cannot skew the blueprint
}
function noteRecent(id){ S.recent=(S.recent||[]).filter(x=>x!==id); S.recent.push(id); if(S.recent.length>45) S.recent.shift(); }
function pick(pool,used){
  let cand=pool.filter(q=>!used.has(q.i));
  if(!cand.length) return null;
  // prefer items not seen in the last 45 draws, so shifts do not replay the same set
  const fresh=cand.filter(q=>(S.recent||[]).indexOf(q.i)<0);
  if(fresh.length>=6) cand=fresh;
  // occasional targeted resurfacing of a past miss, but much lighter than before
  const missed=cand.filter(q=>(S.qStat[q.i]&&S.qStat[q.i].m>0));
  if(missed.length&&Math.random()<.18){ const m=missed[Math.floor(Math.random()*missed.length)]; noteRecent(m.i); return m; }
  const ws=cand.map(q=>{
    let w=domWeight(q.d);
    const pos=(S.recent||[]).indexOf(q.i);
    if(pos>=0) w*=0.12+0.02*pos;              // heavy penalty, easing as it ages out
    w*=0.75+Math.random()*0.5;                 // jitter so ordering is never deterministic
    return w;
  });
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<cand.length;i++){ r-=ws[i]; if(r<=0){ noteRecent(cand[i].i); return cand[i]; } }
  const last=cand[cand.length-1]; noteRecent(last.i); return last;
}

/* ================= scoring ================= */
function record(q,ok){
  S.dom[q.d].s++; if(ok) S.dom[q.d].c++;
  if(!S.tag[q.g]) S.tag[q.g]={s:0,m:0};
  S.tag[q.g].s++; if(!ok) S.tag[q.g].m++;
  if(!S.qStat[q.i]) S.qStat[q.i]={s:0,m:0};
  S.qStat[q.i].s++; if(!ok) S.qStat[q.i].m++;
  adapt(ok); save();
  if(!ok&&S.tag[q.g].m>=2&&S.flagged.indexOf(q.g)<0){ S.flagged.push(q.g); return true; }
  return false;
}
function gateStatus(){
  const runs=S.sessions.filter(x=>(x.mode==="shift"&&x.n>=10)||x.mode==="exam").slice(-2);
  if(runs.length<2) return {pass:false,label:runs.length+" of 2 qualifying shifts logged"};
  const ok=runs.every(r=>r.pct>=85&&Object.keys(r.byDom).every(d=>r.byDom[d].s<3||pct(r.byDom[d].c,r.byDom[d].s)>=75));
  return {pass:ok,label:ok?"Gate met - book the exam":"Last two scored runs: "+runs.map(r=>r.pct+"%").join(" / ")};
}

function nextTicket(){

function renderTicket(done,chosen){

function answer(chosen){
  stopTimer();
  const q=sess.q, ok=chosen===q.a;

  if(!sess.byDom[q.d]) sess.byDom[q.d]={s:0,c:0};

function dAnswer(chosen){
  stopTimer();
  const q=sess.q, ok=chosen===q.a;
  const pat=record(q,ok);
  if(!sess.byDom[q.d]) sess.byDom[q.d]={s:0,c:0};
  sess.byDom[q.d].s++; if(ok) sess.byDom[q.d].c++;
  if(ok){
    sess.correct++; sess.streak++;
    sess.mult = sess.streak>=10?4:sess.streak>=6?3:sess.streak>=3?2:1;
    const secs=(Date.now()-sess.t0)/1000;
    const bonus=Math.max(0,Math.round((limit()-secs)*2));
    sess.score += (100+bonus)*sess.mult;
  } else { sess.lives--; sess.streak=0; sess.mult=1; sess.misses.push(q); }
  renderDrill(true,chosen);
  $("fb").innerHTML=feedback(q,ok,chosen,pat)+
    `<div class="row"><button class="btn pri" id="nx" onclick="nextDrill()">${sess.lives<=0?"See results":"Next"}</button>

/* ================= TIMER ================= */
function runTimer(secs,onEnd){
  stopTimer(); let left=secs;

  tickFn(); tickHandle=setInterval(tickFn,1000);
}

function rate(r){
  const i=sess.ci, s=srsOf(i), D=86400000;
  if(r===0){ s.ease=Math.max(1.3,s.ease-.2); s.iv=0; s.due=Date.now(); sess.again.push(i); }
  else if(r===1){ s.ease=Math.max(1.3,s.ease-.15); s.iv=Math.max(1,(s.iv||1)*1.2); s.due=Date.now()+s.iv*D; }
  else if(r===2){ s.iv=s.iv?s.iv*s.ease:1; s.due=Date.now()+s.iv*D; }
  else { s.ease=s.ease+.15; s.iv=(s.iv||1)*s.ease*1.3; s.due=Date.now()+s.iv*D; }
  s.reps++; S.srs[i]=s; save();
  sess.queue.shift();
  if(r===0) sess.queue.push(i); else sess.done++;
  nextCard();
}

function acrStart(kind){ sess={mode:"acr",kind:"fun",i:0,correct:0,used:new Set(),misses:[]}; startSess(); nextAcr(); }
function nextAcr(){

  if(sib.length<3) sib=sib.concat(pool.filter(a=>a.g!==target.g&&a.a!==target.a&&sib.indexOf(a)<0));

  const all=shuffle([target].concat(wrong));

function pbqStart(id){

  if(p.t==="grid") PB.sel=p.rows.map(()=>-1);

function pbqRender(){

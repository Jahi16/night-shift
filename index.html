q:"A SOC documents the exact step-by-step actions to take when a phishing report arrives: verify, contain the mailbox, reset credentials, notify. What is this document called?",
c:["Policy","Standard","Playbook","Charter"],a:2,
e:"A playbook is a procedural checklist for a specific scenario, turning response into repeatable, ordered steps anyone on shift can follow.",
w:["A policy states mandatory high-level requirements, not step sequences.","A standard defines uniform technical configurations.","","A charter establishes a team's mission and authority."]},
{i:831,d:5,o:"5.2",t:"b",g:"risk-register",
q:"Management wants an early-warning measurement that signals when risk is approaching an unacceptable level, such as the percentage of servers missing critical patches beyond 30 days. What is this measurement called?",
c:["Single loss expectancy","Key risk indicator","Exposure factor","Annualized rate of occurrence"],a:1,
e:"A key risk indicator is a monitored metric with thresholds that warn when risk is trending toward unacceptable, enabling action before an incident.",
w:["SLE is the dollar loss expected from one incident.","","Exposure factor is the fraction of asset value a single event destroys.","ARO estimates how often an event happens per year."]},
{i:832,d:5,o:"5.4",t:"s",g:"attestation",
q:"Employees must read the updated acceptable use policy and electronically sign a statement confirming they understand and will comply. Which compliance concept does the signature satisfy?",
c:["Sanctions","Independent assessment","Data inventory","Acknowledgement and attestation"],a:3,
e:"Attestation and acknowledgement create an auditable record that each person received, understood, and accepted the policy, which underpins later enforcement.",
w:["Sanctions are penalties applied after violations.","Independent assessment is third-party evaluation of controls.","A data inventory catalogs information assets.",""]},
{i:833,d:5,o:"5.3",t:"b",g:"vendor-monitoring",
q:"A company sends its cloud vendors a standardized annual document asking them to describe their security controls, certifications, and incident history. Which third-party risk practice is this?",
c:["Security questionnaire","Right-to-audit clause","Rules of engagement","Statement of work"],a:0,
e:"Questionnaires are the routine vendor monitoring instrument, collecting self-reported control information on a recurring basis without an on-site audit.",
w:["","Right-to-audit reserves the ability to inspect directly; the scenario is self-reporting.","Rules of engagement govern security testing.","A SOW defines deliverables for an engagement."]},
{i:834,d:5,o:"5.6",t:"s",g:"insider-threat-awareness",
q:"During training, staff learn that a colleague who suddenly works odd hours alone, photographs screens, and asks for access far beyond their role may warrant a confidential report. Which awareness topic is being taught?",
c:["Password hygiene, choosing and protecting strong, unique credentials for each account","Removable media handling, the safe use and control of USB drives and other portable storage","Recognizing insider threat indicators","Hybrid work ergonomics, setting up a safe and comfortable home office workspace"],a:2,
e:"Insider threat awareness trains employees to notice and report behavioral warning signs such as unusual access requests and covert data capture.",
w:["Password practice is entirely unrelated to observing a colleague's suspicious behavior.","Removable media is a narrower topic about one specific exfiltration channel, not the broad behavioral pattern described here.","","Ergonomics is workplace safety training, unrelated to security or insider threat behavior."]}
];

const Q6 = [
{i:901,d:1,o:"1.2",t:"b",g:"physical-security",
q:"A data center entrance uses two interlocked doors: the outer door must close and the occupant must authenticate before the inner door releases, and only one person fits between them. Which control is this?",
c:["Bollard, a short sturdy post installed to stop vehicles from ramming a building or entrance","Access control vestibule","Faraday cage, a shielded enclosure that blocks electromagnetic signals from entering or leaving","Air gap, physically isolating a network from any other network with no connection at all"],a:1,
e:"An access control vestibule, historically a mantrap, defeats tailgating by trapping a single person between interlocked doors until identity is verified.",
w:["Bollards stop vehicles, not pedestrians trying to tailgate through a doorway.","","A Faraday cage is about blocking signals, not controlling physical entry.","An air gap is network isolation and has nothing to do with a physical doorway."]},
{i:902,d:1,o:"1.2",t:"b",g:"zero-trust",
q:"A zero trust system raises the authentication requirements automatically when a login attempt arrives from a new device, an unusual country, and an odd hour, but allows a routine office login with standard credentials. Which zero trust concept is this?",
c:["Adaptive identity","Implicit trust zone","Policy enforcement point","Threat scope reduction"],a:0,
e:"Adaptive identity adjusts authentication demands to the real-time risk signals of each request instead of applying one static requirement to all logins.",
w:["","Implicit trust zones are what zero trust eliminates.","The policy enforcement point executes the decision; the question describes how the decision varies.","Threat scope reduction is the outcome of limiting access, not the risk-responsive mechanism."]},
{i:903,d:1,o:"1.4",t:"m",g:"key-exchange",
q:"Two parties who have never met establish a shared secret over an open network, and even if their long-term keys are stolen next year, recordings of today's session cannot be decrypted. Which mechanism provides this?",
c:["Static RSA key transport","Pre-shared keys distributed by email","Key escrow","Ephemeral Diffie-Hellman key exchange"],a:3,
e:"Ephemeral Diffie-Hellman (DHE or ECDHE) negotiates a fresh session key each time and discards it, providing forward secrecy so captured traffic stays sealed even after later key compromise.",
w:["Static RSA transport ties sessions to the server's long-term key; steal it and recorded sessions open.","Email distribution exposes the secret in transit and provides no forward secrecy.","Escrow deliberately makes keys recoverable, the opposite property.",""]},
{i:904,d:1,o:"1.3",t:"b",g:"change-management",
q:"A team modifies a firewall script, and the change system stores the new script alongside every previous revision with author, timestamp, and the ability to instantly restore any prior version. Which technical change management concept is this?",
c:["Allow list","Downtime scheduling","Version control","Dependency mapping"],a:2,
e:"Version control preserves the full revision history of configurations and code, attributing every change and enabling immediate rollback to a known-good version.",
w:["Allow lists control what may execute.","Downtime scheduling manages maintenance windows.","","Dependency mapping identifies what else a change affects."]},
{i:905,d:2,o:"2.2",t:"b",g:"image-based-vector",
q:"Posters appear in a building lobby offering free coffee for scanning a QR code, which silently directs phones to a credential-harvesting page. Which threat vector category does this attack use?",
c:["Image-based vector","File-based vector","Voice call vector","Supply chain vector"],a:0,
e:"QR codes are an image-based vector: the malicious destination hides inside an image the victim cannot read, defeating the usual advice to inspect a link before clicking.",
w:["","No file is delivered; the image encodes a URL.","No call occurs.","No supplier relationship is exploited."]},
{i:906,d:4,o:"4.4",t:"m",g:"scan-methods",
q:"Which statement correctly contrasts agent-based and agentless vulnerability assessment?",
c:["Agentless requires software installed on every target before it can produce any results","Agent-based cannot see installed software versions the way a remote scan can","Agent-based reports from inside the host; agentless scans remotely with nothing installed","They produce identical visibility in all cases, so the choice comes down to licensing cost alone"],a:2,
e:"Agents live on the host and report inside-out detail continuously, while agentless scanning probes from outside over the network, trading installation effort for shallower visibility of offline or hardened hosts.",
w:["That describes agent-based, reversed: agentless is the approach that needs nothing installed.","Inside-the-host visibility, including exact installed software versions, is exactly what agents excel at, the opposite of this claim.","","Visibility genuinely differs between the two, which is precisely why many organizations run both rather than choosing on cost alone."]},
{i:907,d:2,o:"2.2",t:"b",g:"open-ports",
q:"A scan of a file server reveals listening services for FTP, Telnet, and an old remote administration tool, none of which the business uses. What do these findings represent?",
c:["Hardened baseline","Unnecessary open ports enlarging the attack surface","Evidence of an active breach","Normal operating system behavior requiring no action"],a:1,
e:"Every listening service is attack surface. Unused services, especially legacy cleartext ones, add risk with zero benefit and should be disabled or blocked.",
w:["A hardened baseline would have these disabled.","","Open ports show exposure, not proof of compromise.","Modern baselines do not require legacy cleartext services."]},
{i:908,d:2,o:"2.5",t:"s",g:"unsupported-systems",
q:"A hospital wing depends on an imaging workstation running an operating system that stopped receiving security updates years ago, and the medical device vendor forbids OS changes. Which mitigation BEST reduces the risk while keeping the device operational?",
c:["Ignore it since the vendor accepts responsibility","Install unofficial community patches","Replace the OS against vendor instructions","Isolate the device on a tightly restricted network segment"],a:3,
e:"When patching is impossible, compensating controls apply: segment the unsupported system so only the minimum required traffic reaches it, containing what cannot be fixed.",
w:["Vendor support terms do not transfer the hospital's security risk.","Unofficial patches void medical device certification and may destabilize care equipment.","Violating vendor requirements risks both function and regulatory standing.",""]},
{i:909,d:2,o:"2.4",t:"b",g:"malware-types",
q:"IT investigates a slow workstation and finds a process capturing every keypress and mailing batches to an external address, including passwords typed into banking sites. Which malware type is this?",
c:["Logic bomb","Keylogger","Worm","Bloatware"],a:1,
e:"A keylogger records keystrokes to steal what users type, with credentials as the prize.",
w:["A logic bomb waits for a trigger condition to detonate.","","A worm self-propagates across the network; nothing is spreading.","Bloatware is unwanted preinstalled software, annoying but not capturing input."]},
{i:910,d:2,o:"2.4",t:"b",g:"dns-attacks",
q:"A company's domain registration is transferred to an attacker who alters name servers so all traffic and email route to systems they control. Which attack occurred?",
c:["Domain hijacking","DNS amplification","ARP poisoning","URL redirection via XSS"],a:0,
e:"Domain hijacking seizes control of the registration itself, redirecting every service tied to the domain at the authoritative source.",
w:["","Amplification abuses DNS to flood a victim with traffic, a availability attack.","ARP poisoning misdirects traffic on a local LAN segment only.","XSS redirects within a browser session, not the domain's global records."]},
{i:911,d:2,o:"2.4",t:"s",g:"wireless-attacks",
q:"Conference attendees keep dropping off the venue Wi-Fi every few seconds. A capture shows floods of management frames ordering clients to disconnect, sourced from a spoofed access point address. Which attack is underway?",
c:["Evil twin, a rogue access point broadcasting the same network name to lure victims into connecting","Bluesnarfing, unauthorized theft of data over an active Bluetooth connection","Deauthentication attack","RFID cloning, duplicating the credentials stored on a proximity access badge"],a:2,
e:"A deauthentication attack forges 802.11 management frames that command clients to disconnect, and is often the setup for capturing reconnection handshakes or pushing victims to a rogue AP.",
w:["An evil twin would keep victims connected to a fake network, not repeatedly kick them off, the opposite of what's described here.","Bluesnarfing targets Bluetooth, an entirely different radio protocol from the Wi-Fi management frames described.","","RFID cloning copies physical badges, unrelated to Wi-Fi management frames."]},
{i:912,d:2,o:"2.4",t:"s",g:"log-indicators",
q:"A server that normally uploads its logs at 02:00 suddenly pushes large log archives at random mid-day hours, shortly after which several log files are found truncated. Which indicator category do these events represent?",
c:["Resource inaccessibility, users or services unable to reach a system or file they normally can","Blocked content, traffic denied by a filtering device that normally would have passed","Impossible travel, a single account authenticating from geographically distant locations too quickly","Out-of-cycle logging and missing logs"],a:3,
e:"Logging outside its established schedule paired with truncated files suggests an intruder manipulating and covering tracks, both named indicators of malicious activity.",
w:["No resource became unavailable to users in this scenario.","Nothing described here was filtered or blocked.","No authentication or geographic data is involved in this scenario at all.",""]},
{i:913,d:3,o:"3.2",t:"m",g:"security-zones",
q:"A network design places internet-facing services, internal user workstations, and regulated database servers into separate areas with firewalls controlling every crossing. Which infrastructure concept does this illustrate?",
c:["Platform diversity","Security zones","Port security","Continuity of operations"],a:1,
e:"Security zones group systems by trust and sensitivity, forcing all traffic between zones through inspection and policy enforcement points.",
w:["Platform diversity mixes vendors to avoid a shared flaw.","","Port security limits MAC addresses on individual switch ports.","COOP is continuity planning, not network layout."]},
{i:914,d:3,o:"3.2",t:"b",g:"device-attributes",
q:"A monitoring appliance receives a mirrored copy of traffic from a switch SPAN port and can alert on threats but can never block them. Which device attribute pair describes it?",
c:["Passive and out-of-band (tap/monitor)","Active and inline, sitting directly in the traffic path with the ability to intervene","Fail-closed and inline, blocking all traffic the moment the device itself fails","Active and fail-open, passing traffic unblocked the moment the device fails"],a:0,
e:"A device fed by mirrored traffic sits out-of-band and is passive: it observes a copy and cannot interrupt the original flow, which is the IDS posture as opposed to an inline IPS.",
w:["","Active inline devices sit directly in the traffic path and have the power to block, unlike a device fed only a mirrored copy.","Fail-closed describes inline failure behavior specifically; a mirror-fed device has no traffic path to fail closed on.","Fail-open likewise applies only to devices placed inline, not to a passive monitor watching a copy of traffic."]},
{i:915,d:3,o:"3.2",t:"m",g:"firewall-types",
q:"Which capability distinguishes a layer 7 firewall from a layer 4 firewall?",
c:["Filtering traffic by source IP address before allowing or denying a connection","Filtering traffic by TCP or UDP port number to decide what is allowed through","Inspecting application content, such as HTTP methods and URLs, to make decisions","Operating at faster throughput speeds in every deployment scenario tested"],a:2,
e:"Layer 7 firewalls understand application protocols and can act on content like specific URLs or API calls, while layer 4 devices see only addresses, ports, and session state.",
w:["Both layer 4 and layer 7 firewalls can filter by source IP; that's not what distinguishes them.","Port filtering is the classic, defining layer 4 capability, not layer 7's distinguishing feature.","","Deep application inspection typically costs performance rather than gaining it, the opposite of this claim."]},
{i:916,d:3,o:"3.2",t:"s",g:"tunneling",
q:"A company needs site-to-site encryption for ALL traffic between two offices, regardless of application, at the network layer. Which tunneling choice fits this requirement BEST?",
c:["TLS for each individual application","IPSec tunnel between the site gateways","SSH port forwarding per service","Unencrypted GRE alone"],a:1,
e:"IPSec at the network layer encrypts everything crossing the gateway-to-gateway tunnel, covering every application automatically, which per-application TLS or SSH forwarding cannot do practically.",
w:["TLS secures individual application sessions, requiring every app to support it.","","Port forwarding per service does not scale to all traffic.","GRE encapsulates but provides no encryption by itself."]},
{i:917,d:3,o:"3.1",t:"s",g:"multi-cloud",
q:"After a provider-wide outage took down its only cloud platform for a day, a company re-architects critical services to run across two different cloud providers simultaneously. Which consideration drove this design?",
c:["Reducing overall licensing cost by shopping between competing providers","Simplifying patch management by having fewer systems to track","Increasing vendor lock-in to secure better long-term contract pricing","Avoiding single-provider dependence for availability"],a:3,
e:"Multi-cloud spreads critical workloads across providers so no single vendor's outage, pricing change, or failure takes the business down, trading added complexity for resilience.",
w:["Running two separate platforms usually raises overall cost and licensing complexity, not lowers it.","Managing two distinct environments makes patch management harder to coordinate, not simpler.","Multi-cloud is specifically meant to reduce lock-in; deliberately increasing it would be a drawback of this design, not a goal.",""]},
{i:918,d:3,o:"3.4",t:"b",g:"geographic-dispersion",
q:"A company places its two data centers 500 miles apart specifically so one hurricane, grid failure, or regional disaster cannot disable both. Which resilience concept is this?",
c:["Geographic dispersion","Vertical scaling","Warm site testing","Capacity planning"],a:0,
e:"Geographic dispersion separates redundant infrastructure far enough that a single regional event cannot affect both locations.",
w:["","Vertical scaling adds resources to one system.","Warm site testing validates a recovery facility; the question is about placement distance.","Capacity planning sizes resources for demand."]},
{i:919,d:4,o:"4.2",t:"b",g:"asset-inventory",
q:"A security team cannot say how many servers exist, what software they run, or who owns them. Which foundational process must come FIRST before vulnerability management can function?",
c:["Penetration testing, hiring a team to actively attempt exploitation against the environment","Alert tuning, adjusting detection thresholds so the SOC is not overwhelmed by noise","Asset inventory and enumeration","Digital forensics, the after-the-fact investigation of a confirmed incident"],a:2,
e:"You cannot scan, patch, or assign risk to assets you do not know exist. Inventory and enumeration are the prerequisite for every downstream security process.",
w:["Testing requires a defined scope; you cannot meaningfully target an attack against an estate you cannot enumerate.","Tuning alerts assumes you already know which assets and log sources should be generating them in the first place.","","Forensics investigates a specific incident after it occurs and has no bearing on establishing baseline visibility."]},
{i:920,d:4,o:"4.2",t:"b",g:"asset-ownership",
q:"During procurement, each new system is assigned a named individual responsible for its security decisions, access approvals, and lifecycle. Which asset management practice is this?",
c:["Sanitization","Assignment of ownership","Enumeration","Certification of destruction"],a:1,
e:"Assigning ownership attaches accountability to every asset, so someone specific answers for its protection and decisions throughout its life.",
w:["Sanitization removes data at disposal time.","","Enumeration discovers and lists assets.","Destruction certification documents end-of-life disposal."]},
{i:921,d:4,o:"4.2",t:"s",g:"data-retention",
q:"Legal requires financial records kept for seven years, while the privacy office wants personal data deleted as soon as possible. Which practice reconciles both demands systematically?",
c:["A retention policy with defined schedules per data type, enforced by automated lifecycle rules","Keeping everything forever, since storage is inexpensive and deletion always carries some risk of destroying something needed later","Deleting everything annually on a fixed calendar regardless of what legal or regulatory holds may apply to specific records","Letting each department decide informally based on its own judgment about what should be kept"],a:0,
e:"Retention schedules assign each data category a keep period satisfying its legal obligations and a defined destruction point satisfying minimization, with automation enforcing both consistently.",
w:["","Indefinite retention violates minimization principles and increases breach impact and legal exposure the longer sensitive data sits around.","Blanket annual deletion violates the seven-year legal mandate outright, regardless of how simple the calendar rule is to administer.","Informal, department-by-department discretion guarantees inconsistency and non-compliance somewhere in the organization."]},
{i:922,d:4,o:"4.3",t:"m",g:"pentest-vs-scan",
q:"Which statement BEST distinguishes a penetration test from a vulnerability scan?",
c:["A scan requires more specialized manual skill to run than a penetration test does","A test is always cheaper than scanning because it targets a narrower scope","Scans run only once per year, while tests can be scheduled at any cadence the organization chooses","A scan finds weaknesses automatically; a test exploits them to prove impact"],a:3,
e:"Scanners enumerate possible flaws; penetration testers attempt actual exploitation, demonstrating what an attacker could truly achieve and chaining findings together.",
w:["Testing requires substantially more skill than running an automated scanner, the reverse of this claim.","Manual, skilled testing consistently costs more than automated scanning, not less.","Scans typically run continuously or on frequent automated schedules, not just annually.",""]},
{i:923,d:4,o:"4.3",t:"b",g:"vuln-prioritization",
q:"A vulnerability affecting industrial pump controllers is rated moderate generally, but a water utility treats it as critical because exploitation could halt water treatment for a city. Which prioritization factor raised the severity?",
c:["CVSS base score, the standardized numeric rating assigned to the vulnerability regardless of who is running the affected system","Organizational and industry impact","Patch availability, whether a vendor fix currently exists for the affected controller firmware","Scan frequency, how often the utility's vulnerability scanner checks these devices"],a:1,
e:"The same flaw carries different consequences per organization. Industry and mission impact, here public water service, legitimately override a generic severity rating.",
w:["The base score is exactly what stayed moderate; it is context-blind by design and does not account for who is running the system.","","Patch availability affects how quickly remediation can happen, not how severe the consequence would be if exploited today.","How often an organization scans for the flaw has no bearing on what would happen if it were actually exploited."]},
{i:924,d:4,o:"4.4",t:"b",g:"log-archiving",
q:"Regulations require a firm to retain security logs for five years, while the SIEM only keeps ninety days online for performance. Which practice satisfies the requirement?",
c:["Archiving logs to long-term storage","Deleting logs after ninety days","Raising alert thresholds","Disabling verbose logging"],a:0,
e:"Archiving moves older logs to durable long-term storage, meeting retention mandates while keeping the SIEM's active window fast.",
w:["","Deletion at ninety days directly violates the five-year mandate.","Alert thresholds have nothing to do with retention.","Reducing logging shrinks the evidence collected, worsening compliance."]},
{i:925,d:4,o:"4.5",t:"m",g:"edr-vs-av",
q:"Which capability distinguishes endpoint detection and response (EDR) from traditional signature-based antivirus?",
c:["EDR only works on servers, not user workstations or laptops","Antivirus can remove malware while EDR is limited to detection with no response capability","EDR continuously records behavior, enabling detection of threats with no known signature","EDR requires no software running on the endpoint itself, unlike antivirus"],a:2,
e:"EDR watches process behavior, connections, and changes over time, letting analysts detect novel attacks, trace their path, and respond remotely, where signature AV only matches known malware patterns.",
w:["EDR deploys across workstations and servers alike; nothing limits it to servers only.","EDR's name is literally Detection and Response, encompassing removal, isolation, and remediation actions well beyond what its name suggests here.","","EDR runs as an agent on the endpoint just as antivirus does; both require local software."]},
{i:926,d:4,o:"4.5",t:"b",g:"web-filtering",
q:"A web filter blocks a newly registered domain not because of its content, but because the domain is two hours old and has already been reported in early phishing telemetry. Which filtering approach is this?",
c:["Content categorization","Reputation-based filtering","Agent-based inspection","URL allow listing"],a:1,
e:"Reputation filtering scores destinations on signals such as age, hosting history, and abuse reports, blocking risky sites before category databases catch up.",
w:["Categorization assigns topics like gambling or news; a two-hour-old domain has no meaningful category yet.","","Agent-based describes where filtering runs, not the decision logic.","Allow listing permits only pre-approved sites, a much blunter model."]},
{i:927,d:4,o:"4.6",t:"s",g:"access-controls",
q:"A hospital configures nurse accounts so they can access patient systems only during their scheduled shifts, with logins outside those hours rejected automatically. Which access control is this?",
c:["Discretionary access control","Attribute-based sensitivity labels","Federation","Time-of-day restrictions"],a:3,
e:"Time-of-day restrictions bind access to approved hours, shrinking the window in which stolen credentials are useful.",
w:["DAC lets resource owners grant access at their discretion.","Sensitivity labels drive mandatory access control decisions.","Federation shares identity across organizations.",""]},
{i:928,d:4,o:"4.6",t:"b",g:"password-tools",
q:"An organization wants employees to keep a unique, long, random password for every site without writing any down, requiring them to remember only one strong master passphrase. Which tool accomplishes this?",
c:["Password manager","Password expiration policy","Shared credential spreadsheet","Single sign-on portal"],a:0,
e:"A password manager generates and vaults unique random credentials per site behind one master secret, eliminating reuse without memorization burden.",
w:["","Expiration forces rotation but does nothing about uniqueness or strength.","A shared spreadsheet is the anti-pattern this replaces.","SSO reduces how many passwords exist; it cannot cover external personal-site accounts the way a vault does."]},
{i:929,d:5,o:"5.1",t:"b",g:"sdlc-policy",
q:"A development organization mandates that threat modeling occurs during design, security testing before release, and dependency review at every build. Which policy embeds these requirements?",
c:["Acceptable use policy","Business continuity policy","Software development lifecycle policy","Physical security standard"],a:2,
e:"An SDLC policy defines the security activities required at each development phase, making security a gate in the process rather than an afterthought.",
w:["AUP governs how users may use company systems.","BC policy covers operating through disruption.","","Physical standards govern facilities."]},
{i:930,d:5,o:"5.3",t:"s",g:"conflict-of-interest",
